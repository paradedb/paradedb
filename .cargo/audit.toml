# Configuration for cargo-audit, run by .github/workflows/check-rust-advisories.yml.

[advisories]
ignore = [
  # rkyv 0.7 is an optional dependency of rust_decimal that we never enable: it
  # appears in Cargo.lock but `cargo tree -i rkyv@0.7` cannot reach it on any
  # target, so the vulnerable code is never compiled. rust_decimal is already at
  # its latest release, and it reaches us only through stressgres. Revisit if
  # rust_decimal moves to rkyv 0.8, at which point this entry can go.
  "RUSTSEC-2026-0235",
]

# Unmaintained and yanked crates are reported as warnings rather than failures.
# They are worth seeing in the log, but they are not a reason to fail a build:
# the tree currently carries nine, all transitive.
informational_warnings = ["unmaintained", "unsound", "notice"]
