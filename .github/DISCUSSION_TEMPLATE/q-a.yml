title: "[Q&A] "
labels: ["bug", "question"]
body:
  - type: markdown
    attributes:
      value: >
        This discussion type is for questions about ParadeDB. If you are looking to raise an issue,
        please use the most relevant repository; if it has Issues disabled, file in the core issue tracker:

          * [ParadeDB issue tracker](https://github.com/paradedb/paradedb/issues/new/choose) - Issues for ParadeDB core and the pg_search extension
          * ORM integrations - [Django](https://github.com/paradedb/django-paradedb), [Drizzle](https://github.com/paradedb/drizzle-paradedb), [Entity Framework Core](https://github.com/paradedb/efcore-paradedb), [Prisma](https://github.com/paradedb/prisma-paradedb), [Rails](https://github.com/paradedb/rails-paradedb), and [SQLAlchemy](https://github.com/paradedb/sqlalchemy-paradedb)
          * Developer and AI tooling - [Agent Skills](https://github.com/paradedb/agent-skills), [Benchmarker](https://github.com/paradedb/benchmarker), [Cursor plugin](https://github.com/paradedb/cursor-plugin), and [GitHub Actions](https://github.com/paradedb/actions)
          * Deployment integrations - [Helm charts](https://github.com/paradedb/charts) and [Render blueprint](https://github.com/paradedb/render-blueprint)

        Please report security vulnerabilities using GitHub's [report vulnerability form](https://github.com/paradedb/paradedb/security/advisories/new).

  - type: textarea
    attributes:
      label: What happens?
      description: A short, clear and concise description of the current situation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: To Reproduce
      description: |
        Please provide steps to reproduce the behaviour, preferably a [minimal reproducible example](https://en.wikipedia.org/wiki/Minimal_reproducible_example).
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### Environment"
  - type: input
    attributes:
      label: "OS:"
      placeholder: e.g., macOS
      description: Please include your operating system version and architecture (e.g., aarch64, x86, x64, etc.)
    validations:
      required: true
  - type: input
    attributes:
      label: "ParadeDB Version (e.g. output of `SELECT * FROM paradedb.version_info();`):"
      placeholder: e.g., v0.8.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Are you using ParadeDB Docker, Helm, or the extension standalone?
      options:
        - ParadeDB Docker Image
        - ParadeDB Helm Chart
        - ParadeDB pg_search Extension
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### Identity Disclosure"
  - type: input
    attributes:
      label: "Full Name:"
      placeholder: e.g., John Doe
    validations:
      required: true
  - type: input
    attributes:
      label: "Affiliation:"
      placeholder: e.g., Acme Corporation
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        If the above is not given and is not obvious from your GitHub profile page, we might close your issue without further review. Please refer to the [reasoning behind this rule](https://berthub.eu/articles/posts/anonymous-help/) if you have questions.

  - type: markdown
    attributes:
      value: "### Confirmation"
  - type: dropdown
    attributes:
      label: Did you include all relevant data sets for reproducing the issue?
      options:
        - "Yes"
        - "No - I cannot share the data sets because they are confidential"
        - "No - I cannot easily share my data sets due to their large size"
        - "No - Other reason (please specify in the issue body)"
        - "N/A - The reproduction does not require a data set"
      default: 0
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Did you include the code required to reproduce the issue?
      options:
        - label: Yes, I have
  - type: checkboxes
    attributes:
      label: Did you include all relevant configurations (e.g., CPU architecture, PostgreSQL version, Linux distribution) to reproduce the issue?
      options:
        - label: Yes, I have
