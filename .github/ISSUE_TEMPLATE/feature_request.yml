name: Feature request
description: Suggest an idea for this project.
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: >
        ParadeDB components live across several repositories. Please file your request in the most relevant issue tracker:

          * [ParadeDB issue tracker](https://github.com/paradedb/paradedb/issues/new/choose) - Requests for ParadeDB core and the pg_search extension
          * ORM integrations - [Django](https://github.com/paradedb/django-paradedb), [Drizzle](https://github.com/paradedb/drizzle-paradedb), [Entity Framework Core](https://github.com/paradedb/efcore-paradedb), [Prisma](https://github.com/paradedb/prisma-paradedb), [Rails](https://github.com/paradedb/rails-paradedb), and [SQLAlchemy](https://github.com/paradedb/sqlalchemy-paradedb)
          * [Benchmarker](https://github.com/paradedb/benchmarker) - Database benchmarking suite

        Please report security vulnerabilities using GitHub's [report vulnerability form](https://github.com/paradedb/paradedb/security/advisories/new).

  - type: textarea
    attributes:
      label: What feature are you requesting?
      description: A short, clear and concise description of the desired feature.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Why are you requesting this feature?
      description: A short, clear and concise description of why this feature is important.
    validations:
      required: true

  - type: textarea
    attributes:
      label: What is your proposed implementation for this feature?
      description: A short, clear and concise description of how you'd implement this feature.
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### Identity Disclosure:"
  - type: input
    attributes:
      label: "Full Name:"
      placeholder: e.g., John Doe
    validations:
      required: true
  - type: input
    attributes:
      label: "Affiliation:"
      placeholder: e.g., Acme Corporation
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        If the above is not given and is not obvious from your GitHub profile page, we might close your issue without further review. Please refer to the [reasoning behind this rule](https://berthub.eu/articles/posts/anonymous-help/) if you have questions.
