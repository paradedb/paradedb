self-hosted-runner:
  # RunsOn runner attributes are expressed as labels in workflow `runs-on` arrays.
  labels:
    - family=*
    - image=*
    - ami=*
    - extras=*
    - cpu=*
    - ram=*
    - volume=*
    - spot=false
    - retry=when-interrupted
    # Hosted label not yet recognized by actionlint.
    - ubuntu-26.04
