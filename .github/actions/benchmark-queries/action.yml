name: Benchmark - Queries
description: Run a given benchmark dataset against pg_search and publish metrics

inputs:
  dataset:
    description: "The benchmark dataset to run (e.g. logs, docs, stackoverflow)"
    required: true
  size:
    description: "Size label for pre-sampled dataset, e.g. '100k', '1m', '20m'"
    required: true
  index:
    description: "Index variant to build/benchmark (resolves to datasets/{dataset}/indexes/{index}.sql), e.g. bm25"
    required: true
  ref:
    description: "Git ref or short SHA to report in benchmarks"
    required: true
  github_app_client_id:
    description: "ParadeDB GitHub App client ID"
    required: true
  github_app_private_key:
    description: "ParadeDB GitHub App private key"
    required: true
  fail_on_error:
    description: "Whether to fail on query errors. Set to 'false' for backfills against older versions."
    required: false
    default: "true"
  publish_baseline:
    description: "Whether to push results to the gh-pages baseline that later runs are diffed against. Only a run on main should; every run compares against the baseline regardless."
    required: false
    default: "false"
  alert_threshold:
    description: >-
      Ratio of current to baseline value above which github-action-benchmark alerts,
      e.g. "115%".
    required: false
    default: "115%"
runs:
  using: "composite"
  steps:
    - name: Refresh pg_search after snapshot restore
      shell: bash
      run: |
        # Heap snapshots include an old extension catalog. Recreate it from the installed
        # build so benchmarks also pick up unreleased SQL changes.
        psql "postgresql://localhost:288${{ env.pg_version }}/postgres" \
          -v ON_ERROR_STOP=1 --single-transaction \
          -c "DROP EXTENSION IF EXISTS pg_search;" \
          -c "CREATE EXTENSION pg_search;"

    - name: Run Benchmarks
      working-directory: benchmarks/
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
        FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        INDEX: ${{ inputs.index }}
        SIZE: ${{ inputs.size }}
      run: |
        POSTGRES_URL="postgresql://$(whoami)@localhost:288${{ env.pg_version }}/postgres"

        # The heap is assumed to already be restored from a snapshot; the benchmark builds the
        # index and runs queries against it.
        cargo run --release -- benchmark \
          --url "${POSTGRES_URL}" \
          --dataset "${DATASET}" \
          --index "${INDEX}" \
          --size "${SIZE}" \
          --runs 10 \
          --output json \
          --fail-on-error "${FAIL_ON_ERROR}"

        echo "ROWS_LABEL=${SIZE}" >> "$GITHUB_ENV"

    - name: Upload Query Benchmark Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: query-benchmark-${{ inputs.dataset }}-${{ inputs.index }}-${{ inputs.size }}-${{ github.run_attempt }}
        path: benchmarks/results.json
        retention-days: 1 # Fallback if publishing fails
        if-no-files-found: warn

    - name: Print the Postgres Logs
      if: failure()
      shell: bash
      run: cat ~/.pgrx/${{ env.pg_version }}.log

    - name: Print Crashdump Stacktrace
      if: always()
      shell: bash
      env:
        PG_VERSION: ${{ env.pg_version }}
      run: ./.github/scripts/render_crashdump.sh

    - name: Generate GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@v3.2.0 # Keep the exact pin because actionlint 1.7.12 has stale @v3 metadata that rejects client-id
      with:
        client-id: ${{ inputs.github_app_client_id }}
        private-key: ${{ inputs.github_app_private_key }}

    - name: Wait for App Token to Become Usable
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        auth="Authorization: Basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
        for attempt in $(seq 1 10); do
          if git -c http.extraheader="$auth" ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "App token usable after ${attempt} attempt(s)"
            exit 0
          fi
          echo "App token not usable yet (attempt ${attempt}/10); retrying in 5s"
          sleep 5
        done
        echo "App token never became usable after 10 attempts" >&2
        exit 1

    - name: Publish Benchmark Metrics
      uses: ./.github/actions/publish-benchmark-results
      with:
        name: "pg_search '${{ inputs.dataset }} (${{ inputs.index }})' (${{ env.ROWS_LABEL }} rows)"
        ref: ${{ inputs.ref }}
        metrics_file: benchmarks/results.json
        github_token: ${{ steps.app-token.outputs.token }}
        publish_baseline: ${{ inputs.publish_baseline }}
        pages_directory: benchmarks
        alert_threshold: ${{ inputs.alert_threshold }}
        comment_summary: ${{ github.event_name == 'pull_request' }}
