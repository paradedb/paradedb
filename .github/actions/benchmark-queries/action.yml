name: Benchmark - Queries
description: Run a given benchmark dataset against pg_search and stage results for publication

inputs:
  dataset:
    description: "The benchmark dataset to run (e.g. logs, docs, stackoverflow)"
    required: true
  size:
    description: "Size label for pre-sampled dataset, e.g. '100k', '1m', '20m'"
    required: true
  index:
    description: "Index variant to build/benchmark (resolves to datasets/{dataset}/indexes/{index}.sql), e.g. bm25, hnsw, ivfflat"
    required: true
  ref:
    description: "Git ref or short SHA to report in benchmarks"
    required: true
  fail_on_error:
    description: "Whether to fail on query errors. Set to 'false' for backfills against older versions."
    required: false
    default: "true"
  publish_baseline:
    description: "Whether to push results to the gh-pages baseline that later runs are diffed against. Only a run on main should; every run compares against the baseline regardless."
    required: false
    default: "false"
  alert_threshold:
    description: >-
      Ratio of current to baseline value above which github-action-benchmark alerts,
      e.g. "115%". Callers using the paired-bootstrap strategy should loosen this into a
      catastrophic-regression backstop, since the comparison script owns real alerting.
    required: false
    default: "115%"
  alert_strategy:
    description: >-
      How regressions are detected. "point-ratio": only the alert_threshold point comparison.
      "paired-bootstrap": percentile series whose runs published per-query samples alert when the
      bootstrapped lower 95% bound of the paired percentile ratio exceeds 1.15x -- pairing cancels
      cross-query latency variance, so this is both less noisy and more sensitive than a point
      comparison. Series without samples fall back to disjoint-CI, then 15% point comparisons.
      p99 series stay charted but never alert; a single-run p99 cannot evidence a regression.
    required: false
    default: "point-ratio"

runs:
  using: "composite"
  steps:
    - name: Refresh pg_search after snapshot restore
      shell: bash
      run: |
        # Heap snapshots include an old extension catalog. Recreate it from the installed
        # build so benchmarks also pick up unreleased SQL changes.
        psql "postgresql://localhost:288${{ env.pg_version }}/postgres" \
          -v ON_ERROR_STOP=1 --single-transaction \
          -c "DROP EXTENSION IF EXISTS pg_search;" \
          -c "CREATE EXTENSION pg_search;"

    - name: Run Benchmarks
      working-directory: benchmarks/
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
        FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        INDEX: ${{ inputs.index }}
        SIZE: ${{ inputs.size }}
      run: |
        POSTGRES_URL="postgresql://$(whoami)@localhost:288${{ env.pg_version }}/postgres"

        # The heap is assumed to already be restored from a snapshot; the benchmark builds the
        # index and runs queries against it.
        cargo run --release -- benchmark \
          --url "${POSTGRES_URL}" \
          --dataset "${DATASET}" \
          --index "${INDEX}" \
          --size "${SIZE}" \
          --runs 10 \
          --output json \
          --fail-on-error "${FAIL_ON_ERROR}"

    - name: Upload Query Benchmark Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: query-benchmark-${{ inputs.dataset }}-${{ inputs.index }}-${{ inputs.size }}-${{ github.run_attempt }}
        path: benchmarks/results.json
        retention-days: 1 # Fallback if publishing fails
        if-no-files-found: warn

    - name: Print the Postgres Logs
      if: failure()
      shell: bash
      run: cat ~/.pgrx/${{ env.pg_version }}.log

    - name: Print Crashdump Stacktrace
      if: always()
      shell: bash
      env:
        PG_VERSION: ${{ env.pg_version }}
      run: ./.github/scripts/render_crashdump.sh

    - name: Stage results for publication
      uses: ./.github/actions/stage-benchmark-results
      with:
        kind: queries
        key: ${{ inputs.dataset }}-${{ inputs.index }}-${{ inputs.size }}
        metadata: ${{ toJSON(inputs) }}
        path: benchmarks/results.json
