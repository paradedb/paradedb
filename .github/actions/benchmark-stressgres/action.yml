name: Benchmark - Stressgres
description: Run a given Stressgres job file against pg_search and stage results for publication

inputs:
  test_file:
    description: "The .toml Stressgres scenario to run (e.g. single-node-planner-paths.toml)"
    required: true
  duration:
    description: "Duration of the Stressgres run, in milliseconds"
    required: false
    default: "600000" # 10 minutes in milliseconds
  ref:
    description: "Git ref or short SHA to report in benchmarks"
    required: true

runs:
  using: "composite"
  steps:
    - name: Sanitize Inputs Into Variables
      id: sanitize-inputs
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        TEST_FILE: ${{ inputs.test_file }}
      run: |
        # Strip .toml from the test file name
        echo "jobname=$(basename "$TEST_FILE" .toml)" >> "$GITHUB_OUTPUT"

        # Strip slashes from the ref
        safe_ref="${REF//\//-}"
        echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"

    - name: Resolving ${{ inputs.ref }} into SHA
      id: resolve_ref
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        echo "Resolving ref: $REF" >&2
        # Try local resolution only
        SHA=$(git rev-parse --verify --quiet "$REF")
        if [ -z "$SHA" ]; then
          echo "Could not resolve ref '$REF'" >&2
          exit 1
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Run Stressgres Job
      shell: bash
      env:
        DURATION: ${{ inputs.duration }}
        TEST_FILE: ${{ inputs.test_file }}
        STEP_SANITIZE_INPUTS_JOBNAME: ${{ steps.sanitize-inputs.outputs.jobname }}
        STEP_RESOLVE_REF_SHA: ${{ steps.resolve_ref.outputs.sha }}
      run: |
        sudo chmod a+rwx /var/run/postgresql/
        stressgres headless \
          "stressgres/suites/${TEST_FILE}" \
          --log-file "stressgres-${STEP_SANITIZE_INPUTS_JOBNAME}-""${STEP_RESOLVE_REF_SHA}".log \
          --pgversion pg18 \
          --runtime "${DURATION}"

    - name: Generate CSV
      shell: bash
      env:
        STEP_SANITIZE_INPUTS_JOBNAME: ${{ steps.sanitize-inputs.outputs.jobname }}
        STEP_RESOLVE_REF_SHA: ${{ steps.resolve_ref.outputs.sha }}
      run: stressgres csv "stressgres-${STEP_SANITIZE_INPUTS_JOBNAME}-""${STEP_RESOLVE_REF_SHA}".log output.csv

      # This is where we can configure how the different runs are aggregated
      # into multiple JSON files for plotting in our continuous benchmarks.
      #
      # TPS values are pulled out separately as they're "bigger-is-better" whereas
      # everything else is "smaller-is-better"
    - name: Generate Continuous Benchmarking Metrics
      shell: python {0}
      run: |
        import csv, json, os
        tps, other = [], []
        with open(f"output.csv") as f:
            reader = csv.DictReader(f)
            for row in reader:
                m = {
                  "name": f"{row['job_title']} - {row['server_name']} - {row['metric_name']}",
                  "unit": f"median {row['metric_name']}",
                  "value": float(row['median']),
                  "extra": f"avg {row['metric_name']}: {row['avg']}, max {row['metric_name']}: {row['max']}, count: {row['count']}"
                }
                if row["metric_name"] == "tps":
                    tps.append(m)
                else:
                    other.append(m)
        tps.sort(key=lambda x: x["name"])
        other.sort(key=lambda x: x["name"])
        with open(f"pg_search_tps.json", "w")  as o: json.dump(tps, o)
        with open(f"pg_search_other.json", "w") as o: json.dump(other, o)

    - name: Stage results for publication
      uses: ./.github/actions/stage-benchmark-results
      with:
        kind: stressgres
        key: ${{ steps.sanitize-inputs.outputs.jobname }}
        metadata: ${{ toJSON(inputs) }}
        path: pg_search_*.json

    - name: Print Postgres Logs
      if: always()
      shell: bash
      run: |
        shopt -s nullglob
        for file in /tmp/stressgres/*.log; do
          echo "$file"
          cat "$file"
        done
