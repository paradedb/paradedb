name: Benchmark Vector Operating Points
description: Measure k6 vector operating points, then collect separate PostgreSQL profiles

inputs:
  dataset:
    description: "Dataset name and size used for the profile artifact"
    required: true
  container:
    description: "Database container to profile"
    default: "paradedb"
  profile-warmup-seconds:
    description: "Profile warmup duration per operating point"
    default: "5"
  profile-duration-seconds:
    description: "Profile measurement duration per operating point, after warmup"
    default: "10"

runs:
  using: composite
  steps:
    - name: Measure selected operating points with k6
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        root="$PWD"
        mkdir -p benchmarker/results
        printf '\nPublished k6 latency and QPS are measured without perf. PostgreSQL profiles come from a separate, shorter pass and do not contribute to published timings.\n' \
          >> benchmark-artifacts/result-context.md
        while IFS= read -r point; do
          (
            cd benchmarker/results
            taskset -c 64-67 "$root/benchmarker/k6" run --out dashboard=json,html \
              -e PARADEDB_URL="$PARADEDB_URL" \
              -e OPERATING_POINTS="$root/benchmark-artifacts/operating_points.json" \
              -e OPERATING_POINT="$point" \
              -e QUERY_VECTORS="$root/benchmark-artifacts/query_vectors.json" \
              "$root/benchmarks/cohere/k6/search.js"
          )
          jsons=(benchmarker/results/dashboard_*.json)
          htmls=(benchmarker/results/dashboard_*.html)
          test "${#jsons[@]}" -eq 1 && test "${#htmls[@]}" -eq 1
          mv "${jsons[0]}" "benchmarker/results/${point}.json"
          mv "${htmls[0]}" "benchmarker/results/${point}.html"
        done < <(jq -r '.[] | select(.reached) | .name' benchmark-artifacts/operating_points.json)

    - name: Install host perf
      uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
      with:
        packages: linux-perf

    - name: Profile selected operating points with k6
      shell: bash
      env:
        PROFILE_CONTAINER: ${{ inputs.container }}
        PROFILE_WARMUP_SECONDS: ${{ inputs.profile-warmup-seconds }}
        PROFILE_DURATION_SECONDS: ${{ inputs.profile-duration-seconds }}
      run: |
        set -euo pipefail
        root="$PWD"
        while IFS= read -r point; do
          output="$root/benchmark-profiles/$PROFILE_CONTAINER/$point"
          mkdir -p "$output"
          (
            cd "$output"
            bash "$root/.github/scripts/profile-postgres.sh" "$PROFILE_CONTAINER" "$output" -- \
              taskset -c 64-67 "$root/benchmarker/k6" run --out dashboard=json,html \
              -e PARADEDB_URL="$PARADEDB_URL" \
              -e OPERATING_POINTS="$root/benchmark-artifacts/operating_points.json" \
              -e OPERATING_POINT="$point" \
              -e QUERY_VECTORS="$root/benchmark-artifacts/query_vectors.json" \
              -e WARMUP_SECONDS="$PROFILE_WARMUP_SECONDS" \
              -e DURATION_SECONDS="$PROFILE_DURATION_SECONDS" \
              "$root/benchmarks/cohere/k6/search.js"
          )
        done < <(jq -r '.[] | select(.reached) | .name' benchmark-artifacts/operating_points.json)

    - name: Upload PostgreSQL profiles
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.dataset }}-perf
        path: benchmark-profiles/
        retention-days: 7
        if-no-files-found: warn
