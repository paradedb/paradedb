name: Fetch Benchmark Sources from Main
description: Fetch latest benchmark code and suites from `main`

inputs:
  source_directory:
    description: "Directory containing the source being benchmarked or built"
    required: false
    default: "."
  github-token:
    description: "GitHub token to authenticate with"
    required: true

# We manually fetch benchmark code from `main` when backfilling old commits that may predate
# newer queries. Workflow actions stay in the root checkout.

runs:
  using: "composite"
  steps:
    - name: Fetch the Latest Benchmark Queries
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository }}
        path: bench-temp
        token: ${{ inputs.github-token }}
        fetch-depth: 1
        ref: main

    - name: Copy Latest Benchmarks into Place
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ inputs.source_directory }}
      run: |
        for directory in benchmarks stressgres; do
          rm -rf "${SOURCE_DIRECTORY:?}/${directory}"
          cp -rv "bench-temp/${directory}" "${SOURCE_DIRECTORY}/"
        done

    - name: Cleanup Temporary Checkout
      shell: bash
      run: rm -rf bench-temp
