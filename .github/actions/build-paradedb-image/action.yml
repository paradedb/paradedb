name: Build ParadeDB Image
description: Build ParadeDB from source or a prebuilt Antithesis pg_search package

inputs:
  ref:
    description: "pg_search commit/ref to build"
    required: true
  base_image:
    description: "Base ParadeDB image"
    required: false
    default: "paradedb/paradedb:latest-pg18"
  image_tag:
    description: "Tag for the built image"
    required: false
    default: "paradedb-source:ci"
  cache_scope:
    description: "Scope for GHA cache"
    required: false
    default: "benchmarker-source-pg18-arm64"

  checkout_source:
    description: "Checkout ref into pg_search_source; disable to use the caller's checkout and artifacts"
    required: false
    default: "true"
  context:
    description: "Docker build context (relative to the workspace)"
    required: false
    default: "pg_search_source"
  dockerfile:
    description: "Dockerfile path (relative to the workspace)"
    required: false
    default: "docker/Dockerfile.source"
  platforms:
    description: "Target platforms (empty uses the runner architecture)"
    required: false
    default: ""
  build_args:
    description: "Additional newline-separated Docker build arguments"
    required: false
    default: ""
  labels:
    description: "Newline-separated image metadata labels"
    required: false
    default: ""
  push:
    description: "Push image_tag to the registry (caller must log in first)"
    required: false
    default: "false"
  load:
    description: "Load the image into the local Docker daemon"
    required: false
    default: "true"

outputs:
  short_commit:
    description: "Short commit SHA of pg_search ref"
    value: ${{ steps.commit_info.outputs.short_commit }}

runs:
  using: composite
  steps:
    - name: Checkout pg_search Source at ref=${{ inputs.ref }}
      if: inputs.checkout_source == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        path: pg_search_source
        persist-credentials: false
        fetch-depth: 0

    - name: Configure RunsOn Caching
      uses: runs-on/action@v2

    - name: Derive Short Commit
      id: commit_info
      shell: bash
      working-directory: ${{ inputs.checkout_source == 'true' && 'pg_search_source' || '.' }}
      run: echo "short_commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set Up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build ParadeDB Image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        build-args: |
          BASE_IMAGE=${{ inputs.base_image }}
          ${{ inputs.build_args }}
        pull: true
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.load == 'true' }}
        tags: ${{ inputs.image_tag }}
        labels: ${{ inputs.labels }}
        cache-from: type=gha,scope=${{ inputs.cache_scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}
