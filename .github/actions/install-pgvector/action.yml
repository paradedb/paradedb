name: Install pgvector
description: Install the pgvector dependency required by pg_search

inputs:
  pg_version:
    description: "PostgreSQL major version to install against"
    required: true
  pg_impl:
    description: "PostgreSQL installation: system or pgrx"
    required: false
    default: "system"

runs:
  using: composite
  steps:
    - name: Install pgvector Build Dependencies
      uses: paradedb/actions/apt-install@v14
      with:
        packages: build-essential git

    - name: Build and Install pgvector
      shell: bash
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
        INPUTS_PG_IMPL: ${{ inputs.pg_impl }}
      run: |
        set -euo pipefail
        case "$INPUTS_PG_IMPL" in
          system)
            PG_CONFIG="/usr/lib/postgresql/${INPUTS_PG_VERSION}/bin/pg_config"
            INSTALL=(sudo)
            ;;
          pgrx)
            configs=("$HOME"/.pgrx/"${INPUTS_PG_VERSION}".*/pgrx-install/bin/pg_config)
            PG_CONFIG="${configs[0]}"
            INSTALL=()
            ;;
          *) echo "Unsupported PostgreSQL installation: $INPUTS_PG_IMPL" >&2; exit 1 ;;
        esac
        test -x "$PG_CONFIG"
        SOURCE_DIR="$(mktemp -d)"
        trap 'rm -rf "$SOURCE_DIR"' EXIT
        git clone --depth 1 --branch v0.8.6 https://github.com/pgvector/pgvector.git "$SOURCE_DIR"
        make -C "$SOURCE_DIR" PG_CONFIG="$PG_CONFIG" -j "$(nproc)"
        "${INSTALL[@]}" make -C "$SOURCE_DIR" PG_CONFIG="$PG_CONFIG" install
