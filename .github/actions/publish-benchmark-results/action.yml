name: Publish Benchmark Results
description: Stage one metric with its artifact ID and preserve its original comparison on retries

inputs:
  publication_id:
    description: "Stable artifact ID plus metric name, shared by every retry"
    required: true
  name:
    description: "Benchmark suite name"
    required: true
  ref:
    description: "Full SHA of the commit benchmarked"
    required: true
  direction:
    description: "Metric direction: smaller or bigger"
    required: false
    default: "smaller"
  metrics_file:
    description: "JSON results file"
    required: true
  github_token:
    description: "ParadeDB GitHub App installation token"
    required: true
  pages_directory:
    description: "History directory on gh-pages"
    required: true
  publish_baseline:
    description: "Whether to write the baseline to gh-pages"
    required: false
    default: "false"
  alert_threshold:
    description: "Regression alert threshold"
    required: false
    default: "115%"
  comment_on_regression:
    description: "Whether to comment on regressions"
    default: "true"
  comment_summary:
    description: "Whether to comment on every comparison"
    default: "false"

outputs:
  comparison_file:
    description: "History containing this result and its original baseline"
    value: _benchmark_publish/comparison.js

runs:
  using: composite
  steps:
    - name: Validate Metric Direction
      shell: bash
      env:
        DIRECTION: ${{ inputs.direction }}
      run: |
        case "$DIRECTION" in
          smaller|bigger) ;;
          *) echo "Invalid metric direction: $DIRECTION" >&2; exit 1 ;;
        esac

    - name: Prepare Published Metrics
      id: existing
      shell: bash
      env:
        DATA_DIRECTORY: ${{ inputs.pages_directory }}
        SUITE: ${{ inputs.name }}
        PUBLICATION_ID: ${{ inputs.publication_id }}
        PUBLISH_BASELINE: ${{ inputs.publish_baseline }}
      run: python3 .github/scripts/benchmark_publication.py prepare >> "$GITHUB_OUTPUT"

    - name: Prepare Metric and Comments
      if: steps.existing.outputs.published != 'true'
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: ${{ inputs.name }}
        ref: ${{ inputs.ref }}
        tool: ${{ inputs.direction == 'bigger' && 'customBiggerIsBetter' || 'customSmallerIsBetter' }}
        output-file-path: ${{ inputs.metrics_file }}
        github-token: ${{ inputs.github_token }}
        external-data-json-path: _benchmark_publish/history.json
        auto-push: false
        alert-threshold: ${{ inputs.alert_threshold }}
        comment-on-alert: ${{ inputs.comment_on_regression }}
        alert-comment-cc-users: "@${{ github.actor }}"
        comment-always: ${{ inputs.comment_summary }}

    - name: Record Publication and Original Comparison
      if: steps.existing.outputs.published != 'true'
      shell: bash
      env:
        DATA_DIRECTORY: ${{ inputs.pages_directory }}
        SUITE: ${{ inputs.name }}
        PUBLICATION_ID: ${{ inputs.publication_id }}
        PUBLISH_BASELINE: ${{ inputs.publish_baseline }}
      run: |
        python3 .github/scripts/benchmark_publication.py record
        if [ "$PUBLISH_BASELINE" = 'true' ]; then
          git -C benchmark-data-repository add "${DATA_DIRECTORY}/data.js"
        fi
