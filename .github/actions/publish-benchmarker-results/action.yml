name: Publish Benchmarker Results
description: Publish Benchmarker benchmark results to gh-pages

inputs:
  dataset:
    description: "Dataset name (e.g. hackernews, stackexchange)"
    required: true
  ref:
    description: "Full SHA of the commit benchmarked"
    required: true
  github_token:
    description: "GitHub token for publishing and comments"
    required: true
  pr_number:
    description: "PR number to comment on (empty if not a PR)"
    required: false
    default: ""
  publish_baseline:
    description: "Whether to publish baseline metrics to gh-pages"
    required: false
    default: "false"
  context_file:
    description: "Optional Markdown context to include above the benchmark comparison"
    required: false
    default: ""
  sweep_reports_dir:
    description: "Optional directory containing sweep comparison HTML and metadata"
    required: false
    default: ""
  index_metrics_file:
    description: "Optional JSON metrics for index build time and size"
    required: false
    default: ""
  buffer_metrics_file:
    description: "Optional JSON metrics for shared buffer hits per query"
    required: false
    default: ""
  router_metrics_file:
    description: "Optional JSON router-quality ratios; published with regression alerts, not added to the comment table"
    required: false
    default: ""
  router_detail_metrics_file:
    description: "Optional JSON router-quality detail metrics; published without alerts, not added to the comment table"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Upload Dashboards
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        overwrite: true
        retention-days: 30
        name: benchmarker-dashboards-${{ inputs.dataset }}-${{ inputs.ref }}
        path: |
          benchmarker/results/*.json
          benchmarker/results/*.html
        if-no-files-found: warn

    - name: Extract Tracked Metrics
      id: metrics
      shell: bash
      env:
        RESULTS_DIR: benchmarker/results
        METRICS_FILE: benchmarker/benchmarker_metrics.json
        THROUGHPUT_METRICS_FILE: benchmarker/benchmarker_throughput_metrics.json
        INDEX_METRICS_FILE: ${{ inputs.index_metrics_file }}
        BUFFER_METRICS_FILE: ${{ inputs.buffer_metrics_file }}
        ROUTER_METRICS_FILE: ${{ inputs.router_metrics_file }}
        ROUTER_DETAIL_METRICS_FILE: ${{ inputs.router_detail_metrics_file }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        mkdir -p _metrics
        printf '{}\n' > _latency_baseline.json
        printf '{}\n' > _throughput_baseline.json
        printf '{}\n' > _index_baseline.json
        printf '{}\n' > _buffer_baseline.json
        printf '[]\n' > _index_metrics.json
        printf '[]\n' > _buffer_metrics.json
        if [ -n "$INDEX_METRICS_FILE" ]; then
          cp "$INDEX_METRICS_FILE" _index_metrics.json
        fi
        if [ -n "$BUFFER_METRICS_FILE" ]; then
          cp "$BUFFER_METRICS_FILE" _buffer_metrics.json
        fi
        printf '[]\n' > _router_metrics.json
        printf '[]\n' > _router_detail_metrics.json
        if [ -n "$ROUTER_METRICS_FILE" ]; then
          cp "$ROUTER_METRICS_FILE" _router_metrics.json
        fi
        if [ -n "$ROUTER_DETAIL_METRICS_FILE" ]; then
          cp "$ROUTER_DETAIL_METRICS_FILE" _router_detail_metrics.json
        fi
        for j in "${RESULTS_DIR}"/*.json; do
          case "$(basename "$j")" in
            benchmarker_*.json) continue ;;
          esac
          nm="$(basename "$j" .json)"
          jq --arg nm "$nm" '
            [ .runs | to_entries[] | .value as $r
              | ([$r.queries[]?.latencies[]?] | sort) as $sorted
              | ($sorted | length) as $n
              | select($n > 0)
              | ([$r.queries[]?.displayName | select(. != null)][0] // ($r.name + " (" + $nm + ")")) as $label
              | ([$r.queries[]?.timestamps[]?]) as $timestamps
              | if ($timestamps | length) != $n then
                  error("Missing query timestamps for " + $label)
                else . end
              | ([$r.queries[]? | . as $q | range(0; .latencies | length)
                  | $q.timestamps[.] - $q.latencies[.]] | min) as $start
              | ((($timestamps | max) - $start) / 1000) as $seconds
              | if $seconds <= 0 then
                  error("Non-positive query duration for " + $label)
                else . end
              | {
                  name: ($label + " p50 latency"),
                  unit: "ms",
                  value: $sorted[((($n - 1) * 50 / 100) | floor)]
                },
                {
                  name: ($label + " p95 latency"),
                  unit: "ms",
                  value: $sorted[((($n - 1) * 95 / 100) | floor)]
                },
                {
                  name: ($label + " p99 latency"),
                  unit: "ms",
                  value: $sorted[((($n - 1) * 99 / 100) | floor)]
                },
                {
                  name: ($label + " QPS"),
                  unit: "queries/s",
                  value: ($n / $seconds)
                }
            ]
          ' "$j" > "_metrics/${nm}.json"
        done

        mkdir -p "$(dirname "${METRICS_FILE}")" "$(dirname "${THROUGHPUT_METRICS_FILE}")"
        printf '[]\n' > "${METRICS_FILE}"
        printf '[]\n' > "${THROUGHPUT_METRICS_FILE}"
        if compgen -G "_metrics/*.json" > /dev/null; then
          jq -s 'add | map(select(.unit == "ms"))' _metrics/*.json > "${METRICS_FILE}"
          jq -s 'add | map(select(.unit == "queries/s"))' _metrics/*.json > "${THROUGHPUT_METRICS_FILE}"
          echo "=== Extracted Metrics ==="
          cat "${METRICS_FILE}" "${THROUGHPUT_METRICS_FILE}"
        fi
        echo "present=$(jq 'length > 0' "${METRICS_FILE}")" >> "$GITHUB_OUTPUT"
        echo "buffers_present=$(jq 'length > 0' _buffer_metrics.json)" >> "$GITHUB_OUTPUT"
        echo "router_present=$(jq 'length > 0' _router_metrics.json)" >> "$GITHUB_OUTPUT"
        echo "router_detail_present=$(jq 'length > 0' _router_detail_metrics.json)" >> "$GITHUB_OUTPUT"

    - name: Publish Latency Metrics (p50, p95, and p99)
      id: publish_latency
      if: steps.metrics.outputs.present == 'true'
      uses: ./.github/actions/publish-benchmark-results
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-latency
        name: "benchmarker ${{ inputs.dataset }} (latency)"
        ref: ${{ inputs.ref }}
        metrics_file: benchmarker/benchmarker_metrics.json
        github_token: ${{ inputs.github_token }}
        pages_directory: benchmarker
        publish_baseline: ${{ inputs.publish_baseline == 'true' }}
        comment_on_regression: ${{ inputs.pr_number == '' }}

    - name: Read Latency Baseline
      if: inputs.pr_number != '' && steps.publish_latency.outcome == 'success'
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
      run: |
        sed '1s/^window.BENCHMARK_DATA = //' "${{ steps.publish_latency.outputs.comparison_file }}" |
          jq --arg suite "benchmarker ${DATASET} (latency)" '.entries[$suite][-2] // {}' > _latency_baseline.json

    - name: Publish QPS Metrics
      id: publish_throughput
      if: steps.metrics.outputs.present == 'true'
      uses: ./.github/actions/publish-benchmark-results
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-throughput
        name: "benchmarker ${{ inputs.dataset }} (throughput)"
        ref: ${{ inputs.ref }}
        direction: bigger
        metrics_file: benchmarker/benchmarker_throughput_metrics.json
        github_token: ${{ inputs.github_token }}
        pages_directory: benchmarker
        publish_baseline: ${{ inputs.publish_baseline == 'true' }}
        comment_on_regression: ${{ inputs.pr_number == '' }}

    - name: Read QPS Baseline
      if: inputs.pr_number != '' && steps.publish_throughput.outcome == 'success'
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
      run: |
        sed '1s/^window.BENCHMARK_DATA = //' "${{ steps.publish_throughput.outputs.comparison_file }}" |
          jq --arg suite "benchmarker ${DATASET} (throughput)" '.entries[$suite][-2] // {}' > _throughput_baseline.json

    - name: Publish Buffer Metrics
      id: publish_buffers
      if: steps.metrics.outputs.buffers_present == 'true'
      uses: ./.github/actions/publish-benchmark-results
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-buffers
        name: "benchmarker ${{ inputs.dataset }} (buffers)"
        ref: ${{ inputs.ref }}
        metrics_file: _buffer_metrics.json
        github_token: ${{ inputs.github_token }}
        pages_directory: benchmarker
        publish_baseline: ${{ inputs.publish_baseline == 'true' }}
        comment_on_regression: ${{ inputs.pr_number == '' }}

    - name: Read Buffer Baseline
      if: inputs.pr_number != '' && steps.publish_buffers.outcome == 'success'
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
      run: |
        sed '1s/^window.BENCHMARK_DATA = //' "${{ steps.publish_buffers.outputs.comparison_file }}" |
          jq --arg suite "benchmarker ${DATASET} (buffers)" '.entries[$suite][-2] // {}' > _buffer_baseline.json

    # Router-quality history: two suites so only the ratios alert. Neither is read back for the
    # comment's results table.
    - name: Publish Router Ratio Metrics
      if: steps.metrics.outputs.router_present == 'true'
      uses: ./.github/actions/publish-benchmark-results
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-router
        name: "benchmarker ${{ inputs.dataset }} (router)"
        ref: ${{ inputs.ref }}
        metrics_file: _router_metrics.json
        github_token: ${{ inputs.github_token }}
        pages_directory: benchmarker
        publish_baseline: ${{ inputs.publish_baseline == 'true' }}
        comment_on_regression: ${{ inputs.pr_number == '' }}

    - name: Publish Router Detail Metrics
      if: steps.metrics.outputs.router_detail_present == 'true'
      uses: ./.github/actions/publish-benchmark-results
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-router-detail
        name: "benchmarker ${{ inputs.dataset }} (router detail)"
        ref: ${{ inputs.ref }}
        metrics_file: _router_detail_metrics.json
        github_token: ${{ inputs.github_token }}
        pages_directory: benchmarker
        publish_baseline: ${{ inputs.publish_baseline == 'true' }}
        comment_on_regression: false

    - name: Publish Index Build Metrics
      id: publish_index
      if: inputs.index_metrics_file != ''
      uses: ./.github/actions/publish-benchmark-results
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-index
        name: "benchmarker ${{ inputs.dataset }} (index build)"
        ref: ${{ inputs.ref }}
        metrics_file: _index_metrics.json
        github_token: ${{ inputs.github_token }}
        pages_directory: benchmarker
        publish_baseline: ${{ inputs.publish_baseline == 'true' }}
        comment_on_regression: ${{ inputs.pr_number == '' }}

    - name: Read Index Build Baseline
      if: inputs.pr_number != '' && steps.publish_index.outcome == 'success'
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
      run: |
        sed '1s/^window.BENCHMARK_DATA = //' "${{ steps.publish_index.outputs.comparison_file }}" |
          jq --arg suite "benchmarker ${DATASET} (index build)" '.entries[$suite][-2] // {}' > _index_baseline.json

    - name: Stage Reports (HTML Only) for gh-pages
      shell: bash
      env:
        RESULTS_DIR: benchmarker/results
        SWEEP_REPORTS_DIR: ${{ inputs.sweep_reports_dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        mkdir -p _ghpages_html
        htmls=("${RESULTS_DIR}"/*.html)
        if [ ${#htmls[@]} -gt 0 ]; then
          cp "${htmls[@]}" _ghpages_html/
        fi
        if [ -n "$SWEEP_REPORTS_DIR" ] && [ -d "$SWEEP_REPORTS_DIR" ]; then
          sweep_htmls=("${SWEEP_REPORTS_DIR}"/*.html)
          if [ ${#sweep_htmls[@]} -gt 0 ]; then
            mkdir -p _ghpages_html/sweep
            cp "${sweep_htmls[@]}" _ghpages_html/sweep/
          fi
        fi
        ls -la _ghpages_html

    - name: Stage Reports in Pages Checkout
      if: hashFiles('_ghpages_html/**/*.html') != ''
      shell: bash
      env:
        COMMIT_SHA: ${{ inputs.ref }}
        DATASET: ${{ inputs.dataset }}
      run: |
        destination="benchmarker-runs/${COMMIT_SHA}/${DATASET}"
        mkdir -p "benchmark-data-repository/${destination}"
        cp -R _ghpages_html/. "benchmark-data-repository/${destination}/"
        git -C benchmark-data-repository add --sparse -- "$destination"

    - name: Comment Benchmark Comparison and Report Links
      if: inputs.pr_number != '' && (hashFiles('_ghpages_html/**/*.html') != '' || inputs.context_file != '' || inputs.sweep_reports_dir != '' || inputs.index_metrics_file != '' || inputs.buffer_metrics_file != '')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        COMMIT_SHA: ${{ inputs.ref }}
        PR_NUMBER: ${{ inputs.pr_number }}
        DATASET: ${{ inputs.dataset }}
        METRICS_FILE: benchmarker/benchmarker_metrics.json
        THROUGHPUT_METRICS_FILE: benchmarker/benchmarker_throughput_metrics.json
        CONTEXT_FILE: ${{ inputs.context_file }}
        SWEEP_REPORTS_DIR: ${{ inputs.sweep_reports_dir }}
      run: |
        set -euo pipefail
        bash .github/scripts/benchmarker_comment.sh > _comment.md
        cat _comment.md >> "${GITHUB_STEP_SUMMARY}"
        gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file _comment.md

    - name: Fail if No Metrics Were Extracted
      shell: bash
      env:
        METRICS_FILE: benchmarker/benchmarker_metrics.json
      run: |
        [ -f "${METRICS_FILE}" ] || { echo "No metrics file because an earlier step failed. Skipping the check."; exit 0; }
        n=$(jq 'length' "${METRICS_FILE}")
        echo "extracted metric rows: ${n}"
        if [ "${n:-0}" -eq 0 ]; then
          echo "::error::No benchmark metrics extracted: the k6 run produced no query samples. Check query execution / the dashboard export." >&2
          exit 1
        fi
