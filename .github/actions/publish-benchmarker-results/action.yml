name: Publish Benchmarker Results
description: Extract latency and QPS metrics, upload dashboards, publish to gh-pages, and comment on PRs

inputs:
  dataset:
    description: "Dataset name (e.g. hn-ci, stackexchange)"
    required: true
  short_commit:
    description: "Short commit SHA"
    required: true
  ref:
    description: "Git ref or commit benchmarked"
    required: true
  image_tag:
    description: "Image tag tested"
    required: false
    default: "paradedb-source:ci"
  results_dir:
    description: "Directory containing results json and html files"
    required: false
    default: "benchmarker/results"
  metrics_file:
    description: "Path to write extracted latency metrics json"
    required: false
    default: "benchmarker/benchmarker_metrics.json"
  throughput_metrics_file:
    description: "Path to write extracted QPS metrics json"
    required: false
    default: "benchmarker/benchmarker_throughput_metrics.json"
  github_token:
    description: "GitHub token for publishing and comments"
    required: true
  pr_number:
    description: "PR number to comment on (empty if not a PR)"
    required: false
    default: ""
  auto_push:
    description: "Whether to auto-push baseline metrics to gh-pages"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Upload dashboards
      uses: actions/upload-artifact@v7
      with:
        overwrite: true
        retention-days: 30
        name: benchmarker-dashboards-${{ inputs.dataset }}-${{ inputs.short_commit }}
        path: |
          ${{ inputs.results_dir }}/*.json
          ${{ inputs.results_dir }}/*.html
        if-no-files-found: warn

    - name: Extract tracked metrics
      shell: bash
      env:
        RESULTS_DIR: ${{ inputs.results_dir }}
        METRICS_FILE: ${{ inputs.metrics_file }}
        THROUGHPUT_METRICS_FILE: ${{ inputs.throughput_metrics_file }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        mkdir -p _metrics
        printf '{}\n' > _latency_baseline.json
        printf '{}\n' > _throughput_baseline.json
        for j in "${RESULTS_DIR}"/*.json; do
          case "$(basename "$j")" in
            benchmarker_*.json) continue ;;
          esac
          nm="$(basename "$j" .json)"
          jq --arg nm "$nm" '
            [ .runs | to_entries[] | .value as $r
              | ([$r.queries[]?.latencies[]?] | sort) as $sorted
              | ($sorted | length) as $n
              | select($n > 0)
              | ([$r.queries[]?.displayName | select(. != null)][0] // ($r.name + " (" + $nm + ")")) as $label
              | ([$r.queries[]?.timestamps[]?]) as $timestamps
              | if ($timestamps | length) != $n then
                  error("Missing query timestamps for " + $label)
                else . end
              | ([$r.queries[]? | . as $q | range(0; .latencies | length)
                  | $q.timestamps[.] - $q.latencies[.]] | min) as $start
              | ((($timestamps | max) - $start) / 1000) as $seconds
              | if $seconds <= 0 then
                  error("Non-positive query duration for " + $label)
                else . end
              | {
                  name: ($label + " p50 latency"),
                  unit: "ms",
                  value: $sorted[((($n - 1) * 50 / 100) | floor)]
                },
                {
                  name: ($label + " p95 latency"),
                  unit: "ms",
                  value: $sorted[((($n - 1) * 95 / 100) | floor)]
                },
                {
                  name: ($label + " p99 latency"),
                  unit: "ms",
                  value: $sorted[((($n - 1) * 99 / 100) | floor)]
                },
                {
                  name: ($label + " QPS"),
                  unit: "queries/s",
                  value: ($n / $seconds)
                }
            ]
          ' "$j" > "_metrics/${nm}.json"
        done

        mkdir -p "$(dirname "${METRICS_FILE}")" "$(dirname "${THROUGHPUT_METRICS_FILE}")"
        if compgen -G "_metrics/*.json" > /dev/null; then
          jq -s 'add | map(select(.unit == "ms"))' _metrics/*.json > "${METRICS_FILE}"
          jq -s 'add | map(select(.unit == "queries/s"))' _metrics/*.json > "${THROUGHPUT_METRICS_FILE}"
          echo "=== Extracted Metrics ==="
          cat "${METRICS_FILE}" "${THROUGHPUT_METRICS_FILE}"
        fi

    - name: Cleanup Previous Benchmark Publish Working Directory
      shell: bash
      run: rm -rf ./benchmark-data-repository

    - name: Publish Latency Metrics (p50, p95, and p99)
      id: publish_latency
      if: hashFiles(inputs.metrics_file) != ''
      continue-on-error: true
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: "benchmarker ${{ inputs.dataset }} (latency)"
        ref: ${{ inputs.ref }}
        tool: customSmallerIsBetter
        output-file-path: ${{ inputs.metrics_file }}
        github-token: ${{ inputs.github_token }}
        gh-repository: github.com/${{ github.repository }}
        gh-pages-branch: gh-pages
        benchmark-data-dir-path: benchmarker
        auto-push: ${{ inputs.auto_push == 'true' }}
        alert-threshold: "115%"
        comment-on-alert: ${{ inputs.pr_number == '' }}
        alert-comment-cc-users: "@${{ github.actor }}"
        comment-always: false

    - name: Read latency baseline
      if: inputs.pr_number != '' && steps.publish_latency.outcome == 'success'
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
      run: |
        sed '1s/^window.BENCHMARK_DATA = //' benchmark-data-repository/benchmarker/data.js |
          jq --arg suite "benchmarker ${DATASET} (latency)" '.entries[$suite][-2] // {}' > _latency_baseline.json

    - name: Cleanup Previous Benchmark Publish Working Directory
      shell: bash
      run: rm -rf ./benchmark-data-repository

    - name: Publish QPS Metrics
      id: publish_throughput
      if: hashFiles(inputs.throughput_metrics_file) != ''
      continue-on-error: true
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: "benchmarker ${{ inputs.dataset }} (throughput)"
        ref: ${{ inputs.ref }}
        tool: customBiggerIsBetter
        output-file-path: ${{ inputs.throughput_metrics_file }}
        github-token: ${{ inputs.github_token }}
        gh-repository: github.com/${{ github.repository }}
        gh-pages-branch: gh-pages
        benchmark-data-dir-path: benchmarker
        auto-push: ${{ inputs.auto_push == 'true' }}
        alert-threshold: "115%"
        comment-on-alert: ${{ inputs.pr_number == '' }}
        alert-comment-cc-users: "@${{ github.actor }}"
        comment-always: false

    - name: Read QPS baseline
      if: inputs.pr_number != '' && steps.publish_throughput.outcome == 'success'
      shell: bash
      env:
        DATASET: ${{ inputs.dataset }}
      run: |
        sed '1s/^window.BENCHMARK_DATA = //' benchmark-data-repository/benchmarker/data.js |
          jq --arg suite "benchmarker ${DATASET} (throughput)" '.entries[$suite][-2] // {}' > _throughput_baseline.json

    - name: Stage dashboards (HTML only) for gh-pages
      shell: bash
      env:
        RESULTS_DIR: ${{ inputs.results_dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        mkdir -p _ghpages_html
        htmls=("${RESULTS_DIR}"/*.html)
        if [ ${#htmls[@]} -gt 0 ]; then
          cp "${htmls[@]}" _ghpages_html/
        fi
        ls -la _ghpages_html

    - name: Publish dashboards to gh-pages
      if: hashFiles('_ghpages_html/*.html') != ''
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ./_ghpages_html
        destination_dir: benchmarker-runs/${{ inputs.short_commit }}/${{ inputs.dataset }}
        keep_files: true
        user_name: "github-actions[bot]"
        user_email: "github-actions[bot]@users.noreply.github.com"
        commit_message: "benchmarker dashboards for ${{ inputs.short_commit }} (${{ inputs.dataset }})"

    - name: Comment benchmark comparison and dashboard links
      if: inputs.pr_number != '' && hashFiles('_ghpages_html/*.html') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        STEP_COMMIT_INFO_SHORT_COMMIT: ${{ inputs.short_commit }}
        PR_NUMBER: ${{ inputs.pr_number }}
        DATASET: ${{ inputs.dataset }}
        METRICS_FILE: ${{ inputs.metrics_file }}
        THROUGHPUT_METRICS_FILE: ${{ inputs.throughput_metrics_file }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${EVENT_REPOSITORY_NAME}/benchmarker-runs/${STEP_COMMIT_INFO_SHORT_COMMIT}/${DATASET}"
        OVERTIME="https://${GITHUB_REPOSITORY_OWNER}.github.io/${EVENT_REPOSITORY_NAME}/benchmarker/"
        links=""
        for h in _ghpages_html/*.html; do
          nm="$(basename "$h" .html)"
          links="${links}- [${nm}](${BASE}/${nm}.html)"$'\n'
        done
        {
          printf '### 📊 Benchmarker results (%s): `%s`\n\n' "${DATASET}" "${STEP_COMMIT_INFO_SHORT_COMMIT}"
          jq -nr --slurpfile latency _latency_baseline.json --slurpfile throughput _throughput_baseline.json '
            "Baselines: latency `\($latency[0].commit.id // "—")`, QPS `\($throughput[0].commit.id // "—")`.\n"
          '
          printf '| Benchmark | Current | Previous | Ratio |\n|---|---:|---:|---:|\n'
          jq -nr \
            --slurpfile latency "${METRICS_FILE}" \
            --slurpfile throughput "${THROUGHPUT_METRICS_FILE}" \
            --slurpfile latency_baseline _latency_baseline.json \
            --slurpfile throughput_baseline _throughput_baseline.json '
            def display: "\(.value * 1000 | round / 1000) \(.unit)";
            (($latency[0] | map(. + {baseline: $latency_baseline[0]})) +
             ($throughput[0] | map(. + {baseline: $throughput_baseline[0]})))
            | sort_by((.name | sub(" (p[0-9]+ latency|QPS)$"; "")), .unit == "queries/s", .name)
            | .[] as $current
            | ([$current.baseline.benches[]? | select(.name == $current.name)][0]) as $previous
            | (if $previous != null and $previous.value > 0 then
                 if $current.unit == "queries/s" then
                   if $current.value > 0 then $previous.value / $current.value else null end
                 else $current.value / $previous.value end
               else null end) as $ratio
            | (if $ratio == null then "—" else
                 "\($ratio * 100 | round / 100)x" + (if $ratio > 1.15 then " ⚠️" else "" end)
               end) as $ratio_text
            | "| `\($current.name)` | \($current | display) | \(if $previous == null then "—" else $previous | display end) | \($ratio_text) |"
          '
          printf '\nRatio: current/previous for latency, previous/current for QPS; below 1 is better. ⚠️ marks regressions above 1.15x. — means no comparable baseline.\n'
          printf '\n'
          printf 'Interactive per-script graphs (latency timeline, throughput, per-container **CPU %%** / **memory**):\n\n'
          printf '%s\n' "$links"
          printf 'Over-time tracking (p50, p95, p99 latency and QPS across commits): [%s](%s)\n\n' "$OVERTIME" "$OVERTIME"
          printf '_gh-pages may take ~a minute to deploy after this run._\n'
        } > _comment.md
        cat _comment.md >> "${GITHUB_STEP_SUMMARY}"
        gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file _comment.md

    - name: Fail if no metrics were extracted
      shell: bash
      env:
        METRICS_FILE: ${{ inputs.metrics_file }}
      run: |
        [ -f "${METRICS_FILE}" ] || { echo "no metrics file (earlier stage failed); skipping guard"; exit 0; }
        n=$(jq 'length' "${METRICS_FILE}")
        echo "extracted metric rows: ${n}"
        if [ "${n:-0}" -eq 0 ]; then
          echo "::error::No benchmark metrics extracted: the k6 run produced no query samples. Check query execution / the dashboard export." >&2
          exit 1
        fi
