name: Publish Queries Results
description: Publish Queries benchmark results to gh-pages

inputs:
  source_directory:
    description: "Source directory used by the benchmark"
    required: false
    default: "."
  dataset:
    description: "The benchmark dataset to run (e.g. logs, docs, stackoverflow)"
    required: true
  size:
    description: "Size label for pre-sampled dataset, e.g. '100k', '1m', '20m'"
    required: true
  index:
    description: "Index variant to build/benchmark (resolves to datasets/{dataset}/indexes/{index}.sql), e.g. bm25, hnsw, ivfflat"
    required: true
  ref:
    description: "Full SHA of the commit benchmarked"
    required: true
  github_token:
    description: "GitHub token to authenticate with"
    required: true
  publish:
    description: "Whether to push results to the gh-pages baseline that later runs are diffed against. Only main runs update the baseline. All runs compare against it."
    required: false
    default: "false"
  alert_threshold:
    description: >-
      Ratio of current to baseline value above which github-action-benchmark alerts,
      e.g. "115%". Callers using the paired-bootstrap strategy should loosen this into a
      catastrophic-regression backstop, since the comparison script owns real alerting.
    required: false
    default: "115%"
  alert_strategy:
    description: >-
      How regressions are detected. "point-ratio": only the alert_threshold point comparison.
      "paired-bootstrap": percentile series whose runs published per-query samples alert when the
      bootstrapped lower 95% bound of the paired percentile ratio exceeds 1.15x. Pairing cancels
      cross-query latency variance, so this is both less noisy and more sensitive than a point
      comparison. Series without samples fall back to disjoint-CI, then 15% point comparisons.
      p99 series stay on the charts but never trigger alerts. One run is not enough to detect a p99 regression.
    required: false
    default: "point-ratio"

runs:
  using: composite
  steps:
    # Necessary to avoid "destination path is not empty" error
    - name: Cleanup Previous Benchmark Publish Working Directory
      shell: bash
      run: rm -rf ./benchmark-data-repository

    - name: Publish Benchmark Metrics
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: "pg_search '${{ inputs.dataset }} (${{ inputs.index }})' (${{ inputs.size }} rows)"
        ref: ${{ inputs.ref }}
        tool: customSmallerIsBetter
        output-file-path: ${{ inputs.source_directory }}/benchmarks/results_${{ inputs.dataset }}_${{ inputs.index }}_${{ inputs.size }}.json
        github-token: ${{ inputs.github_token }}
        gh-repository: github.com/${{ github.repository }}
        gh-pages-branch: gh-pages
        auto-push: ${{ inputs.publish }}
        benchmark-data-dir-path: benchmarks
        alert-threshold: ${{ inputs.alert_threshold }}
        comment-on-alert: true # We comment and alert rather than failing, so regressions are reported on GitHub
        alert-comment-cc-users: "@${{ github.actor }}"
        comment-always: ${{ github.event_name == 'pull_request' }}

    # The publish step above appends the current run to its local gh-pages clone, so the script
    # takes the second-to-last entry as the baseline.
    - name: Compare Against Baseline (Paired Bootstrap)
      if: inputs.alert_strategy == 'paired-bootstrap'
      id: paired_bootstrap
      shell: bash
      env:
        INPUTS_DATASET: ${{ inputs.dataset }}
        INPUTS_INDEX: ${{ inputs.index }}
        RESULTS_FILE: ${{ inputs.source_directory }}/benchmarks/results_${{ inputs.dataset }}_${{ inputs.index }}_${{ inputs.size }}.json
      run: |
        python3 "${GITHUB_ACTION_PATH}/compare_baseline.py" \
          --results "$RESULTS_FILE" \
          --data-js benchmark-data-repository/benchmarks/data.js \
          --suite "pg_search '${INPUTS_DATASET} (${INPUTS_INDEX})' (${{ inputs.size }} rows)" \
          --out benchmark-alert.md

    - name: Comment on Alert (Paired Bootstrap)
      if: inputs.alert_strategy == 'paired-bootstrap' && steps.paired_bootstrap.outputs.alert == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        printf '\ncc @%s\n' "${GITHUB_ACTOR}" >> benchmark-alert.md
        gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
          -F body=@benchmark-alert.md
