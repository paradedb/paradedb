name: Publish Stressgres Results
description: Publish Stressgres benchmark results to gh-pages

inputs:
  test_file:
    description: "Stressgres scenario file (e.g. single-node-planner-paths.toml)"
    required: true
  ref:
    description: "Full SHA of the commit benchmarked"
    required: true
  github_token:
    description: "GitHub token for publishing and comments"
    required: true

runs:
  using: composite
  steps:
    # Necessary to avoid "destination path is not empty" error
    - name: Cleanup Previous Benchmark Publish Working Directory
      shell: bash
      run: rm -rf ./benchmark-data-repository

    - name: Publish TPS Metrics
      uses: ./.github/actions/publish-benchmark-metrics
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-tps
        name: "pg_search ${{ inputs.test_file }} Performance - TPS"
        ref: ${{ inputs.ref }}
        tool: customBiggerIsBetter
        output_file: pg_search_tps.json
        github_token: ${{ inputs.github_token }}
        auto_push: ${{ github.event_name != 'pull_request' }}
        data_directory: stressgres
        alert_threshold: "115%"
        comment_on_alert: true # We comment and alert rather than failing, so regressions are reported on GitHub
        comment_always: ${{ github.event_name == 'pull_request' }}

    # Necessary to avoid "destination path is not empty" error
    - name: Cleanup Previous Benchmark Publish Working Directory
      shell: bash
      run: rm -rf ./benchmark-data-repository

    - name: Publish Other Metrics
      uses: ./.github/actions/publish-benchmark-metrics
      with:
        publication_id: ${{ env.BENCHMARK_PUBLICATION_ID }}-other
        name: "pg_search ${{ inputs.test_file }} Performance - Other Metrics"
        ref: ${{ inputs.ref }}
        tool: customSmallerIsBetter
        output_file: pg_search_other.json
        github_token: ${{ inputs.github_token }}
        auto_push: ${{ github.event_name != 'pull_request' }}
        data_directory: stressgres
        alert_threshold: "110%"
        comment_on_alert: true
        comment_always: ${{ github.event_name == 'pull_request' }}
