name: Set Up Benchmark Cluster
description: >-
  Install and configure the pg_search + pgvector Postgres cluster used by both benchmark snapshot
  generation and snapshot restore. Keeping this in one place ensures the cluster that gets
  snapshotted matches the cluster that restores it (a pgBackRest snapshot is a whole-cluster image,
  including installed extensions and GUCs).

inputs:
  source_directory:
    description: "Directory containing the source being benchmarked or built"
    required: false
    default: "."
  pg_version:
    description: "PostgreSQL major version."
    required: false
    default: "18"
  global_target_segment_count:
    description: >-
      Cluster-wide `paradedb.global_target_segment_count`. A non-zero value overrides every
      index's own `target_segment_count`. With `0` (the extension's default), each index uses its
      own value. Defaults to `0`. Callers that want a fixed cluster-wide count (e.g. the
      stackoverflow bm25 indexes, which set no per-index count) pass their own.
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Set Up pg_search Build Environment
      uses: ./.github/actions/setup-pg-search-build-environment
      with:
        source_directory: ${{ inputs.source_directory }}
        pg_version: ${{ inputs.pg_version }}
        cache_prefix_key: "v2-benchmarks-rust-cache"
        cache_save: "true"
        cache_on_failure: "true"
        extra_packages: lld libopenblas-dev gdb

    - name: Enable Crash Dumps
      shell: bash
      run: ./.github/scripts/setup_crashdumps.sh

    - name: Compile and Install pg_search
      working-directory: ${{ inputs.source_directory }}
      shell: bash
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
      run: >-
        cargo pgrx install -p pg_search --sudo --release
        --pg-config "/usr/lib/postgresql/${INPUTS_PG_VERSION}/bin/pg_config"
        "--features=pg${INPUTS_PG_VERSION}" --no-default-features

    - name: Start PostgreSQL
      shell: bash
      working-directory: ${{ inputs.source_directory }}/pg_search/
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
      run: cargo pgrx start "pg${INPUTS_PG_VERSION}"

    - name: Configure PostgreSQL Settings and Machine Settings
      shell: bash
      working-directory: /home/runner/.pgrx/data-${{ inputs.pg_version }}/
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
      run: |
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM RESET ALL;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET shared_preload_libraries = pg_search,pg_stat_statements;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET maintenance_work_mem = '12GB';"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET shared_buffers = '12GB';"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET max_parallel_workers = 8;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET max_worker_processes = 8;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET max_parallel_maintenance_workers = 8;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET max_parallel_workers_per_gather = 8;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET autovacuum = off;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET max_wal_size = '100GB';"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET jit = off;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET bgwriter_lru_maxpages = 0;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET max_wal_senders = 0;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET wal_level = minimal;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET huge_pages = on;"
        sudo sysctl -w vm.nr_hugepages=10000

    - name: Restart Postgres
      shell: bash
      working-directory: ${{ inputs.source_directory }}/pg_search/
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
      run: |
        cargo pgrx stop "pg${INPUTS_PG_VERSION}"
        cargo pgrx start "pg${INPUTS_PG_VERSION}"

    - name: Install pg_stat_statements
      shell: bash
      working-directory: /home/runner/.pgrx/data-${{ inputs.pg_version }}/
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
      run: |
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "CREATE EXTENSION pg_stat_statements;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET pg_stat_statements.track_planning = on;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET pg_stat_statements.track = top ;"

    - name: Install pg_search
      shell: bash
      working-directory: ${{ inputs.source_directory }}/pg_search/
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
        INPUTS_GLOBAL_TARGET_SEGMENT_COUNT: ${{ inputs.global_target_segment_count }}
      run: |
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "CREATE EXTENSION IF NOT EXISTS vector;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "CREATE EXTENSION IF NOT EXISTS pg_search;"
        psql "postgresql://localhost:288${INPUTS_PG_VERSION}/postgres" -c "ALTER SYSTEM SET paradedb.global_target_segment_count = ${INPUTS_GLOBAL_TARGET_SEGMENT_COUNT};";

    - name: Restart Postgres
      shell: bash
      working-directory: ${{ inputs.source_directory }}/pg_search/
      env:
        INPUTS_PG_VERSION: ${{ inputs.pg_version }}
      run: |
        cargo pgrx stop "pg${INPUTS_PG_VERSION}"
        cargo pgrx start "pg${INPUTS_PG_VERSION}"

    - name: Install pgBackRest
      uses: paradedb/actions/apt-install@v14
      with:
        packages: pgbackrest
