name: Set Up Benchmarker
description: Checkout the benchmarker repository, set up Go, and build binaries

inputs:
  repository:
    description: "Repository to clone"
    required: false
    default: "paradedb/benchmarker"
  ref:
    description: "Ref to checkout"
    required: false
    default: "main"
  verbose:
    description: "Show xk6 dependency-resolution diagnostics"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Checkout benchmarker (${{ inputs.ref }})
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: benchmarker

    - name: Set Up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: benchmarker/go.mod
        cache-dependency-path: benchmarker/go.sum

    - name: Build benchmarker (k6 + loader)
      shell: bash
      working-directory: benchmarker
      env:
        GOTOOLCHAIN: auto
        VERBOSE_BUILD: ${{ inputs.verbose }}
      run: |
        if [[ "$VERBOSE_BUILD" == "true" ]]; then
          xk6="$(go env GOPATH)/bin/xk6"
          make "$xk6"
          "$xk6" build --verbose --with github.com/paradedb/benchmarker=.
          make loader viewer
        else
          make
        fi
