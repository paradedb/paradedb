name: Set Up Git Signing
description: Configure SSH commit and tag signing in the current repository

inputs:
  github-token:
    description: GitHub token for checking the registered signing key
    required: true
  signing-key:
    description: Unencrypted OpenSSH private signing key
    required: true
  signing-user:
    description: GitHub account that owns the signing key
    required: true
  signing-email:
    description: Verified email address on the signing account
    required: true

runs:
  using: composite
  steps:
    - name: Configure SSH Signing
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SIGNING_KEY: ${{ inputs.signing-key }}
        SIGNING_USER: ${{ inputs.signing-user }}
        SIGNING_EMAIL: ${{ inputs.signing-email }}
      run: |
        : "${SIGNING_KEY:?A signing key is required}"
        : "${SIGNING_USER:?A signing user is required}"
        : "${SIGNING_EMAIL:?A signing email is required}"
        umask 077
        # Callers remove these files in an always() step after signing is finished.
        KEY_FILE="$RUNNER_TEMP/github-bot-signing-key"
        printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
        PUBLIC_KEY=$(ssh-keygen -y -P '' -f "$KEY_FILE" | awk '{print $1, $2}')
        gh api --paginate "users/$SIGNING_USER/ssh_signing_keys" --jq '.[] | .key | split(" ") | .[0:2] | join(" ")' |
          grep -Fx -- "$PUBLIC_KEY"
        printf '%s %s\n' "$SIGNING_EMAIL" "$PUBLIC_KEY" > "$KEY_FILE.allowed-signers"
        git config user.name "$SIGNING_USER"
        git config user.email "$SIGNING_EMAIL"
        git config gpg.format ssh
        git config user.signingkey "$KEY_FILE"
        git config gpg.ssh.allowedSignersFile "$KEY_FILE.allowed-signers"
        git config commit.gpgsign true
        git config tag.gpgsign true
