name: Set Up perf
description: Install the host profiler for Ubuntu 26 benchmark runners

runs:
  using: composite
  steps:
    - name: Install perf
      uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
      with:
        packages: linux-perf

    - name: Check perf installation
      shell: bash
      run: sudo -n perf version --build-options
