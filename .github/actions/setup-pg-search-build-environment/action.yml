name: Set Up pg_search Build Environment
description: Install and initialize PostgreSQL, Rust, cargo-pgrx, and a shared Rust build cache

inputs:
  pg_version:
    description: "PostgreSQL major version to build against."
    required: false
    default: "18"
  extra_packages:
    description: "Additional apt packages to install alongside PostgreSQL."
    required: false
    default: ""
  cache_prefix_key:
    description: "rust-cache prefix separating compatible build profiles."
    required: false
    default: "v2-benchmarks-rust-cache"
  cache_save:
    description: "Whether this run may save a new Rust cache entry."
    required: false
    default: "true"
  cache_on_failure:
    description: "Whether to save the Rust cache when a later step fails."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install PostgreSQL ${{ inputs.pg_version }} and Build Dependencies
      uses: ./.github/actions/setup-postgres
      with:
        pg_version: ${{ inputs.pg_version }}
        extra_packages: ${{ inputs.extra_packages }}

    - name: Set Up pg_search Toolchain
      uses: ./.github/actions/setup-pg-search-toolchain
      with:
        pg_version: ${{ inputs.pg_version }}
        cache_prefix_key: ${{ inputs.cache_prefix_key }}
        cache_save: ${{ inputs.cache_save }}
        cache_on_failure: ${{ inputs.cache_on_failure }}

    - name: Initialize pgrx Environment
      shell: bash
      run: cargo pgrx init "--pg${{ inputs.pg_version }}=/usr/lib/postgresql/${{ inputs.pg_version }}/bin/pg_config"
