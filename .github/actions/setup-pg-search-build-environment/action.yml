name: Set up pg_search build environment
description: Install and initialize PostgreSQL, Rust, cargo-pgrx, and the benchmark build cache

inputs:
  pg_version:
    description: "PostgreSQL major version to build against."
    required: false
    default: "18"
  extra_packages:
    description: "Additional apt packages to install alongside PostgreSQL."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install PostgreSQL ${{ inputs.pg_version }} and build dependencies
      uses: ./.github/actions/setup-postgres
      with:
        pg_version: ${{ inputs.pg_version }}
        extra_packages: ${{ inputs.extra_packages }}

    - name: Set up pg_search toolchain
      uses: ./.github/actions/setup-pg-search-toolchain
      with:
        pg_version: ${{ inputs.pg_version }}
        cache_prefix_key: "v2-benchmarks-rust-cache"
        cache_save: "true"
        cache_on_failure: "true"

    - name: Initialize pgrx environment
      shell: bash
      run: cargo pgrx init "--pg${{ inputs.pg_version }}=/usr/lib/postgresql/${{ inputs.pg_version }}/bin/pg_config"
