name: Set Up pg_vectorsearch
description: Build the pinned PRISM extension used by the vector benchmarks

inputs:
  ref:
    description: "paradedb/pg_vectorsearch commit"
    required: true
  github_token:
    description: "Token with read access to paradedb/pg_vectorsearch"
    required: true

runs:
  using: composite
  steps:
    - name: Checkout pg_vectorsearch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: paradedb/pg_vectorsearch
        ref: ${{ inputs.ref }}
        path: pg-vectorsearch
        token: ${{ inputs.github_token }}
        persist-credentials: false

    - name: Build and install pg_vectorsearch in the benchmark container
      shell: bash
      run: |
        set -euo pipefail
        docker cp pg-vectorsearch paradedb:/tmp/pg-vectorsearch
        docker exec -i --user root paradedb bash <<'BUILD'
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          postgresql-server-dev-18 build-essential pkg-config meson ninja-build libopenblas-dev
        pg_config="/usr/lib/postgresql/18/bin/pg_config"
        CC="$("$pg_config" --cc)" meson setup /tmp/pg-vectorsearch/build /tmp/pg-vectorsearch --buildtype=release \
          -Dnative=true -Dblas=enabled -Dpostgresql=enabled -Dtools=disabled -Dpg_config="$pg_config"
        meson compile -C /tmp/pg-vectorsearch/build -j 8
        meson install -C /tmp/pg-vectorsearch/build
        rm -rf /tmp/pg-vectorsearch /var/lib/apt/lists/*
        BUILD
        mkdir -p benchmark-artifacts
        git -C pg-vectorsearch rev-parse HEAD > benchmark-artifacts/pg-vectorsearch-commit.txt
