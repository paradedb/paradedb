name: Set Up pg_vectorsearch
description: Install the pinned PRISM extension in the vector benchmark image

inputs:
  ref:
    description: "paradedb/pg_vectorsearch commit"
    required: true
  github_token:
    description: "Token with read access to paradedb/pg_vectorsearch"
    required: true

runs:
  using: composite
  steps:
    - name: Checkout pg_vectorsearch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: paradedb/pg_vectorsearch
        ref: ${{ inputs.ref }}
        path: pg-vectorsearch
        token: ${{ inputs.github_token }}
        persist-credentials: false

    - name: Build and install pg_vectorsearch in Docker
      shell: bash
      run: |
        set -euo pipefail
        docker build --builder default --build-arg BASE_IMAGE="$PARADEDB_IMAGE" \
          --tag "$PARADEDB_IMAGE" -f benchmarks/vector/Dockerfile.pg-vectorsearch pg-vectorsearch
        mkdir -p benchmark-artifacts
        git -C pg-vectorsearch rev-parse HEAD > benchmark-artifacts/pg-vectorsearch-commit.txt
