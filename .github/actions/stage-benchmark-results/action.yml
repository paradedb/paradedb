name: Stage Benchmark Results
description: Save results and publication inputs for the queued publisher
inputs:
  source_directory:
    description: "Directory containing the benchmarked Git commit"
    required: false
    default: "."
  kind:
    required: true
    description: Publisher kind
  key:
    required: true
    description: Unique dataset or suite key
  metadata:
    required: true
    description: Publication inputs as JSON; credentials are removed before upload
  path:
    required: true
    description: Result files to upload
runs:
  using: composite
  steps:
    - name: Save publication inputs
      shell: bash
      env:
        METADATA: ${{ inputs.metadata }}
        KIND: ${{ inputs.kind }}
        SOURCE_DIRECTORY: ${{ inputs.source_directory }}
      run: |
        mkdir -p _benchmark_publish
        ref=$(jq -r .ref <<< "$METADATA")
        # Resolve moving branch names before the publication job waits in the queue.
        if [ "$KIND" != benchmarker ]; then
          ref=$(git -C "$SOURCE_DIRECTORY" rev-parse --verify "${ref}^{commit}")
        fi
        jq --arg kind "$KIND" --arg ref "$ref" \
          'del(.github_token, .github_app_client_id, .github_app_private_key) + {kind: $kind, ref: $ref}' \
          <<< "$METADATA" > _benchmark_publish/metadata.json
    - uses: actions/upload-artifact@v7
      with:
        name: gh-pages-${{ inputs.kind }}-${{ inputs.key }}-${{ github.run_attempt }}
        path: |
          _benchmark_publish/metadata.json
          ${{ inputs.path }}
        retention-days: 30
        if-no-files-found: error
