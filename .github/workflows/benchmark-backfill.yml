# workflows/benchmark-backfill.yml
#
# Benchmark Backfill
# Backfill benchmarks results using an array of git commit hashes

name: Benchmark Backfill

on:
  workflow_dispatch:
    inputs:
      commits: # JSON array of SHAs
        description: >
          Commits to re-run, written as a JSON array.
          Example: ["6d3c1f0", "a1b2c3d", "deadbeef"]

          Using one hash still requires the JSON array syntax, i.e. ["6d3c1f0"].
        required: true
        type: string
      reset_data:
        description: Turn on to reset the data before running the benchmarks
        type: boolean
        default: true

# The token must be allowed to start other workflows
permissions:
  actions: write
  contents: write

# We don't specify a concurrency group here, as we want all jobs to complete.

jobs:
  reset:
    name: Reset the `gh-pages` data.js Files
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: ${{ inputs.reset_data }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout Git Repository at ref=gh-pages
        if: ${{ inputs.reset_data }}
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          token: ${{ steps.app-token.outputs.token }}

      - name: Reset data.js Files
        if: ${{ inputs.reset_data }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          files=$(git ls-files stressgres/data.js benchmarks/data.js)
          if [ -n "$files" ]; then
            echo "$files" | xargs git rm
            # Omit author/committer fields so GitHub signs the commit as the App.
            TREE=$(printf '%s\n' "$files" | jq -R '{path: ., mode: "100644", type: "blob", sha: null}' |
              jq -s --arg base "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $base, tree: .}' |
              gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
            test "$TREE" = "$(git write-tree)"
            COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
              -f message="Reset data.js files" -f tree="$TREE" -f "parents[]=$(git rev-parse HEAD)" \
              --jq 'if .verification.verified then .sha else error("Reset commit is not verified") end')
            git fetch origin "$COMMIT"
            git reset --soft "$COMMIT"
            git push
          fi

  # We run one job per commit
  dispatch:
    name: Dispatch All Benchmark Jobs
    runs-on: ubuntu-latest
    needs: reset
    strategy:
      matrix:
        sha: ${{ fromJSON(github.event.inputs.commits) }} # → ["…","…"]

    steps:
      - name: Fire Benchmark for ${{ matrix.sha }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const sha   = '${{ matrix.sha }}';
            const wf = 'benchmark-pg_search-queries.yml';

            /*  createWorkflowDispatch must point at a branch or tag, not a
                bare SHA, so we send `ref:"main"` and hand the commit SHA
                through an input named `commit`  */
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: wf,
              ref: 'main',
              inputs: { commit: sha, fail_on_error: 'false' }
            });
            core.info(`queued ${wf} for ${sha}`);

      - name: Fire Stressgres for ${{ matrix.sha }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const sha   = '${{ matrix.sha }}';
            const wf = 'benchmark-pg_search-stressgres.yml';

            /*  createWorkflowDispatch must point at a branch or tag, not a
                bare SHA, so we send `ref:"main"` and hand the commit SHA
                through an input named `commit`  */
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: wf,
              ref: 'main',
              inputs: { commit: sha }
            });
            core.info(`queued ${wf} for ${sha}`);
