# workflows/benchmark-backfill.yml
#
# Benchmark Backfill
# Backfill benchmarks results using an array of git commit hashes

name: Benchmark Backfill

on:
  workflow_dispatch:
    inputs:
      commits: # JSON array of SHAs
        description: >
          Commits to re-run, written as a JSON array.
          Example: ["6d3c1f0", "a1b2c3d", "deadbeef"]

          Using one hash still requires the JSON array syntax, i.e. ["6d3c1f0"].
        required: true
        type: string
      reset_data:
        description: Turn on to reset the data before running the benchmarks
        type: boolean
        default: true

# The token must be allowed to start other workflows
permissions:
  actions: write
  contents: write

# We don't specify a concurrency group here, as we want all jobs to complete.

jobs:
  reset:
    name: Reset the `gh-pages` data.js Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository at ref=gh-pages
        if: ${{ inputs.reset_data }}
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Configure Bot Commit Signing
        if: ${{ inputs.reset_data }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY }}
          SIGNING_USER: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER }}
          SIGNING_EMAIL: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL }}
        run: |
          : "${SIGNING_KEY:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY secret}"
          : "${SIGNING_USER:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER secret}"
          : "${SIGNING_EMAIL:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL secret}"
          umask 077
          KEY_FILE="$RUNNER_TEMP/github-bot-signing-key"
          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          PUBLIC_KEY=$(ssh-keygen -y -P '' -f "$KEY_FILE" | awk '{print $1, $2}')
          # GitHub verifies SSH signatures against the account's registered signing keys.
          gh api --paginate "users/$SIGNING_USER/ssh_signing_keys" --jq '.[] | .key | split(" ") | .[0:2] | join(" ")' |
            grep -Fx -- "$PUBLIC_KEY"
          printf '%s %s\n' "$SIGNING_EMAIL" "$PUBLIC_KEY" > "$KEY_FILE.allowed-signers"
          git config user.name "$SIGNING_USER"
          git config user.email "$SIGNING_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$KEY_FILE"
          git config gpg.ssh.allowedSignersFile "$KEY_FILE.allowed-signers"
          git config commit.gpgsign true

      - name: Reset data.js Files
        if: ${{ inputs.reset_data }}
        run: |
          files=$(git ls-files stressgres/data.js benchmarks/data.js)
          if [ -n "$files" ]; then
            echo "$files" | xargs git rm
            git commit -S -m "Reset data.js files"
            git verify-commit HEAD
            git push
          fi

      - name: Remove Bot Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/github-bot-signing-key" "$RUNNER_TEMP/github-bot-signing-key.allowed-signers"

  # We run one job per commit
  dispatch:
    name: Dispatch All Benchmark Jobs
    runs-on: ubuntu-latest
    needs: reset
    strategy:
      matrix:
        sha: ${{ fromJSON(github.event.inputs.commits) }} # → ["…","…"]

    steps:
      - name: Fire Benchmark for ${{ matrix.sha }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const sha   = '${{ matrix.sha }}';
            const wf = 'benchmark-pg_search-queries.yml';

            /*  createWorkflowDispatch must point at a branch or tag, not a
                bare SHA, so we send `ref:"main"` and hand the commit SHA
                through an input named `commit`  */
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: wf,
              ref: 'main',
              inputs: { commit: sha, fail_on_error: 'false' }
            });
            core.info(`queued ${wf} for ${sha}`);

      - name: Fire Stressgres for ${{ matrix.sha }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const sha   = '${{ matrix.sha }}';
            const wf = 'benchmark-pg_search-stressgres.yml';

            /*  createWorkflowDispatch must point at a branch or tag, not a
                bare SHA, so we send `ref:"main"` and hand the commit SHA
                through an input named `commit`  */
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: wf,
              ref: 'main',
              inputs: { commit: sha }
            });
            core.info(`queued ${wf} for ${sha}`);
