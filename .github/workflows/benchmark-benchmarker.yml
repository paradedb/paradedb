# workflows/benchmark-benchmarker.yml
#
# Benchmark pg_search (Benchmarker)
# Runs the external benchmarker suite (github.com/paradedb/benchmarker) against a
# pg_search build made from THIS repo's source, using the `hn-benchmarker`
# dataset. Every k6 script the dataset ships is run once against the single
# database under test (the branch's pg_search). Background:
# https://www.paradedb.com/blog/benchmarker-iteration.
#
# How it works, end to end:
#   1. Compile pg_search from the checked-out source on the runner with
#      cargo-pgrx (.github/actions/build-pg_search-source).
#   2. Overlay those artifacts onto a released ParadeDB image (docker/
#      Dockerfile.benchmarker) so only the pg_search binary changes -> the
#      Postgres version, tuning, and bootstrap match the published image.
#   3. Clone benchmarker, `make` its custom k6 + loader, pull the hn-benchmarker
#      dataset from the public S3 bucket, and stand up the paradedb container
#      (the branch under test) from the dataset's docker-compose, with
#      PARADEDB_IMAGE pointed at the source build.
#   4. Load paradedb, restart it, then run every k6 script in the dataset once.
#   5. Upload the k6 dashboards as artifacts, publish each run's self-contained
#      dashboard HTML (with per-container CPU/memory graphs) to gh-pages and link
#      it from a PR comment, and (on main) push QPS + p50/p90/p95/p99 latency to
#      gh-pages via github-action-benchmark for over-time tracking.

name: Benchmark pg_search (Benchmarker)

on:
  # Track history on every push to main that could move performance.
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/*.toml"
      - ".github/workflows/benchmark-benchmarker.yml"
      - "docker/Dockerfile.benchmarker"
  # Opt-in on a PR by attaching the `benchmark-benchmarker` label.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      commit:
        description: "pg_search commit/ref to benchmark. Defaults to the triggering ref (main on a manual run)."
        required: false
        default: ""
      benchmarker_ref:
        description: "benchmarker repo ref (branch/tag/SHA) to run."
        required: false
        default: "main"
      base_paradedb_image:
        description: "Released ParadeDB image whose pg_search is overwritten with the source build. Defaults to the rolling latest-pg18 tag."
        required: false
        default: "paradedb/paradedb:latest-pg18"

permissions:
  contents: write # github-action-benchmark pushes to the gh-pages branch
  pull-requests: write # comment benchmark alerts on PRs

# No concurrency group: we want every benchmark run to complete (results are
# appended to gh-pages history), matching the other benchmark workflows here.

jobs:
  benchmark-benchmarker:
    name: Run Benchmarker Suite
    # RunsOn (https://runs-on.com) provisions an ephemeral EC2 instance in our AWS
    # account from these labels. See https://runs-on.com/configuration/job-labels/ (us-east-1).
    runs-on:
      - runs-on=${{ github.run_id }}
      # 8 vCPU / 32 GiB Graviton4 with local NVMe. Same m8gd family as the
      # metal-24xl used by benchmark-pg_search-queries (comparable microarch),
      # just the small size. The two DB containers are each capped at 4 cores by
      # the dataset compose and only one is under load at a time, so 8 cores give
      # ~4 to the active backend and ~4 to the k6 client. Bump the size (e.g.
      # m8gd.4xlarge) if you widen client concurrency. 32 GiB fits both 8 GiB
      # container limits plus headroom.
      - family=m8gd.2xlarge
      - image=ubuntu24-full-arm64
      - extras=s3-cache # magic S3-backed cache; see https://runs-on.com/caching/magic-cache/
      # No EBS volume: rely on the on-machine NVMe to avoid the run-to-run
      # variance EBS would introduce, matching the other benchmark runners.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'benchmark-benchmarker')
    env:
      pg_version: "18"
      BENCHMARKER_REPO: paradedb/benchmarker
      DATASET: hn-benchmarker
      DATASET_S3: s3://paradedb-benchmarker/datasets/hn-benchmarker.tar.gz
      IMAGE_TAG: paradedb-source:ci

    steps:
      # A PR triggers this by having the `benchmark-benchmarker` label attached.
      # Remove it once the job starts so it can be re-applied to run again.
      - name: Maybe Remove Label
        if: github.event_name == 'pull_request' && github.event.label.name == 'benchmark-benchmarker'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --remove-label benchmark-benchmarker || true

      - name: Determine Ref to Benchmark
        id: determine-ref
        run: |
          # A workflow_dispatch `commit` input wins. Otherwise use github.sha: on a
          # PR that is the merge commit (present in the base repo even for forks),
          # and on push/dispatch it is the triggering commit.
          if [ -n "${{ inputs.commit }}" ]; then
            echo "ref=${{ inputs.commit }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout pg_search Source at ref=${{ steps.determine-ref.outputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.determine-ref.outputs.ref }}
          fetch-depth: 0

      - name: Derive Short Commit
        id: commit_info
        # HEAD is the just-checked-out ref, so this is the actual benchmarked
        # commit even when a branch/tag/custom ref was requested above.
        run: echo "short_commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # ---- Build the full ParadeDB image from source -----------------------

      # Compile pg_search from the checked-out source on the runner. A native
      # build (no Docker builder stage) keeps cargo's mtime fingerprinting intact,
      # so the action's target/ cache gives real incremental compiles run-to-run.
      - name: Build pg_search from source
        id: build-pg_search
        uses: ./.github/actions/build-pg_search-source
        with:
          pg-version: ${{ env.pg_version }}

      # Overlay the source-built pg_search onto the released base image. The
      # Dockerfile is a single COPY, so this is a fast, cache-free image build.
      - name: Assemble ParadeDB image (pg_search from source)
        run: |
          set -euo pipefail
          ctx="$(mktemp -d)"
          cp docker/Dockerfile.benchmarker "${ctx}/Dockerfile"
          cp -R "${{ steps.build-pg_search.outputs.artifacts-dir }}" "${ctx}/artifacts"
          # --pull so the rolling latest-pg18 base is refetched, not taken from a
          # stale local layer.
          docker build \
            --pull \
            --file "${ctx}/Dockerfile" \
            --build-arg BASE_IMAGE="${{ inputs.base_paradedb_image || 'paradedb/paradedb:latest-pg18' }}" \
            --tag "${IMAGE_TAG}" \
            "${ctx}"

      # ---- Set up and run benchmarker --------------------------------------

      - name: Checkout benchmarker (${{ inputs.benchmarker_ref || 'main' }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BENCHMARKER_REPO }}
          ref: ${{ inputs.benchmarker_ref || 'main' }}
          path: benchmarker
          # benchmarker is a public repo, so checkout's default token reads it.

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: benchmarker/go.mod
          cache-dependency-path: benchmarker/go.sum

      - name: Build benchmarker (k6 + loader)
        working-directory: benchmarker
        run: make

      - name: Pull ${{ env.DATASET }} dataset (public S3, anonymous)
        working-directory: benchmarker
        run: ./bin/loader pull --dataset "${DATASET}" --anonymous --source "${DATASET_S3}"

      - name: Start database
        working-directory: benchmarker/datasets/${{ env.DATASET }}
        # The dataset's paradedb service is gated behind the `paradedb` compose
        # profile, so select it via COMPOSE_PROFILES. PARADEDB_IMAGE points the
        # compose image: ${PARADEDB_IMAGE:-<release>} at our source build; it
        # must be set on every compose invocation, otherwise compose sees config
        # drift and recreates the container with the default release image.
        env:
          PARADEDB_IMAGE: ${{ env.IMAGE_TAG }}
          COMPOSE_PROFILES: paradedb
        run: docker compose up -d --wait

      - name: Load data (paradedb)
        working-directory: benchmarker
        run: ./bin/loader load --backend paradedb "./datasets/${DATASET}"

      - name: Restart database for a clean start
        working-directory: benchmarker/datasets/${{ env.DATASET }}
        env:
          PARADEDB_IMAGE: ${{ env.IMAGE_TAG }}
          COMPOSE_PROFILES: paradedb
        run: |
          docker restart paradedb
          docker compose up -d --wait

      - name: Run k6 scripts
        working-directory: benchmarker
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.commit_info.outputs.short_commit }}","ref":"${{ steps.determine-ref.outputs.ref }}","image":"${{ env.IMAGE_TAG }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="$PWD"
          mkdir -p results
          scripts=("$root/datasets/${DATASET}/k6/"*.js)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No k6 scripts found under datasets/${DATASET}/k6/" >&2
            exit 1
          fi
          # Run every script the dataset ships, once each, against the single
          # database under test. Name each pass by the script's basename so its
          # dashboard + metrics are tracked under that name.
          for script in "${scripts[@]}"; do
            name="$(basename "$script" .js)"
            # First pass warms the OS page cache + Postgres shared_buffers so the
            # measured pass reflects warm steady-state, not cold-cache noise. Only
            # the second (measured) pass is exported and kept; the warm-up produces
            # no dashboard output.
            echo "== warming ${name} (discarded) =="
            ( cd "$root/results" && "$root/k6" run "$script" >/dev/null )
            echo "== measuring ${name} =="
            ( cd "$root/results" && "$root/k6" run --out dashboard=json,html "$script" )
            mv "$(ls -t "$root"/results/dashboard_*.json | head -1)" "$root/results/${name}.json"
            mv "$(ls -t "$root"/results/dashboard_*.html | head -1)" "$root/results/${name}.html"
          done

      - name: Dump database logs on failure
        if: failure()
        run: docker logs paradedb || true

      - name: Upload dashboards
        if: always()
        # Best-effort: the gh-pages HTML + comment below are the real deliverables,
        # so never let the artifact backend fail the job.
        continue-on-error: true
        # runs-on's extras=s3-cache proxies ACTIONS_RESULTS_URL to its local cache
        # server, which upload-artifact then POSTs to and fails with a non-JSON
        # error. Pin the endpoint back to GitHub's canonical artifact receiver just
        # for this step (see test-pg_search.yml).
        env:
          ACTIONS_RESULTS_URL: https://results-receiver.actions.githubusercontent.com/
          ACTIONS_CACHE_SERVICE_V2: ""
        uses: actions/upload-artifact@v7
        with:
          name: benchmarker-dashboards-${{ steps.commit_info.outputs.short_commit }}
          # Two patterns, not a brace glob: @actions/glob does not expand {json,html}.
          path: |
            benchmarker/results/*.json
            benchmarker/results/*.html
          if-no-files-found: warn

      # ---- Publish to gh-pages for over-time tracking ----------------------

      - name: Extract tracked metrics
        working-directory: benchmarker
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Aggregate each dashboard's per-query samples into per-run QPS and
          # p50/p90/p95/p99. Schema: dashboard/output.go ->
          #   runs: { <run>: { name, backend, startTime, endTime,
          #                    queries: { <q>: { latencies[], timestamps[] } } } }
          # Latencies (ms) live under queries[].latencies; QPS = sample count over
          # the timestamp span. Each run's .name (e.g. "paradedb (single_topk)")
          # is already a unique, descriptive series name.
          mkdir -p _metrics
          for j in results/*.json; do
            nm="$(basename "$j" .json)"
            jq '[ .runs | to_entries[] | .value as $r
                  | ([$r.queries[]?.latencies[]?]) as $lat
                  | ([$r.queries[]?.timestamps[]?]) as $ts
                  | ($lat | length) as $n
                  | select($n > 0)
                  | { name:  ($r.name + " QPS"),
                      unit:  "QPS",
                      value: ($n / (((($ts|max) - ($ts|min)) | if . <= 0 then 1000 else . end) / 1000)) } ]' \
              "$j" > "_metrics/${nm}.qps.json"
            # `(50,90,95,99) as $p` fans out => four percentile rows per run
            # (nearest-rank on sorted latencies).
            jq '[ .runs | to_entries[] | .value as $r
                  | ([$r.queries[]?.latencies[]?] | sort) as $sorted
                  | ($sorted | length) as $n
                  | select($n > 0)
                  | (50, 90, 95, 99) as $p
                  | { name:  ($r.name + " p" + ($p|tostring) + " latency"),
                      unit:  "ms",
                      value: $sorted[ ((($n - 1) * $p / 100) | floor) ] } ]' \
              "$j" > "_metrics/${nm}.lat.json"
          done
          # Merge per-script arrays (guarded so an empty set yields [] not a hang).
          if compgen -G "_metrics/*.qps.json" > /dev/null; then jq -s 'add' _metrics/*.qps.json; else echo '[]'; fi > benchmarker_qps.json
          if compgen -G "_metrics/*.lat.json" > /dev/null; then jq -s 'add' _metrics/*.lat.json; else echo '[]'; fi > benchmarker_latency.json
          echo "== QPS =="; cat benchmarker_qps.json
          echo "== latency percentiles =="; cat benchmarker_latency.json

      - name: Cleanup Previous Benchmark Publish Working Directory
        run: rm -rf ./benchmark-data-repository

      - name: Publish Throughput (QPS)
        # Never let a metrics/publish hiccup block the HTML dashboards + comment.
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "benchmarker hn-benchmarker (QPS)"
          ref: ${{ steps.determine-ref.outputs.ref }}
          tool: customBiggerIsBetter
          output-file-path: benchmarker/benchmarker_qps.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-repository: github.com/${{ github.repository }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarker
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "115%"
          comment-on-alert: true
          alert-comment-cc-users: "@${{ github.actor }}"
          comment-always: ${{ github.event_name == 'pull_request' }}

      - name: Publish Latency (p50/p90/p95/p99)
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "benchmarker hn-benchmarker (latency percentiles)"
          ref: ${{ steps.determine-ref.outputs.ref }}
          tool: customSmallerIsBetter
          output-file-path: benchmarker/benchmarker_latency.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-repository: github.com/${{ github.repository }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarker
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "115%"
          comment-on-alert: true
          alert-comment-cc-users: "@${{ github.actor }}"
          comment-always: ${{ github.event_name == 'pull_request' }}

      # ---- Publish per-run dashboards to gh-pages and link them -------------
      # The k6 `dashboard=html` export is a self-contained page (data, including
      # per-container CPU % / memory series, is inlined as
      # window.__DASHBOARD_EMBEDDED_DATA), so hosting the .html alone renders the
      # full interactive graphs. No JSON needed.

      - name: Stage dashboards (HTML only) for gh-pages
        run: |
          set -euo pipefail
          mkdir -p _ghpages_html
          cp benchmarker/results/*.html _ghpages_html/
          ls -la _ghpages_html

      - name: Publish dashboards to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_ghpages_html
          # Per-commit subdir; keep_files preserves the github-action-benchmark
          # data under benchmarker/ (and every other run's dashboards).
          destination_dir: benchmarker-runs/${{ steps.commit_info.outputs.short_commit }}
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "benchmarker dashboards for ${{ steps.commit_info.outputs.short_commit }}"

      - name: Comment dashboard links on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/benchmarker-runs/${{ steps.commit_info.outputs.short_commit }}"
          OVERTIME="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/benchmarker/"
          # One link per published script dashboard.
          links=""
          for h in _ghpages_html/*.html; do
            nm="$(basename "$h" .html)"
            links="${links}- [${nm}](${BASE}/${nm}.html)"$'\n'
          done
          {
            printf '### 📊 Benchmarker dashboards — `%s`\n\n' "${{ steps.commit_info.outputs.short_commit }}"
            printf 'Interactive per-script graphs (latency timeline, throughput, per-container **CPU %%** / **memory**):\n\n'
            printf '%s\n' "$links"
            printf 'Over-time tracking (QPS + latency percentiles across commits): [%s](%s)\n\n' "$OVERTIME" "$OVERTIME"
            printf '_gh-pages may take ~a minute to deploy after this run._\n'
          } > _comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file _comment.md

      - name: Comment dashboard links on commit (push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/benchmarker-runs/${{ steps.commit_info.outputs.short_commit }}"
          links=""
          for h in _ghpages_html/*.html; do
            nm="$(basename "$h" .html)"
            links="${links}[${nm}](${BASE}/${nm}.html) · "
          done
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="📊 Benchmarker dashboards: ${links%· }"

      # The publish steps run continue-on-error so a metrics hiccup can't block the
      # dashboards/comment above. This final gate makes the *specific* "k6 ran but
      # recorded no query samples" case (empty QPS set) a loud, red failure instead
      # of a silently-masked green. Runs last so the deliverables still ship.
      - name: Fail if no metrics were extracted
        if: always()
        run: |
          f=benchmarker/benchmarker_qps.json
          # No file => an earlier stage already failed the job; don't pile on.
          [ -f "$f" ] || { echo "no metrics file (earlier stage failed); skipping guard"; exit 0; }
          n=$(jq 'length' "$f")
          echo "extracted QPS series: ${n}"
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::No benchmark metrics extracted (empty QPS set): the k6 run produced no query samples. Check query execution / the dashboard export." >&2
            exit 1
          fi
