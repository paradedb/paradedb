name: Benchmark pg_search (Benchmarker Cohere)

on:
  schedule:
    - cron: "30 13 * * *" # Daily at 13:30 UTC. Space nightly benchmarks two hours apart.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      size:
        description: "Cohere corpus size"
        type: choice
        options: [all, 1m, 10m]
        default: all
      commit:
        description: "pg_search commit/ref to benchmark (defaults to the triggering ref)"
        default: ""
      pdbench_ref:
        description: "pdbench ref"
        default: "d8c42a466e72ff4e39910d3f95a98c50577d0002"
      benchmarker_ref:
        description: "benchmarker ref"
        default: "ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3"
      publish_baseline:
        description: "Publish baseline metrics when running on main"
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  cohere:
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    name: Cohere ${{ matrix.size }} (ParadeDB)
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["benchmarks", "benchmark-cohere-pg_search", "benchmark-benchmarker-cohere"]'), github.event.label.name)
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(inputs.size == '1m' && '["1m"]' || inputs.size == '10m' && '["10m"]' || '["1m", "10m"]') }}
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache+git-cache+apt-cache # See https://runs-on.com/caching/magic-cache/
    env:
      COHERE_SIZE: ${{ matrix.size }}
      PDBENCH_REF: ${{ inputs.pdbench_ref || 'd8c42a466e72ff4e39910d3f95a98c50577d0002' }}
      BENCHMARKER_REF: ${{ inputs.benchmarker_ref || 'ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3' }}
      BENCHMARK_REF: ${{ inputs.commit || github.sha }}

    steps:
      - name: Remove benchmark label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$BENCHMARK_LABEL" || true

      - name: Checkout extension to benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BENCHMARK_REF }}
          persist-credentials: false

      - name: Record benchmark commit
        id: commit_info
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout benchmark workflow for backfills
        if: inputs.commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: benchmark-workflow
          persist-credentials: false

      - name: Use this workflow's benchmark code for backfills
        if: inputs.commit != ''
        run: |
          rsync -a --delete benchmark-workflow/benchmarks/ benchmarks/
          rsync -a benchmark-workflow/.github/actions/ .github/actions/
          rsync -a benchmark-workflow/.github/scripts/ .github/scripts/
          cp benchmark-workflow/docker/Dockerfile.source docker/Dockerfile.source

      - name: Test Cohere benchmark helpers
        run: python3 -m unittest discover -s benchmarks/cohere -p 'test_*.py'

      - name: Configure RunsOn caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      # pdbench comes first: it holds the compose file the cluster starts with.
      - name: Create pdbench checkout token
        id: pdbench_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}
          owner: paradedb
          repositories: pdbench
          permission-contents: read

      - name: Checkout pdbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: paradedb/pdbench
          ref: ${{ env.PDBENCH_REF }}
          path: pdbench
          token: ${{ steps.pdbench_token.outputs.token }}
          persist-credentials: false

      - name: Set up Docker benchmark cluster
        uses: ./.github/actions/setup-docker-benchmark-cluster
        with:
          ref: ${{ env.BENCHMARK_REF }}
          dataset: cohere
          size: ${{ matrix.size }}
          compose_file: pdbench/datasets/cohere/docker-compose.yml

      - name: Install pdbench toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Cache pdbench build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pdbench -> target

      - name: Build pdbench
        working-directory: pdbench
        run: |
          # rust-cache saves target/duckdb-sources with its files stripped, and libduckdb-sys
          # cannot unpack over the leftover directories when its build script reruns.
          rm -rf target/duckdb-sources
          cargo +1.97.1 build --locked --release -p pdbench -p pdbench-load --target-dir target -j 16
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Set up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          ref: ${{ env.BENCHMARKER_REF }}

      - name: Refresh pg_search and build index
        run: |
          set -euo pipefail
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -c 'DROP EXTENSION IF EXISTS pg_search;' -c 'CREATE EXTENSION pg_search;'
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 \
            -c "SELECT name, setting, unit FROM pg_settings
                WHERE name IN ('maintenance_work_mem', 'shared_buffers', 'max_parallel_workers',
                               'max_worker_processes', 'max_parallel_maintenance_workers',
                               'parallel_leader_participation', 'paradedb.global_target_segment_count')
                ORDER BY name;" \
            | tee benchmark-artifacts/index-build-settings.log
          # The index definition, its options and the Postgres settings it is built under come
          # from pdbench's load config and dataset files.
          (
            cd pdbench
            pdbench-load finalize "configs/load/cohere-${COHERE_SIZE}-paradedb.yaml" \
              --set "output=$GITHUB_WORKSPACE/benchmark-artifacts/load"
          ) 2>&1 | tee benchmark-artifacts/index-build.log
          runs=(benchmark-artifacts/load/*/*_load)
          test "${#runs[@]}" -eq 1
          index="$(jq -r '.config.datastore.vars.index_name' "${runs[0]}/run.json")"
          # The run covers post.sql: dropping any old index, the build, and VACUUM ANALYZE.
          created="$(jq -r '.created_at' "${runs[0]}/run.json")"
          finished="$(jq -r '.finished_at' "${runs[0]}/run.json")"
          build_seconds=$(( $(date -d "$finished" +%s) - $(date -d "$created" +%s) ))
          size_bytes="$(psql "$PARADEDB_URL" -XAt -v ON_ERROR_STOP=1 \
            -c "SELECT pg_total_relation_size('${index}'::regclass)")"
          jq -n --arg index "$index" --argjson build_seconds "$build_seconds" --argjson size_bytes "$size_bytes" '[
            {name: ($index + " build time"), unit: "min", value: ($build_seconds / 60)},
            {name: ($index + " index size"), unit: "MiB", value: ($size_bytes / 1048576)}
          ]' > benchmark-artifacts/index-metrics.json
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '\timing on' \
            -f benchmarks/datasets/cohere/after_create_index.sql \
            -c 'VACUUM FULL ANALYZE;' -c 'VACUUM ANALYZE;' \
            | tee benchmark-artifacts/index-vacuum.log

      - name: Verify default boundary replication
        run: |
          psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
            -c "SELECT json_agg(v) FROM paradedb.vector_info('cohere_wiki_bm25_idx', 'emb') AS v" \
            > benchmark-artifacts/vector-info.json
          jq -e 'length > 0 and all(.[]; .vector_format == "ivf" and .quantized and .vector_total_rows == 2 * .vector_num_vectors)' \
            benchmark-artifacts/vector-info.json

      - name: Install fixture reader
        uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          packages: python3-venv

      - name: Import published ground-truth fixtures
        env:
          FIXTURE_SOURCE: s3://paradedb-benchmark/datasets/cohere/v1/queries
        run: |
          set -euo pipefail
          python3 -m venv .cohere-fixtures
          .cohere-fixtures/bin/pip install --only-binary=:all: duckdb==2.0.0
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '
            CREATE TABLE IF NOT EXISTS pdbench_ground_truth (
              corpus text, query_stem text, query_id int, gt_ids text[],
              PRIMARY KEY (corpus, query_stem, query_id)
            );'
          .cohere-fixtures/bin/python - <<'PYTHON'
          import os
          import duckdb

          db = duckdb.connect()
          db.execute("INSTALL httpfs; LOAD httpfs; INSTALL postgres; LOAD postgres;")
          url = os.environ["PARADEDB_URL"].replace("'", "''")
          db.execute(f"ATTACH '{url}' AS pg (TYPE postgres);")
          for query in ("knn_top10_unfiltered", "knn_top10_10pct", "knn_top10_1pct"):
              source = f"{os.environ['FIXTURE_SOURCE']}/ground_truth_{query}_{os.environ['COHERE_SIZE']}.parquet"
              count = db.execute("SELECT count(*) FROM read_parquet(?)", [source]).fetchone()[0]
              if count != 100:
                  raise ValueError(f"{query}: expected 100 ground-truth rows, found {count}")
              db.execute("DELETE FROM pg.public.pdbench_ground_truth WHERE corpus = 'cohere_wiki' AND query_stem = ?", [query])
              db.execute("INSERT INTO pg.public.pdbench_ground_truth SELECT 'cohere_wiki', ?, query_id, gt_ids FROM read_parquet(?)", [query, source])
          PYTHON

      - name: Sweep max_probe with pdbench
        run: |
          set -euo pipefail
          for query in knn_top10_unfiltered knn_top10_10pct knn_top10_1pct; do
            pdbench search --url "$PARADEDB_URL" --config "benchmarks/cohere/${COHERE_SIZE}.toml" \
              --assets-dir benchmarks/cohere/assets --runs-dir benchmark-artifacts/search \
              --query "$query" --no-compare --html
          done

      - name: Find mainline pdbench baseline
        id: pdbench_baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const name = `cohere-${process.env.COHERE_SIZE}-diagnostics`;
            const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'benchmark-pg_search-benchmarker-cohere.yml',
              branch: 'main', event: 'push', status: 'success', per_page: 100,
            });
            for await (const { data: runs } of pages) {
              for (const run of runs) {
                // Keep the baseline stable if a newer main run finishes first.
                if (run.run_number >= context.runNumber) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                const artifact = artifacts.find(a => a.name === name && !a.expired);
                if (!artifact) continue;
                core.setOutput('run_id', run.id);
                core.setOutput('commit', run.head_sha);
                core.setOutput('url', run.html_url);
                core.info(`Baseline: ${run.html_url} (${run.head_sha})`);
                return;
              }
            }
            await core.summary.addHeading('pdbench mainline comparison', 3)
              .addRaw(`Skipped: no successful main push has an unexpired ${name} artifact.\n`)
              .write();

      - name: Download mainline pdbench baseline
        if: steps.pdbench_baseline.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cohere-${{ matrix.size }}-diagnostics
          path: benchmark-baseline
          run-id: ${{ steps.pdbench_baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compare pdbench sweeps with mainline
        if: steps.pdbench_baseline.outputs.run_id != ''
        env:
          BASELINE_COMMIT: ${{ steps.pdbench_baseline.outputs.commit }}
          BASELINE_URL: ${{ steps.pdbench_baseline.outputs.url }}
          CURRENT_COMMIT: ${{ steps.commit_info.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/compare_search.py \
            --baseline "benchmark-baseline/search/${COHERE_SIZE}" \
            --current "benchmark-artifacts/search/${COHERE_SIZE}" \
            --output benchmark-artifacts/comparison \
            --baseline-commit "$BASELINE_COMMIT" --baseline-url "$BASELINE_URL" \
            --current-commit "$CURRENT_COMMIT"
          cat benchmark-artifacts/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare k6 operating points
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/prepare_k6.py --runs benchmark-artifacts/search --output benchmark-artifacts
          jq '[.[] | select(.reached and .buffers.shared_hit_mean != null)
            | {name: (.name + " shared hits/query"), unit: "hits/query", value: .buffers.shared_hit_mean}
          ]' benchmark-artifacts/operating_points.json > benchmark-artifacts/buffer-metrics.json
          psql "$PARADEDB_URL" -XAt -v ON_ERROR_STOP=1 \
            -c 'SELECT json_agg(emb::text ORDER BY id) FROM pdbench_queries' \
            > benchmark-artifacts/query_vectors.json
          cat benchmark-artifacts/operating_points.md >> "$GITHUB_STEP_SUMMARY"
          {
            git -C pdbench rev-parse HEAD
            git -C benchmarker rev-parse HEAD
          } > benchmark-artifacts/tool-commits.txt

      - name: Verify k6 query plans and filter pushdown
        run: python3 benchmarks/cohere/verify_plans.py benchmark-artifacts

      - name: Upload index, recall, and buffer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cohere-${{ matrix.size }}-diagnostics
          path: benchmark-artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Measure selected operating points with k6
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.commit_info.outputs.commit_sha }}","ref":"${{ env.BENCHMARK_REF }}","pdbench":"${{ env.PDBENCH_REF }}","benchmarker":"${{ env.BENCHMARKER_REF }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="$PWD"
          mkdir -p benchmarker/results
          while IFS= read -r point; do
            (
              cd benchmarker/results
              taskset -c 16-19 "$root/benchmarker/k6" run --out dashboard=json,html \
                -e PARADEDB_URL="$PARADEDB_URL" \
                -e OPERATING_POINTS="$root/benchmark-artifacts/operating_points.json" \
                -e OPERATING_POINT="$point" \
                -e QUERY_VECTORS="$root/benchmark-artifacts/query_vectors.json" \
                "$root/benchmarks/cohere/k6/search.js"
            )
            jsons=(benchmarker/results/dashboard_*.json)
            htmls=(benchmarker/results/dashboard_*.html)
            test "${#jsons[@]}" -eq 1 && test "${#htmls[@]}" -eq 1
            mv "${jsons[0]}" "benchmarker/results/${point}.json"
            mv "${htmls[0]}" "benchmarker/results/${point}.html"
          done < <(jq -r '.[] | select(.reached) | .name' benchmark-artifacts/operating_points.json)

      # Router quality runs after k6 so its flat sweeps do not change the cache k6 measures on.
      - name: Write router-quality arm profiles
        run: |
          python3 benchmarks/cohere/router_quality.py configs \
            --profile "benchmarks/cohere/${COHERE_SIZE}.toml" --output benchmark-artifacts/router

      # Per query: the stored arm, seeded from the existing sweep on the unfiltered query, then flat
      # and stored-adaptive seeded from it. The existing sweep's unfiltered report stands in for
      # stored-adaptive when that query routes every segment. A run whose console projection fails
      # with "representative layer0 has no scan stage" is kept when it saved its report; any other
      # failure fails the step.
      - name: Sweep max_probe per router-quality arm with pdbench
        run: |
          python3 benchmarks/cohere/router_quality.py sweep --runs benchmark-artifacts/router \
            --existing "benchmark-artifacts/search/${COHERE_SIZE}" --assets-dir benchmarks/cohere/assets

      - name: Measure router quality at the selected budgets
        run: |
          python3 benchmarks/cohere/router_quality.py measure --runs benchmark-artifacts/router \
            --vectors benchmark-artifacts/query_vectors.json \
            --output benchmark-artifacts/router/measurements.json

      - name: Find mainline router-quality baseline
        id: router_baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const name = `cohere-${process.env.COHERE_SIZE}-router-quality`;
            const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'benchmark-pg_search-benchmarker-cohere.yml',
              branch: 'main', event: 'push', status: 'success', per_page: 100,
            });
            for await (const { data: runs } of pages) {
              for (const run of runs) {
                // Keep the baseline stable if a newer main run finishes first.
                if (run.run_number >= context.runNumber) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                const artifact = artifacts.find(a => a.name === name && !a.expired);
                if (!artifact) continue;
                core.setOutput('run_id', run.id);
                core.setOutput('commit', run.head_sha);
                core.setOutput('url', run.html_url);
                core.info(`Baseline: ${run.html_url} (${run.head_sha})`);
                return;
              }
            }
            core.info(`No successful main push has an unexpired ${name} artifact.`);

      - name: Download mainline router-quality baseline
        if: steps.router_baseline.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cohere-${{ matrix.size }}-router-quality
          path: router-baseline
          run-id: ${{ steps.router_baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      # The publisher copies sweep_reports_dir/*.html to gh-pages under
      # benchmarker-runs/<commit>/<dataset>/sweep/, so the full report is published there.
      - name: Render router-quality section
        env:
          CURRENT_COMMIT: ${{ steps.commit_info.outputs.commit_sha }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          baseline=()
          if [ -f router-baseline/router_quality.json ]; then
            baseline=(--baseline router-baseline)
          fi
          report_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/benchmarker-runs/${CURRENT_COMMIT}/cohere-${COHERE_SIZE}/sweep/router_quality.html"
          python3 benchmarks/cohere/router_quality.py render \
            --measurements benchmark-artifacts/router/measurements.json \
            --output benchmark-artifacts/router \
            --commit "$CURRENT_COMMIT" --pdbench "$PDBENCH_REF" --report-url "$report_url" "${baseline[@]}"
          mkdir -p benchmark-artifacts/comparison
          cp benchmark-artifacts/router/router_quality.html benchmark-artifacts/comparison/
          cat benchmark-artifacts/router/router_quality.md >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-artifacts/operating_points.md benchmark-artifacts/router/router_quality.md \
            > benchmark-artifacts/context.md

      - name: Upload router-quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cohere-${{ matrix.size }}-router-quality
          path: benchmark-artifacts/router/
          retention-days: 30
          if-no-files-found: warn

      - name: Stage Benchmarker results
        uses: ./.github/actions/stage-benchmark-results
        with:
          benchmark_type: benchmarker
          metadata: >-
            {"dataset":"cohere-${{ matrix.size }}",
             "ref":"${{ steps.commit_info.outputs.commit_sha }}","pr_number":"${{ github.event.pull_request.number }}",
             "publish_baseline":"${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_baseline) }}",
             "context_file":"benchmark-artifacts/context.md",
             "sweep_reports_dir":"benchmark-artifacts/comparison",
             "buffer_metrics_file":"benchmark-artifacts/buffer-metrics.json",
             "index_metrics_file":"benchmark-artifacts/index-metrics.json",
             "router_metrics_file":"benchmark-artifacts/router/router-metrics.json",
             "router_detail_metrics_file":"benchmark-artifacts/router/router-detail-metrics.json"}

      - name: Database logs
        if: failure() || cancelled()
        run: docker logs --tail 200 paradedb

      - name: Stop database
        if: always()
        run: docker stop --time 600 paradedb

  publish-results:
    name: Publish Benchmark Results
    needs: cohere
    if: always() && !cancelled() && (needs.cohere.result == 'success' || needs.cohere.result == 'failure')
    uses: ./.github/workflows/publish-benchmark-results.yml
    secrets: inherit
