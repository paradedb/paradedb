# workflows/benchmark-pg_search-benchmarker-cohere.yml
#
# Benchmark pg_search (Benchmarker Cohere)
# Run Cohere vector benchmarks and router diagnostics.

name: Benchmark pg_search (Benchmarker Cohere)

on:
  schedule:
    - cron: "30 13 * * *" # Daily at 13:30 UTC. Space nightly benchmarks two hours apart.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      size:
        description: "Cohere corpus size"
        type: choice
        options: [all, 1m, 10m]
        default: all
      engine:
        description: "Vector index to benchmark (comparisons require size=10m)"
        type: choice
        options:
          [pg_search, pg_vectorsearch, vectorchord, vectorchord-prefilter]
        default: pg_search
      runner_type:
        description: "Runner availability"
        type: choice
        options: [spot, on-demand]
        default: spot
      commit:
        description: "pg_search commit/ref to benchmark (defaults to the triggering ref)"
        default: ""
      pdbench_ref:
        description: "pdbench ref (defaults to the pinned revision for the selected engine)"
        default: ""
      benchmarker_ref:
        description: "benchmarker ref"
        default: "ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3"
      publish_baseline:
        description: "Publish baseline metrics when running on main"
        type: boolean
        default: true
      router_quality:
        description: "Add the router-quality section"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  cohere:
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    name: Cohere ${{ matrix.size }} (ParadeDB)
    if: >-
      (inputs.engine == '' || inputs.engine == 'pg_search') &&
      (github.event_name != 'pull_request' ||
      contains(fromJSON('["benchmarks", "benchmark-cohere-pg_search", "benchmark-benchmarker-cohere", "benchmark-cohere-router-quality"]'), github.event.label.name))
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(inputs.size == '1m' && '["1m"]' || inputs.size == '10m' && '["10m"]' || '["1m", "10m"]') }}
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - spot=${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'spot') || (github.event_name != 'workflow_dispatch' && !contains(github.event.pull_request.labels.*.name, 'benchmark-nonspot')) }}
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache+git-cache+apt-cache # See https://runs-on.com/caching/magic-cache/
    env:
      COHERE_SIZE: ${{ matrix.size }}
      RESULTS_DATASET: cohere-${{ matrix.size }}-8cpu-32gb
      PDBENCH_REF: ${{ inputs.pdbench_ref || '376d023d1f42d31f7f54ef98ea023c5a8d21771f' }}
      BENCHMARKER_REF: ${{ inputs.benchmarker_ref || 'ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3' }}
      BENCHMARK_REF: ${{ inputs.commit || github.sha }}
      # The router-quality section runs on the daily main run, with the
      # benchmark-cohere-router-quality label, and on manual runs that set router_quality.
      ROUTER_QUALITY: ${{ github.event_name == 'schedule' || github.event.label.name == 'benchmark-cohere-router-quality' || (github.event_name == 'workflow_dispatch' && inputs.router_quality) }}

    steps:
      - name: Remove Benchmark Label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$BENCHMARK_LABEL" || true

      - name: Checkout Extension to Benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BENCHMARK_REF }}
          persist-credentials: false

      - name: Record Benchmark Commit
        id: commit_info
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout Benchmark Workflow for Backfills
        if: inputs.commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: benchmark-workflow
          persist-credentials: false

      - name: Use This Workflow's Benchmark Code for Backfills
        if: inputs.commit != ''
        run: |
          rsync -a --delete benchmark-workflow/benchmarks/ benchmarks/
          rsync -a benchmark-workflow/.github/actions/ .github/actions/
          rsync -a benchmark-workflow/.github/scripts/ .github/scripts/
          cp benchmark-workflow/docker/Dockerfile.source docker/Dockerfile.source

      - name: Test Cohere Benchmark Helpers
        run: python3 -m unittest discover -s benchmarks/cohere -p 'test_*.py'

      - name: Configure RunsOn Caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      # pdbench comes first: it holds the compose file the cluster starts with.
      - name: Create pdbench Checkout Token
        id: pdbench_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}
          owner: paradedb
          repositories: pdbench
          permission-contents: read

      - name: Checkout pdbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: paradedb/pdbench
          ref: ${{ env.PDBENCH_REF }}
          path: pdbench
          token: ${{ steps.pdbench_token.outputs.token }}
          persist-credentials: false

      - name: Set Up Docker Benchmark Cluster
        uses: ./.github/actions/setup-docker-benchmark-cluster
        with:
          ref: ${{ env.BENCHMARK_REF }}
          dataset: cohere
          size: ${{ matrix.size }}
          compose_file: pdbench/datasets/cohere/docker-compose.yml
          cpu_limit: "8"
          max_parallel_workers: "8"
          max_parallel_maintenance_workers: "7"
          max_parallel_workers_per_gather: "4"

      - name: Build pdbench
        uses: ./.github/actions/build-pdbench

      - name: Set Up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          ref: ${{ env.BENCHMARKER_REF }}

      - name: Refresh pg_search
        run: |
          set -euo pipefail
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -c 'DROP EXTENSION IF EXISTS pg_search;' -c 'CREATE EXTENSION pg_search;'

      - name: Build Index and Report Metrics
        uses: ./.github/actions/build-vector-benchmark-index
        with:
          config: configs/load/cohere-${{ matrix.size }}-paradedb.yaml
          artifact_name: cohere-${{ matrix.size }}-load-report
          max_parallel_maintenance_workers: "7"
          report_memory: "false"

      - name: Vacuum Benchmark Index
        run: |
          set -euo pipefail
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '\timing on' \
            -f benchmarks/datasets/cohere/after_create_index.sql \
            -c 'VACUUM FULL ANALYZE;' -c 'VACUUM ANALYZE;' \
            | tee benchmark-artifacts/index-vacuum.log

      - name: Verify Default Boundary Replication
        run: |
          psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
            -c "SELECT json_agg(v) FROM paradedb.vector_info('cohere_wiki_bm25_idx', 'emb') AS v" \
            > benchmark-artifacts/vector-info.json
          jq -e 'length > 0 and all(.[]; .vector_format == "ivf" and .quantized and .vector_total_rows == 2 * .vector_num_vectors)' \
            benchmark-artifacts/vector-info.json

      - name: Install Fixture Reader
        uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          packages: python3-venv

      - name: Import Published Ground-truth Fixtures
        env:
          FIXTURE_SOURCE: s3://paradedb-benchmark/datasets/cohere/v1/queries
        run: |
          set -euo pipefail
          python3 -m venv .cohere-fixtures
          .cohere-fixtures/bin/pip install --only-binary=:all: duckdb==2.0.0
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '
            CREATE TABLE IF NOT EXISTS pdbench_ground_truth (
              corpus text, query_stem text, query_id int, gt_ids text[],
              PRIMARY KEY (corpus, query_stem, query_id)
            );'
          .cohere-fixtures/bin/python - <<'PYTHON'
          import os
          import duckdb

          db = duckdb.connect()
          db.execute("INSTALL httpfs; LOAD httpfs; INSTALL postgres; LOAD postgres;")
          url = os.environ["PARADEDB_URL"].replace("'", "''")
          db.execute(f"ATTACH '{url}' AS pg (TYPE postgres);")
          for query in ("knn_top10_unfiltered", "knn_top10_10pct", "knn_top10_1pct"):
              source = f"{os.environ['FIXTURE_SOURCE']}/ground_truth_{query}_{os.environ['COHERE_SIZE']}.parquet"
              count = db.execute("SELECT count(*) FROM read_parquet(?)", [source]).fetchone()[0]
              if count != 100:
                  raise ValueError(f"{query}: expected 100 ground-truth rows, found {count}")
              db.execute("DELETE FROM pg.public.pdbench_ground_truth WHERE corpus = 'cohere_wiki' AND query_stem = ?", [query])
              db.execute("INSERT INTO pg.public.pdbench_ground_truth SELECT 'cohere_wiki', ?, query_id, gt_ids FROM read_parquet(?)", [query, source])
          PYTHON

      - name: Sweep max_probe with pdbench
        run: |
          set -euo pipefail
          for query in knn_top10_unfiltered knn_top10_10pct knn_top10_1pct; do
            pdbench search --url "$PARADEDB_URL" --config "benchmarks/cohere/${COHERE_SIZE}.toml" \
              --assets-dir benchmarks/assets --runs-dir benchmark-artifacts/search \
              --query "$query" --no-compare --html
          done

      - name: Find Mainline pdbench Baseline
        id: pdbench_baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const name = `${process.env.RESULTS_DATASET}-diagnostics`;
            const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'benchmark-pg_search-benchmarker-cohere.yml',
              branch: 'main', event: 'schedule', status: 'success', per_page: 100,
            });
            for await (const { data: runs } of pages) {
              for (const run of runs) {
                // Keep the baseline stable if a newer main run finishes first.
                if (run.run_number >= context.runNumber) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                const artifact = artifacts.find(a => a.name === name && !a.expired);
                if (!artifact) continue;
                core.setOutput('run_id', run.id);
                core.setOutput('commit', run.head_sha);
                core.setOutput('url', run.html_url);
                core.info(`Baseline: ${run.html_url} (${run.head_sha})`);
                return;
              }
            }
            await core.summary.addHeading('pdbench mainline comparison', 3)
              .addRaw(`Skipped: no successful daily main run has an unexpired ${name} artifact.\n`)
              .write();

      - name: Download Mainline pdbench Baseline
        if: steps.pdbench_baseline.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.RESULTS_DATASET }}-diagnostics
          path: benchmark-baseline
          run-id: ${{ steps.pdbench_baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compare pdbench Sweeps with Mainline
        if: steps.pdbench_baseline.outputs.run_id != ''
        env:
          BASELINE_COMMIT: ${{ steps.pdbench_baseline.outputs.commit }}
          BASELINE_URL: ${{ steps.pdbench_baseline.outputs.url }}
          CURRENT_COMMIT: ${{ steps.commit_info.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/compare_search.py \
            --baseline "benchmark-baseline/search/${COHERE_SIZE}" \
            --current "benchmark-artifacts/search/${COHERE_SIZE}" \
            --output benchmark-artifacts/comparison \
            --baseline-commit "$BASELINE_COMMIT" --baseline-url "$BASELINE_URL" \
            --current-commit "$CURRENT_COMMIT"
          cat benchmark-artifacts/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare k6 Operating Points
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/prepare_k6.py --runs benchmark-artifacts/search --output benchmark-artifacts
          jq '[.[] | select(.reached and .buffers.shared_hit_mean != null)
            | {name: (.name + " shared hits/query"), unit: "hits/query", value: .buffers.shared_hit_mean}
          ]' benchmark-artifacts/operating_points.json > benchmark-artifacts/buffer-metrics.json
          psql "$PARADEDB_URL" -XAt -v ON_ERROR_STOP=1 \
            -c 'SELECT json_agg(emb::text ORDER BY id) FROM pdbench_queries' \
            > benchmark-artifacts/query_vectors.json
          cat benchmark-artifacts/operating_points.md >> "$GITHUB_STEP_SUMMARY"
          {
            git -C pdbench rev-parse HEAD
            git -C benchmarker rev-parse HEAD
          } > benchmark-artifacts/tool-commits.txt

      - name: Verify k6 Query Plans and Filter Pushdown
        run: python3 benchmarks/cohere/verify_plans.py benchmark-artifacts

      - name: Upload Index, Recall, and Buffer Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.RESULTS_DATASET }}-diagnostics
          path: benchmark-artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Measure Selected Operating Points with k6
        uses: ./.github/actions/benchmark-vector-k6
        with:
          dataset: ${{ env.RESULTS_DATASET }}
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.commit_info.outputs.commit_sha }}","ref":"${{ env.BENCHMARK_REF }}","pdbench":"${{ env.PDBENCH_REF }}","benchmarker":"${{ env.BENCHMARKER_REF }}"}

      # Router quality runs after k6 so its flat sweeps do not change the cache k6 measures on.
      - name: Write Router-quality Arm Profiles
        if: env.ROUTER_QUALITY == 'true'
        run: |
          python3 benchmarks/cohere/router_quality.py configs \
            --profile "benchmarks/cohere/${COHERE_SIZE}.toml" --output benchmark-artifacts/router

      # Per query: the stored arm, seeded from the existing sweep on the unfiltered query, then flat
      # and stored-adaptive seeded from it. The existing sweep's unfiltered report stands in for
      # stored-adaptive when that query routes every segment. A run whose console projection fails
      # with "representative layer0 has no scan stage" is kept when it saved its report; any other
      # failure fails the step.
      - name: Sweep max_probe per Router-quality Arm with pdbench
        if: env.ROUTER_QUALITY == 'true'
        run: |
          python3 benchmarks/cohere/router_quality.py sweep --runs benchmark-artifacts/router \
            --existing "benchmark-artifacts/search/${COHERE_SIZE}" --assets-dir benchmarks/assets

      - name: Measure Router Quality at the Selected Budgets
        if: env.ROUTER_QUALITY == 'true'
        run: |
          python3 benchmarks/cohere/router_quality.py measure --runs benchmark-artifacts/router \
            --vectors benchmark-artifacts/query_vectors.json \
            --output benchmark-artifacts/router/measurements.json

      # Daily main runs benchmark their own head; manual runs can benchmark another commit.
      - name: Find Mainline Router-quality Baseline
        if: env.ROUTER_QUALITY == 'true'
        id: router_baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const name = `${process.env.RESULTS_DATASET}-router-quality`;
            const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'benchmark-pg_search-benchmarker-cohere.yml',
              branch: 'main', event: 'schedule', status: 'success', per_page: 100,
            });
            for await (const { data: runs } of pages) {
              for (const run of runs) {
                // Keep the baseline stable if a newer main run finishes first.
                if (run.run_number >= context.runNumber) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                const artifact = artifacts.find(a => a.name === name && !a.expired);
                if (!artifact) continue;
                core.setOutput('run_id', run.id);
                core.setOutput('commit', run.head_sha);
                core.setOutput('url', run.html_url);
                core.info(`Baseline: ${run.html_url} (${run.head_sha})`);
                return;
              }
            }
            core.info(`No successful daily main run has an unexpired ${name} artifact.`);

      - name: Download Mainline Router-quality Baseline
        if: steps.router_baseline.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.RESULTS_DATASET }}-router-quality
          path: router-baseline
          run-id: ${{ steps.router_baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      # The publisher copies sweep_reports_dir/*.html to gh-pages under
      # benchmarker-runs/<commit>/<dataset>/sweep/, so the full report is published there.
      - name: Render Router-quality Section
        if: env.ROUTER_QUALITY == 'true'
        env:
          CURRENT_COMMIT: ${{ steps.commit_info.outputs.commit_sha }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          baseline=()
          if [ -f router-baseline/router_quality.json ]; then
            baseline=(--baseline router-baseline)
          fi
          report_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/benchmarker-runs/${CURRENT_COMMIT}/${RESULTS_DATASET}/sweep/router_quality.html"
          python3 benchmarks/cohere/router_quality.py render \
            --measurements benchmark-artifacts/router/measurements.json \
            --output benchmark-artifacts/router \
            --commit "$CURRENT_COMMIT" --pdbench "$PDBENCH_REF" --report-url "$report_url" "${baseline[@]}"
          mkdir -p benchmark-artifacts/comparison
          cp benchmark-artifacts/router/router_quality.html benchmark-artifacts/comparison/
          cat benchmark-artifacts/router/router_quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Router-quality Diagnostics
        if: always() && env.ROUTER_QUALITY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.RESULTS_DATASET }}-router-quality
          path: benchmark-artifacts/router/
          retention-days: 30
          if-no-files-found: warn

      - name: Write PR Comment Context
        run: |
          set -euo pipefail
          printf 'Database resources: 8 CPUs on cores 0-7, 32 GiB RAM, seven parallel maintenance workers, four query workers, and eight global parallel workers. k6 runs on cores 64-67.\n\n' > benchmark-artifacts/context.md
          cat benchmark-artifacts/operating_points.md >> benchmark-artifacts/context.md
          if [ -f benchmark-artifacts/plan-modes.md ]; then
            cat benchmark-artifacts/plan-modes.md >> benchmark-artifacts/context.md
          fi
          if [ "$ROUTER_QUALITY" = true ]; then
            cat benchmark-artifacts/router/router_quality.md >> benchmark-artifacts/context.md
          fi

      - name: Stage Benchmarker Results
        uses: ./.github/actions/stage-benchmark-results
        with:
          benchmark_type: benchmarker
          metadata: >-
            {"dataset":"${{ env.RESULTS_DATASET }}",
             "ref":"${{ steps.commit_info.outputs.commit_sha }}","pr_number":"${{ github.event.pull_request.number }}",
             "publish_baseline":"${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_baseline) }}",
             "context_file":"benchmark-artifacts/context.md",
             "sweep_reports_dir":"benchmark-artifacts/comparison",
             "buffer_metrics_file":"benchmark-artifacts/buffer-metrics.json",
             "index_metrics_file":"benchmark-artifacts/index-metrics.json",
             "router_metrics_file":"${{ env.ROUTER_QUALITY == 'true' && 'benchmark-artifacts/router/router-metrics.json' || '' }}",
             "router_detail_metrics_file":"${{ env.ROUTER_QUALITY == 'true' && 'benchmark-artifacts/router/router-detail-metrics.json' || '' }}"}

      - name: Database Logs
        if: failure() || cancelled()
        run: docker logs --tail 200 paradedb

      - name: Stop Database
        if: always()
        run: docker stop --time 600 paradedb

  cohere-comparison:
    permissions:
      actions: read
      contents: read
      id-token: write
    name: Cohere 10m (${{ matrix.engine }}${{ matrix.engine == 'vectorchord' && format(', prefilter {0}', matrix.prefilter) || '' }})
    if: github.event_name == 'workflow_dispatch' && inputs.engine != 'pg_search' && inputs.engine != ''
    timeout-minutes: 720
    strategy:
      matrix:
        engine: ${{ fromJSON(inputs.engine == 'pg_vectorsearch' && '["pg_vectorsearch"]' || '["vectorchord"]') }}
        prefilter: ${{ fromJSON(inputs.engine == 'vectorchord-prefilter' && '["on"]' || '["off"]') }}
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - spot=${{ inputs.runner_type == 'spot' }}
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache+git-cache+apt-cache
    env:
      COHERE_SIZE: 10m
      PDBENCH_REF: ${{ inputs.pdbench_ref || '376d023d1f42d31f7f54ef98ea023c5a8d21771f' }}
      BENCHMARKER_REF: ${{ inputs.benchmarker_ref || 'ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3' }}
      BENCHMARK_REF: ${{ inputs.commit || github.sha }}
      BENCHMARK_ENGINE: ${{ matrix.engine }}
      PG_VECTORSEARCH_REF: 1bc1c77b2a07611d57c8a1eae767939bd1e39ee1
      VECTORCHORD_REF: f9b5e234c44cee69b266b8431f92b7deed4e99d3
      VECTORCHORD_PREFILTER: ${{ matrix.prefilter }}
      RESULTS_DATASET: cohere-10m-${{ matrix.engine }}${{ matrix.engine == 'vectorchord' && matrix.prefilter == 'on' && '-prefilter' || '' }}-8cpu-32gb
      COHERE_CONFIG: benchmarks/cohere/10m-${{ matrix.engine }}${{ matrix.engine == 'vectorchord' && matrix.prefilter == 'on' && '-prefilter' || '' }}.toml

    steps:
      - name: Validate Comparison Inputs
        env:
          REQUESTED_SIZE: ${{ inputs.size }}
          ROUTER_QUALITY: ${{ inputs.router_quality }}
        run: |
          if [[ "$REQUESTED_SIZE" != 10m || "$ROUTER_QUALITY" == true ]]; then
            echo '::error::Comparison engines require size=10m and router_quality=false.'
            exit 1
          fi

      - name: Checkout Extension to Benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BENCHMARK_REF }}
          persist-credentials: false

      - name: Record Benchmark Commit
        id: commit_info
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tantivy="$(awk '/^name = "tantivy"$/ { found = 1 } found && /^source = / { sub(/.*#/, ""); gsub(/"/, ""); print; exit }' Cargo.lock)"
          echo "tantivy_sha=$tantivy" >> "$GITHUB_OUTPUT"

      - name: Checkout Benchmark Workflow for Backfills
        if: inputs.commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: benchmark-workflow
          persist-credentials: false

      - name: Use This Workflow's Benchmark Code for Backfills
        if: inputs.commit != ''
        run: |
          rsync -a --delete benchmark-workflow/benchmarks/ benchmarks/
          rsync -a benchmark-workflow/.github/actions/ .github/actions/
          rsync -a benchmark-workflow/.github/scripts/ .github/scripts/
          cp benchmark-workflow/docker/Dockerfile.source docker/Dockerfile.source

      - name: Record Benchmark Configuration
        run: |
          mkdir -p benchmark-artifacts
          git rev-parse HEAD > benchmark-artifacts/extension-commit.txt
          echo "$GITHUB_SHA" > benchmark-artifacts/workflow-commit.txt
          cp "$COHERE_CONFIG" benchmark-artifacts/config.toml

      - name: Test Vector Benchmark Helpers
        run: |
          python3 -m unittest discover -s benchmarks/cohere -p 'test_*.py'

      - name: Configure RunsOn Caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      # pdbench comes first: it holds the compose file the cluster starts with.
      - name: Create pdbench Checkout Token
        id: pdbench_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}
          owner: paradedb
          repositories: ${{ matrix.engine == 'pg_vectorsearch' && 'pdbench,pg_vectorsearch' || 'pdbench' }}
          permission-contents: read

      - name: Checkout pdbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: paradedb/pdbench
          ref: ${{ env.PDBENCH_REF }}
          path: pdbench
          token: ${{ steps.pdbench_token.outputs.token }}
          persist-credentials: false

      - name: Set Up Docker Benchmark Cluster
        uses: ./.github/actions/setup-docker-benchmark-cluster
        with:
          ref: ${{ env.BENCHMARK_REF }}
          dataset: cohere
          size: ${{ env.COHERE_SIZE }}
          compose_file: pdbench/datasets/cohere/docker-compose.yml
          cpu_limit: "8"
          max_parallel_workers: "8"
          max_parallel_maintenance_workers: "7"
          max_parallel_workers_per_gather: "4"

      - name: Set Up pg_vectorsearch
        if: matrix.engine == 'pg_vectorsearch'
        uses: ./.github/actions/setup-pg-vectorsearch
        with:
          ref: ${{ env.PG_VECTORSEARCH_REF }}
          github_token: ${{ steps.pdbench_token.outputs.token }}

      - name: Set Up VectorChord
        if: matrix.engine == 'vectorchord'
        uses: ./.github/actions/setup-vectorchord
        with:
          ref: ${{ env.VECTORCHORD_REF }}

      - name: Verify VectorChord Filter Mode
        if: matrix.engine == 'vectorchord'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path(os.environ["COHERE_CONFIG"]).read_text())
          assert config["search"]["session"]["vchordrq.prefilter"] == os.environ["VECTORCHORD_PREFILTER"]
          PY
          PGOPTIONS="-c vchordrq.prefilter=$VECTORCHORD_PREFILTER" \
            psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
              -c "SELECT json_build_object('vchordrq.prefilter', current_setting('vchordrq.prefilter'))" \
            > benchmark-artifacts/vectorchord-filter-settings.json
          jq -e --arg expected "$VECTORCHORD_PREFILTER" \
            '."vchordrq.prefilter" == $expected' benchmark-artifacts/vectorchord-filter-settings.json

      - name: Build pdbench
        uses: ./.github/actions/build-pdbench

      - name: Set Up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          ref: ${{ env.BENCHMARKER_REF }}

      - name: Verify Shared Docker Resources
        run: |
          set -euo pipefail
          docker inspect paradedb | jq '.[0].HostConfig | {Memory, ShmSize, NanoCpus, CpusetCpus}' \
            > benchmark-artifacts/container-resources.json
          jq -e --argjson gib 1073741824 --argjson memory_gib 32 --argjson shm_gib 16 \
            --argjson nanocpus_per_cpu 1000000000 --argjson cpus 8 --arg cpuset '0-7' \
            '.Memory == $memory_gib * $gib and .ShmSize == $shm_gib * $gib
             and .NanoCpus == $cpus * $nanocpus_per_cpu and .CpusetCpus == $cpuset' \
            benchmark-artifacts/container-resources.json

      - name: Install Fixture Reader
        uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          packages: python3-venv

      - name: Import Published Ground-truth Fixtures
        env:
          FIXTURE_SOURCE: s3://paradedb-benchmark/datasets/cohere/v1/queries
        run: |
          set -euo pipefail
          python3 -m venv .cohere-fixtures
          .cohere-fixtures/bin/pip install --only-binary=:all: duckdb==2.0.0
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '
            CREATE TABLE IF NOT EXISTS pdbench_ground_truth (
              corpus text, query_stem text, query_id int, gt_ids text[],
              PRIMARY KEY (corpus, query_stem, query_id)
            );'
          .cohere-fixtures/bin/python - <<'PYTHON'
          import os
          import duckdb

          db = duckdb.connect()
          db.execute("INSTALL httpfs; LOAD httpfs; INSTALL postgres; LOAD postgres;")
          url = os.environ["PARADEDB_URL"].replace("'", "''")
          db.execute(f"ATTACH '{url}' AS pg (TYPE postgres);")
          for query in ("knn_top10_unfiltered", "knn_top10_10pct", "knn_top10_1pct"):
              source = f"{os.environ['FIXTURE_SOURCE']}/ground_truth_{query}_{os.environ['COHERE_SIZE']}.parquet"
              count = db.execute("SELECT count(*) FROM read_parquet(?)", [source]).fetchone()[0]
              if count != 100:
                  raise ValueError(f"{query}: expected 100 ground-truth rows, found {count}")
              db.execute("DELETE FROM pg.public.pdbench_ground_truth WHERE corpus = 'cohere_wiki' AND query_stem = ?", [query])
              db.execute("INSERT INTO pg.public.pdbench_ground_truth SELECT 'cohere_wiki', ?, query_id, gt_ids FROM read_parquet(?)", [query, source])
          PYTHON

      - name: Build Comparison Index
        run: |
          set -euo pipefail
          if [[ "$BENCHMARK_ENGINE" == pg_vectorsearch ]]; then
            psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS pg_vectorsearch;'
          fi
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE cohere_wiki SET (parallel_workers = 7);'
          pdbench build --url "$PARADEDB_URL" --config "$COHERE_CONFIG" \
            --assets-dir benchmarks/assets --runs-dir benchmark-artifacts/search \
            --force-rebuild \
            2>&1 | tee benchmark-artifacts/index-build.log
          profile="$(basename "$COHERE_CONFIG" .toml)"
          jq '.data | [
            {name: (.index.name + " build time"), unit: "min", value: (.build_seconds / 60)},
            {name: (.index.name + " index size"), unit: "MiB", value: (.index.size_bytes / 1048576)},
            {name: (.index.name + " parallel workers"), unit: "workers", value: .metrics.workers.max_parallel_workers}
          ]' benchmark-artifacts/search/"$profile"/*_build.json > benchmark-artifacts/index-metrics.json
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '\timing on' \
            -c 'VACUUM (ANALYZE) cohere_wiki;' \
            | tee benchmark-artifacts/index-vacuum.log

      - name: Verify PRISM Index and Parallel Build
        if: matrix.engine == 'pg_vectorsearch'
        run: |
          set -euo pipefail
          profile="$(basename "$COHERE_CONFIG" .toml)"
          jq -e '.data.index.access_method == "prism" and .data.metrics.workers.max_parallel_workers > 0' \
            benchmark-artifacts/search/"$profile"/*_build.json
          psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
            -c "SELECT json_agg(s) FROM prism_index_settings('cohere_wiki_prism_idx') AS s" \
            > benchmark-artifacts/prism-settings.json

      - name: Verify VectorChord Index and Parallel Build
        if: matrix.engine == 'vectorchord'
        run: |
          set -euo pipefail
          profile="$(basename "$COHERE_CONFIG" .toml)"
          jq -e '.data.index.access_method == "vchordrq" and .data.metrics.workers.max_parallel_workers > 0' \
            benchmark-artifacts/search/"$profile"/*_build.json

      - name: Sweep Recall with pdbench
        run: |
          set -euo pipefail
          for query in knn_top10_unfiltered knn_top10_10pct knn_top10_1pct; do
            pdbench search --url "$PARADEDB_URL" --config "$COHERE_CONFIG" \
              --assets-dir benchmarks/assets --runs-dir benchmark-artifacts/search \
              --query "$query" --no-compare --html
          done

      - name: Prepare k6 Operating Points
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/prepare_k6.py --runs benchmark-artifacts/search --output benchmark-artifacts
          jq '[.[] | select(.reached and .buffers.shared_hit_mean != null)
            | {name: (.name + " shared hits/query"), unit: "hits/query", value: .buffers.shared_hit_mean}
          ]' benchmark-artifacts/operating_points.json > benchmark-artifacts/buffer-metrics.json
          psql "$PARADEDB_URL" -XAt -v ON_ERROR_STOP=1 \
            -c 'SELECT json_agg(emb::text ORDER BY id) FROM pdbench_queries' \
            > benchmark-artifacts/query_vectors.json
          cat benchmark-artifacts/operating_points.md >> "$GITHUB_STEP_SUMMARY"
          {
            git -C pdbench rev-parse HEAD
            git -C benchmarker rev-parse HEAD
          } > benchmark-artifacts/tool-commits.txt

      - name: Write Comparison Context
        run: |
          {
            printf 'Cohere 10M: the existing snapshot, 100 held-out vectors, published ground truth, and unfiltered/year/battle top-10 workloads.\n\n'
            printf 'Engine: %s. pg_search source: %s. pdbench: %s. Benchmarker: %s.\n\n' \
              "$BENCHMARK_ENGINE" "$BENCHMARK_REF" "$PDBENCH_REF" "$BENCHMARKER_REF"
            if [[ "$BENCHMARK_ENGINE" == vectorchord ]]; then
              printf 'VectorChord revision: %s; prefilter=%s. Build and sweep settings are recorded in config.toml.\n\n' "$VECTORCHORD_REF" "$VECTORCHORD_PREFILTER"
            else
              printf 'pg_vectorsearch revision: %s. One global PRISM index with PostgreSQL post-filtering.\n\n' "$PG_VECTORSEARCH_REF"
            fi
            printf 'Filters use PostgreSQL English full-text matching against the same text column and published recall fixtures. There are no scalar filter indexes. Executed cosine ANN plans and filter settings are checked before k6.\n\n'
            printf 'All engines use the shared paradedb Docker service: 8 CPUs on 0-7, 32 GiB RAM, 16 GiB shared memory, 8 GiB shared buffers and maintenance memory, 24 GiB effective cache, 256 MiB work_mem, 7 parallel maintenance workers, 4 query workers, 8 parallel workers, and a 32-process pool. k6 uses CPUs 64-67.\n\n'
            cat benchmark-artifacts/operating_points.md
          } > benchmark-artifacts/result-context.md
          if ! jq -e 'any(.[]; .reached)' benchmark-artifacts/operating_points.json > /dev/null; then
            echo '::error::No operating point passed full 100-vector validation.'
            exit 1
          fi

      - name: Verify k6 Vector Query Plans
        run: |
          python3 benchmarks/cohere/verify_plans.py benchmark-artifacts

      - name: Measure Selected Operating Points with k6
        uses: ./.github/actions/benchmark-vector-k6
        with:
          dataset: ${{ env.RESULTS_DATASET }}
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.commit_info.outputs.commit_sha }}","ref":"${{ env.BENCHMARK_REF }}","pdbench":"${{ env.PDBENCH_REF }}","benchmarker":"${{ env.BENCHMARKER_REF }}","engine":"${{ matrix.engine }}","pg_vectorsearch":"${{ matrix.engine == 'pg_vectorsearch' && env.PG_VECTORSEARCH_REF || '' }}","vectorchord":"${{ matrix.engine == 'vectorchord' && env.VECTORCHORD_REF || '' }}","vectorchord_prefilter":"${{ matrix.engine == 'vectorchord' && matrix.prefilter || '' }}","tantivy":"${{ steps.commit_info.outputs.tantivy_sha }}"}

      - name: Stage Benchmarker Results
        uses: ./.github/actions/stage-benchmark-results
        with:
          benchmark_type: benchmarker
          metadata: >-
            {"dataset":"${{ env.RESULTS_DATASET }}",
             "ref":"${{ steps.commit_info.outputs.commit_sha }}","pr_number":"${{ github.event.pull_request.number }}",
             "publish_baseline":"${{ github.ref == 'refs/heads/main' && inputs.commit == '' && inputs.publish_baseline }}",
             "context_file":"benchmark-artifacts/result-context.md",
             "buffer_metrics_file":"benchmark-artifacts/buffer-metrics.json",
             "index_metrics_file":"benchmark-artifacts/index-metrics.json"}

      - name: Save Database Log
        if: always()
        run: |
          mkdir -p benchmark-artifacts
          docker logs paradedb > benchmark-artifacts/postgres.log 2>&1 || true

      - name: Upload Index, Recall, and Buffer Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.RESULTS_DATASET }}-diagnostics
          path: |
            benchmark-artifacts/
            benchmarker/results/
          retention-days: 30
          if-no-files-found: warn

      - name: Database Logs
        if: failure() || cancelled()
        run: docker logs --tail 200 paradedb

      - name: Stop Database
        if: always()
        run: docker stop --time 600 paradedb

  publish-results:
    name: Publish Benchmark Results
    needs: [cohere, cohere-comparison]
    if: always() && !cancelled() && (needs.cohere.result == 'success' || needs.cohere.result == 'failure' || needs.cohere-comparison.result == 'success' || needs.cohere-comparison.result == 'failure')
    uses: ./.github/workflows/publish-benchmark-results.yml
    secrets: inherit
