# workflows/benchmark-pg_search-benchmarker-hn.yml
#
# Benchmark pg_search (Benchmarker HN vector)
# Run filtered Hacker News vector benchmarks.

name: Benchmark pg_search (Benchmarker HN vector)

on:
  schedule:
    - cron: "30 15 * * *" # Daily at 15:30 UTC. Space nightly benchmarks two hours apart.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      engine:
        description: "Vector index to benchmark"
        type: choice
        options:
          - pg_search
          - pg_vectorsearch
          - vectorchord
          - vectorchord-prefilter
        default: pg_search
      commit:
        description: "pg_search commit/ref to benchmark (defaults to the triggering ref)"
        default: ""
      pdbench_ref:
        description: "pdbench ref"
        default: "df22afd6d48f43653b61c24b928dcf0e929c471c"
      benchmarker_ref:
        description: "benchmarker ref"
        default: "ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  hn:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    name: HN vector 28m (${{ matrix.engine }}${{ matrix.engine == 'vectorchord' && format(', prefilter {0}', matrix.prefilter) || '' }})
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["benchmark-hn-vector", "benchmark-hn-pg_vectorsearch", "benchmark-hn-vectorchord", "benchmark-hn-vectorchord-prefilter"]'), github.event.label.name)
    timeout-minutes: ${{ matrix.engine != 'pg_search' && 1440 || 720 }}
    strategy:
      matrix:
        engine: >-
          ${{ fromJSON((inputs.engine == 'pg_vectorsearch' || github.event.label.name == 'benchmark-hn-pg_vectorsearch') && '["pg_vectorsearch"]' || (startsWith(inputs.engine, 'vectorchord') || startsWith(github.event.label.name, 'benchmark-hn-vectorchord')) && '["vectorchord"]' || '["pg_search"]') }}
        prefilter: >-
          ${{ fromJSON((inputs.engine == 'vectorchord-prefilter' || github.event.label.name == 'benchmark-hn-vectorchord-prefilter') && '["on"]' || '["off"]') }}
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache+git-cache+apt-cache
    env:
      HN_SIZE: 28m
      PDBENCH_REF: ${{ inputs.pdbench_ref || 'df22afd6d48f43653b61c24b928dcf0e929c471c' }}
      BENCHMARKER_REF: ${{ inputs.benchmarker_ref || 'ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3' }}
      BENCHMARK_REF: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      BENCHMARK_ENGINE: ${{ matrix.engine }}
      PG_VECTORSEARCH_REF: 1bc1c77b2a07611d57c8a1eae767939bd1e39ee1
      VECTORCHORD_PREFILTER: ${{ matrix.prefilter }}
      VECTORCHORD_REF: f9b5e234c44cee69b266b8431f92b7deed4e99d3
      RESULTS_DATASET: hackernews-vector-28m${{ matrix.engine == 'pg_vectorsearch' && '-pg-vectorsearch' || matrix.engine == 'vectorchord' && (matrix.prefilter == 'on' && '-vectorchord-prefilter' || '-vectorchord') || '' }}
      HN_CONFIG: benchmarks/hn/${{ matrix.engine == 'pg_vectorsearch' && '28m-pgvectorsearch' || matrix.engine == 'vectorchord' && (matrix.prefilter == 'on' && '28m-vectorchord-prefilter' || '28m-vectorchord') || '28m' }}.toml

    steps:
      - name: Remove Benchmark Label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$BENCHMARK_LABEL" || true

      - name: Checkout Extension to Benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BENCHMARK_REF }}
          persist-credentials: false

      - name: Record Benchmark Commit
        id: commit_info
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tantivy="$(awk '/^name = "tantivy"$/ { found = 1 } found && /^source = / { sub(/.*#/, ""); gsub(/"/, ""); print; exit }' Cargo.lock)"
          echo "tantivy_sha=$tantivy" >> "$GITHUB_OUTPUT"

      - name: Checkout Benchmark Workflow for Backfills
        if: inputs.commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: benchmark-workflow
          persist-credentials: false

      - name: Use This Workflow's Benchmark Code for Backfills
        if: inputs.commit != ''
        run: |
          rsync -a --delete benchmark-workflow/benchmarks/ benchmarks/
          rsync -a benchmark-workflow/.github/actions/ .github/actions/
          rsync -a benchmark-workflow/.github/scripts/ .github/scripts/
          cp benchmark-workflow/docker/Dockerfile.source docker/Dockerfile.source

      - name: Record Benchmark Configuration
        run: |
          mkdir -p benchmark-artifacts
          git rev-parse HEAD > benchmark-artifacts/extension-commit.txt
          echo "$GITHUB_SHA" > benchmark-artifacts/workflow-commit.txt
          cp "$HN_CONFIG" benchmark-artifacts/config.toml

      - name: Test Vector Benchmark Helpers
        run: |
          python3 -m unittest discover -s benchmarks/cohere -p 'test_*.py'

      - name: Configure RunsOn Caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      # pdbench comes first: it holds the compose file the cluster starts with.
      - name: Create pdbench Checkout Token
        id: pdbench_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}
          owner: paradedb
          repositories: ${{ matrix.engine == 'pg_vectorsearch' && 'pdbench,pg_vectorsearch' || 'pdbench' }}
          permission-contents: read

      - name: Checkout pdbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: paradedb/pdbench
          ref: ${{ env.PDBENCH_REF }}
          path: pdbench
          token: ${{ steps.pdbench_token.outputs.token }}
          persist-credentials: false

      - name: Set Up Docker Benchmark Cluster
        uses: ./.github/actions/setup-docker-benchmark-cluster
        with:
          ref: ${{ env.BENCHMARK_REF }}
          dataset: hackernews/vector
          size: ${{ env.HN_SIZE }}/39152428323-1
          backup: "20261018-214625F"
          compose_file: pdbench/datasets/hn/docker-compose.yml

      - name: Set Up pg_vectorsearch
        if: matrix.engine == 'pg_vectorsearch'
        uses: ./.github/actions/setup-pg-vectorsearch
        with:
          ref: ${{ env.PG_VECTORSEARCH_REF }}
          github_token: ${{ steps.pdbench_token.outputs.token }}

      - name: Set Up VectorChord
        if: matrix.engine == 'vectorchord'
        uses: ./.github/actions/setup-vectorchord
        with:
          ref: ${{ env.VECTORCHORD_REF }}

      - name: Verify VectorChord Filter Mode
        if: matrix.engine == 'vectorchord'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path(os.environ["HN_CONFIG"]).read_text())
          assert config["search"]["session"]["vchordrq.prefilter"] == os.environ["VECTORCHORD_PREFILTER"]
          PY
          PGOPTIONS="-c vchordrq.prefilter=$VECTORCHORD_PREFILTER" \
            psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
              -c "SELECT json_build_object('vchordrq.prefilter', current_setting('vchordrq.prefilter'))" \
            > benchmark-artifacts/vectorchord-filter-settings.json
          jq -e --arg expected "$VECTORCHORD_PREFILTER" \
            '."vchordrq.prefilter" == $expected' benchmark-artifacts/vectorchord-filter-settings.json

      - name: Build pdbench
        uses: ./.github/actions/build-pdbench

      - name: Set Up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          ref: ${{ env.BENCHMARKER_REF }}

      - name: Install Fixture Reader
        uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          packages: python3-venv

      - name: Verify Published HN Fixtures
        run: |
          set -euo pipefail
          python3 -m venv .hn-fixtures
          .hn-fixtures/bin/pip install --only-binary=:all: duckdb==2.0.0
          .hn-fixtures/bin/python benchmarks/hn/prepare.py --output benchmark-artifacts/fixtures

      - name: Verify Restored Heap and Import Ground Truth
        run: |
          set -euo pipefail
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -f benchmark-artifacts/fixtures/verify_heap.sql \
            | tee benchmark-artifacts/heap-validation.log
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -f benchmark-artifacts/fixtures/import_ground_truth.sql

      - name: Refresh pg_search
        if: matrix.engine == 'pg_search'
        run: |
          set -euo pipefail
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -c 'DROP EXTENSION IF EXISTS pg_search;' -c 'CREATE EXTENSION pg_search;'

      - name: Build pg_search Index and Report Metrics
        if: matrix.engine == 'pg_search'
        uses: ./.github/actions/build-vector-benchmark-index
        with:
          config: configs/load/hn-full-paradedb.yaml

      - name: Build Comparison Index
        if: matrix.engine != 'pg_search'
        run: |
          set -euo pipefail
          if [[ "$BENCHMARK_ENGINE" == pg_vectorsearch ]]; then
            psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS pg_vectorsearch;'
          fi
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE hn_items SET (parallel_workers = 8);'
          pdbench build --url "$PARADEDB_URL" --config "$HN_CONFIG" \
            --assets-dir benchmarks/assets --runs-dir benchmark-artifacts/search \
            --set dataset.s3_base_path=benchmark-artifacts/fixtures \
            --force-rebuild \
            2>&1 | tee benchmark-artifacts/index-build.log
          profile="$(basename "$HN_CONFIG" .toml)"
          jq '.data | [
            {name: (.index.name + " build time"), unit: "min", value: (.build_seconds / 60)},
            {name: (.index.name + " index size"), unit: "MiB", value: (.index.size_bytes / 1048576)},
            {name: (.index.name + " parallel workers"), unit: "workers", value: .metrics.workers.max_parallel_workers}
          ]' benchmark-artifacts/search/"$profile"/*_build.json > benchmark-artifacts/index-metrics.json
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '\timing on' \
            -c 'VACUUM (ANALYZE) hn_items;' \
            | tee benchmark-artifacts/index-vacuum.log

      - name: Verify Eight-segment Index
        if: matrix.engine == 'pg_search'
        run: |
          set -euo pipefail
          psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
            -c "SELECT json_agg(v) FROM paradedb.vector_info('hn_items_bm25_idx', 'emb') AS v" \
            > benchmark-artifacts/vector-info.json
          psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
            -c "SELECT to_json(reloptions) FROM pg_class WHERE oid = 'hn_items_bm25_idx'::regclass" \
            > benchmark-artifacts/index-options.json
          jq -e 'length == 8 and (map(.vector_num_vectors) | add) == 24138153
            and all(.[]; .vector_format == "ivf" and .quantized)' benchmark-artifacts/vector-info.json
          jq -e 'index("target_segment_count=8") != null
            and index("vector_router_quantization=true") != null' benchmark-artifacts/index-options.json

      - name: Verify PRISM Index and Parallel Build
        if: matrix.engine == 'pg_vectorsearch'
        run: |
          set -euo pipefail
          profile="$(basename "$HN_CONFIG" .toml)"
          jq -e '.data.index.access_method == "prism" and .data.metrics.workers.max_parallel_workers > 0' \
            benchmark-artifacts/search/"$profile"/*_build.json
          psql "$PARADEDB_URL" -XqAt -v ON_ERROR_STOP=1 \
            -c "SELECT json_agg(s) FROM prism_index_settings('hn_items_prism_idx') AS s" \
            > benchmark-artifacts/prism-settings.json

      - name: Verify VectorChord Index and Parallel Build
        if: matrix.engine == 'vectorchord'
        run: |
          set -euo pipefail
          profile="$(basename "$HN_CONFIG" .toml)"
          jq -e '.data.index.access_method == "vchordrq" and .data.metrics.workers.max_parallel_workers > 0' \
            benchmark-artifacts/search/"$profile"/*_build.json

      - name: Restore Recall Starting Values
        if: matrix.engine != 'pg_search'
        id: recall-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: benchmark-artifacts/search/**/sweep_cache*.json
          key: pdbench-hints-v1-hn-28m-${{ matrix.engine }}-${{ matrix.engine == 'vectorchord' && env.VECTORCHORD_REF || env.PG_VECTORSEARCH_REF }}-${{ hashFiles(env.HN_CONFIG, 'benchmarks/assets/hn/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pdbench-hints-v1-hn-28m-${{ matrix.engine }}-${{ matrix.engine == 'vectorchord' && env.VECTORCHORD_REF || env.PG_VECTORSEARCH_REF }}-${{ hashFiles(env.HN_CONFIG, 'benchmarks/assets/hn/**') }}-

      - name: Sweep Recall with pdbench
        run: |
          set -euo pipefail
          for sql in benchmarks/assets/hn/queries/*.sql; do
            query="$(basename "$sql" .sql)"
            pdbench search --url "$PARADEDB_URL" --config "$HN_CONFIG" \
              --assets-dir benchmarks/assets --runs-dir benchmark-artifacts/search \
              --set dataset.s3_base_path=benchmark-artifacts/fixtures \
              --query "$query" --no-compare --html
          done

      - name: Save Recall Starting Values
        if: always() && matrix.engine != 'pg_search' && steps.recall-cache.outcome == 'success' && hashFiles('benchmark-artifacts/search/**/sweep_cache*.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: benchmark-artifacts/search/**/sweep_cache*.json
          key: ${{ steps.recall-cache.outputs.cache-primary-key }}

      - name: Prepare k6 Operating Points
        env:
          TANTIVY_SHA: ${{ steps.commit_info.outputs.tantivy_sha }}
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/prepare_k6.py --dataset hn --runs benchmark-artifacts/search --output benchmark-artifacts
          jq '[.[] | select(.reached and .buffers.shared_hit_mean != null)
            | {name: (.name + " shared hits/query"), unit: "hits/query", value: .buffers.shared_hit_mean}
          ]' benchmark-artifacts/operating_points.json > benchmark-artifacts/buffer-metrics.json
          psql "$PARADEDB_URL" -XAt -v ON_ERROR_STOP=1 \
            -c 'SELECT json_agg(emb::text ORDER BY id) FROM (SELECT id, emb FROM pdbench_queries ORDER BY id LIMIT 100) AS queries' \
            > benchmark-artifacts/query_vectors.json
          .hn-fixtures/bin/python benchmarks/hn/prepare.py --output benchmark-artifacts/fixtures \
            --verify-vectors benchmark-artifacts/query_vectors.json
          cat benchmark-artifacts/operating_points.md >> "$GITHUB_STEP_SUMMARY"
          {
            git -C pdbench rev-parse HEAD
            git -C benchmarker rev-parse HEAD
          } > benchmark-artifacts/tool-commits.txt
          {
            printf '%s\n\n' "HN vector 28m: six filtered top-10 workloads using the same exact-author and timestamp predicates and published ground truth. Strict ID recall may leave targets unreached on tied vectors."
            printf "Engine: \`%s\`; pg_search source: \`%s\`; pdbench: \`%s\`; Benchmarker: \`%s\`.\n\n" "$BENCHMARK_ENGINE" "$BENCHMARK_REF" "$PDBENCH_REF" "$BENCHMARKER_REF"
            if [[ "$BENCHMARK_ENGINE" == pg_vectorsearch ]]; then
              printf "PRISM revision: \`%s\`. Automatic nlist, default replication, integer nprobe sweep 1..4096.\n\n" "$PG_VECTORSEARCH_REF"
              printf 'HN uses one global PRISM index with PostgreSQL post-filtering and no scalar filter indexes. Sequential scans, bitmap scans, and sorts are disabled; executed plans must use PRISM. k6 series are marked prism-postfilter. work_mem is 1 GiB.\n\n'
            elif [[ "$BENCHMARK_ENGINE" == vectorchord ]]; then
              printf 'VectorChord revision: %s. One global cosine vchordrq index, 80,000 lists, residual quantization, spherical centroids, and integer probes 1..80000.\n\n' "$VECTORCHORD_REF"
              printf 'Partitioning uses eight threads, hierarchical k-means in 100 dimensions, and sampling_factor=64. epsilon=1.9; max_scan_tuples=-1. vchordrq.prefilter=%s throughout the sweep and k6 for all six predicates. Executed plans must use vchordrq; result names identify prefilter or postfilter mode.\n\n' "$VECTORCHORD_PREFILTER"
            else
              printf "Eight index segments, training_sample_ratio=0.32, and quantized routing. Tantivy: \`%s\`.\n\n" "$TANTIVY_SHA"
            fi
            printf 'Uses the existing heap snapshot and 100 held-out vectors. All engines use the shared pg_search Docker service: 64 CPUs on cores 0-63, 128 GiB RAM, 64 GiB shared memory, 32 GiB shared buffers, 1 GiB work_mem, eight build/query workers, 16 parallel workers and a 32-process pool. k6 runs on cores 64-67. Scheduled/manual main runs without a commit override update a separate baseline per engine.\n\n'
            cat benchmark-artifacts/operating_points.md
          } > benchmark-artifacts/result-context.md
          if ! jq -e 'any(.[]; .reached)' benchmark-artifacts/operating_points.json > /dev/null; then
            echo '::error::No operating point passed full 100-vector validation. See operating_points.md for recall and budget outcomes.'
            exit 1
          fi

      - name: Verify k6 Vector Query Plans
        run: |
          python3 benchmarks/cohere/verify_plans.py benchmark-artifacts

      - name: Measure Selected Operating Points with k6
        uses: ./.github/actions/benchmark-vector-k6
        with:
          dataset: ${{ env.RESULTS_DATASET }}
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.commit_info.outputs.commit_sha }}","ref":"${{ env.BENCHMARK_REF }}","pdbench":"${{ env.PDBENCH_REF }}","benchmarker":"${{ env.BENCHMARKER_REF }}","engine":"${{ matrix.engine }}","pg_vectorsearch":"${{ matrix.engine == 'pg_vectorsearch' && env.PG_VECTORSEARCH_REF || '' }}","vectorchord":"${{ matrix.engine == 'vectorchord' && env.VECTORCHORD_REF || '' }}","vectorchord_prefilter":"${{ matrix.engine == 'vectorchord' && matrix.prefilter || '' }}","tantivy":"${{ steps.commit_info.outputs.tantivy_sha }}"}

      - name: Stage Benchmarker Results
        uses: ./.github/actions/stage-benchmark-results
        with:
          benchmark_type: benchmarker
          metadata: >-
            {"dataset":"${{ env.RESULTS_DATASET }}",
             "ref":"${{ steps.commit_info.outputs.commit_sha }}","pr_number":"${{ github.event.pull_request.number }}",
             "publish_baseline":"${{ github.ref == 'refs/heads/main' && inputs.commit == '' }}",
             "context_file":"benchmark-artifacts/result-context.md",
             "buffer_metrics_file":"benchmark-artifacts/buffer-metrics.json",
             "index_metrics_file":"benchmark-artifacts/index-metrics.json"}

      - name: Save Database Log
        if: always()
        run: |
          mkdir -p benchmark-artifacts
          docker logs paradedb > benchmark-artifacts/postgres.log 2>&1 || true

      - name: Upload Index, Recall, and Buffer Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.RESULTS_DATASET }}-diagnostics
          path: |
            benchmark-artifacts/
            benchmarker/results/
          retention-days: 30
          if-no-files-found: warn

      - name: Database Logs
        if: failure() || cancelled()
        run: docker logs --tail 200 paradedb

      - name: Stop Database
        if: always()
        run: docker stop --time 600 paradedb

  publish-results:
    name: Publish Benchmark Results
    needs: hn
    if: always() && !cancelled() && (needs.hn.result == 'success' || needs.hn.result == 'failure')
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-benchmark-results.yml
    secrets: inherit
