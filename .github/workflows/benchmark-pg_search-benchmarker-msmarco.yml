name: Benchmark pg_search (Benchmarker MS MARCO)

on:
  pull_request:
    types: [labeled]
  workflow_call:
    inputs:
      commit:
        type: string
        default: ""
      pdbench_ref:
        type: string
        default: "e1bd111cb1c2aa64303493c60f067b22a43f039d"
      benchmarker_ref:
        type: string
        default: "ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3"
      publish_baseline:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      commit:
        description: "pg_search commit/ref to benchmark (defaults to the triggering ref)"
        default: ""
      pdbench_ref:
        description: "pdbench ref"
        default: "e1bd111cb1c2aa64303493c60f067b22a43f039d"
      benchmarker_ref:
        description: "benchmarker ref"
        default: "ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3"
      publish_baseline:
        description: "Publish baseline metrics when running on main"
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  msmarco:
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    name: MS MARCO 113m (ParadeDB)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'benchmark-msmarco-pg_search'
    timeout-minutes: 360
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache
    env:
      MSMARCO_SIZE: 113m
      pg_version: "18"
      PDBENCH_REF: ${{ inputs.pdbench_ref || 'e1bd111cb1c2aa64303493c60f067b22a43f039d' }}
      BENCHMARKER_REF: ${{ inputs.benchmarker_ref || 'ecdca03f4da6e6e2d66ed01df2e5c33d4062d0d3' }}
      BENCHMARK_REF: ${{ inputs.commit || github.sha }}

    steps:
      - name: Remove benchmark label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$BENCHMARK_LABEL" || true

      - name: Checkout extension to benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BENCHMARK_REF }}
          persist-credentials: false

      - name: Record benchmark commit and connection
        id: commit_info
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "PARADEDB_URL=postgresql://$(whoami)@localhost:28818/postgres" >> "$GITHUB_ENV"

      - name: Checkout benchmark workflow for backfills
        if: inputs.commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: benchmark-workflow
          persist-credentials: false

      - name: Use this workflow's benchmark code for backfills
        if: inputs.commit != ''
        run: |
          rsync -a --delete benchmark-workflow/benchmarks/ benchmarks/
          rsync -a benchmark-workflow/.github/actions/ .github/actions/
          rsync -a benchmark-workflow/.github/scripts/ .github/scripts/

      - name: Test vector benchmark helpers
        run: python3 -m unittest discover -s benchmarks/cohere -p 'test_*.py'

      - name: Configure RunsOn caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      - name: Set up benchmark cluster
        uses: ./.github/actions/setup-benchmark-cluster
        with:
          pg_version: ${{ env.pg_version }}

      - name: Create pdbench checkout token
        id: pdbench_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}
          owner: paradedb
          repositories: pdbench
          permission-contents: read

      - name: Checkout pdbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: paradedb/pdbench
          ref: ${{ env.PDBENCH_REF }}
          path: pdbench
          token: ${{ steps.pdbench_token.outputs.token }}
          persist-credentials: false

      - name: Install pdbench toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Cache pdbench build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pdbench -> target

      - name: Build pdbench
        working-directory: pdbench
        run: |
          cargo +1.97.1 build --locked --release -p pdbench --target-dir target -j 16
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Set up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          ref: ${{ env.BENCHMARKER_REF }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::858265286872:role/paradedb-benchmark-read
          role-session-name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 21600
          allowed-account-ids: "858265286872" # ParadeDB CI AWS Account
          unset-current-credentials: true
          aws-region: us-east-1

      - name: Restore MS MARCO heap snapshot
        env:
          SNAPSHOT_REF: ${{ github.head_ref || github.ref_name }}
          SNAPSHOT_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          snapshot_prefix=/snapshots
          branch_prefix="/snapshots/branches/$SNAPSHOT_REPOSITORY_ID/$SNAPSHOT_REF"
          marker="${branch_prefix#/}/msmarco/v1/$MSMARCO_SIZE/pg_backrest/complete.json"
          if [ "$SNAPSHOT_REF" != main ] && aws s3api head-object \
              --bucket paradedb-benchmark --key "$marker" >/dev/null 2>&1; then
            snapshot_prefix="$branch_prefix"
            aws s3 cp "s3://paradedb-benchmark/$marker" benchmark-artifacts/snapshot-source.json
          fi
          echo "$snapshot_prefix" | tee benchmark-artifacts/snapshot-prefix.txt
          echo "Heap snapshot prefix: \`$snapshot_prefix\`" >> "$GITHUB_STEP_SUMMARY"
          (cd pg_search && cargo pgrx stop pg18)
          (cd benchmarks && cargo run --release -- restore-heap \
            --dataset msmarco --size "$MSMARCO_SIZE" \
            --pgdata /home/runner/.pgrx/data-18 --stanza bench \
            --repo-bucket paradedb-benchmark --repo-path-prefix "$snapshot_prefix" \
            --repo-region us-east-1 --repo-endpoint s3.us-east-1.amazonaws.com \
            --repo-s3-key-type shared)
          (cd pg_search && cargo pgrx start pg18)

      - name: Refresh pg_search and build index
        run: |
          set -euo pipefail
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -c 'DROP EXTENSION IF EXISTS pg_search;' -c 'CREATE EXTENSION pg_search;'
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 \
            -c "SELECT name, setting, unit FROM pg_settings
                WHERE name IN ('maintenance_work_mem', 'shared_buffers', 'max_parallel_workers',
                               'max_worker_processes', 'max_parallel_maintenance_workers',
                               'parallel_leader_participation', 'paradedb.global_target_segment_count')
                ORDER BY name;" \
            | tee benchmark-artifacts/index-build-settings.log
          cp benchmarks/datasets/msmarco/indexes/pg_search.sql benchmarks/msmarco/assets/msmarco/index.sql
          pdbench build --url "$PARADEDB_URL" --config "benchmarks/msmarco/${MSMARCO_SIZE}.toml" \
            --assets-dir benchmarks/msmarco/assets --runs-dir benchmark-artifacts/search \
            --force-rebuild \
            | tee benchmark-artifacts/index-build.log
          jq '.data | [
            {name: (.index.name + " build time"), unit: "min", value: (.build_seconds / 60)},
            {name: (.index.name + " index size"), unit: "MiB", value: (.index.size_bytes / 1048576)}
          ]' benchmark-artifacts/search/"${MSMARCO_SIZE}"/*_build.json > benchmark-artifacts/index-metrics.json
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '\timing on' \
            -c 'VACUUM (ANALYZE) msmarco;' \
            | tee benchmark-artifacts/index-vacuum.log

      - name: Install fixture reader
        uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          packages: python3-venv

      - name: Import published ground-truth fixtures
        env:
          FIXTURE_SOURCE: s3://paradedb-benchmark/datasets/msmarco/v1/queries
        run: |
          set -euo pipefail
          python3 -m venv .msmarco-fixtures
          .msmarco-fixtures/bin/pip install --only-binary=:all: duckdb==2.0.0
          psql "$PARADEDB_URL" -X -v ON_ERROR_STOP=1 -c '
            CREATE TABLE IF NOT EXISTS pdbench_ground_truth (
              corpus text, query_stem text, query_id int, gt_ids text[],
              PRIMARY KEY (corpus, query_stem, query_id)
            );'
          .msmarco-fixtures/bin/python - <<'PYTHON'
          import os
          import duckdb

          db = duckdb.connect()
          db.execute("INSTALL httpfs; LOAD httpfs; INSTALL postgres; LOAD postgres;")
          url = os.environ["PARADEDB_URL"].replace("'", "''")
          db.execute(f"ATTACH '{url}' AS pg (TYPE postgres);")
          for query in ("knn_top10_unfiltered", "knn_top100_unfiltered"):
              source = f"{os.environ['FIXTURE_SOURCE']}/ground_truth_{query}_{os.environ['MSMARCO_SIZE']}.parquet"
              count = db.execute("SELECT count(*) FROM read_parquet(?)", [source]).fetchone()[0]
              if count != 1677:
                  raise ValueError(f"{query}: expected 1677 ground-truth rows, found {count}")
              db.execute("DELETE FROM pg.public.pdbench_ground_truth WHERE corpus = 'msmarco' AND query_stem = ?", [query])
              db.execute("INSERT INTO pg.public.pdbench_ground_truth SELECT 'msmarco', ?, query_id, gt_ids FROM read_parquet(?)", [query, source])
          PYTHON

      - name: Sweep max_probe with pdbench
        run: |
          set -euo pipefail
          for query in knn_top10_unfiltered knn_top100_unfiltered; do
            pdbench search --url "$PARADEDB_URL" --config "benchmarks/msmarco/${MSMARCO_SIZE}.toml" \
              --assets-dir benchmarks/msmarco/assets --runs-dir benchmark-artifacts/search \
              --query "$query" --no-compare --html
          done

      - name: Find mainline pdbench baseline
        id: pdbench_baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const name = `msmarco-${process.env.MSMARCO_SIZE}-baseline`;
            const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'benchmark-pg_search-benchmarker-msmarco.yml',
              branch: 'main', event: 'workflow_dispatch', status: 'success', per_page: 100,
            });
            for await (const { data: runs } of pages) {
              for (const run of runs) {
                // Keep the baseline stable if a newer main run finishes first.
                if (run.run_number >= context.runNumber) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                const artifact = artifacts.find(a => a.name === name && !a.expired);
                if (!artifact) continue;
                core.setOutput('run_id', run.id);
                core.setOutput('commit', run.head_sha);
                core.setOutput('url', run.html_url);
                core.info(`Baseline: ${run.html_url} (${run.head_sha})`);
                return;
              }
            }
            await core.summary.addHeading('pdbench mainline comparison', 3)
              .addRaw(`Skipped: no successful main baseline run has an unexpired ${name} artifact.\n`)
              .write();

      - name: Download mainline pdbench baseline
        if: steps.pdbench_baseline.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msmarco-113m-baseline
          path: benchmark-baseline
          run-id: ${{ steps.pdbench_baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compare pdbench sweeps with mainline
        if: steps.pdbench_baseline.outputs.run_id != ''
        env:
          BASELINE_COMMIT: ${{ steps.pdbench_baseline.outputs.commit }}
          BASELINE_URL: ${{ steps.pdbench_baseline.outputs.url }}
          CURRENT_COMMIT: ${{ steps.commit_info.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/compare_search.py --dataset msmarco \
            --baseline "benchmark-baseline/${MSMARCO_SIZE}" \
            --current "benchmark-artifacts/search/${MSMARCO_SIZE}" \
            --output benchmark-artifacts/comparison \
            --baseline-commit "$BASELINE_COMMIT" --baseline-url "$BASELINE_URL" \
            --current-commit "$CURRENT_COMMIT"
          cat benchmark-artifacts/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare k6 operating points
        run: |
          set -euo pipefail
          python3 benchmarks/cohere/prepare_k6.py --dataset msmarco --runs benchmark-artifacts/search --output benchmark-artifacts
          jq '[.[] | select(.reached and .buffers.shared_hit_mean != null)
            | {name: (.name + " shared hits/query"), unit: "hits/query", value: .buffers.shared_hit_mean}
          ]' benchmark-artifacts/operating_points.json > benchmark-artifacts/buffer-metrics.json
          psql "$PARADEDB_URL" -XAt -v ON_ERROR_STOP=1 \
            -c 'SELECT json_agg(emb::text ORDER BY id) FROM (SELECT id, emb FROM pdbench_queries ORDER BY id LIMIT 100) AS queries' \
            > benchmark-artifacts/query_vectors.json
          cat benchmark-artifacts/operating_points.md >> "$GITHUB_STEP_SUMMARY"
          {
            git -C pdbench rev-parse HEAD
            git -C benchmarker rev-parse HEAD
          } > benchmark-artifacts/tool-commits.txt

      - name: Verify k6 vector query plans
        run: python3 benchmarks/cohere/verify_plans.py benchmark-artifacts

      - name: Measure selected operating points with k6
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.commit_info.outputs.commit_sha }}","ref":"${{ env.BENCHMARK_REF }}","pdbench":"${{ env.PDBENCH_REF }}","benchmarker":"${{ env.BENCHMARKER_REF }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="$PWD"
          mkdir -p benchmarker/results
          while IFS= read -r point; do
            (
              cd benchmarker/results
              "$root/benchmarker/k6" run --out dashboard=json,html \
                -e PARADEDB_URL="$PARADEDB_URL" \
                -e OPERATING_POINTS="$root/benchmark-artifacts/operating_points.json" \
                -e OPERATING_POINT="$point" \
                -e QUERY_VECTORS="$root/benchmark-artifacts/query_vectors.json" \
                "$root/benchmarks/cohere/k6/search.js"
            )
            jsons=(benchmarker/results/dashboard_*.json)
            htmls=(benchmarker/results/dashboard_*.html)
            test "${#jsons[@]}" -eq 1 && test "${#htmls[@]}" -eq 1
            mv "${jsons[0]}" "benchmarker/results/${point}.json"
            mv "${htmls[0]}" "benchmarker/results/${point}.html"
          done < <(jq -r '.[] | select(.reached) | .name' benchmark-artifacts/operating_points.json)

      - name: Stage Benchmarker results
        uses: ./.github/actions/stage-benchmark-results
        with:
          benchmark_type: benchmarker
          metadata: >-
            {"dataset":"msmarco-113m",
             "ref":"${{ steps.commit_info.outputs.commit_sha }}","pr_number":"${{ github.event.pull_request.number }}",
             "publish_baseline":"${{ github.ref == 'refs/heads/main' && inputs.commit == '' && inputs.publish_baseline }}",
             "context_file":"benchmark-artifacts/operating_points.md",
             "sweep_reports_dir":"benchmark-artifacts/comparison",
             "buffer_metrics_file":"benchmark-artifacts/buffer-metrics.json",
             "index_metrics_file":"benchmark-artifacts/index-metrics.json"}

      - name: Upload mainline baseline
        if: github.ref == 'refs/heads/main' && inputs.commit == '' && inputs.publish_baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msmarco-113m-baseline
          path: benchmark-artifacts/search/
          retention-days: 90
          if-no-files-found: error

      - name: Upload index, recall, and buffer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msmarco-113m-diagnostics
          path: benchmark-artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Database logs
        if: failure() || cancelled()
        run: tail -200 ~/.pgrx/18.log

      - name: Stop database
        if: always()
        working-directory: pg_search
        run: cargo pgrx stop pg18

  publish-results:
    name: Publish Benchmark Results
    needs: msmarco
    if: always() && !cancelled() && (needs.msmarco.result == 'success' || needs.msmarco.result == 'failure')
    uses: ./.github/workflows/publish-benchmark-results.yml
    secrets: inherit
