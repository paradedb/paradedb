name: Benchmark MS MARCO vector

on:
  schedule:
    - cron: "30 17 * * *" # Daily at 17:30 UTC.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      engine:
        description: "Vector index to benchmark"
        type: choice
        options: [pg_search, pg_vectorsearch, vectorchord]
        default: pg_search
      commit:
        description: "pg_search commit/ref to benchmark (defaults to the triggering ref)"
        default: ""
      pdbench_ref:
        description: "pdbench ref (empty uses the shared workflow's pin)"
        default: ""
      benchmarker_ref:
        description: "benchmarker ref (empty uses the shared workflow's pin)"
        default: ""

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

jobs:
  benchmark:
    name: MS MARCO ${{ matrix.engine }}
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["benchmark-msmarco-pg_search", "benchmark-msmarco-pg_vectorsearch", "benchmark-msmarco-vectorchord"]'), github.event.label.name)
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(github.event_name == 'schedule' && '["pg_search", "pg_vectorsearch", "vectorchord"]' || format('["{0}"]', inputs.engine || (github.event.label.name == 'benchmark-msmarco-pg_vectorsearch' && 'pg_vectorsearch') || (github.event.label.name == 'benchmark-msmarco-vectorchord' && 'vectorchord') || 'pg_search')) }}
    uses: ./.github/workflows/benchmark-msmarco.yml
    with:
      engine: ${{ matrix.engine }}
      commit: ${{ inputs.commit || '' }}
      pdbench_ref: ${{ inputs.pdbench_ref || '' }}
      benchmarker_ref: ${{ inputs.benchmarker_ref || '' }}
    secrets: inherit
