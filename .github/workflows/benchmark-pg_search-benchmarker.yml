# Benchmark pg_search (Benchmarker)
#
# Runs the benchmarker suite on datasets (hn-ci and stackexchange), indexing
# with a pg_search compiled from this repo's source and overlaid onto a
# released ParadeDB image. Dashboards and latency history are published to
# gh-pages.

name: Benchmark pg_search (Benchmarker)

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/build-paradedb-image/**"
      - ".github/actions/publish-benchmarker-results/**"
      - ".github/actions/setup-benchmarker/**"
      - ".github/patches/benchmarker.patch"
      - ".github/workflows/benchmark-pg_search-benchmarker.yml"
      - "docker/Dockerfile.source"
      - "**/*.rs"
      - "**/*.toml"
      - "Cargo.lock"
  pull_request:
    types: [labeled] # Opt in on a PR with `benchmark-benchmarker` (all), `benchmark-benchmarker-hn`, or `benchmark-benchmarker-stackexchange`
  workflow_dispatch:
    inputs:
      dataset:
        description: "Which dataset(s) to benchmark: 'all', 'hn-ci', or 'stackexchange'."
        required: false
        type: string
        default: "all"
      profile:
        description: "Collect conjunction CPU profiles and per-query timings"
        type: boolean
        default: false
      score_ablation:
        description: "Compare scoring and norm-read modes on one index (requires profile)"
        type: boolean
        default: false
      layout_commit:
        description: "Optional boxed-decoder commit for the same-index layout comparison"
        type: string
        default: ""
      commit:
        description: "pg_search commit/ref to benchmark. Defaults to the triggering ref (main on a manual run)."
        required: false
        default: ""
      benchmarker_hn_ref:
        description: "benchmarker repo ref for hn-ci (branch/tag/SHA)."
        required: false
        default: "main"
      benchmarker_stackexchange_repo:
        description: "benchmarker repo to clone for stackexchange."
        required: false
        default: "planetscale/paradedb-benchmarker"
      benchmarker_stackexchange_ref:
        description: "benchmarker repo ref for stackexchange (branch/tag/SHA)."
        required: false
        default: "datasets"
      base_paradedb_image:
        description: "Released ParadeDB image whose pg_search is overwritten with the source build. Defaults to the rolling latest-pg18 tag."
        required: false
        default: "paradedb/paradedb:latest-pg18"

permissions:
  contents: write # github-action-benchmark pushes to the gh-pages branch
  pull-requests: write # comment benchmark alerts on PRs

# No concurrency group: let every run complete and append to gh-pages history.

jobs:
  benchmark-hn:
    name: Benchmarker (hn-ci)
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl # We use metal instances for benchmarks to keep variance low
      - image=ubuntu26-full-arm64
      - extras=s3-cache # S3-backed cache; https://runs-on.com/caching/magic-cache/
      # No EBS volume: on-machine NVMe avoids run-to-run variance.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.dataset == 'all' || inputs.dataset == 'hn-ci' || inputs.dataset == '')) ||
      (github.event_name == 'pull_request' && (github.event.label.name == 'benchmark-benchmarker' || github.event.label.name == 'benchmark-benchmarker-hn'))
    env:
      DATASET: hn-ci
      DATASET_S3: s3://paradedb-benchmarker/datasets/hn-ci.tar.gz
      IMAGE_TAG: paradedb-source:ci

    steps:
      # The label triggers this run; remove it so it can be re-applied to re-run.
      - name: Maybe Remove Label
        if: github.event_name == 'pull_request' && (github.event.label.name == 'benchmark-benchmarker' || github.event.label.name == 'benchmark-benchmarker-hn')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --remove-label benchmark-benchmarker \
            --remove-label benchmark-benchmarker-hn || true

      - name: Determine Ref to Benchmark
        id: determine-ref
        env:
          INPUTS_COMMIT: ${{ inputs.commit }}
        run: |
          # workflow_dispatch `commit` wins; otherwise github.sha (the PR merge
          # commit, or the commit pushed to main).
          if [ -n "${INPUTS_COMMIT}" ]; then
            echo "ref=${INPUTS_COMMIT}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Workflow
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build ParadeDB Image
        id: build_image
        uses: ./.github/actions/build-paradedb-image
        with:
          ref: ${{ steps.determine-ref.outputs.ref }}
          base_image: ${{ inputs.base_paradedb_image || 'paradedb/paradedb:latest-pg18' }}
          image_tag: ${{ env.IMAGE_TAG }}

      - name: Set Up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          repository: paradedb/benchmarker
          ref: ${{ inputs.benchmarker_hn_ref || 'main' }}

      - name: Pull ${{ env.DATASET }} dataset (public S3, anonymous)
        working-directory: benchmarker
        run: ./bin/loader pull --dataset "${DATASET}" --anonymous --source "${DATASET_S3}"

      - name: Start database
        working-directory: benchmarker/datasets/${{ env.DATASET }}
        env:
          PARADEDB_IMAGE: ${{ env.IMAGE_TAG }}
          COMPOSE_PROFILES: paradedb
        run: docker compose up -d --wait

      - name: Load data (paradedb)
        working-directory: benchmarker
        run: ./bin/loader load --backend paradedb "./datasets/${DATASET}"

      - name: Restart database for a clean start
        working-directory: benchmarker/datasets/${{ env.DATASET }}
        env:
          PARADEDB_IMAGE: ${{ env.IMAGE_TAG }}
          COMPOSE_PROFILES: paradedb
        run: |
          docker restart paradedb
          docker compose up -d --wait

      - name: Run k6 scripts
        working-directory: benchmarker
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.build_image.outputs.short_commit }}","ref":"${{ steps.determine-ref.outputs.ref }}","image":"${{ env.IMAGE_TAG }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="$PWD"
          mkdir -p results
          scripts=("$root/datasets/${DATASET}/k6/"*.js)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No k6 scripts found under datasets/${DATASET}/k6/" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            name="$(basename "$script" .js)"
            # Warm-up pass (discarded) fills page cache + shared_buffers; the
            # second pass is the measured, exported one.
            echo "== warming ${name} (discarded) =="
            ( cd "$root/results" && taskset -c 5-7 "$root/k6" run "$script" >/dev/null )
            echo "== measuring ${name} =="
            ( cd "$root/results" && taskset -c 5-7 "$root/k6" run --out dashboard=json,html "$script" )
            mv "$(ls -t "$root"/results/dashboard_*.json | head -1)" "$root/results/${name}.json"
            mv "$(ls -t "$root"/results/dashboard_*.html | head -1)" "$root/results/${name}.html"
          done

      - name: Dump database logs on failure
        if: failure() || cancelled()
        run: |
          echo "== Docker containers =="
          docker ps -a || true
          echo "== ParadeDB container logs =="
          docker logs --tail 200 $(docker ps -aq --filter "name=paradedb") || true
          echo "== Kernel dmesg (OOM / Segfault) =="
          sudo dmesg -T | grep -i -E 'killed process|oom|segfault|out of memory' | tail -n 50 || true

      - name: Publish Benchmarker Results
        if: success()
        uses: ./.github/actions/publish-benchmarker-results
        with:
          dataset: ${{ env.DATASET }}
          short_commit: ${{ steps.build_image.outputs.short_commit }}
          ref: ${{ steps.determine-ref.outputs.ref }}
          image_tag: ${{ env.IMAGE_TAG }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          auto_push: ${{ github.ref == 'refs/heads/main' }}

  benchmark-stackexchange:
    name: Benchmarker (stackexchange)
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl # We use metal instances for benchmarks to keep variance low
      - image=ubuntu26-full-arm64
      - extras=s3-cache # S3-backed cache; https://runs-on.com/caching/magic-cache/
      # No EBS volume: on-machine NVMe avoids run-to-run variance.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.dataset == 'all' || inputs.dataset == 'stackexchange' || inputs.dataset == '')) ||
      (github.event_name == 'pull_request' && (github.event.label.name == 'benchmark-benchmarker' || github.event.label.name == 'benchmark-benchmarker-stackexchange'))
    env:
      DATASET: stackexchange
      BACKREST_REPO_BUCKET: paradedb-ci-benchmarks
      SNAPSHOT_PREFIX: snapshots/benchmarker
      IMAGE_TAG: paradedb-source:ci

    steps:
      - name: Initialize Environment
        run: echo "VOLUME_ROOT=${RUNNER_TEMP}/volumes" >> "$GITHUB_ENV"

      # The label triggers this run; remove it so it can be re-applied to re-run.
      - name: Maybe Remove Label
        if: github.event_name == 'pull_request' && (github.event.label.name == 'benchmark-benchmarker' || github.event.label.name == 'benchmark-benchmarker-stackexchange')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --remove-label benchmark-benchmarker \
            --remove-label benchmark-benchmarker-stackexchange || true

      - name: Determine Ref to Benchmark
        id: determine-ref
        env:
          INPUTS_COMMIT: ${{ inputs.commit }}
        run: |
          # workflow_dispatch `commit` wins; otherwise github.sha (the PR merge
          # commit, or the commit pushed to main).
          if [ -n "${INPUTS_COMMIT}" ]; then
            echo "ref=${INPUTS_COMMIT}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Workflow
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install profiling tools
        if: inputs.profile
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-perf python3-venv python3-psycopg
          perf_bin=$(command -v perf)
          test -x "$perf_bin"
          "$perf_bin" --version
          echo "PERF_BIN=$perf_bin" >> "$GITHUB_ENV"
          sudo sysctl kernel.perf_event_paranoid=-1
          sudo "$perf_bin" stat -e cpu-clock -- sleep 0.1
          sample_event=""
          for event in cycles:u cpu-clock task-clock cycles; do
            if sudo "$perf_bin" record -a -C 0 -e "$event" -F 99 --call-graph dwarf,16384 \
              -o "$RUNNER_TEMP/perf-preflight.data" -- taskset -c 0 python3 -c 'sum(range(50000000))'; then
              sudo "$perf_bin" script -i "$RUNNER_TEMP/perf-preflight.data" -F ip > "$RUNNER_TEMP/perf-preflight.samples"
              if [ -s "$RUNNER_TEMP/perf-preflight.samples" ]; then
                sample_event="$event"
                break
              fi
            fi
          done
          test -n "$sample_event"
          echo "PERF_EVENT=$sample_event" >> "$GITHUB_ENV"
          echo "Verified sampling event: $sample_event"
          sudo "$perf_bin" report -i "$RUNNER_TEMP/perf-preflight.data" --stdio --inline \
            --no-children --percent-limit 0.1 -g none
          python3 -m venv --system-site-packages "$RUNNER_TEMP/profile-venv"
          "$RUNNER_TEMP/profile-venv/bin/python" -c 'import psycopg; print(psycopg.__version__)'

      - name: Build ParadeDB Image
        id: build_image
        uses: ./.github/actions/build-paradedb-image
        with:
          ref: ${{ steps.determine-ref.outputs.ref }}
          base_image: ${{ inputs.base_paradedb_image || 'paradedb/paradedb:latest-pg18' }}
          image_tag: ${{ env.IMAGE_TAG }}
          build_profile: ${{ inputs.profile && 'release-with-debug' || 'release' }}
          cache_scope: ${{ inputs.profile && 'bp128-profile-pg18-arm64' || 'benchmarker-source-pg18-arm64' }}

      - name: Build boxed-decoder image
        if: inputs.score_ablation && inputs.layout_commit != ''
        uses: ./.github/actions/build-paradedb-image
        with:
          ref: ${{ inputs.layout_commit }}
          base_image: ${{ inputs.base_paradedb_image }}
          image_tag: paradedb-boxed:ci
          build_profile: release-with-debug
          cache_scope: bp128-boxed-pg18-arm64

      - name: Smoke test norm modes
        if: inputs.score_ablation
        env:
          LAYOUT_COMMIT: ${{ inputs.layout_commit }}
        run: |
          set -euo pipefail
          images=("$IMAGE_TAG")
          if [ -n "$LAYOUT_COMMIT" ]; then images+=(paradedb-boxed:ci); fi
          trap 'docker rm -f bp128-smoke >/dev/null 2>&1 || true' EXIT
          for image in "${images[@]}"; do
            modes=(full quantized legacy bounded)
            if [ "$image" = paradedb-boxed:ci ]; then modes+=(fieldnorms); fi
            for mode in "${modes[@]}"; do
              echo "Checking image=$image mode=$mode"
              docker run -d --name bp128-smoke -e POSTGRES_PASSWORD=postgres \
                -e POSTGRES_DB=benchmark -e TANTIVY_BP128_MODE="$mode" "$image"
              for attempt in $(seq 1 60); do
                if docker exec bp128-smoke pg_isready -h 127.0.0.1 -U postgres -d benchmark; then break; fi
                sleep 1
              done
              docker exec -i -e PGPASSWORD=postgres bp128-smoke psql -X -h 127.0.0.1 -U postgres -d benchmark \
                -v ON_ERROR_STOP=1 < .github/scripts/bp128_smoke.sql
              docker rm -f bp128-smoke
            done
          done

      - name: Set Up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          repository: ${{ inputs.benchmarker_stackexchange_repo || 'planetscale/paradedb-benchmarker' }}
          ref: ${{ inputs.benchmarker_stackexchange_ref || 'datasets' }}
          patch_file: .github/patches/benchmarker.patch
          lfs: "false"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Restore ${{ env.DATASET }} Heap Snapshot
        run: |
          set -euo pipefail
          mkdir -p "${VOLUME_ROOT}"
          s3_src="s3://${BACKREST_REPO_BUCKET}/${SNAPSHOT_PREFIX}/${DATASET}/heap.tar.zst"
          echo "Downloading heap snapshot from ${s3_src}..."
          aws s3 cp "${s3_src}" "${RUNNER_TEMP}/heap.tar.zst"

          target_dir="${VOLUME_ROOT}/bench-datasets-${DATASET}/paradedb"
          mkdir -p "${target_dir}"
          echo "Extracting heap to ${target_dir}..."
          sudo tar -I zstd -xf "${RUNNER_TEMP}/heap.tar.zst" -C "${target_dir}"
          rm -f "${RUNNER_TEMP}/heap.tar.zst"

      - name: Build index with ${{ env.IMAGE_TAG }}
        working-directory: benchmarker
        run: |
          set -euo pipefail
          make -f Makefile.${DATASET} index \
            BACKENDS=paradedb \
            PARADEDB_IMAGE="${IMAGE_TAG}" \
            VOLUME_ROOT="${VOLUME_ROOT}" \
            MEMORY=64g

      - name: Run benchmark
        if: ${{ !inputs.profile }}
        working-directory: benchmarker
        env:
          BENCHMARKER_META: >-
            {"commit":"${{ steps.build_image.outputs.short_commit }}","ref":"${{ steps.determine-ref.outputs.ref }}","image":"${{ env.IMAGE_TAG }}"}
          POSTGRES_CPUSET: "0-7"
        run: |
          set -euo pipefail
          mkdir -p results

          topk_styles=(conjunction disjunction phrase mixed)
          for style in "${topk_styles[@]}"; do
            echo "== Running workload=topk query_style=${style} =="
            taskset -c 8-11 make -f Makefile.${DATASET} run \
              BACKENDS=paradedb \
              WORKLOAD=topk \
              QUERY_STYLE="${style}" \
              VUS=1 \
              PREWARM=30s \
              DURATION=300s \
              OUTPUT=json,html \
              OUT_DIR="${PWD}/results" \
              PARADEDB_IMAGE="${IMAGE_TAG}" \
              VOLUME_ROOT="${VOLUME_ROOT}"
          done

          echo "== Running workload=count query_style=mixed =="
          taskset -c 8-11 make -f Makefile.${DATASET} run \
            BACKENDS=paradedb \
            WORKLOAD=count \
            QUERY_STYLE=mixed \
            VUS=1 \
            PREWARM=30s \
            DURATION=300s \
            OUTPUT=json,html \
            OUT_DIR="${PWD}/results" \
            PARADEDB_IMAGE="${IMAGE_TAG}" \
            VOLUME_ROOT="${VOLUME_ROOT}"

      - name: Prepare conjunction requests
        if: inputs.profile
        working-directory: benchmarker
        run: |
          mkdir -p results/profiles
          cp benchmarks/queries.js results/profiles/queries.mjs
          node --input-type=module <<'JS' > results/profiles/requests.json
          import fs from 'node:fs';
          import {selectQueries, buildRequest} from './results/profiles/queries.mjs';
          const pool = JSON.parse(fs.readFileSync('datasets/stackexchange/queries.json'));
          console.log(JSON.stringify(selectQueries(pool, 'conjunction', 1592614637).map(entry => ({
            id: entry.record.source_id, request: buildRequest('paradedb', 'topk', entry, 10)
          }))));
          JS

      - name: Profile conjunction queries
        if: inputs.profile && !inputs.score_ablation
        working-directory: benchmarker
        env:
          POSTGRES_CPUSET: "0-7"
          PROFILE_COMMIT: ${{ steps.determine-ref.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p results/profiles
          taskset -c 8-11 make -f Makefile.stackexchange run \
            BACKENDS=paradedb WORKLOAD=topk QUERY_STYLE=conjunction VUS=1 \
            PREWARM=30s DURATION=300s OUTPUT=json,html OUT_DIR="$PWD/results" \
            PARADEDB_IMAGE="$IMAGE_TAG" VOLUME_ROOT="$VOLUME_ROOT"
          container=$(docker ps -aq --filter label=io.benchmarker.project=bench-datasets-stackexchange)
          test "$(wc -w <<< "$container")" -eq 1
          docker start "$container"
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U postgres -d benchmark; then break; fi
            sleep 2
          done
          symfs="$RUNNER_TEMP/profile-symbols"
          mkdir -p "$symfs/usr/lib/postgresql/18/lib" "$symfs/usr/lib/postgresql/18/bin"
          docker cp "$container:/usr/lib/postgresql/18/lib/pg_search.so" "$symfs/usr/lib/postgresql/18/lib/"
          docker cp "$container:/usr/lib/postgresql/18/bin/postgres" "$symfs/usr/lib/postgresql/18/bin/"
          sha256sum "$symfs/usr/lib/postgresql/18/lib/pg_search.so" > results/profiles/library.sha256
          taskset -c 8-11 "$RUNNER_TEMP/profile-venv/bin/python" ../.github/scripts/bp128_profile.py results/profiles
          for data in results/profiles/*.data; do
            sudo "$PERF_BIN" report -i "$data" --symfs "$symfs" --stdio --no-children \
              --inline --percent-limit 0.1 -g none > "$data.self.txt"
            sudo "$PERF_BIN" report -i "$data" --symfs "$symfs" --stdio --children \
              --inline --percent-limit 0.5 -g graph,0.5,caller > "$data.stacks.txt"
          done
          sudo chown -R "$USER" results
          docker stop "$container"

      - name: Compare modes on the same index
        if: inputs.profile && inputs.score_ablation
        working-directory: benchmarker
        env:
          POSTGRES_CPUSET: "0-7"
          PROFILE_COMMIT: ${{ steps.determine-ref.outputs.ref }}
          LAYOUT_COMMIT: ${{ inputs.layout_commit }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('benchmarks/compose.yml')
          source = path.read_text()
          anchor = '    POSTGRES_DB: benchmark\n'
          assert source.count(anchor) == 1
          path.write_text(source.replace(anchor, anchor + '    TANTIVY_BP128_MODE: ${TANTIVY_BP128_MODE:-full}\n'))
          PY
          labels=(full-before quantized legacy bounded full-after)
          if [ -n "$LAYOUT_COMMIT" ]; then labels=(full-before bounded boxed-full boxed-fieldnorms full-after); fi
          for label in "${labels[@]}"; do
            export TANTIVY_BP128_MODE="${label%%-*}"
            pass_image="$IMAGE_TAG"
            export PROFILE_COMMIT="${{ steps.determine-ref.outputs.ref }}"
            if [[ "$label" == boxed-* ]]; then
              export TANTIVY_BP128_MODE="${label#boxed-}"
              pass_image=paradedb-boxed:ci
              export PROFILE_COMMIT="$LAYOUT_COMMIT"
            fi
            out="$PWD/results/$label"
            mkdir -p "$out"
            cp results/profiles/requests.json "$out/requests.json"
            taskset -c 8-11 make -f Makefile.stackexchange run \
              BACKENDS=paradedb WORKLOAD=topk QUERY_STYLE=conjunction VUS=1 \
              PREWARM=30s DURATION=60s OUTPUT=json,html OUT_DIR="$out" \
              PARADEDB_IMAGE="$pass_image" VOLUME_ROOT="$VOLUME_ROOT"
            container=$(docker ps -aq --filter label=io.benchmarker.project=bench-datasets-stackexchange)
            test "$(wc -w <<< "$container")" -eq 1
            docker start "$container"
            for attempt in $(seq 1 60); do
              if docker exec "$container" pg_isready -U postgres -d benchmark; then break; fi
              sleep 2
            done
            test "$(docker exec "$container" printenv TANTIVY_BP128_MODE)" = "$TANTIVY_BP128_MODE"
            docker exec "$container" sha256sum /usr/lib/postgresql/18/lib/pg_search.so > "$out/library.sha256"
            taskset -c 8-11 "$RUNNER_TEMP/profile-venv/bin/python" ../.github/scripts/bp128_profile.py "$out" --timings-only
            export PROFILE_BASE_TIMINGS="$PWD/results/full-before/timings.json"
            docker stop "$container"
          done
          python3 <<'PY'
          import json
          from pathlib import Path
          roots = sorted(path.parent for path in Path('results').glob('*/metadata.json'))
          reference = json.loads(Path('results/full-before/metadata.json').read_text())
          library_hash = Path('results/full-before/library.sha256').read_text()
          for root in roots:
              current = json.loads((root / 'metadata.json').read_text())
              assert current['index_bytes'] == reference['index_bytes'], root
              assert sorted(current['segments']) == sorted(reference['segments']), root
              assert current['settings'] == reference['settings'], root
              if not root.name.startswith('boxed-'):
                  assert (root / 'library.sha256').read_text() == library_hash, root
          if Path('results/boxed-full').exists():
              assert Path('results/boxed-full/library.sha256').read_text() == Path('results/boxed-fieldnorms/library.sha256').read_text()
          print('Verified identical index layout, index size and PostgreSQL settings across all passes; binary hashes match within each variant')
          PY

      - name: Upload profiles
        if: always() && inputs.profile
        uses: actions/upload-artifact@v7
        with:
          name: bp128-profiles-${{ steps.build_image.outputs.short_commit }}
          path: benchmarker/results
          retention-days: 7

      - name: Dump database logs on failure
        if: failure() || cancelled()
        run: |
          echo "== Docker containers =="
          docker ps -a || true
          echo "== ParadeDB container logs =="
          docker logs --tail 200 $(docker ps -aq --filter "name=paradedb") || true
          echo "== Kernel dmesg (OOM / Segfault) =="
          sudo dmesg -T | grep -i -E 'killed process|oom|segfault|out of memory' | tail -n 50 || true

      - name: Publish Benchmarker Results
        if: success() && !inputs.profile
        uses: ./.github/actions/publish-benchmarker-results
        with:
          dataset: ${{ env.DATASET }}
          short_commit: ${{ steps.build_image.outputs.short_commit }}
          ref: ${{ steps.determine-ref.outputs.ref }}
          image_tag: ${{ env.IMAGE_TAG }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          auto_push: ${{ github.ref == 'refs/heads/main' }}

  notify-slack-on-failure:
    name: Notify Slack on Failure
    needs: [benchmark-hn, benchmark-stackexchange]
    if: always() && (needs.benchmark-hn.result == 'failure' || needs.benchmark-stackexchange.result == 'failure') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - name: Notify Slack on Failure (push only)
        uses: paradedb/actions/slack-alert@v14
        with:
          suppress_spot_retries: "true" # Defer Slack alerts while RunsOn retries Spot interruptions
          job_results: ${{ toJSON(needs) }}
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
