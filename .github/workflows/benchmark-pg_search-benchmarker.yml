name: Diagnose PR 6580 conjunctions on shared indexes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossover:
    name: Index built by ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        builder: [baseline, candidate]
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache
    timeout-minutes: 150
    env:
      BASELINE: 6f4f4cb031da12263adc1c210ce7ada6d3435f1e
      CANDIDATE: a3ffa2bfec51578d54bd4107e5148788d191ee0a
      BASE_IMAGE: paradedb/paradedb:latest-pg18@sha256:a9cbdcfd8a1c349ab21590fd6d6dcbe7da489878df6502922d032dd64c1a7ae7
      POSTGRES_CPUSET: "0-7"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize environment
        run: echo "VOLUME_ROOT=${RUNNER_TEMP}/volumes" >> "$GITHUB_ENV"
      - name: Build baseline
        uses: ./.github/actions/build-paradedb-image
        with:
          ref: ${{ env.BASELINE }}
          base_image: ${{ env.BASE_IMAGE }}
          image_tag: paradedb-crossover:baseline
          cache_scope: benchmarker-source-pg18-arm64
      - name: Build candidate
        uses: ./.github/actions/build-paradedb-image
        with:
          ref: ${{ env.CANDIDATE }}
          base_image: ${{ env.BASE_IMAGE }}
          image_tag: paradedb-crossover:candidate
          cache_scope: benchmarker-crossover-6580-arm64
      - name: Set up pinned benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          repository: planetscale/paradedb-benchmarker
          ref: f487fbaaf5039a7b92e1de4efb40e0f7c6fcdb86
          patch_file: .github/patches/benchmarker.patch
          lfs: "false"
      - name: Add post-measurement diagnostics
        working-directory: benchmarker
        run: python3 ../.github/diagnostics/conjunction-6580/capture.py
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Restore heap snapshot
        run: |
          set -euo pipefail
          target_dir="${VOLUME_ROOT}/bench-datasets-stackexchange/paradedb"
          mkdir -p "${target_dir}"
          aws s3 cp s3://paradedb-ci-benchmarks/snapshots/benchmarker/stackexchange/heap.tar.zst "${RUNNER_TEMP}/heap.tar.zst"
          sudo tar -I zstd -xf "${RUNNER_TEMP}/heap.tar.zst" -C "${target_dir}"
          rm -f "${RUNNER_TEMP}/heap.tar.zst"
      - name: Build index once
        working-directory: benchmarker
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          make -f Makefile.stackexchange index BACKENDS=paradedb \
            PARADEDB_IMAGE="paradedb-crossover:${BUILDER}" \
            VOLUME_ROOT="${VOLUME_ROOT}" MEMORY=64g
          mkdir -p results
          docker image inspect paradedb-crossover:baseline paradedb-crossover:candidate > results/images.json
      - name: Crossover pass 1
        working-directory: benchmarker
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          variants=(baseline candidate candidate baseline)
          if [[ "${BUILDER}" == candidate ]]; then variants=(candidate baseline baseline candidate); fi
          variant="${variants[0]}"
          if [[ "${variant}" == baseline ]]; then ref="${BASELINE}"; else ref="${CANDIDATE}"; fi
          export BENCHMARKER_META="{\"commit\":\"${ref:0:7}\",\"ref\":\"${ref}\",\"builder\":\"${BUILDER}\",\"pass\":1}"
          taskset -c 8-11 make -f Makefile.stackexchange run \
            BACKENDS=paradedb WORKLOAD=topk QUERY_STYLE=conjunction \
            VUS=1 PREWARM=90s DURATION=180s OUTPUT=json,html \
            OUT_DIR="${PWD}/results/1-${variant}" \
            PARADEDB_IMAGE="paradedb-crossover:${variant}" VOLUME_ROOT="${VOLUME_ROOT}"
      - name: Upload pass 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conjunction-${{ matrix.builder }}-1
          path: benchmarker/results/1-*/
      - name: Crossover pass 2
        working-directory: benchmarker
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          variants=(baseline candidate candidate baseline)
          if [[ "${BUILDER}" == candidate ]]; then variants=(candidate baseline baseline candidate); fi
          variant="${variants[1]}"
          if [[ "${variant}" == baseline ]]; then ref="${BASELINE}"; else ref="${CANDIDATE}"; fi
          export BENCHMARKER_META="{\"commit\":\"${ref:0:7}\",\"ref\":\"${ref}\",\"builder\":\"${BUILDER}\",\"pass\":2}"
          taskset -c 8-11 make -f Makefile.stackexchange run \
            BACKENDS=paradedb WORKLOAD=topk QUERY_STYLE=conjunction \
            VUS=1 PREWARM=90s DURATION=180s OUTPUT=json,html \
            OUT_DIR="${PWD}/results/2-${variant}" \
            PARADEDB_IMAGE="paradedb-crossover:${variant}" VOLUME_ROOT="${VOLUME_ROOT}"
      - name: Upload pass 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conjunction-${{ matrix.builder }}-2
          path: benchmarker/results/2-*/
      - name: Crossover pass 3
        working-directory: benchmarker
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          variants=(baseline candidate candidate baseline)
          if [[ "${BUILDER}" == candidate ]]; then variants=(candidate baseline baseline candidate); fi
          variant="${variants[2]}"
          if [[ "${variant}" == baseline ]]; then ref="${BASELINE}"; else ref="${CANDIDATE}"; fi
          export BENCHMARKER_META="{\"commit\":\"${ref:0:7}\",\"ref\":\"${ref}\",\"builder\":\"${BUILDER}\",\"pass\":3}"
          taskset -c 8-11 make -f Makefile.stackexchange run \
            BACKENDS=paradedb WORKLOAD=topk QUERY_STYLE=conjunction \
            VUS=1 PREWARM=90s DURATION=180s OUTPUT=json,html \
            OUT_DIR="${PWD}/results/3-${variant}" \
            PARADEDB_IMAGE="paradedb-crossover:${variant}" VOLUME_ROOT="${VOLUME_ROOT}"
      - name: Upload pass 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conjunction-${{ matrix.builder }}-3
          path: benchmarker/results/3-*/
      - name: Crossover pass 4
        working-directory: benchmarker
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          variants=(baseline candidate candidate baseline)
          if [[ "${BUILDER}" == candidate ]]; then variants=(candidate baseline baseline candidate); fi
          variant="${variants[3]}"
          if [[ "${variant}" == baseline ]]; then ref="${BASELINE}"; else ref="${CANDIDATE}"; fi
          export BENCHMARKER_META="{\"commit\":\"${ref:0:7}\",\"ref\":\"${ref}\",\"builder\":\"${BUILDER}\",\"pass\":4}"
          taskset -c 8-11 make -f Makefile.stackexchange run \
            BACKENDS=paradedb WORKLOAD=topk QUERY_STYLE=conjunction \
            VUS=1 PREWARM=90s DURATION=180s OUTPUT=json,html \
            OUT_DIR="${PWD}/results/4-${variant}" \
            PARADEDB_IMAGE="paradedb-crossover:${variant}" VOLUME_ROOT="${VOLUME_ROOT}"
      - name: Upload pass 4
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conjunction-${{ matrix.builder }}-4
          path: benchmarker/results/4-*/
      - name: Upload image identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conjunction-${{ matrix.builder }}-images
          path: benchmarker/results/images.json
      - name: Dump failure logs
        if: failure()
        run: |
          docker ps -a
          for container in $(docker ps -aq --filter label=com.docker.compose.service=paradedb); do
            docker logs --tail 100 "${container}"
          done
