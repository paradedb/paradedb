name: Benchmark pg_search (Benchmarker)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Wikipedia OR plan diagnostics
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-paradedb-image
        with:
          ref: bfdc35755517d17c0fd136490c2d88cbed9dbc05
          image_tag: bitmap-main:diagnostics
      - uses: ./.github/actions/build-paradedb-image
        with:
          ref: e049dbae43a62dd80baaf18904b54e033488e82c
          image_tag: two-term:diagnostics
      - uses: ./.github/actions/setup-benchmarker
        with:
          ref: 8e48aa849bec45df13a3d3f4da0e78e95e891dbd
      - name: Pull Wikipedia config
        working-directory: benchmarker
        run: ./bin/loader pull --dataset _ci_config --anonymous --source s3://paradedb-benchmarker/datasets/wikipedia/ --exclude data.csv.gz
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Restore Wikipedia heap
        run: |
          set -euo pipefail
          echo "VOLUME_ROOT=${RUNNER_TEMP}/volumes" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/volumes/paradedb" results
          aws s3 cp s3://paradedb-ci-benchmarks/snapshots/benchmarker/wikipedia/heap.tar.zst "${RUNNER_TEMP}/heap.tar.zst"
          sudo tar -I zstd -xf "${RUNNER_TEMP}/heap.tar.zst" -C "${RUNNER_TEMP}/volumes/paradedb"
          rm "${RUNNER_TEMP}/heap.tar.zst"
      - name: Compare both binaries on both index builds
        env:
          POSTGRES_CPUSET: "0-7"
          MEMORY: 64g
          EFFECTIVE_CACHE_SIZE: 48GB
          PARADEDB_CONTAINER: paradedb
        run: |
          set -euo pipefail
          root="$PWD"
          export PARADEDB_DATA_DIR="${VOLUME_ROOT}/paradedb"
          cd benchmarker/datasets/_ci_config
          for index_binary in bitmap-main two-term; do
            export PARADEDB_IMAGE="${index_binary}:diagnostics"
            docker compose up -d --wait --wait-timeout 300 paradedb
            docker compose exec -T paradedb psql -X -U postgres -d benchmark -v ON_ERROR_STOP=1 -c "DROP EXTENSION IF EXISTS pg_search CASCADE; CREATE EXTENSION pg_search CASCADE;"
            docker compose exec -T paradedb psql -X -U postgres -d benchmark -v ON_ERROR_STOP=1 < paradedb/post.sql
            docker compose stop paradedb
            for query_binary in bitmap-main two-term; do
              export PARADEDB_IMAGE="${query_binary}:diagnostics"
              docker compose up -d --wait --wait-timeout 300 paradedb
              phase="index-${index_binary}_query-${query_binary}"
              taskset -c 8-11 python3 "$root/.github/scripts/diagnose_wikipedia_plans.py" k6/queries.json "$root/results/${phase}"
              for mode in auto force_custom_plan force_generic_plan; do
                options="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote("-c plan_cache_mode="+sys.argv[1]+" -c session_preload_libraries=auto_explain -c auto_explain.log_min_duration=0 -c auto_explain.log_analyze=on -c auto_explain.log_timing=off -c auto_explain.sample_rate=0.002 -c auto_explain.log_format=json",safe=""))' "$mode")"
                (
                  cd "$root/results"
                  taskset -c 8-11 "$root/benchmarker/k6" run --out dashboard=json,html \
                    -e "PARADEDB_URL=postgres://postgres:postgres@127.0.0.1:5432/benchmark?options=${options}" \
                    -e PARADEDB_CONTAINER=paradedb -e WORKLOAD=topk -e QUERY_STYLE=disjunction \
                    -e VUS=1 -e WARMUP_SECONDS=5 -e DURATION_SECONDS=30 \
                    "$root/benchmarker/datasets/_ci_config/k6/search.js" > "${phase}-${mode}.log" 2>&1
                  mv dashboard_*.json "${phase}-${mode}.json"
                  mv dashboard_*.html "${phase}-${mode}.html"
                )
              done
              docker logs paradedb > "$root/results/${phase}-postgres.log" 2>&1
              docker compose stop paradedb
            done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wikipedia-or-plan-diagnostics
          path: results/
