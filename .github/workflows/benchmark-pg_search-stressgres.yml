# workflows/benchmark-pg_search-stressgres.yml
#
# Benchmark pg_search (Stressgres)
# Run our Stressgres stress testing tool against pg_search on the
# testing suites specified in stressgres/suites/.

name: Diagnose mutable cache regressions

# Run Stressgres nightly on main, on labeled PRs, or manually.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "A specific commit hash or tag to benchmark. Uses `main` if not specified."
        required: false
        default: ""
      use_benchmarks_from_ref:
        description: "Whether to use benchmark code from the specified commit instead of main. Actions always come from this workflow."
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: write

# Benchmark jobs run in parallel. Publication jobs use the shared gh-pages queue.

jobs:
  benchmark-pg_search-stressgres:
    name: Diagnose (${{ matrix.suite }}, cache=${{ matrix.cache_mode }})
    strategy:
      fail-fast: false
      max-parallel: 2 # Avoid exhausting regional capacity for the large bare-metal benchmark runners
      matrix:
        suite:
          - logical-replication-multi-subscriber.toml
        cache_mode: ["on"]
    runs-on:
      # To configure the runners: https://runs-on.com/configuration/job-labels/#how-it-works (runs in us-east-1)
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl # We use metal instances for benchmarks to keep variance low
      - image=ubuntu26-full-arm64
      - extras=s3-cache # See https://runs-on.com/caching/magic-cache/
      # We deliberately do not enable EBS and instead rely on the on-machine NVMe drives to avoid the variance
      # using EBS would cause
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'benchmarks') || (github.event_name == 'pull_request' && github.event.label.name == 'benchmark-stressgres')
    env:
      pg_version: 18
      CACHE_MODE: ${{ matrix.cache_mode }}
      POST_CLEANUP: "off"

    steps:
      # The job can be triggered manually by attaching the `benchmarks` label to a PR. This step
      # removes the label once the job has started, so it can be applied again if needed.
      - name: Maybe Remove Label
        if: github.event_name == 'pull_request' && (github.event.label.name == 'benchmarks' || github.event.label.name == 'benchmark-stressgres')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --remove-label benchmarks \
            --remove-label benchmark-stressgres || true

      - name: Determine Ref to Benchmark
        id: determine-ref
        env:
          INPUTS_COMMIT: ${{ inputs.commit }}
        run: |
          # If a specific commit was provided via workflow_dispatch, use that.
          # For pull_request events, benchmark the PR merge commit (github.sha),
          # which exists in the base repo even for forks.
          # Otherwise, default to main.
          if [ -n "${INPUTS_COMMIT}" ]; then
            echo "ref=${INPUTS_COMMIT}" >> "$GITHUB_OUTPUT"
            echo "Determined ref from workflow_dispatch input: ${INPUTS_COMMIT}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Determined ref from pull_request event: ${GITHUB_SHA}"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Determined ref as default: main"
          fi

      # Keep workflow actions separate from the source commit being benchmarked
      # so we can benchmark older commits with newer actions.
      - name: Checkout Workflow Actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout Source to Benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.determine-ref.outputs.ref }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve Benchmark Commit
        id: commit_info
        working-directory: source
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # With extras=s3-cache, configure RunsOn before cache or artifact operations.
      - name: Configure RunsOn Caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      - name: Fetch Latest Benchmark Code, Suites
        if: ${{ !inputs.use_benchmarks_from_ref && github.event.label.name != 'benchmarks' && github.event.label.name != 'benchmark-stressgres' }}
        uses: ./.github/actions/benchmarks-from-main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          source_directory: source

      - name: Resolve Git Ref to PR
        id: pr_label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # ← Set this to whatever ref you’re resolving:
          # • a SHA:            ${{ github.sha }}
          # • a branch name:    ${{ github.ref_name }}
          # • a tag:            ${{ github.ref_name }}
          # • a PR number:      e.g. “123”
          TARGET_REF: ${{ steps.commit_info.outputs.commit_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const ref = process.env.TARGET_REF;

            let pr = null;

            // If the ref is purely numeric, treat it as a PR number
            if (/^\d+$/.test(ref)) {
              try {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: parseInt(ref, 10)
                });
                pr = data;
              } catch (e) {
                // not a valid PR number → fall through
              }
            }

            // Otherwise, try to find any PR associated with this commit SHA
            if (!pr) {
              const res = await github.request(
                'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
                {
                  owner,
                  repo,
                  commit_sha: ref,
                  headers: {
                    accept: 'application/vnd.github.groot-preview+json'
                  }
                }
              );
              if (res.data.length) {
                pr = res.data[0];
              }
            }

            // Return “PR #123: Title” or the raw ref
            return pr
              ? `PR #${pr.number}: ${pr.title}`
              : ref;

      - name: Running for ${{ steps.pr_label.outputs.result }}
        env:
          STEP_PR_LABEL_RESULT: ${{ steps.pr_label.outputs.result }}
        run: echo "${STEP_PR_LABEL_RESULT}"

      - name: Set Up pg_search Build Environment
        uses: ./.github/actions/setup-pg-search-build-environment
        with:
          source_directory: source
          pg_version: ${{ env.pg_version }}
          cache_prefix_key: "v2-benchmarks-rust-cache"
          cache_save: "true"
          cache_on_failure: "true"
          extra_packages: >-
            lsof fontconfig pkg-config libfontconfig1-dev libopenblas-dev lld gdb

      - name: Enable Crash Dumps
        run: ./.github/scripts/setup_crashdumps.sh

      - name: Instrument materialization counters
        run: |
          python .github/diagnostics/instrument_cache.py
          cargo fmt --manifest-path source/Cargo.toml --all
          git -C source diff > diagnostic-source.patch

      - name: Compile and Install pg_search
        working-directory: source
        run: >-
          cargo pgrx install -p pg_search --sudo --release
          --pg-config "/usr/lib/postgresql/${{ env.pg_version }}/bin/pg_config"
          --features=pg${{ env.pg_version }} --no-default-features

      - name: Start PostgreSQL
        working-directory: source/pg_search/
        run: cargo pgrx start pg${{ env.pg_version }}

      - name: Configure PostgreSQL Settings and Machine Settings
        working-directory: /home/runner/.pgrx/data-${{ env.pg_version }}/
        run: |
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM RESET ALL;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET shared_preload_libraries = pg_search;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET maintenance_work_mem = '12GB';"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET shared_buffers = '12GB';"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET max_parallel_workers = 8;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET max_worker_processes = 8;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET max_parallel_maintenance_workers = 8;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET max_parallel_workers_per_gather = 8;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET max_wal_size = '100GB';"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET huge_pages = on;"
          sudo sysctl -w vm.nr_hugepages=10000

      - name: Restart Postgres
        working-directory: source/pg_search/
        run: |
          cargo pgrx stop pg${{ env.pg_version }}
          cargo pgrx start pg${{ env.pg_version }}

      - name: Install pg_search
        working-directory: source/pg_search/
        run: |
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "CREATE EXTENSION IF NOT EXISTS pg_search;"
          psql postgresql://localhost:288${{ env.pg_version }}/postgres -c "ALTER SYSTEM SET paradedb.global_target_segment_count = 48;";

      - name: Restart Postgres
        working-directory: source/pg_search/
        run: |
          cargo pgrx stop pg${{ env.pg_version }}
          cargo pgrx start pg${{ env.pg_version }}

      - name: Install the Stressgres CLI Tool
        working-directory: source/stressgres/
        run: CARGO_TARGET_DIR=../target/ cargo install --path .

      - name: Prepare diagnostic telemetry
        env:
          CACHE_MODE: ${{ matrix.cache_mode }}
          TEST_FILE: ${{ matrix.suite }}
        run: |
          python .github/diagnostics/prepare_suites.py
          cp "source/stressgres/suites/${TEST_FILE}" diagnostic-suite.toml
          printf '%s\n' "source=${{ steps.commit_info.outputs.commit_sha }}" "cache=${CACHE_MODE}" "suite=${TEST_FILE}" > diagnostic-metadata.txt

      - name: Benchmark ${{ matrix.suite }}
        uses: ./.github/actions/benchmark-stressgres
        with:
          source_directory: source
          test_file: ${{ matrix.suite }}
          ref: ${{ steps.commit_info.outputs.commit_sha }}

      - name: Measure quiescent allocation and page reuse
        if: env.POST_CLEANUP == 'on'
        run: python .github/diagnostics/post_cleanup.py

      - name: Upload cleanup measurements
        if: always() && env.POST_CLEANUP == 'on'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-post-cleanup-${{ github.run_attempt }}
          path: |
            post-cleanup.json
            /tmp/stressgres/PostCleanup.log
          retention-days: 14

      - name: Print Crashdump Stacktrace
        if: always()
        env:
          PG_VERSION: ${{ env.pg_version }}
        run: ./.github/scripts/render_crashdump.sh
