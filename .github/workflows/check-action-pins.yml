name: Check Action Pins

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-action-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install YAML Parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Check Action References
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_check_action_pins.py'
          python3 .github/scripts/check_action_pins.py
