# workflows/check-released-migrations.yml
#
# Check Released Migrations & Lint Migration Fragments
# Delegates SQL migration checks to `cargo pgrx migrate check` (and changelog fragment
# checks to `release.py`) via `scripts/release.sh lint-fragments`:
# 1. Fails a PR that modifies or deletes an existing `pg_search--*--*.sql` script in
#    `pg_search/sql/`. New schema changes must be added as migration fragments in
#    `pg_search/sql/unreleased/` instead -- see RELEASE.md.
# 2. Lints unreleased fragments (`pg_search/sql/unreleased/*.sql` and changelog `.mdx`):
#    - Verifies `depends-on` declarations and forbids mixing released and unreleased
#      objects (or unreleased objects from multiple prerequisites) in one fragment.
#    - On stable branches (`0.*.x`), enforces that fragments are byte-for-byte identical
#      to `origin/main` and that all `depends-on` prerequisites exist on the branch.
#    See CONTRIBUTING.md and pg_search/sql/unreleased/.gitkeep for rules.

name: Check Released Migrations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 0.*.x # Release branches
    paths:
      - ".github/scripts/**"
      - ".github/workflows/check-released-migrations.yml"
      - ".github/workflows/publish-github-release.yml"
      - "pg_search/sql/**"
      - "pg_search/Cargo.toml"
      - "Cargo.toml"
      - "rust-toolchain.toml"

permissions:
  contents: read

jobs:
  check-released-migrations:
    name: Check Released Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          rustflags: ""

      - name: Extract pgrx Version
        id: pgrx
        run: echo "version=$(sed -nE 's/^pgrx = "=?([^"]+)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache pgrx binary
        id: cache-pgrx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ steps.pgrx.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-pgrx
        if: steps.cache-pgrx.outputs.cache-hit != 'true'
        env:
          STEP_PGRX_VERSION: ${{ steps.pgrx.outputs.version }}
        run: cargo install --locked cargo-pgrx --version "$STEP_PGRX_VERSION" --debug

      - name: Test Release Scripts
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s .github/scripts

      # Enforces released-script immutability, fragment dependency rules, and
      # release-branch fragment identity against origin/main. See CONTRIBUTING.md.
      - name: Lint Migration Fragments
        run: |
          ./scripts/release.sh lint-fragments \
            --base-ref "${GITHUB_BASE_REF}" \
            --base-sha "$(git rev-parse HEAD^1)"
