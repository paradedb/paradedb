# workflows/check-released-migrations.yml
#
# Check Released Migrations & Lint Migration Fragments
# 1. Fails a PR that edits a pg_search migration script whose target version is
#    already released (a `vX.Y.Z` tag exists), since such edits never reach users
#    already on that version. New schema must go on the current upgrade path after
#    bumping the workspace version -- see RELEASE.md.
# 2. Lints unreleased migration fragments (pg_search/sql/unreleased/*.sql):
#    - PRs on main: verifies depends-on declarations and forbids mixing edits to
#      already-released objects with unreleased objects in the same fragment.
#    - PRs on stable branches (0.*.x): enforces that fragments are byte-for-byte
#      identical to origin/main and that any depends-on PRs exist in the branch history.
#    See CONTRIBUTING.md and pg_search/sql/unreleased/.gitkeep for rules.

name: Check Released Migrations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 0.*.x # Release branches
    paths:
      - "pg_search/sql/**"

permissions:
  contents: read

jobs:
  check-released-migrations:
    name: Check Released Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true # Required: the check resolves release tags locally

      - name: Reject Edits to Already-Released Migrations
        run: |
          fail=0
          for f in $(git diff --name-only --diff-filter=AMD \
              "HEAD^1...HEAD" \
              -- 'pg_search/sql/pg_search--*--*.sql'); do
            target="${f##*--}"; target="${target%.sql}"
            if git rev-parse -q --verify "refs/tags/v$target" >/dev/null; then
              echo "::error file=$f::Edits released migration (v$target is tagged). Bump workspace.package.version in Cargo.toml and add the change to a new pg_search--<released>--<next>.sql script instead. See RELEASE.md."
              fail=1
            fi
          done
          exit $fail

      # Validates fragment dependency rules and prevents fragment divergence between
      # stable release branches and main. See CONTRIBUTING.md for details.
      - name: Lint Migration Fragments
        run: |
          ./scripts/release.sh lint-fragments \
            --base-ref "${{ github.base_ref }}" \
            --base-sha "$(git rev-parse HEAD^1)"
