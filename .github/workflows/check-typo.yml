# workflows/check-typo.yml
#
# Check Typo
# Check Typo using codespell.

name: Check Typo

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: check-typo-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-typo:
    name: Check Typo using codespell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      # The `skip` parameter is a total mess, read up before adding.
      # https://github.com/codespell-project/codespell/issues/1915
      - name: Check Typo
        uses: paradedb/actions/check-typo@b7703a0b117808acb8a659ca94be8ba274344289
        with:
          ignore-words-file: .codespellignore
          skip: Cargo.lock,./tests,./pg_search/tests/pg_regress,./nix
