name: Cherry Pick

on:
  pull_request_target: # pull_request_target enables cherry-picks from forked repos
    branches:
      - main
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport (Cherry Pick)
    if: >
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'cherry-pick/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Keep the exact pin because actionlint 1.7.12 has stale @v3 metadata that rejects client-id
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1 # The backport action fetches source commits and target branches itself
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Bot Commit Signing
        uses: paradedb/actions/setup-git-signing@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          signing-key: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY }}
          signing-user: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER }}
          signing-email: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL }}

      - name: Backport based on cherry-pick/<branch> labels
        uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER }}
          git_committer_email: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL }}
          add_author_as_assignee: true
          add_author_as_reviewer: true
          add_labels: automated-cherry-pick
          pull_title: "${pull_title}"
          label_pattern: "^cherry-pick/([^ ]+)$"
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }

      - name: Remove Bot Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/github-bot-signing-key" "$RUNNER_TEMP/github-bot-signing-key.allowed-signers"
