name: Cherry Pick

on:
  pull_request_target: # pull_request_target enables cherry-picks from forked repos
    branches:
      - main
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport (Cherry Pick)
    if: >
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'cherry-pick/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Bot Commit Signing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SIGNING_KEY: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY }}
          SIGNING_USER: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER }}
          SIGNING_EMAIL: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL }}
        run: |
          : "${SIGNING_KEY:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY secret}"
          : "${SIGNING_USER:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER secret}"
          : "${SIGNING_EMAIL:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL secret}"
          umask 077
          KEY_FILE="$RUNNER_TEMP/github-bot-signing-key"
          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          PUBLIC_KEY=$(ssh-keygen -y -P '' -f "$KEY_FILE" | awk '{print $1, $2}')
          # GitHub verifies SSH signatures against the account's registered signing keys.
          gh api --paginate "users/$SIGNING_USER/ssh_signing_keys" --jq '.[] | .key | split(" ") | .[0:2] | join(" ")' |
            grep -Fx -- "$PUBLIC_KEY"
          printf '%s %s\n' "$SIGNING_EMAIL" "$PUBLIC_KEY" > "$KEY_FILE.allowed-signers"
          git config user.name "$SIGNING_USER"
          git config user.email "$SIGNING_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$KEY_FILE"
          git config gpg.ssh.allowedSignersFile "$KEY_FILE.allowed-signers"
          git config commit.gpgsign true

      - name: Backport based on cherry-pick/<branch> labels
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER }}
          git_committer_email: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL }}
          add_author_as_assignee: true
          add_author_as_reviewer: true
          add_labels: automated-cherry-pick
          pull_title: "${pull_title}"
          label_pattern: "^cherry-pick/([^ ]+)$"
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }

      - name: Remove Bot Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/github-bot-signing-key" "$RUNNER_TEMP/github-bot-signing-key.allowed-signers"
