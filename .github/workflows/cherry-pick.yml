name: Cherry Pick

on:
  pull_request_target: # pull_request_target enables cherry-picks from forked repos
    branches:
      - main
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport (Cherry Pick)
    if: >
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'cherry-pick/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Backport Signing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_USER: ${{ vars.RELEASE_SIGNING_USER }}
          RELEASE_SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
        run: |
          : "${RELEASE_SIGNING_KEY:?Set the RELEASE_SIGNING_KEY secret before backporting}"
          : "${RELEASE_SIGNING_USER:?Set the RELEASE_SIGNING_USER variable before backporting}"
          : "${RELEASE_SIGNING_EMAIL:?Set the RELEASE_SIGNING_EMAIL variable before backporting}"
          umask 077
          SIGNING_KEY="$RUNNER_TEMP/backport-signing-key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$SIGNING_KEY"
          PUBLIC_KEY=$(ssh-keygen -y -P '' -f "$SIGNING_KEY" | awk '{print $1, $2}')
          gh api --paginate "users/$RELEASE_SIGNING_USER/ssh_signing_keys" --jq '.[] | .key | split(" ") | .[0:2] | join(" ")' |
            grep -Fx -- "$PUBLIC_KEY"
          git config gpg.format ssh
          git config user.signingkey "$SIGNING_KEY"
          # The action uses both cherry-pick and commit (for draft conflicts).
          git config commit.gpgsign true

      - name: Backport based on cherry-pick/<branch> labels
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: ${{ vars.RELEASE_SIGNING_USER }}
          git_committer_email: ${{ vars.RELEASE_SIGNING_EMAIL }}
          add_author_as_assignee: true
          add_author_as_reviewer: true
          add_labels: automated-cherry-pick
          pull_title: "${pull_title}"
          label_pattern: "^cherry-pick/([^ ]+)$"
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }

      - name: Remove Backport Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/backport-signing-key"
