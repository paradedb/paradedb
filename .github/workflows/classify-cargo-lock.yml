name: Classify Cargo.lock changes

on:
  workflow_call:
    outputs:
      standalone_only:
        description: Whether the changes are isolated to standalone workspace tools
        value: ${{ jobs.classify.outputs.standalone_only }}

permissions:
  contents: read

jobs:
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      standalone_only: ${{ steps.classify.outputs.standalone_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ci_lockfile_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
