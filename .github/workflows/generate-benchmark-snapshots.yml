# workflows/generate-benchmark-snapshots.yml
#
# Generate Benchmark Heap Snapshots
#
# Stack Overflow and Cohere: native pgrx clusters backed up with pgBackRest to
# s3://paradedb-ci-benchmarks/snapshots/{dataset}/{size}/. Sampled source data must
# exist at datasets/{dataset}/sampled/{size}/{csv|parquet}/ in that bucket.
# Stack Exchange and Wikipedia: benchmarker Docker heaps archived to
# s3://paradedb-ci-benchmarks/snapshots/benchmarker/{dataset}/heap.tar.zst.
# Each path uses the same platform and format as its benchmark's restore path.

name: Generate Benchmark Snapshots

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Which dataset(s) to snapshot."
        required: false
        type: choice
        options:
          - all
          - stackoverflow
          - cohere
          - stackexchange
          - wikipedia
        default: all
      size:
        description: "Optional size for stackoverflow/cohere (e.g. 100k, 1m, 20m). Blank = all sizes. Not supported for stackexchange/wikipedia."
        required: false
        default: ""
      benchmarker_ref:
        description: "Benchmarker ref for stackexchange/wikipedia (branch/tag/SHA)."
        required: false
        default: "main"
      dataset_source:
        description: "Optional S3 prefix override. Defaults to s3://paradedb-benchmarker/datasets/<dataset>/."
        required: false
        type: string
        default: ""
      base_paradedb_image:
        description: "Released image for benchmarker heap loading."
        required: false
        default: "paradedb/paradedb:latest-pg18"

permissions:
  contents: read

jobs:
  # Build the (dataset, size) matrix from the inputs so only the selected entries run — each entry
  # does a full, expensive cluster setup, so we don't want to run ones we didn't ask for.
  prep:
    name: Resolve Snapshot Matrix
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.build.outputs.native }}
      benchmarker: ${{ steps.build.outputs.benchmarker }}
    steps:
      - name: Build matrix
        id: build
        env:
          DATASET: ${{ inputs.dataset }}
          SIZE: ${{ inputs.size }}
        run: |
          set -euo pipefail
          all='[
            {"dataset":"stackoverflow","size":"100k"},
            {"dataset":"stackoverflow","size":"1m"},
            {"dataset":"stackoverflow","size":"20m"},
            {"dataset":"cohere","size":"1m"},
            {"dataset":"cohere","size":"10m"}
          ]'
          include=$(echo "$all" | jq -c \
            --arg ds "${DATASET:-all}" --arg sz "${SIZE}" \
            '[ .[] | select(($ds=="all" or .dataset==$ds) and ($sz=="" or .size==$sz)) ]')
          echo "Selected entries: $include"
          docker=$(jq -cn --arg ds "${DATASET:-all}" --arg sz "$SIZE" \
            '["stackexchange", "wikipedia"] | map(select(($ds=="all" or .==$ds) and $sz==""))')
          if [ "$include" = '[]' ] && [ "$docker" = '[]' ]; then
            echo "No snapshot matches dataset=$DATASET size=$SIZE" >&2
            exit 1
          fi
          echo "native=$include" >> "$GITHUB_OUTPUT"
          echo "benchmarker=$docker" >> "$GITHUB_OUTPUT"

  generate:
    name: Snapshot ${{ matrix.dataset }} (${{ matrix.size }})
    needs: prep
    if: needs.prep.outputs.native != '[]'
    runs-on:
      # To configure the runners: https://runs-on.com/configuration/job-labels/#how-it-works (runs in us-east-1)
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl # We use metal instances for benchmarks to keep variance low
      - image=ubuntu26-full-arm64
      - extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.native) }}
    env:
      pg_version: 18
      BACKREST_STANZA: bench
      BACKREST_REPO_BUCKET: paradedb-ci-benchmarks
      BACKREST_REPO_PATH_PREFIX: /snapshots
      BACKREST_REPO_REGION: us-east-1
      BACKREST_REPO_ENDPOINT: s3.us-east-1.amazonaws.com
      BACKREST_REPO_S3_KEY_TYPE: shared
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set Up Benchmark Cluster
        uses: ./.github/actions/setup-benchmark-cluster
        with:
          pg_version: ${{ env.pg_version }}
          # stackoverflow's bm25 indexes set no per-index `target_segment_count`, so bake the
          # standard 48-segment operating point into its snapshot. Every other dataset keeps the
          # extension default of 0, so an index's own `target_segment_count` is honored.
          global_target_segment_count: ${{ matrix.dataset == 'stackoverflow' && '48' || '0' }}

      # Load the heap only (no index, no queries) so the cluster can be captured as a snapshot.
      - name: Load Heap
        working-directory: benchmarks/
        run: |
          set -euo pipefail
          cargo run --release -- load-heap \
            --dataset "${{ matrix.dataset }}" \
            --size "${{ matrix.size }}" \
            --url "postgresql://$(whoami)@localhost:288${{ env.pg_version }}/postgres" \
            --data-source "s3://${BACKREST_REPO_BUCKET}/datasets/${{ matrix.dataset }}"

      # Clear any pre-existing snapshot at this path. Each run inits a fresh cluster (new system
      # identifier), so a snapshot left from a prior run would conflict with pgBackRest stanza-create
      # (error 028: "info files exist but do not match the database"). Regenerating intentionally
      # replaces the old snapshot. Also aborts orphaned multipart uploads from any failed prior run.
      - name: Clear existing snapshot
        run: |
          set -euo pipefail
          prefix="${BACKREST_REPO_PATH_PREFIX#/}/${{ matrix.dataset }}/${{ matrix.size }}/"
          aws s3api list-multipart-uploads --bucket "${BACKREST_REPO_BUCKET}" --prefix "$prefix" \
            --query 'Uploads[].{Key:Key,UploadId:UploadId}' --output text 2>/dev/null \
            | while read -r key uid; do
                [ -n "$key" ] && aws s3api abort-multipart-upload --bucket "${BACKREST_REPO_BUCKET}" --key "$key" --upload-id "$uid" || true
              done
          aws s3 rm --recursive "s3://${BACKREST_REPO_BUCKET}/${prefix}"

      # Stop Postgres -- required for the --no-online cold backup.
      - name: Stop Postgres
        working-directory: pg_search/
        run: cargo pgrx stop pg${{ env.pg_version }}

      - name: Snapshot Heap
        working-directory: benchmarks/
        run: |
          set -euo pipefail
          cargo run --release -- snapshot-heap \
            --dataset "${{ matrix.dataset }}" \
            --size "${{ matrix.size }}" \
            --pgdata "/home/runner/.pgrx/data-${{ env.pg_version }}" \
            --stanza "${BACKREST_STANZA}" \
            --repo-bucket "${BACKREST_REPO_BUCKET}" \
            --repo-path-prefix "${BACKREST_REPO_PATH_PREFIX}" \
            --repo-region "${BACKREST_REPO_REGION}" \
            --repo-endpoint "${BACKREST_REPO_ENDPOINT}" \
            --repo-s3-key-type "${BACKREST_REPO_S3_KEY_TYPE}" \
            --process-max 8

  generate-benchmarker:
    name: Snapshot ${{ matrix.dataset }} (benchmarker)
    needs: prep
    if: needs.prep.outputs.benchmarker != '[]'
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.prep.outputs.benchmarker) }}
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
      - extras=s3-cache
    env:
      BACKREST_REPO_BUCKET: paradedb-ci-benchmarks
      SNAPSHOT_PREFIX: snapshots/benchmarker
      DATASET: ${{ matrix.dataset }}
      DATASET_SOURCE: ${{ inputs.dataset_source || format('s3://paradedb-benchmarker/datasets/{0}/', matrix.dataset) }}
      PARADEDB_IMAGE: ${{ inputs.base_paradedb_image || 'paradedb/paradedb:latest-pg18' }}

    steps:
      - name: Initialize Environment
        run: echo "VOLUME_ROOT=${RUNNER_TEMP}/volumes" >> "$GITHUB_ENV"

      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SUBACCOUNT_GITHUB_ACTIONS_USER_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set Up Benchmarker
        uses: ./.github/actions/setup-benchmarker
        with:
          ref: ${{ inputs.benchmarker_ref || 'main' }}

      - name: Load Heap (no index)
        working-directory: benchmarker
        env:
          PARADEDB_DATA_DIR: ${{ env.VOLUME_ROOT }}/bench-datasets-${{ env.DATASET }}/paradedb
          PARADEDB_CONTAINER: paradedb
          POSTGRES_CPUSET: "0-7"
          MEMORY: 64g
          EFFECTIVE_CACHE_SIZE: 48GB
          PARADEDB_URL: postgres://postgres:postgres@127.0.0.1:5432/benchmark
        run: |
          set -euo pipefail
          mkdir -p "${VOLUME_ROOT}"
          ./bin/loader pull \
            --dataset _snapshot_source \
            --source "${DATASET_SOURCE}"

          source_dataset="datasets/_snapshot_source"
          test -f "${source_dataset}/data.csv"
          test -f "${source_dataset}/docker-compose.yml"

          (
            cd "${source_dataset}"
            docker compose up -d --wait --wait-timeout 300 paradedb
          )
          ./bin/loader load --backend paradedb --pre-only "${source_dataset}"
          (
            cd "${source_dataset}"
            docker compose stop -t 600 paradedb
          )

      - name: Archive and Upload Heap Snapshot
        run: |
          set -euo pipefail
          pgdata_dir="${VOLUME_ROOT}/bench-datasets-${DATASET}/paradedb"
          if [ ! -d "${pgdata_dir}" ]; then
            echo "Directory ${pgdata_dir} does not exist" >&2
            exit 1
          fi
          echo "Archiving ${pgdata_dir}..."
          archive="${RUNNER_TEMP}/heap-${DATASET}.tar.zst"
          sudo tar -I 'zstd -3 -T0' -cf "${archive}" -C "${pgdata_dir}" .

          s3_dest="s3://${BACKREST_REPO_BUCKET}/${SNAPSHOT_PREFIX}/${DATASET}/heap.tar.zst"
          echo "Uploading ${archive} to ${s3_dest}..."
          aws s3 cp "${archive}" "${s3_dest}"
          rm -f "${archive}"
          echo "Snapshot upload complete: ${s3_dest}"

      - name: Dump database logs on failure
        if: failure()
        run: docker ps -a && docker logs --tail 200 "$(docker ps -aq --filter "name=paradedb" | head -1)" || true

  notify-slack-on-failure:
    name: Notify Slack on Failure
    needs: [prep, generate, generate-benchmarker]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - name: Notify Slack on Failure
        uses: paradedb/actions/slack-alert@v14
        with:
          suppress_spot_retries: "true"
          job_results: ${{ toJSON(needs) }}
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
