# workflows/lint-rust.yml
#
# Lint Rust
# Lint Rust files using Clippy and Rustfmt.

name: Lint Rust

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/setup-pg-search-toolchain/**"
      - ".github/actions/setup-postgres/**"
      - "rust-toolchain.toml"
      - ".github/scripts/check_impl_drop.py"
      - ".github/workflows/lint-rust.yml"
      - "Cargo.lock"
      - "**/*.rs"
      - "**/*.toml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: lint-rust-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-format:
    name: Check Rust Formatting and Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rustfmt
          cache: false

      # A bare `impl Drop` can abort the backend during an ERROR or at exit (#6479, #6530).
      - name: Check impl Drop
        run: python3 .github/scripts/check_impl_drop.py

      - name: Check Cargo.lock
        run: cargo metadata --format-version 1 --locked > /dev/null

      - name: Run Rustfmt
        run: cargo fmt --all -- --check

      - name: Install cargo-machete
        run: cargo install -j $(nproc) cargo-machete --locked --debug

      - name: Install taplo
        run: cargo install -j $(nproc) taplo-cli --version ^0.9 --locked --debug

      - name: Run cargo-machete
        run: cargo machete

      - name: Check Cargo.toml Formatting
        run: taplo format --check

  lint-rust:
    name: Lint Rust Files
    runs-on:
      # Compute-optimized c-family — Rust clippy/fmt is CPU-bound.
      # See https://runs-on.com/configuration/job-labels/ — runs in us-east-1.
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c7g+c8g
      - cpu=4
      - ram=8
      - image=ubuntu26-full-arm64
      - volume=80gb # default runner ships with 30GB — see https://runs-on.com/runners/linux/
      - extras=s3-cache+git-cache+apt-cache # See https://runs-on.com/caching/magic-cache/
    strategy:
      fail-fast: false
      matrix:
        pg_version: [18]

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # With extras=s3-cache, configure RunsOn before cache or artifact operations.
      - name: Configure RunsOn Caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      - name: Set Up pg_search Toolchain
        uses: ./.github/actions/setup-pg-search-toolchain
        with:
          pg_version: ${{ matrix.pg_version }}
          rust_components: clippy

      - name: Install & Configure Supported PostgreSQL Version
        uses: ./.github/actions/setup-postgres
        with:
          pg_version: ${{ matrix.pg_version }}
          extra_packages: clang libclang-dev lld libfontconfig1-dev libopenblas-dev

      - name: Run Rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings --no-deps
