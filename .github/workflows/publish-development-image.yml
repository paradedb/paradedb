# Build a normal PostgreSQL 18 ARM64 image from source without creating a release.
# PRs build and smoke-test only. Publishing is a manual dispatch from main.
name: Publish Development Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/publish-development-image.yml"
      - "docker/generate-development-dockerfile.sh"
      - "docker/Dockerfile.template"
      - "docker/bootstrap.sh"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA to build from this repository. Run the workflow from main."
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  build-extension:
    name: Build Development pg_search
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: runs-on=${{ github.run_id }}/spot=false/family=m7g+m8g/cpu=16/ram=64/image=ubuntu24-full-arm64/extras=s3-cache
    container: debian:13-slim
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      extension_version: ${{ steps.package.outputs.version }}
    steps:
      - name: Install Dependencies
        uses: paradedb/actions/apt-install@v14
        with:
          packages: sudo git ca-certificates curl gnupg

      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve Source Commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Build pg_search from Source
        id: build
        uses: paradedb/actions/build-pg_search-source@v14
        with:
          pg-version: "18"
          profile: release
          cache-prefix-key: development-image-arm64
          cache-save: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Package Extension
        id: package
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifacts-dir }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE "s/^default_version[[:space:]]*=[[:space:]]*'([^']+)'[[:space:]]*$/\1/p" "$ARTIFACTS/usr/share/postgresql/18/extension/pg_search.control")"
          [[ "$version" =~ ^[a-zA-Z0-9._-]{1,64}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p package/DEBIAN
          cp -R "$ARTIFACTS/usr" package/usr
          cat > package/DEBIAN/control <<'CONTROL'
          Package: postgresql-18-pg-search
          Version: 0.0.0
          Architecture: arm64
          Depends: postgresql-18, libopenblas0
          Maintainer: ParadeDB <support@paradedb.com>
          Description: Development build of pg_search
          CONTROL
          dpkg-deb --build --root-owner-group package pg_search.deb

      - name: Upload Extension Package
        uses: actions/upload-artifact@v7
        with:
          name: development-pg-search
          path: pg_search.deb
          if-no-files-found: error
          retention-days: 1

  test-image:
    name: Build and Test Development Image
    needs: build-extension
    runs-on: ubuntu-24.04-arm
    steps:
      # Runtime code comes from the workflow ref; source_ref selects only pg_search.
      - name: Checkout Runtime
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Extension Package
        uses: actions/download-artifact@v8
        with:
          name: development-pg-search
          path: docker

      - name: Build Development Image
        env:
          SOURCE_SHA: ${{ needs.build-extension.outputs.source_sha }}
          EXTENSION_VERSION: ${{ needs.build-extension.outputs.extension_version }}
        run: |
          docker/generate-development-dockerfile.sh > docker/Dockerfile.development
          docker build --platform linux/arm64 \
            --file docker/Dockerfile.development \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "com.paradedb.extension-version=$EXTENSION_VERSION" \
            --tag paradedb-development docker

      - name: Smoke Test Development Image
        env:
          EXTENSION_VERSION: ${{ needs.build-extension.outputs.extension_version }}
        run: |
          set -euo pipefail
          trap 'docker logs development-db; docker rm -f development-db' EXIT
          docker run -d --name development-db \
            -e POSTGRES_PASSWORD=development-test \
            paradedb-development
          ready=false
          for attempt in $(seq 1 90); do
            echo "Waiting for PostgreSQL ($attempt/90)"
            if docker exec development-db pg_isready -h localhost -U postgres; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          actual="$(docker exec development-db psql -U postgres -Atc "SELECT extversion FROM pg_extension WHERE extname = 'pg_search'")"
          [[ "$actual" == "$EXTENSION_VERSION" ]]
          docker exec -i development-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE development_smoke (id bigint PRIMARY KEY, description text);
          INSERT INTO development_smoke VALUES (1, 'running shoes'), (2, 'winter boots');
          CREATE INDEX development_smoke_idx ON development_smoke
            USING bm25 (id, description) WITH (key_field = 'id');
          DO $$
          BEGIN
            IF (SELECT count(*) FROM development_smoke WHERE description @@@ 'shoes') != 1 THEN
              RAISE EXCEPTION 'pg_search smoke test failed';
            END IF;
          END $$;
          SQL

      - name: Save Tested Image
        if: github.event_name == 'workflow_dispatch'
        run: docker save paradedb-development | gzip > development-image.tar.gz

      - name: Upload Tested Image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: development-image
          path: development-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Tested Development Image
    needs: [build-extension, test-image]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Tested Image
        uses: actions/download-artifact@v8
        with:
          name: development-image

      - name: Load Tested Image
        run: docker load --input development-image.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Publish Development Image
        id: image
        env:
          SOURCE_SHA: ${{ needs.build-extension.outputs.source_sha }}
        run: |
          image="$GITHUB_REPOSITORY:18-dev-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag paradedb-development "$image"
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" == *@sha256:* ]]
          echo "ref=$image@${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "tag=$image" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Development Image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: cosign sign --yes "$IMAGE"

      - name: Summarize Development Image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.image.outputs.tag }}
          SOURCE_SHA: ${{ needs.build-extension.outputs.source_sha }}
          EXTENSION_VERSION: ${{ needs.build-extension.outputs.extension_version }}
        run: |
          {
            echo "Source: $GITHUB_REPOSITORY @ $SOURCE_SHA"
            echo "Tag: $TAG"
            echo "Image reference: $IMAGE"
            echo "pg_search version: $EXTENSION_VERSION"
            echo "Platform: PostgreSQL 18, linux/arm64"
            echo 'Use the image reference and pg_search version in the staging console under the paradedb organization.'
          } >> "$GITHUB_STEP_SUMMARY"
