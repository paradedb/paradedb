# workflows/publish-github-release.yml
#
# Publish GitHub Release
# Orchestrates fragment assembly, version syncing, and publishes a ParadeDB GitHub Release.
# This workflow is triggered manually via the GitHub Actions UI and deploys the branch that it is being run from.
#
# Conditionals checking for `paradedb/paradedb` ensure that mutable steps (e.g., artifact assembly,
# version bumps, and commits) only run on the community repository. See RELEASE.md for details.

name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, in semver format (e.g. 0.22.0)."
        type: string
        required: true
        default: ""
      beta:
        description: "Whether this release is a beta release. Defaults to false."
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-github-release-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  publish-github-release:
    name: Publish ParadeDB GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Validate Inputs and Setup
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "start_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Checking for existing release..."
          if gh release view v${{ github.event.inputs.version }} > /dev/null 2>&1; then
            echo "Release v${{ github.event.inputs.version }} already exists. All releases must be unique."
            exit 1
          fi
          echo "Release check passed!"

          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            echo "Validating that the version contains '-rc.X'..."
            if [[ "${{ github.event.inputs.version }}" != *"-rc."* ]]; then
              echo "Version (${{ github.event.inputs.version }}) does not contain '-rc.X' but is marked as a beta release."
              exit 1
            fi
            echo "Beta release: skipping branch prefix checks (can be run from any branch/commit)."
          else
            echo "Validating that the version does not contain '-rc.X'..."
            if [[ "${{ github.event.inputs.version }}" == *"-rc."* ]]; then
              echo "Version (${{ github.event.inputs.version }}) contains '-rc.X' but is not marked as a beta release."
              exit 1
            fi

            if [[ "${{ github.ref_name }}" == "main" ]]; then
              echo "Validating that the version is a minor release on the main branch..."
              if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
                echo "On releases of the 'main' branch, releases must be minor (patch = 0)."
                echo "Provided version '${{ github.event.inputs.version }}' is not a minor release."
                exit 1
              fi
            elif [[ "${{ github.ref_name }}" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
              BRANCH_PREFIX="${BASH_REMATCH[1]}"
              echo "Validating that version matches stable branch '${BRANCH_PREFIX}.x'..."
              if [[ ! "${{ github.event.inputs.version }}" =~ ^${BRANCH_PREFIX}\.[0-9]+$ ]]; then
                echo "❌ Error: On stable branch '${{ github.ref_name }}', version must match '${BRANCH_PREFIX}.<patch>'."
                echo "Provided version '${{ github.event.inputs.version }}' does not match."
                exit 1
              fi
            else
              echo "❌ Error: Full releases must be triggered from 'main' or a stable branch ('<major>.<minor>.x')."
              echo "Current ref '${{ github.ref_name }}' is not a valid release branch."
              exit 1
            fi
          fi
          echo "Input validation passed!"

      - name: Configure Release Tag Signing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SIGNING_KEY: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY }}
          SIGNING_USER: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER }}
          SIGNING_EMAIL: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL }}
        run: |
          : "${SIGNING_KEY:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY secret}"
          : "${SIGNING_USER:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER secret}"
          : "${SIGNING_EMAIL:?Set the PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL secret}"
          umask 077
          KEY_FILE="$RUNNER_TEMP/github-bot-signing-key"
          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          PUBLIC_KEY=$(ssh-keygen -y -P '' -f "$KEY_FILE" | awk '{print $1, $2}')
          # GitHub verifies SSH signatures against the account's registered signing keys.
          gh api --paginate "users/$SIGNING_USER/ssh_signing_keys" --jq '.[] | .key | split(" ") | .[0:2] | join(" ")' |
            grep -Fx -- "$PUBLIC_KEY"
          printf '%s %s\n' "$SIGNING_EMAIL" "$PUBLIC_KEY" > "$KEY_FILE.allowed-signers"
          git config user.name "$SIGNING_USER"
          git config user.email "$SIGNING_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$KEY_FILE"
          git config gpg.ssh.allowedSignersFile "$KEY_FILE.allowed-signers"
          git config tag.gpgsign true

      - name: Install Rust
        if: github.repository == 'paradedb/paradedb'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Install Determinate Nix
        if: github.repository == 'paradedb/paradedb'
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Assemble Release Artifacts
        if: github.repository == 'paradedb/paradedb'
        run: |
          FLAGS=""
          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            FLAGS="--preserve-fragments --beta"
          fi
          ./scripts/release.sh all "${{ github.event.inputs.version }}" $FLAGS

      - name: Update Cargo Version, Lockfile, and Nix Hash
        if: github.repository == 'paradedb/paradedb'
        run: |
          ./scripts/release.sh set-version "${{ github.event.inputs.version }}"

      - name: Determine if Release Should be Marked as Latest
        id: release_latest
        run: |
          FLAGS=""
          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            FLAGS="--beta"
          fi
          IS_LATEST=$(./scripts/release.sh is-latest "${{ github.event.inputs.version }}" $FLAGS)
          echo "is_latest=${IS_LATEST}"
          echo "is_latest=${IS_LATEST}" >> $GITHUB_OUTPUT

      - name: Prepare Approval Details
        if: github.event.inputs.beta != 'true'
        id: approval_details
        run: |
          ./scripts/release.sh approval-body "${{ github.event.inputs.version }}" \
            --branch "${{ github.ref_name }}" \
            --output-file /tmp/approval-body.md
          {
            echo "issue_body<<EOF"
            cat /tmp/approval-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat /tmp/approval-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Manual Approval Before Release
        if: github.event.inputs.beta != 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ steps.app-token.outputs.token }}
          approvers: pg_search-maintainers
          minimum-approvals: 1
          issue-title: "Release v${{ github.event.inputs.version }}?"
          issue-body: ${{ steps.approval_details.outputs.issue_body }}

      - name: Commit Release Artifacts
        if: github.repository == 'paradedb/paradedb'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add -A
          python3 .github/scripts/commit-with-github-app.py "chore: Prepare \`${{ github.event.inputs.version }}\`."

          if [[ "${{ github.event.inputs.beta }}" != "true" ]]; then
            # Verify remote branch has not advanced before pushing release commit
            git fetch origin ${{ github.ref_name }}
            REMOTE_SHA=$(git rev-parse origin/${{ github.ref_name }})
            START_SHA="${{ steps.validate.outputs.start_sha }}"
            if [[ "$REMOTE_SHA" != "$START_SHA" ]]; then
              echo "❌ Error: Remote branch '${{ github.ref_name }}' has advanced ($START_SHA -> $REMOTE_SHA) since this release workflow started."
              echo "New commits/fragments may have landed on the branch. Aborting release so all changes can be cleanly included."
              exit 1
            fi
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Beta release: skipping push of release commit to branch '${{ github.ref_name }}'."
          fi

      - name: Create Tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          echo "Creating and pushing tag ${TAG}..."
          git tag -s "$TAG" -m "Release $TAG"
          git verify-tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Sync Release Artifacts to Main
        if: github.repository == 'paradedb/paradedb' && github.ref_name != 'main' && github.event.inputs.beta != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RELEASE_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${RELEASE_VERSION%%-*}"
          IS_LATEST="${{ steps.release_latest.outputs.is_latest }}"

          # Record newly created release files and consumed fragment paths from the release commit
          NEW_SQL="pg_search/sql/pg_search--*--${CLEAN_VERSION}.sql"
          DOCS_SNIPPET="docs/snippets/version.mdx"

          # Determine changelog location on the release branch
          # TODO: Legacy accommodation for 0.25.x (remove after 0.25.x is EOL):
          # On 0.25.x, changelog was created in docs/changelog/; on post-reorg branches, in docs/project/changelog/
          if git ls-tree -r --name-only HEAD | grep -q "^docs/project/changelog/${CLEAN_VERSION}\.mdx$"; then
            BRANCH_CHANGELOG="docs/project/changelog/${CLEAN_VERSION}.mdx"
          else
            BRANCH_CHANGELOG="docs/changelog/${CLEAN_VERSION}.mdx"
          fi

          DELETED_FRAGMENTS=$(git diff HEAD~1 --diff-filter=D --name-only -- 'pg_search/sql/unreleased/' 'docs/changelog/unreleased/' 'docs/project/changelog/unreleased/')

          echo "Switching to main branch to sync release artifacts..."
          git fetch origin main:main
          git checkout main

          echo "Checking out assembled release files from the release commit..."
          CHECKOUT_FILES="${NEW_SQL} ${BRANCH_CHANGELOG}"
          if [[ "$IS_LATEST" == "true" ]]; then
            CHECKOUT_FILES="${CHECKOUT_FILES} ${DOCS_SNIPPET}"
          fi
          git checkout "${{ github.ref_name }}" -- ${CHECKOUT_FILES}

          # TODO: Legacy accommodation for 0.25.x (remove after 0.25.x is EOL):
          # Move changelog to docs/project/changelog/ if it was checked out from docs/changelog/
          if [[ "$BRANCH_CHANGELOG" == "docs/changelog/"* && -d "docs/project/changelog" ]]; then
            TARGET_CHANGELOG="docs/project/changelog/${CLEAN_VERSION}.mdx"
            echo "Moving legacy changelog $BRANCH_CHANGELOG to $TARGET_CHANGELOG on main..."
            mkdir -p "docs/project/changelog"
            mv "$BRANCH_CHANGELOG" "$TARGET_CHANGELOG"
            rmdir docs/changelog/unreleased docs/changelog 2>/dev/null || true
          fi

          if [[ -n "$DELETED_FRAGMENTS" ]]; then
            echo "Removing consumed fragments from main..."
            echo "$DELETED_FRAGMENTS" | while read -r fragment; do
              if [[ -f "$fragment" ]]; then
                echo " - Removing $fragment"
                rm -f "$fragment"
              fi
              # TODO: Legacy accommodation for 0.25.x (remove after 0.25.x is EOL):
              # If fragment was deleted from docs/changelog/unreleased/ on 0.25.x, also delete counterpart in docs/project/changelog/unreleased/ on main
              if [[ "$fragment" == "docs/changelog/unreleased/"* ]]; then
                alt_fragment="docs/project/changelog/unreleased/${fragment##*/}"
                if [[ -f "$alt_fragment" ]]; then
                  echo " - Removing $alt_fragment"
                  rm -f "$alt_fragment"
                fi
              fi
            done
          fi

          echo "Registering ${CLEAN_VERSION} in docs/docs.json on main (is_latest=${IS_LATEST})..."
          if [[ "$IS_LATEST" == "true" ]]; then
            ./scripts/release.sh changelog "${CLEAN_VERSION}" --register-only --is-latest
          else
            ./scripts/release.sh changelog "${CLEAN_VERSION}" --register-only --no-is-latest
          fi

          git add -A
          if ! git diff --staged --quiet; then
            python3 .github/scripts/commit-with-github-app.py "chore: Sync \`${RELEASE_VERSION}\` release artifacts to main."
            git push origin main
            echo "✅ Successfully synced release artifacts to main."
          else
            echo "No changes needed on main."
          fi

          # Switch back to the release branch for tagging and release creation
          git checkout "${{ github.ref_name }}"

      - name: Create Stable Branch
        if: github.ref_name == 'main' && github.event.inputs.beta != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          STABLE_BRANCH="${MAJOR_MINOR}.x"
          sha=$(git rev-parse HEAD)

          echo "Checking if stable branch refs/heads/${STABLE_BRANCH} exists..."
          if ! gh api "repos/${{ github.repository }}/git/ref/heads/${STABLE_BRANCH}" > /dev/null 2>&1; then
            echo "Creating stable branch refs/heads/${STABLE_BRANCH} pointing at $sha"
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/${STABLE_BRANCH}" \
              -f sha="$sha"
            echo "✅ Created stable branch ${STABLE_BRANCH}"
          else
            echo "ℹ️ Stable branch ${STABLE_BRANCH} already exists."
          fi

      # The tag_name will have "-rc.X" suffix and be marked as a prerelease for beta releases,
      # and no suffix and marked as a full release for prod releases. The tag has already been
      # created in the step above, so this step just attaches the release to it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: ${{ github.ref_name }} # Deploy the branch that this workflow is being run from
          prerelease: ${{ github.event.inputs.beta }} # Whether this release is a beta release
          make_latest: ${{ steps.release_latest.outputs.is_latest }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Bot Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/github-bot-signing-key" "$RUNNER_TEMP/github-bot-signing-key.allowed-signers"

      - name: Notify Slack on Failure
        if: failure()
        uses: paradedb/actions/slack-alert@v14
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
