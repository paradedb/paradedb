# workflows/publish-github-release.yml
#
# Publish GitHub Release
# Orchestrates fragment assembly, version syncing, and publishes a ParadeDB GitHub Release.
# This workflow is triggered manually via the GitHub Actions UI and deploys the branch that it is being run from.

name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, in semver format (e.g. 0.22.0)."
        type: string
        required: true
        default: ""
      beta:
        description: "Whether this release is a beta release. Defaults to false."
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-github-release-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-github-release:
    name: Publish ParadeDB GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Validate Inputs and Setup
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "start_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Checking for existing release..."
          if gh release view v${{ github.event.inputs.version }} > /dev/null 2>&1; then
            echo "Release v${{ github.event.inputs.version }} already exists. All releases must be unique."
            exit 1
          fi
          echo "Release check passed!"

          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            echo "Validating that the version contains '-rc.X'..."
            if [[ "${{ github.event.inputs.version }}" != *"-rc."* ]]; then
              echo "Version (${{ github.event.inputs.version }}) does not contain '-rc.X' but is marked as a beta release."
              exit 1
            fi
          else
            echo "Validating that the version does not contain '-rc.X'..."
            if [[ "${{ github.event.inputs.version }}" == *"-rc."* ]]; then
              echo "Version (${{ github.event.inputs.version }}) contains '-rc.X' but is not marked as a beta release."
              exit 1
            fi
          fi

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "Validating that the version is a minor release on the main branch..."
            if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.0(-rc\.[0-9]+)?$ ]]; then
              echo "On releases of the 'main' branch, releases must be minor (patch = 0)."
              echo "Provided version '${{ github.event.inputs.version }}' is not a minor release."
              exit 1
            fi
          elif [[ "${{ github.ref_name }}" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
            BRANCH_PREFIX="${BASH_REMATCH[1]}"
            echo "Validating that version matches stable branch '${BRANCH_PREFIX}.x'..."
            if [[ ! "${{ github.event.inputs.version }}" =~ ^${BRANCH_PREFIX}\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "❌ Error: On stable branch '${{ github.ref_name }}', version must match '${BRANCH_PREFIX}.<patch>'."
              echo "Provided version '${{ github.event.inputs.version }}' does not match."
              exit 1
            fi
          fi
          echo "Input validation passed!"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Assemble Release Artifacts
        run: |
          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            ./scripts/assemble_release_fragments.sh all "${{ github.event.inputs.version }}" --preserve-fragments
          else
            ./scripts/assemble_release_fragments.sh all "${{ github.event.inputs.version }}"
          fi

      - name: Update Cargo Version, Lockfile, and Nix Hash
        run: |
          TARGET_VERSION="${{ github.event.inputs.version }}"
          # Update version in Cargo.toml
          python3 -c "
          import re
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'(?m)^version = \"[^\"]+\"', f'version = \"${TARGET_VERSION}\"', content, count=1)
          with open('Cargo.toml', 'w') as f:
              f.write(content)
          "
          cargo update --workspace
          chmod +x scripts/update-nix-cargo-hash.sh
          scripts/update-nix-cargo-hash.sh 18

      - name: Commit and Push Release Artifacts
        run: |
          # Verify that the remote branch has not advanced since the workflow started.
          # If new commits merged into main or the stable branch during assembly/nix build,
          # abort to prevent releasing mismatched code and migration fragments.
          # TODO: In the future, we could potentially implement a retry loop that pulls and re-assembles.
          git fetch origin ${{ github.ref_name }}
          REMOTE_SHA=$(git rev-parse origin/${{ github.ref_name }})
          START_SHA="${{ steps.validate.outputs.start_sha }}"
          if [[ "$REMOTE_SHA" != "$START_SHA" ]]; then
            echo "❌ Error: Remote branch '${{ github.ref_name }}' has advanced ($START_SHA -> $REMOTE_SHA) since this release workflow started."
            echo "New commits/fragments may have landed on the branch. Aborting release so all changes can be cleanly included."
            exit 1
          fi

          git config user.name "paradedb-github-app[bot]"
          git config user.email "282009505+paradedb-github-app[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Prepare \`${{ github.event.inputs.version }}\`."
          git push origin HEAD:${{ github.ref_name }}

      - name: Determine if Release Should be Marked as Latest
        id: release_latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Beta releases should never be the latest release
          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            echo "is_latest=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          current_tag_version="${{ github.event.inputs.version }}"
          latest_tag_version=$(gh release list --jq '.[] | select(.isLatest == true) | .name' --json=name,isLatest | sed 's/^v//')
          echo "Current latest release is $latest_tag_version"
          echo "Current version to be released is $current_tag_version"

          echo ""
          echo "Install semver CLI via npm to compare versions..."
          npm install semver

          echo ""
          echo "Comparing versions to determine if the current version is the latest..."
          if npx semver -r ">$latest_tag_version" "$current_tag_version"; then
            echo "is_latest=true"
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false"
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync Release Artifacts to Main
        if: github.ref_name != 'main'
        run: |
          RELEASE_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${RELEASE_VERSION%%-*}"
          IS_LATEST="${{ steps.release_latest.outputs.is_latest }}"

          # Record newly created release files and consumed fragment paths from the release commit
          NEW_SQL="pg_search/sql/pg_search--*--${CLEAN_VERSION}.sql"
          NEW_CHANGELOG="docs/changelog/${CLEAN_VERSION}.mdx"
          DOCS_SNIPPET="docs/snippets/version.mdx"
          DELETED_FRAGMENTS=$(git diff HEAD~1 --diff-filter=D --name-only -- 'pg_search/sql/unreleased/' 'docs/changelog/unreleased/')

          echo "Switching to main branch to sync release artifacts..."
          git fetch origin main:main
          git checkout main

          echo "Checking out assembled release files from the release commit..."
          if [[ "$IS_LATEST" == "true" ]]; then
            git checkout "${{ github.ref_name }}" -- ${NEW_SQL} ${NEW_CHANGELOG} ${DOCS_SNIPPET}
          else
            git checkout "${{ github.ref_name }}" -- ${NEW_SQL} ${NEW_CHANGELOG}
          fi

          if [[ -n "$DELETED_FRAGMENTS" ]]; then
            echo "Removing consumed fragments from main..."
            echo "$DELETED_FRAGMENTS" | while read -r fragment; do
              if [[ -f "$fragment" ]]; then
                echo " - Removing $fragment"
                rm -f "$fragment"
              fi
            done
          fi

          echo "Registering ${CLEAN_VERSION} in docs/docs.json on main (is_latest=${IS_LATEST})..."
          if [[ "$IS_LATEST" == "true" ]]; then
            ./scripts/assemble_release_fragments.sh changelog "${CLEAN_VERSION}" --register-only --is-latest
          else
            ./scripts/assemble_release_fragments.sh changelog "${CLEAN_VERSION}" --register-only --no-is-latest
          fi

          git config user.name "paradedb-github-app[bot]"
          git config user.email "282009505+paradedb-github-app[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: Sync \`${RELEASE_VERSION}\` release artifacts to main."
            git push origin main
            echo "✅ Successfully synced release artifacts to main."
          else
            echo "No changes needed on main."
          fi

          # Switch back to the release branch for tagging and release creation
          git checkout "${{ github.ref_name }}"

      - name: Create Tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Creating tag v${{ github.event.inputs.version }} pointing at $sha"
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v${{ github.event.inputs.version }}" \
            -f sha="$sha"

      - name: Create Stable Branch
        if: github.ref_name == 'main' && github.event.inputs.beta != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          STABLE_BRANCH="${MAJOR_MINOR}.x"
          sha=$(git rev-parse HEAD)

          echo "Checking if stable branch refs/heads/${STABLE_BRANCH} exists..."
          if ! gh api "repos/${{ github.repository }}/git/ref/heads/${STABLE_BRANCH}" > /dev/null 2>&1; then
            echo "Creating stable branch refs/heads/${STABLE_BRANCH} pointing at $sha"
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/${STABLE_BRANCH}" \
              -f sha="$sha"
            echo "✅ Created stable branch ${STABLE_BRANCH}"
          else
            echo "ℹ️ Stable branch ${STABLE_BRANCH} already exists."
          fi

      # The tag_name will have "-rc.X" suffix and be marked as a prerelease for beta releases,
      # and no suffix and marked as a full release for prod releases. The tag has already been
      # created in the step above, so this step just attaches the release to it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: ${{ github.ref_name }} # Deploy the branch that this workflow is being run from
          prerelease: ${{ github.event.inputs.beta }} # Whether this release is a beta release
          make_latest: ${{ steps.release_latest.outputs.is_latest }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-Release Development Version Bump
        run: |
          RELEASE_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${RELEASE_VERSION%%-*}"
          IS_BETA="${{ github.event.inputs.beta }}"
          REF_NAME="${{ github.ref_name }}"

          if [[ "$REF_NAME" == "main" ]]; then
            if [[ "$IS_BETA" == "true" ]]; then
              NEXT_DEV_VERSION="$CLEAN_VERSION"
              COMMIT_MSG="chore: Reset development version to \`${NEXT_DEV_VERSION}\`."
            else
              # Next minor dev version: e.g. 0.26.0 -> 0.27.0
              NEXT_DEV_VERSION=$(python3 -c "
              major, minor, patch = map(int, '${CLEAN_VERSION}'.split('.'))
              print(f'{major}.{minor + 1}.0')
              ")
              COMMIT_MSG="chore: Start development of \`${NEXT_DEV_VERSION}\`."
            fi
            TARGET_BRANCH="main"
          else
            # Patch release on stable branch: switch back to stable branch
            git checkout "$REF_NAME"
            # Next patch dev version: e.g. 0.25.5 -> 0.25.6
            NEXT_DEV_VERSION=$(python3 -c "
            major, minor, patch = map(int, '${CLEAN_VERSION}'.split('.'))
            print(f'{major}.{minor}.{patch + 1}')
            ")
            COMMIT_MSG="chore: Start development of \`${NEXT_DEV_VERSION}\`."
            TARGET_BRANCH="$REF_NAME"
          fi

          echo "Bumping ${TARGET_BRANCH} to development version ${NEXT_DEV_VERSION}..."
          python3 -c "
          import re
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'(?m)^version = \"[^\"]+\"', f'version = \"${NEXT_DEV_VERSION}\"', content, count=1)
          with open('Cargo.toml', 'w') as f:
              f.write(content)
          "
          cargo update --workspace
          chmod +x scripts/update-nix-cargo-hash.sh
          scripts/update-nix-cargo-hash.sh 18

          git config user.name "paradedb-github-app[bot]"
          git config user.email "282009505+paradedb-github-app[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock nix/pg_search.nix
          if ! git diff --staged --quiet; then
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:"$TARGET_BRANCH"
            echo "✅ Successfully bumped ${TARGET_BRANCH} to ${NEXT_DEV_VERSION}."
          else
            echo "No development bump needed."
          fi

      - name: Notify Slack on Failure
        if: failure()
        uses: paradedb/actions/slack-alert@v10
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
