# workflows/publish-github-release.yml
#
# Publish GitHub Release
# Orchestrates fragment assembly, version syncing, and publishes a ParadeDB GitHub Release.
# This workflow is triggered manually via the GitHub Actions UI and releases the selected branch or tag.
# Beta releases require an -rc.N version and create a prerelease without advancing the branch.
# The new version tag triggers the other publishing workflows.
#
# Release files are prepared without secrets and passed as a patch to separate
# approval and publishing jobs. Both validate the patch before using credentials.
# Only the publishing job gets the signing key. Slack notifications run separately.
# Backport this workflow and its validation scripts together to stable branches.
#
# Conditionals checking for `paradedb/paradedb` ensure that artifact assembly,
# version bumps, and release commits only run on the community repository.
# See RELEASE.md for the community and enterprise release procedures.

name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, without the v prefix (e.g. 0.26.0 or 0.26.0-rc.0 for a beta)."
        type: string
        required: true
        default: ""
      beta:
        description: "Whether this release is a beta release. Requires an -rc.N version and skips manual approval. Creates a prerelease and tag without advancing the selected branch. Defaults to false."
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-github-release-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release Without Publishing Credentials
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.release_latest.outputs.is_latest }}
    permissions:
      contents: read
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2 # Keep the parent for release-artifact diffs even when no commit is created.
      - name: Fetch Release Tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --depth=2 --no-tags origin "+refs/tags/v*:refs/tags/v*"

      - name: Validate Inputs and Setup
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ github.event.inputs.version }}
          INPUTS_BETA: ${{ github.event.inputs.beta }}
        run: |
          echo "start_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Checking for existing release..."
          if gh release view "v${INPUTS_VERSION}" > /dev/null 2>&1; then
            echo "Release v${INPUTS_VERSION} already exists. All releases must be unique."
            exit 1
          fi
          echo "Release check passed!"

          if [[ "${INPUTS_BETA}" == "true" ]]; then
            echo "Validating that the version contains '-rc.X'..."
            if [[ "${INPUTS_VERSION}" != *"-rc."* ]]; then
              echo "Version (${INPUTS_VERSION}) does not contain '-rc.X' but is marked as a beta release."
              exit 1
            fi
            echo "Beta release: skipping branch prefix checks (can be run from any branch/commit)."
          else
            echo "Validating that the version does not contain '-rc.X'..."
            if [[ "${INPUTS_VERSION}" == *"-rc."* ]]; then
              echo "Version (${INPUTS_VERSION}) contains '-rc.X' but is not marked as a beta release."
              exit 1
            fi

            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "Validating that the version is a minor release on the main branch..."
              if [[ ! "${INPUTS_VERSION}" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
                echo "On releases of the 'main' branch, releases must be minor (patch = 0)."
                echo "Provided version '${INPUTS_VERSION}' is not a minor release."
                exit 1
              fi
            elif [[ "${GITHUB_REF_NAME}" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
              BRANCH_PREFIX="${BASH_REMATCH[1]}"
              echo "Validating that version matches stable branch '${BRANCH_PREFIX}.x'..."
              if [[ ! "${INPUTS_VERSION}" =~ ^${BRANCH_PREFIX}\.[0-9]+$ ]]; then
                echo "❌ Error: On stable branch '${GITHUB_REF_NAME}', version must match '${BRANCH_PREFIX}.<patch>'."
                echo "Provided version '${INPUTS_VERSION}' does not match."
                exit 1
              fi
            else
              echo "❌ Error: Full releases must be triggered from 'main' or a stable branch ('<major>.<minor>.x')."
              echo "Current ref '${GITHUB_REF_NAME}' is not a valid release branch."
              exit 1
            fi
          fi
          echo "Input validation passed!"

      - name: Install Rust
        if: github.repository == 'paradedb/paradedb'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
          rustflags: ""

      - name: Install Determinate Nix
        if: github.repository == 'paradedb/paradedb'
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1

      - name: Determine if Release Should be Marked as Latest
        id: release_latest
        env:
          INPUTS_BETA: ${{ github.event.inputs.beta }}
          INPUTS_VERSION: ${{ github.event.inputs.version }}
        run: |
          FLAGS=""
          if [[ "${INPUTS_BETA}" == "true" ]]; then
            FLAGS="--beta"
          fi
          IS_LATEST=$(./scripts/release.sh is-latest "${INPUTS_VERSION}" $FLAGS)
          echo "is_latest=${IS_LATEST}"
          echo "is_latest=${IS_LATEST}" >> $GITHUB_OUTPUT

      - name: Assemble Release Artifacts
        if: github.repository == 'paradedb/paradedb'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          IS_BETA: ${{ github.event.inputs.beta }}
          IS_LATEST: ${{ steps.release_latest.outputs.is_latest }}
        run: |
          FLAGS=(--no-is-latest)
          if [[ "$IS_LATEST" == "true" ]]; then
            FLAGS=(--is-latest)
          fi
          if [[ "$IS_BETA" == "true" ]]; then
            FLAGS+=(--preserve-fragments --beta)
          fi
          ./scripts/release.sh all "$RELEASE_VERSION" "${FLAGS[@]}"

      - name: Update Cargo Version, Lockfile, and Nix Hash
        if: github.repository == 'paradedb/paradedb'
        env:
          INPUTS_VERSION: ${{ github.event.inputs.version }}
        run: |
          ./scripts/release.sh set-version "${INPUTS_VERSION}"

      - name: Export Release Changes
        run: |
          git add -A
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/release.patch"

      - name: Upload Release Changes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-preparation
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
          retention-days: 7

  approve-release:
    name: Review Prepared Release
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2 # Keep the parent for release-artifact diffs even when no commit is created.

      - name: Download This Run's Release Changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-preparation
          path: ${{ runner.temp }}/release-preparation

      - name: Validate and Import Release Changes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/apply_release_patch.py \
            "$RUNNER_TEMP/release-preparation/release.patch" "$RELEASE_VERSION"

      - name: Fetch Release Tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --depth=2 --no-tags origin "+refs/tags/v*:refs/tags/v*"

      - name: Prepare Approval Details
        if: github.event.inputs.beta != 'true'
        id: approval_details
        env:
          INPUTS_VERSION: ${{ github.event.inputs.version }}
        run: |
          ./scripts/release.sh approval-body "${INPUTS_VERSION}" \
            --branch "${GITHUB_REF_NAME}" \
            --output-file /tmp/approval-body.md
          {
            printf '\nPrepared from commit `%s`. Review the patch artifact in [this workflow run](%s/%s/actions/runs/%s) before approving.\n\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            git diff --cached --stat
          } >> /tmp/approval-body.md
          {
            echo "issue_body<<EOF"
            cat /tmp/approval-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat /tmp/approval-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate GitHub App Token
        id: app-token
        if: inputs.beta != true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Keep the exact pin because actionlint 1.7.12 has stale @v3 metadata that rejects client-id
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-members: read

      # Pin the image directly because the action loads a mutable container tag.
      - name: Manual Approval Before Release
        if: github.event.inputs.beta != 'true'
        uses: docker://ghcr.io/trstringer/manual-approval@sha256:7cac2dde511346ae728d44e6a4c6385e5cd4b1a612e2158712448cfc4414b15b # v1.13.0
        env:
          INPUT_SECRET: ${{ steps.app-token.outputs.token }}
          INPUT_APPROVERS: pg_search-maintainers
          INPUT_MINIMUM-APPROVALS: "1"
          INPUT_EXCLUDE-WORKFLOW-INITIATOR-AS-APPROVER: "false"
          INPUT_ISSUE-TITLE: "Release v${{ github.event.inputs.version }}?"
          INPUT_ISSUE-BODY: ${{ steps.approval_details.outputs.issue_body }}

  publish-github-release:
    name: Sign and Publish Reviewed Release
    needs: [prepare-release, approve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2 # Keep the parent for release-artifact diffs even when no commit is created.

      - name: Download This Run's Release Changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-preparation
          path: ${{ runner.temp }}/release-preparation

      - name: Validate and Import Release Changes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/apply_release_patch.py \
            "$RUNNER_TEMP/release-preparation/release.patch" "$RELEASE_VERSION"

      - name: Fetch Release Tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --depth=2 --no-tags origin "+refs/tags/v*:refs/tags/v*"

      - name: Check Release Is Still Unpublished
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "start_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "::error::Release already exists; refusing to publish it again."
            exit 1
          fi

      - name: Determine if Release Should be Marked as Latest
        id: release_latest
        env:
          INPUTS_BETA: ${{ github.event.inputs.beta }}
          INPUTS_VERSION: ${{ github.event.inputs.version }}
          EXPECTED_LATEST: ${{ needs.prepare-release.outputs.is_latest }}
        run: |
          FLAGS=""
          if [[ "${INPUTS_BETA}" == "true" ]]; then
            FLAGS="--beta"
          fi
          IS_LATEST=$(./scripts/release.sh is-latest "${INPUTS_VERSION}" $FLAGS)
          if [[ "$IS_LATEST" != "$EXPECTED_LATEST" ]]; then
            echo "::error::Release ordering changed since preparation. Re-run to prepare and review current metadata."
            exit 1
          fi
          echo "is_latest=${IS_LATEST}"
          echo "is_latest=${IS_LATEST}" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Keep the exact pin because actionlint 1.7.12 has stale @v3 metadata that rejects client-id
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Authenticate Release Pushes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Commit Release Artifacts
        if: github.repository == 'paradedb/paradedb'
        uses: ./.github/actions/commit-with-paradedb-github-app
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          message: "chore: Prepare `${{ github.event.inputs.version }}`."

      - name: Push Release Commit
        if: github.repository == 'paradedb/paradedb'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BETA: ${{ github.event.inputs.beta }}
          RELEASE_REF: ${{ github.ref_name }}
          START_SHA: ${{ steps.validate.outputs.start_sha }}
        run: |
          if [[ "$BETA" != "true" ]]; then
            # Verify remote branch has not advanced before pushing release commit
            git fetch --depth=2 --no-tags origin "+refs/heads/$RELEASE_REF:refs/remotes/origin/$RELEASE_REF"
            REMOTE_SHA=$(git rev-parse "origin/$RELEASE_REF")
            if [[ "$REMOTE_SHA" != "$START_SHA" ]]; then
              echo "❌ Error: Remote branch '$RELEASE_REF' has advanced ($START_SHA -> $REMOTE_SHA) since this release workflow started."
              echo "New commits/fragments may have landed on the branch. Aborting release so all changes can be cleanly included."
              exit 1
            fi
            git push origin "HEAD:$RELEASE_REF"
          else
            echo "Beta release: skipping push of release commit to branch '$RELEASE_REF'."
          fi

      - name: Configure Release Tag Signing
        uses: paradedb/actions/setup-git-signing@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          signing-key: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_KEY }}
          signing-user: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_USER }}
          signing-email: ${{ secrets.PARADEDB_GITHUB_BOT_COMMIT_SIGNING_EMAIL }}

      - name: Create Tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUTS_VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG="v${INPUTS_VERSION}"
          echo "Creating and pushing tag ${TAG}..."
          git tag -s "$TAG" -m "Release $TAG"
          git verify-tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Remove Bot Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/github-bot-signing-key" "$RUNNER_TEMP/github-bot-signing-key.allowed-signers"

      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ github.event.inputs.version }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"

      # The tag_name will have "-rc.X" suffix and be marked as a prerelease for beta releases,
      # and no suffix and marked as a full release for prod releases. The tag has already been
      # created in the step above, so this step just attaches the release to it.

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_BETA: ${{ inputs.beta }}
          IS_LATEST: ${{ steps.release_latest.outputs.is_latest }}
        run: |
          FLAGS=(--latest="$IS_LATEST")
          if [[ "$IS_BETA" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "v$RELEASE_VERSION" --verify-tag \
            --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${FLAGS[@]}"

      - name: Stage Release Artifacts on Main
        if: github.repository == 'paradedb/paradedb' && github.ref_name != 'main' && github.event.inputs.beta != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          IS_LATEST: ${{ steps.release_latest.outputs.is_latest }}
        run: |
          CLEAN_VERSION="${RELEASE_VERSION%%-*}"

          # Record newly created release files and consumed fragment paths from the release commit
          NEW_SQL="pg_search/sql/pg_search--*--${CLEAN_VERSION}.sql"

          # Determine changelog location on the release branch
          # TODO: Legacy accommodation for 0.25.x (remove after 0.25.x is EOL):
          # On 0.25.x, changelog was created in docs/changelog/; on post-reorg branches, in docs/project/changelog/
          if git ls-tree -r --name-only HEAD | grep -q "^docs/project/changelog/${CLEAN_VERSION}\.mdx$"; then
            BRANCH_CHANGELOG="docs/project/changelog/${CLEAN_VERSION}.mdx"
          else
            BRANCH_CHANGELOG="docs/changelog/${CLEAN_VERSION}.mdx"
          fi

          DELETED_FRAGMENTS=$(git diff HEAD~1 --diff-filter=D --name-only -- 'pg_search/sql/unreleased/' 'docs/changelog/unreleased/' 'docs/project/changelog/unreleased/')

          echo "Switching to main branch to sync release artifacts..."
          git fetch --depth=1 --no-tags origin main:main
          git checkout main

          echo "Checking out assembled release files from the release commit..."
          git checkout "v${RELEASE_VERSION}" -- ${NEW_SQL} "${BRANCH_CHANGELOG}"

          # TODO: Legacy accommodation for 0.25.x (remove after 0.25.x is EOL):
          # Move changelog to docs/project/changelog/ if it was checked out from docs/changelog/
          if [[ "$BRANCH_CHANGELOG" == "docs/changelog/"* && -d "docs/project/changelog" ]]; then
            TARGET_CHANGELOG="docs/project/changelog/${CLEAN_VERSION}.mdx"
            echo "Moving legacy changelog $BRANCH_CHANGELOG to $TARGET_CHANGELOG on main..."
            mkdir -p "docs/project/changelog"
            mv "$BRANCH_CHANGELOG" "$TARGET_CHANGELOG"
            rmdir docs/changelog/unreleased docs/changelog 2>/dev/null || true
          fi

          if [[ -n "$DELETED_FRAGMENTS" ]]; then
            echo "Removing consumed fragments from main..."
            echo "$DELETED_FRAGMENTS" | while read -r fragment; do
              if [[ -f "$fragment" ]]; then
                echo " - Removing $fragment"
                rm -f "$fragment"
              fi
              # TODO: Legacy accommodation for 0.25.x (remove after 0.25.x is EOL):
              # If fragment was deleted from docs/changelog/unreleased/ on 0.25.x, also delete counterpart in docs/project/changelog/unreleased/ on main
              if [[ "$fragment" == "docs/changelog/unreleased/"* ]]; then
                alt_fragment="docs/project/changelog/unreleased/${fragment##*/}"
                if [[ -f "$alt_fragment" ]]; then
                  echo " - Removing $alt_fragment"
                  rm -f "$alt_fragment"
                fi
              fi
            done
          fi

          echo "Registering ${CLEAN_VERSION} in docs/docs.json on main (is_latest=${IS_LATEST})..."
          if [[ "$IS_LATEST" == "true" ]]; then
            ./scripts/release.sh changelog "${CLEAN_VERSION}" --register-only --is-latest
          else
            ./scripts/release.sh changelog "${CLEAN_VERSION}" --register-only --no-is-latest
          fi

          git add -A

      - name: Commit Release Artifacts on Main
        id: sync-commit
        if: github.repository == 'paradedb/paradedb' && github.ref_name != 'main' && github.event.inputs.beta != 'true'
        uses: ./.github/actions/commit-with-paradedb-github-app
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          message: "chore: Sync `${{ github.event.inputs.version }}` release artifacts to main."

      - name: Push Release Artifacts on Main
        if: github.repository == 'paradedb/paradedb' && github.ref_name != 'main' && github.event.inputs.beta != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_CREATED: ${{ steps.sync-commit.outputs.created }}
        run: |
          if [[ "$COMMIT_CREATED" == "true" ]]; then
            git push origin main
            echo "✅ Successfully synced release artifacts to main."
          else
            echo "No changes needed on main."
          fi

      - name: Create Stable Branch
        if: github.ref_name == 'main' && github.event.inputs.beta != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUTS_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUTS_VERSION}"
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          STABLE_BRANCH="${MAJOR_MINOR}.x"
          sha=$(git rev-parse HEAD)

          echo "Checking if stable branch refs/heads/${STABLE_BRANCH} exists..."
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${STABLE_BRANCH}" > /dev/null 2>&1; then
            echo "Creating stable branch refs/heads/${STABLE_BRANCH} pointing at $sha"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${STABLE_BRANCH}" \
              -f sha="$sha"
            echo "✅ Created stable branch ${STABLE_BRANCH}"
          else
            echo "ℹ️ Stable branch ${STABLE_BRANCH} already exists."
          fi

  notify-failure:
    name: Notify Release Failure
    needs: [prepare-release, approve-release, publish-github-release]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Slack on Failure
        uses: paradedb/actions/slack-alert@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
