# workflows/publish-paradedb-docs.yml
#
# Publish ParadeDB (Docs)
# Publish the documentation to our Mintlify documentation site.

name: Publish ParadeDB (Docs)

on:
  push:
    tags:
      - "v*"
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      refresh_only:
        description: Refresh the website without publishing docs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-paradedb-docs:
    name: Publish Docs to Mintlify
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'check_run' &&
      !inputs.refresh_only && !contains(github.ref, '-rc.')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish Docs to Mintlify
        env:
          SECRETS_MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
          SECRETS_MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
        run: |
          # Capture the response body and HTTP status separately so a failed deploy
          # surfaces Mintlify's error message instead of just an opaque curl exit code.
          http_code=$(curl -sS -o response.txt -w "%{http_code}" -X POST \
            "https://api.mintlify.com/v1/project/update/${SECRETS_MINTLIFY_PROJECT_ID}" \
            -H "Authorization: Bearer ${SECRETS_MINTLIFY_API_KEY}" \
            -H "Content-Type: application/json")

          echo "HTTP status: ${http_code}"
          echo "Response body:"
          cat response.txt

          # Fail the step on any non-2xx response.
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Mintlify deploy failed with HTTP ${http_code}"
            exit 1
          fi

      - name: Notify Slack on Failure
        if: failure()
        uses: paradedb/actions/slack-alert@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"

  refresh:
    name: Refresh Website MCP
    if: >-
      github.repository == 'paradedb/paradedb' &&
      ((github.event_name == 'workflow_dispatch' && inputs.refresh_only) ||
       (github.event_name == 'check_run' &&
        github.event.check_run.app.id == 222410 &&
        github.event.check_run.name == 'Mintlify Deployment' &&
        github.event.check_run.conclusion == 'success' &&
        contains(github.event.check_run.output.summary, 'https://www.paradedb.com/docs')))
    permissions:
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: refresh-website-docs
      cancel-in-progress: false
    steps:
      - name: Refresh Website Docs
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SUITE_ID: ${{ github.event.check_run.check_suite.id }}
          WEBSITE_DEPLOY_HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "check_run" ]]; then
            branch=$(gh api "repos/$GITHUB_REPOSITORY/check-suites/$CHECK_SUITE_ID" --jq '.head_branch')
            if [[ "$branch" != "main" ]]; then
              echo "Not a production docs deployment; skipping."
              exit 0
            fi
          fi

          : "${WEBSITE_DEPLOY_HOOK_URL:?Set WEBSITE_DEPLOY_HOOK_URL}"
          curl --fail --silent --show-error --max-time 30 --request POST \
            "$WEBSITE_DEPLOY_HOOK_URL" --output response.json
          jq --exit-status '.job.id != null and .job.state != "ERROR" and .job.state != "CANCELED"' response.json > /dev/null
          echo "Website rebuild queued."
