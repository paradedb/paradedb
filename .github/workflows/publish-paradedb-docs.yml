# workflows/publish-paradedb-docs.yml
#
# Publish ParadeDB (Docs)
# Publish the documentation to our Mintlify documentation site.

name: Publish ParadeDB (Docs)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-paradedb-docs:
    name: Publish Docs to Mintlify
    runs-on: ubuntu-latest
    if: github.repository == 'paradedb/paradedb' && !contains(github.ref, '-rc.')
    timeout-minutes: 20
    concurrency:
      group: refresh-website-docs
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Publish Docs and Refresh Website
        env:
          MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          WEBSITE_DEPLOY_HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: python3 .github/scripts/refresh_website_docs.py publish

      - name: Notify Slack on Failure
        if: failure()
        uses: paradedb/actions/slack-alert@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
