# workflows/publish-paradedb-docs.yml
#
# Publish ParadeDB (Docs)
# Request a documentation deployment through the Mintlify project update API.
# Runs on v* tag pushes or manual dispatch; refs containing -rc. are skipped.
# The request uses the configured Mintlify project and does not send the selected
# ref or upload the checked-out docs.

name: Publish ParadeDB (Docs)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-paradedb-docs:
    name: Publish Docs to Mintlify
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-rc.') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Publish Docs to Mintlify
        run: |
          # Capture the response body and HTTP status separately so a failed deploy
          # surfaces Mintlify's error message instead of just an opaque curl exit code.
          http_code=$(curl -sS -o response.txt -w "%{http_code}" -X POST \
            https://api.mintlify.com/v1/project/update/${{ secrets.MINTLIFY_PROJECT_ID }} \
            -H "Authorization: Bearer ${{ secrets.MINTLIFY_API_KEY }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: ${http_code}"
          echo "Response body:"
          cat response.txt

          # Fail the step on any non-2xx response.
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Mintlify deploy failed with HTTP ${http_code}"
            exit 1
          fi

      - name: Notify Slack on Failure
        if: failure()
        uses: paradedb/actions/slack-alert@v14
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
