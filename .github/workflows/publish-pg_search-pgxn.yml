# workflows/publish-pg_search-pgxn.yml
#
# Publish pg_search (PGXN)
# Bundle and publish the pg_search extension source to the PostgreSQL Extension Network (PGXN).

name: Publish pg_search (PGXN)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pg_search-pgxn:
    name: Publish pg_search to PGXN
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-rc.') }}
    container: pgxn/pgxn-tools

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Bundle the Release
        run: make dist

      - name: Release on PGXN
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: pgxn-release
