name: Refresh Website Docs

on:
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  refresh:
    name: Refresh Website MCP
    if: >-
      github.repository == 'paradedb/paradedb' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.check_run.app.id == 222410 &&
        github.event.check_run.name == 'Mintlify Deployment' &&
        github.event.check_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: refresh-website-docs
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Refresh Website Docs
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_DEPLOY_HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "check_run" ]]; then
            python3 .github/scripts/refresh_website_docs.py check
          else
            python3 .github/scripts/refresh_website_docs.py refresh
          fi
