name: Test Benchmark Profiling

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/setup-perf/**"
      - ".github/scripts/profile-postgres.sh"
      - ".github/scripts/test_profile_postgres.py"
      - ".github/workflows/test-benchmark-profiling.yml"
      - ".github/workflows/benchmark-pg_search-benchmarker-cohere.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-postgres:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test profiler lifecycle
        run: python3 -m unittest discover -s .github/scripts -p test_profile_postgres.py -v

      - name: Install host profiler
        uses: ./.github/actions/setup-perf

      - name: Start PostgreSQL
        run: |
          docker run -d --name profile-postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd 'pg_isready -U postgres' --health-interval 1s \
            --health-retries 60 postgres:18
          # shellcheck disable=SC2016
          timeout 90 bash -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" profile-postgres)" = healthy ]; do sleep 1; done'

      - name: Profile a backend created after attachment
        run: |
          bash .github/scripts/profile-postgres.sh profile-postgres profiles/smoke -- \
            docker exec profile-postgres psql -U postgres -v ON_ERROR_STOP=1 \
              -c 'SELECT sum(i) FROM generate_series(1, 10000000) AS i;'
          test -s profiles/smoke/report.txt
          test -s profiles/smoke/report-callgraph.txt
          sudo perf script --input profiles/smoke/perf.data --fields pid --hide-call-graph \
            | tee profiles/smoke/sample-pids.txt > /dev/null
          python3 - <<'PYTHON'
          from pathlib import Path

          profile = Path("profiles/smoke")
          attached = {line.split()[0] for line in (profile / "processes.txt").read_text().splitlines()[1:]}
          sampled = {line.strip() for line in (profile / "sample-pids.txt").read_text().splitlines() if line.strip().isdigit()}
          assert sampled - attached, "No samples from a backend created after perf attached"
          report = (profile / "report.txt").read_text()
          assert "[.]" in report, "No resolved user-space symbols in the report"
          PYTHON

      - name: Upload smoke-test profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: postgres-profiling-smoke
          path: profiles/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f profile-postgres
