name: Test Benchmark Publication

on:
  pull_request:
    paths:
      - ".github/scripts/benchmark_publication.py"
      - ".github/scripts/test_benchmark_publication.py"
      - ".github/actions/publish-benchmark-metrics/**"
      - ".github/actions/publish-queries-results/**"
      - ".github/actions/publish-stressgres-results/**"
      - ".github/actions/publish-benchmarker-results/**"
      - ".github/workflows/publish-benchmark-results.yml"
      - ".github/workflows/test-benchmark-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Publication Retries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s .github/scripts -p test_benchmark_publication.py
