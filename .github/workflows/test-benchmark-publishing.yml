name: Test Benchmark Publishing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/publish-benchmark-results/**"
      - ".github/actions/publish-benchmarker-results/**"
      - ".github/scripts/benchmark-pages.sh"
      - ".github/scripts/benchmark_publication.py"
      - ".github/scripts/test_benchmark_publication.py"
      - ".github/workflows/publish-benchmark-results.yml"
      - ".github/workflows/test-benchmark-publishing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test Benchmark Publication and Sparse Checkout
        run: python3 -m unittest discover -s .github/scripts -p 'test_benchmark_publication.py' -v
