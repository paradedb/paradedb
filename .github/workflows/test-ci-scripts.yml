name: Test CI Scripts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/**"
      - "!.github/scripts/test_release.py"
      - ".github/workflows/test-ci-scripts.yml"
  workflow_dispatch:

concurrency:
  group: test-ci-scripts-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test CI Scripts
        working-directory: .github/scripts
        run: |
          python3 -m pip install PyYAML==6.0.3
          tests=()
          for test in test_*.py; do
            if [[ "$test" != test_release.py ]]; then
              tests+=("$test")
            fi
          done
          python3 -m unittest "${tests[@]}"
