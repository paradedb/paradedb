name: Test Docs Refresh

on:
  pull_request:
    paths:
      - ".github/scripts/refresh_website_docs.py"
      - ".github/scripts/test_refresh_website_docs.py"
      - ".github/workflows/refresh-website-docs.yml"
      - ".github/workflows/publish-paradedb-docs.yml"
      - ".github/workflows/test-docs-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Docs Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test Deployment Gating and Failures
        run: python3 -m unittest discover -s .github/scripts -p test_refresh_website_docs.py -v
