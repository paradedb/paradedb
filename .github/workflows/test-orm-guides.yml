name: Test ORM Guides

on:
  pull_request:
    paths:
      - "docs/guides/**"
      - ".github/scripts/extract_orm_guides.py"
      - ".github/workflows/test-orm-guides.yml"
  workflow_dispatch:

concurrency:
  group: test-orm-guides-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guides:
    name: ${{ matrix.orm }} guides
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orm: [drizzle, django, sqlalchemy, rails, efcore]
    services:
      paradedb:
        image: paradedb/paradedb:0.25.9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract guide projects
        run: python .github/scripts/extract_orm_guides.py "${{ matrix.orm }}" "$RUNNER_TEMP/orm-guides"

      - name: Set up Node.js
        if: matrix.orm == 'drizzle'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Drizzle dependencies
        if: matrix.orm == 'drizzle'
        working-directory: ${{ runner.temp }}/orm-guides
        run: |
          npm init -y
          npm pkg set type=module
          npm install drizzle-orm@1.0.0-rc.4 postgres @paradedb/drizzle-paradedb@0.5.0 tsx

      - name: Install Django dependencies
        if: matrix.orm == 'django'
        run: pip install django-paradedb==0.13.0 "psycopg[binary]" django-cte httpx python-dotenv

      - name: Install SQLAlchemy dependencies
        if: matrix.orm == 'sqlalchemy'
        run: |
          pip install sqlalchemy-paradedb==0.11.0 "psycopg[binary]"
          echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: Set up Ruby
        if: matrix.orm == 'rails'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Rails dependencies
        if: matrix.orm == 'rails'
        working-directory: ${{ runner.temp }}/orm-guides
        run: bundle install

      - name: Set up .NET
        if: matrix.orm == 'efcore'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run guides
        working-directory: ${{ runner.temp }}/orm-guides
        run: bash run-guides.sh
