# workflows/test-paradedb-docs.yml
#
# Test ParadeDB (Docs)
# Test our documentation for broken links via Mintlify.

name: Test ParadeDB (Docs)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-paradedb-docs.yml"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-paradedb-docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-paradedb-docs:
    name: Test Docs for Broken Links, SEO Issues, and Code Snippets
    runs-on:
      # Compute-optimized c-family — Rust + Postgres tests are CPU-bound.
      # See https://runs-on.com/configuration/job-labels/ — runs in us-east-1.
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c7g+c8g
      - cpu=8
      - ram=16
      - image=ubuntu24-full-arm64
      - volume=80gb # default runner ships with 30GB — see https://runs-on.com/runners/linux/
      - extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        pg_version: [18]

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: "" # Use .cargo/config.toml target-cpu flags

      - name: Extract pgrx Version
        id: pgrx
        run: echo "version=$(sed -nE 's/^pgrx = "=?([^"]+)"$/\1/p' Cargo.toml)" >> $GITHUB_OUTPUT

      # Cache notes:
      # - Do NOT add hashFiles('**/Cargo.lock') or arch to shared-key.
      #   See test-pg_search.yml for rationale.
      - name: Install Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: "v3-rust-cache"
          shared-key: pg${{ matrix.pg_version }}
          cache-targets: true
          cache-all-crates: true
          # We don't save the cache here to avoid thrashing. The cache is only saved on the nightly run of test-pg_search.yml
          save-if: false

      - name: Install System Dependencies
        uses: paradedb/actions/apt-install@v14
        with:
          packages: libsecret-1-dev libopenblas-dev lld

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Mintlify CLI
        run: npm install -g mintlify

      - name: Test Docs for Broken Links
        working-directory: docs/
        run: |
          output=$(mintlify broken-links 2>&1) || true
          echo "$output"
          if [[ "$output" == *"success no broken links found"* ]]; then
            echo "No broken links found."
          else
            echo "Broken links found. See output above for details."
            exit 1
          fi

      # Check that:
      # - There are no underscores in URLs
      # - Each .mdx file has a title, description, and canonical URL
      # - Each canonical URL matches the file path
      - name: Test for SEO Issues
        working-directory: docs/
        run: |
          echo "Running SEO validation..."

          echo ""
          echo "Checking for underscores in URLs..."
          files=$(find . -type f -name "*_*" ! -path "./images/*" ! -path "./logo/*")
          if [ -n "$files" ]; then
            echo "❌ Found files with underscores:"
            echo "$files" | sed 's/^/  - /'
            exit 1
          else
            echo "✅ No filenames with underscores (excluding /images/ and /logo/)."
          fi

          echo ""
          echo "Checking that each file has title, description, and canonical URL..."
          missing_meta=0
          for file in $(find . -name "*.mdx" \
            ! -path "./changelog/unreleased/*" \
            ! -path "./project/changelog/*" \
            ! -path "./snippets/*"); do

            title=$(grep -E "^title:" "$file" || true)
            desc=$(grep -E "^description:" "$file" || true)
            canonical=$(grep -E "^canonical:" "$file" || true)

            if [ -z "$title" ] || [ -z "$desc" ] || [ -z "$canonical" ]; then
              echo "❌ Missing metadata in $file"
              missing_meta=1
              continue
            fi

            # Build expected canonical: https://www.paradedb.com/docs/<relative path without .mdx>
            relative_path=$(echo "$file" | sed 's|^\./||; s|\.mdx$||; s|^docs/||')
            expected_canonical="https://www.paradedb.com/docs/${relative_path}"

            # Extract canonical from file (strip 'canonical:' and whitespace)
            found_canonical=$(echo "$canonical" | sed 's/^canonical:[[:space:]]*//')

            if [ "$found_canonical" != "$expected_canonical" ]; then
              echo "❌ Canonical URL mismatch in $file"
              echo "   Expected: $expected_canonical"
              echo "   Found:    $found_canonical"
              missing_meta=1
            fi
          done

          if [ "$missing_meta" -eq 1 ]; then
            exit 1
          else
            echo "✅ All files have proper metadata and canonical URLs."
          fi

          echo "🎉 All SEO checks passed!"

      - name: Install pgrx
        run: cargo install -j $(nproc) --locked cargo-pgrx --version "${{ steps.pgrx.outputs.version }}" --debug

      - name: Initialize pgrx Environment
        run: cargo pgrx init "--pg${{ matrix.pg_version }}=download" --configure-flag="--without-readline"

      - name: Add pgrx PostgreSQL binaries to PATH
        run: echo "$(ls -d ~/.pgrx/${{ matrix.pg_version }}.*/pgrx-install/bin | head -n 1)" >> $GITHUB_PATH

      - name: Install pgvector (pgrx-managed Postgres)
        run: |
          git clone --branch v0.8.6 https://github.com/pgvector/pgvector.git
          cd pgvector/
          PG_CONFIG=$(ls -d ~/.pgrx/${{ matrix.pg_version }}.*/pgrx-install/bin/pg_config | head -n 1)
          make PG_CONFIG="$PG_CONFIG" -j
          make PG_CONFIG="$PG_CONFIG" install -j

      - name: Compile & install pg_search extension (pgrx)
        working-directory: pg_search/
        run: cargo pgrx install --pg-config ~/.pgrx/${{ matrix.pg_version }}.*/pgrx-install/bin/pg_config --features="pg${{ matrix.pg_version }},block_tracker"

      - name: Add extension to shared_preload_libraries
        working-directory: /home/runner/.pgrx/data-${{ matrix.pg_version }}/
        run: sed -i "s/^#shared_preload_libraries = .*/shared_preload_libraries = 'pg_search'/" postgresql.conf

      - name: Start Postgres (pgrx)
        working-directory: tests/
        run: RUST_BACKTRACE=1 cargo pgrx start pg${{ matrix.pg_version }}

      - name: Smoke Test Code Snippets
        run: ./.github/scripts/smoke_test_code_snippets.sh

  guides:
    name: ${{ matrix.orm }} guides
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orm: [drizzle, django, sqlalchemy, rails, efcore]
    services:
      paradedb:
        image: paradedb/paradedb:0.25.9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract guide projects
        run: python .github/scripts/extract_orm_guides.py "${{ matrix.orm }}" "$RUNNER_TEMP/orm-guides"

      - name: Set up Node.js
        if: matrix.orm == 'drizzle'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Drizzle dependencies
        if: matrix.orm == 'drizzle'
        working-directory: ${{ runner.temp }}/orm-guides
        run: |
          npm init -y
          npm pkg set type=module
          npm install drizzle-orm@1.0.0-rc.4 postgres @paradedb/drizzle-paradedb@0.5.0 tsx

      - name: Install Django dependencies
        if: matrix.orm == 'django'
        run: pip install django-paradedb==0.13.0 "psycopg[binary]" django-cte httpx python-dotenv

      - name: Install SQLAlchemy dependencies
        if: matrix.orm == 'sqlalchemy'
        run: |
          pip install sqlalchemy-paradedb==0.11.0 "psycopg[binary]"
          echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: Set up Ruby
        if: matrix.orm == 'rails'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Rails dependencies
        if: matrix.orm == 'rails'
        working-directory: ${{ runner.temp }}/orm-guides
        run: bundle install

      - name: Set up .NET
        if: matrix.orm == 'efcore'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run guides
        working-directory: ${{ runner.temp }}/orm-guides
        run: bash run-guides.sh
