# workflows/test-pg_search-cloud.yml
#
# Test pg_search (Cloud)
# Build and publish a source image for manual testing in ParadeDB Cloud.
# Compile pg_search from the selected source revision and install it into a released
# ParadeDB image. PRs build and smoke-test locally on the runner; manual runs also
# publish the image to Docker Hub for use in staging.

name: Test pg_search (Cloud)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-pg_search-cloud.yml"
      - "docker/Dockerfile.source"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA to build for Cloud testing. Run the workflow from main."
        required: true
        type: string
        default: main

concurrency:
  group: test-pg_search-cloud-${{ inputs.source_ref || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-source-image:
    name: Build and Test Source Image
    runs-on:
      - runs-on=${{ github.run_id }}
      - spot=false
      - family=m7g+m8g
      - cpu=16
      - ram=64
      - image=ubuntu24-full-arm64
      - extras=s3-cache
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.image.outputs.source_sha }}
      extension_version: ${{ steps.image.outputs.extension_version }}

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keep image assembly from the workflow ref even when building an older SHA.
      - name: Prepare Image Context
        run: |
          mkdir -p "$RUNNER_TEMP/source-image"
          cp docker/Dockerfile.source "$RUNNER_TEMP/source-image/Dockerfile"

      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Build pg_search from Source
        id: build
        uses: paradedb/actions/build-pg_search-source@v14
        with:
          pg-version: "18"
          profile: release
          cache-prefix-key: "v1-cloud-rust-cache"
          cache-save: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Assemble Source Image
        id: image
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifacts-dir }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          version="$(sed -nE "s/^default_version[[:space:]]*=[[:space:]]*'([^']+)'[[:space:]]*$/\1/p" "$ARTIFACTS/usr/share/postgresql/18/extension/pg_search.control")"
          [[ "$version" =~ ^[a-zA-Z0-9._-]{1,64}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "extension_version=$version" >> "$GITHUB_OUTPUT"
          cp -R "$ARTIFACTS" "$RUNNER_TEMP/source-image/artifacts"
          docker build --pull --platform linux/arm64 \
            --file "$RUNNER_TEMP/source-image/Dockerfile" \
            --build-arg "BASE_IMAGE=$GITHUB_REPOSITORY:latest-pg18" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$source_sha" \
            --label "com.paradedb.extension-version=$version" \
            --tag paradedb-development "$RUNNER_TEMP/source-image"

      - name: Smoke Test Development Image
        env:
          EXTENSION_VERSION: ${{ steps.image.outputs.extension_version }}
        run: |
          set -euo pipefail
          trap 'docker logs development-db; docker rm -f development-db' EXIT
          docker run -d --name development-db \
            -e POSTGRES_PASSWORD=development-test \
            paradedb-development
          ready=false
          for attempt in $(seq 1 90); do
            echo "Waiting for PostgreSQL ($attempt/90)"
            if docker exec development-db pg_isready -h localhost -U postgres; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          actual="$(docker exec development-db psql -U postgres -Atc "SELECT extversion FROM pg_extension WHERE extname = 'pg_search'")"
          [[ "$actual" == "$EXTENSION_VERSION" ]]
          docker exec -i development-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE development_smoke (id bigint PRIMARY KEY, description text);
          INSERT INTO development_smoke VALUES (1, 'running shoes'), (2, 'winter boots');
          CREATE INDEX development_smoke_idx ON development_smoke
            USING bm25 (id, description) WITH (key_field = 'id');
          DO $$
          BEGIN
            IF (SELECT count(*) FROM development_smoke WHERE description @@@ 'shoes') != 1 THEN
              RAISE EXCEPTION 'pg_search smoke test failed';
            END IF;
          END $$;
          SQL

      - name: Save Tested Image
        if: github.event_name == 'workflow_dispatch'
        run: docker save paradedb-development | gzip > development-image.tar.gz

      - name: Upload Tested Image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: development-image
          path: development-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-source-image:
    name: Publish Tested Development Image
    needs: build-source-image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Tested Image
        uses: actions/download-artifact@v8
        with:
          name: development-image

      - name: Load Tested Image
        run: docker load --input development-image.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Publish Development Image
        id: image
        env:
          SOURCE_SHA: ${{ needs.build-source-image.outputs.source_sha }}
        run: |
          image="$GITHUB_REPOSITORY:18-dev-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag paradedb-development "$image"
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" == *@sha256:* ]]
          echo "ref=$image@${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "tag=$image" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Development Image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: cosign sign --yes "$IMAGE"

      - name: Summarize Development Image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.image.outputs.tag }}
          SOURCE_SHA: ${{ needs.build-source-image.outputs.source_sha }}
          EXTENSION_VERSION: ${{ needs.build-source-image.outputs.extension_version }}
        run: |
          {
            echo "Source: $GITHUB_REPOSITORY @ $SOURCE_SHA"
            echo "Tag: $TAG"
            echo "Image reference: $IMAGE"
            echo "pg_search version: $EXTENSION_VERSION"
            echo "Platform: PostgreSQL 18, linux/arm64"
            echo 'Use the image reference and pg_search version in the staging console under the paradedb organization.'
          } >> "$GITHUB_STEP_SUMMARY"
