# workflows/test-pg_search-cloud.yml
#
# Test pg_search (Cloud)
# Build and publish a source image for manual testing in ParadeDB Cloud.
# Compile pg_search from the selected source revision and install it into a released
# ParadeDB image, then publish it to Docker Hub for use in staging.

name: Test pg_search (Cloud)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA to build for Cloud testing. Run the workflow from main."
        required: true
        type: string
        default: main

concurrency:
  group: test-pg_search-cloud-${{ inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Sign the published image with Cosign.

jobs:
  test-pg_search-cloud:
    name: Build and Publish Cloud Test Image
    runs-on:
      - runs-on=${{ github.run_id }}
      - spot=false
      - family=m7g+m8g # M instances provide 4 GiB RAM per vCPU for these workloads.
      - cpu=16
      - ram=64
      - image=ubuntu26-full-arm64
      - extras=s3-cache
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keep image assembly from the workflow ref even when building an older SHA.
      - name: Prepare Image Context
        run: |
          mkdir -p "$RUNNER_TEMP/source-image"
          cp docker/Dockerfile.source "$RUNNER_TEMP/source-image/Dockerfile"

      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Resolve Runtime Base Image
        id: base-image
        run: |
          image="$GITHUB_REPOSITORY:latest-pg18"
          docker pull "$image"
          echo "image=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Source Metadata
        id: image
        run: |
          source_sha="$(git rev-parse HEAD)"
          version=$(python3 - <<'PYTHON'
          import tomllib
          from pathlib import Path
          package = tomllib.loads(Path("pg_search/Cargo.toml").read_text())["package"]
          version = package["version"]
          if isinstance(version, dict):
              version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          print(version)
          PYTHON
          )
          [[ "$version" =~ ^[a-zA-Z0-9._-]{1,64}$ ]]
          {
            echo "source_sha=$source_sha"
            echo "extension_version=$version"
            echo "tag=$GITHUB_REPOSITORY:18-$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and Publish Cloud Test Image
        id: published-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ runner.temp }}/source-image/Dockerfile
          platforms: linux/arm64
          build-args: BASE_IMAGE=${{ steps.base-image.outputs.image }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.source_sha }}
            com.paradedb.extension-version=${{ steps.image.outputs.extension_version }}
          cache-from: type=gha,scope=cloud-source-pg18-arm64
          cache-to: type=gha,mode=max,scope=cloud-source-pg18-arm64

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Cloud Test Image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.published-image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Summarize Cloud Test Image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.published-image.outputs.digest }}
          TAG: ${{ steps.image.outputs.tag }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
          EXTENSION_VERSION: ${{ steps.image.outputs.extension_version }}
        run: |
          {
            echo "Source: $GITHUB_REPOSITORY @ $SOURCE_SHA"
            echo "Tag: $TAG"
            echo "Image reference: $IMAGE"
            echo "pg_search version: $EXTENSION_VERSION"
            echo "Platform: PostgreSQL 18, linux/arm64"
            echo 'Use the digest-pinned image reference in the staging console under the paradedb organization.'
          } >> "$GITHUB_STEP_SUMMARY"
