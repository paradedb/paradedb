# workflows/test-pg_search-cloud.yml
#
# Test pg_search (Cloud)
# Build and publish a source image for manual testing in ParadeDB Cloud.
# Compile pg_search from the selected source revision and install it into a released
# ParadeDB image, then publish it to Docker Hub for use in staging.

name: Test pg_search (Cloud)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA to build for Cloud testing. Run the workflow from main."
        required: true
        type: string
        default: main

concurrency:
  group: test-pg_search-cloud-${{ inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Sign the published image with Cosign.

jobs:
  test-pg_search-cloud:
    name: Build and Publish Cloud Test Image
    runs-on:
      - runs-on=${{ github.run_id }}
      - spot=false
      - family=m7g+m8g # M instances provide 4 GiB RAM per vCPU for these workloads.
      - cpu=16
      - ram=64
      - image=ubuntu26-full-arm64
      - extras=s3-cache
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # With extras=s3-cache, configure RunsOn before cache or artifact operations.
      - name: Configure RunsOn Caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      # Keep image assembly from the workflow ref even when building an older SHA.
      - name: Prepare Image Context
        run: |
          mkdir -p "$RUNNER_TEMP/source-image"
          cp docker/Dockerfile.source "$RUNNER_TEMP/source-image/Dockerfile"

      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Resolve Image Tag
        id: image
        run: echo "tag=$GITHUB_REPOSITORY:18-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and Publish Cloud Test Image
        id: published-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ runner.temp }}/source-image/Dockerfile
          platforms: linux/arm64
          build-args: BASE_IMAGE=${{ github.repository }}:latest-pg18
          pull: true
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=cloud-source-pg18-arm64
          cache-to: type=gha,mode=max,scope=cloud-source-pg18-arm64

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2; Upstream does not publish a moving @v4 tag

      - name: Sign Cloud Test Image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.published-image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Summarize Cloud Test Image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.published-image.outputs.digest }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo "Tag: $TAG"
            echo "Image reference: $IMAGE"
            echo "Platform: PostgreSQL 18, linux/arm64"
            echo 'Use the digest-pinned image reference in the staging console under the paradedb organization.'
          } >> "$GITHUB_STEP_SUMMARY"
