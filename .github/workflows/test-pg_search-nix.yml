# Release preparation refreshes the hash via scripts/release.sh set-version.
# Run this check manually to diagnose a stale hash on a specific ref.

name: Test pg_search (Nix)

on:
  workflow_dispatch:

concurrency:
  group: test-pg_search-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-cargo-hash-check:
    name: Verify Nix Cargo Hash
    runs-on: ubuntu-latest
    env:
      PG_MAJOR_VERSION: "18"

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1

      - name: Verify Nix Cargo Hash
        run: nix build --no-link ".#pg_search-pg${PG_MAJOR_VERSION}.cargoDeps"
