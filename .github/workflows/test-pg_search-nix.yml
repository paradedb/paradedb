# Build the Nix package for packaging changes or on demand. Its Rust dependencies come from Cargo.lock.

name: Test pg_search (Nix)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-pg_search-nix.yml"
      - "nix/**"
      - "flake.lock"
      - "flake.nix"
  workflow_dispatch:

concurrency:
  group: test-pg_search-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-build:
    name: Build pg_search with Nix
    runs-on: ubuntu-latest
    env:
      PG_MAJOR_VERSION: "18"

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1

      - name: Build pg_search with Nix
        run: nix build --print-build-logs --no-link ".#pg_search-pg${PG_MAJOR_VERSION}"
