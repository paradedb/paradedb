# workflows/test-pg_search-schema.yml
#
# SchemaBot Generate Diff
# Determine if a commit introduces an extension schema change for pg_search

name: Test pg_search (Schema)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/check_migration_diff.py"
      - ".github/actions/setup-pg-search-toolchain/**"
      - ".github/workflows/test-pg_search-schema.yml"
      - "pg_search/**"
      - "!pg_search/README.md"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: test-pg_search-schema-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-pg_search-schema:
    name: SchemaBot
    runs-on:
      # Compute-optimized c-family — Rust schema generation is CPU-bound.
      # See https://runs-on.com/configuration/job-labels/ — runs in us-east-1.
      - runs-on=${{ github.run_id }}
      - family=c7g+c8g
      - cpu=8
      - ram=16
      - image=ubuntu24-full-arm64
      - extras=s3-cache
      - volume=80gb # default runner ships with 30GB — see https://runs-on.com/runners/linux/
    defaults:
      run:
        shell: bash -eo pipefail {0}
    strategy:
      matrix:
        pg_version: [18]

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch the entire history
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      # Do NOT add hashFiles('**/Cargo.lock') or arch to shared-key.
      # See test-pg_search.yml for rationale.
      # Only save cache on non-PR events; PRs restore from the default branch.
      # See test-pg_search.yml for rationale.
      - name: Set Up pg_search Toolchain
        id: toolchain
        uses: ./.github/actions/setup-pg-search-toolchain
        with:
          pg_version: ${{ matrix.pg_version }}

      - name: Install & Configure Supported PostgreSQL Version
        uses: ./.github/actions/setup-postgres
        with:
          pg_version: ${{ matrix.pg_version }}

      - name: Install OpenBLAS (superkmeans-rs BLAS backend)
        run: |
          sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install pg-schema-diff and its Required Dependencies
        run: |
          sudo apt install clang lld llvm diffutils
          cargo install -j $(nproc) --git https://github.com/paradedb/pg-schema-diff.git --debug --force

      - name: Initialize pgrx Environment
        run: |
          cargo pgrx init "--pg${{ matrix.pg_version }}=/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config"
          # Save the pgrx version for comparison later
          echo "FIRST_PGRX_VERSION=${{ steps.toolchain.outputs.pgrx_version }}" >> $GITHUB_ENV

      - name: Generate Schema from this git rev
        run: cargo pgrx schema -p pg_search pg${{ matrix.pg_version }} > ~/this.sql

      - name: Switch to Base git rev and Generate Schema Again
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          # Switch to the base git rev
          git checkout .

          # Fetch the base ref from the upstream repository (the repo the PR
          # targets), not from the PR head's repo. For fork-based PRs the head
          # repo's `main` branch is often stale, which would otherwise produce
          # a misleading schema diff (and pull in a stale pgrx version below).
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${BASE_REPO}.git"
          git fetch --depth=1 upstream "${BASE_REF}"
          git checkout FETCH_HEAD

          # See if we need a different cargo-pgrx and install it if so
          THIS_PGRX_VERSION=$(sed -nE 's/^pgrx = "=?([^"]+)"$/\1/p' Cargo.toml)
          if [[ "${THIS_PGRX_VERSION}" != "${FIRST_PGRX_VERSION}" ]]; then
            # Install cargo-pgrx
            cargo install -j $(nproc) --locked cargo-pgrx --version ${THIS_PGRX_VERSION} --force --debug

            # Initialize it (again) -- probably unnecessary, but might as well in case ~/.pgrx/config.toml ever changes
            cargo pgrx init "--pg${{ matrix.pg_version }}=/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config"
          fi

          # Generate schema
          cargo pgrx schema -p pg_search pg${{ matrix.pg_version }} > ~/old.sql

      - name: Generate Schema Diffs
        run: |
          # Run pg-schema-diff and capture its exit code
          # Note: Only capture stdout (the actual diff), stderr goes to terminal for debugging
          set +e  # Temporarily disable exit on error
          pg-schema-diff diff ~/old.sql ~/this.sql > ~/diff.sql 2>&1
          PG_SCHEMA_DIFF_EXIT=$?
          set -e  # Re-enable exit on error

          # Check if pg-schema-diff crashed or had an error
          if [ $PG_SCHEMA_DIFF_EXIT -ne 0 ]; then
            echo "❌ ERROR: pg-schema-diff failed with exit code $PG_SCHEMA_DIFF_EXIT"
            echo "Output:"
            cat ~/diff.sql
            exit 1
          fi

          # Show the schema diff
          echo "Schema diff generated successfully:"
          cat ~/diff.sql

          # Remove trailing newlines from diff for comparison
          perl -i -pe 'chomp if eof' ~/diff.sql

      - name: Switch Back to PR Branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref }}
        run: |
          # Switch back to the PR branch to check the migration file
          git checkout "$HEAD_REF"

      - name: Check Schema Diff and Validate Migration Fragment
        id: check_schema_diff
        run: |
          if test -s ~/diff.sql; then
            echo "=========================================="
            echo "SCHEMA DIFFERENCE DETECTED"
            echo "=========================================="
            echo
            echo "A suggested upgrade.sql script follows. Please review it carefully as SchemaBot is not infallible."
            echo
            echo "--- BEGIN SUGGESTED UPGRADE SCRIPT ---"
            cat ~/diff.sql
            echo "--- END SUGGESTED UPGRADE SCRIPT ---"
            echo
            echo "=========================================="

            PR_NUMBER="${{ github.event.pull_request.number }}"
            shopt -s nullglob

            if [ -n "$PR_NUMBER" ]; then
              MATCHING_FILES=(pg_search/sql/unreleased/"${PR_NUMBER}".*.sql)
            else
              # Fallback for non-PR events (workflow_dispatch, push)
              MATCHING_FILES=(pg_search/sql/unreleased/*.sql)
            fi

            if (( ${#MATCHING_FILES[@]} == 0 )); then
              echo "❌ ERROR: Schema changed but no SQL migration fragment found in pg_search/sql/unreleased/"
              if [ -n "$PR_NUMBER" ]; then
                echo "Expected file: pg_search/sql/unreleased/${PR_NUMBER}.<short_description>.sql"
              else
                echo "Expected file: pg_search/sql/unreleased/<PR_NUMBER>.<short_description>.sql"
              fi
              echo "Please create a fragment file containing the required schema changes shown above."
              exit 1
            fi

            echo "Found migration fragment(s):"
            for f in "${MATCHING_FILES[@]}"; do
              echo " - $f"
            done
            echo

            # Concatenate matching fragments into a temporary file for validation
            COMBINED_FRAGMENT=$(mktemp)
            cat "${MATCHING_FILES[@]}" > "$COMBINED_FRAGMENT"

            echo "Checking if migration fragment(s) contain all schema changes (order-independent)..."

            # Compare schema changes independent of order, since pg-schema-diff output order is non-deterministic
            if ! python3 .github/scripts/check_migration_diff.py ~/diff.sql "$COMBINED_FRAGMENT" --debug; then
              rm -f "$COMBINED_FRAGMENT"
              echo
              echo "The migration fragment(s) need to be updated."
              echo "Please ensure all the schema changes shown above are in your fragment file(s)."
              echo
              echo "ℹ️  NOTE: If you need to modify the SchemaBot-generated diff because it's incorrect,"
              echo "   please update the schema diff generation logic at:"
              echo "   https://github.com/paradedb/pg-schema-diff"
              exit 1
            fi
            rm -f "$COMBINED_FRAGMENT"
          else
            echo "✅ No schema difference detected"
            echo "schema_diff_detected=false" >> $GITHUB_OUTPUT
          fi
