# workflows/test-pg_search-upgrade.yml
#
# Test pg_search (Upgrade)
# Test that the pg_search extension can upgrade via ALTER EXTENSION.

name: Test pg_search (Upgrade)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/setup-pg-search-toolchain/**"
      - ".github/actions/test-pg_search-upgrade/**"
      - ".github/scripts/release.py"
      - ".github/workflows/test-pg_search-upgrade.yml"
      - "pg_search/**"
      - "!pg_search/README.md"
      - "tests/**"
      - "tokenizers/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: test-pg_search-upgrade-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Test the newest release in this checkout's SQL chain and the pinned legacy release.
  discover-upgrade-starting-points:
    name: Discover upgrade starting points
    runs-on: ubuntu-latest
    outputs:
      prior_matrix: ${{ steps.compute.outputs.prior_matrix }}
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch Release Tags
        run: git fetch --depth=1 --no-tags origin "+refs/tags/v*:refs/tags/v*"

      - name: Compute prior versions
        id: compute
        run: |
          set -euo pipefail
          LATEST_TAG=$(./scripts/release.sh latest-sql-version --released)
          LATEST_PGRX=$(git show "$LATEST_TAG:Cargo.toml" | sed -nE 's/^pgrx = "=?([^"]+)"$/\1/p' | head -1)
          if [ -z "$LATEST_PGRX" ]; then
            echo "Could not determine pgrx version at $LATEST_TAG" >&2
            exit 1
          fi
          echo "Resolved latest tag=$LATEST_TAG pgrx=$LATEST_PGRX"

          # v0.25.0 is the first stable release with vector indexes and also
          # preserves legacy tokenizer coverage. Dedup if it is the latest tag.
          MATRIX=$(jq -nc --arg p "$LATEST_TAG" --arg pgrx "$LATEST_PGRX" '[
            { "pg_search_version": "v0.25.0", "pgrx_version": "0.19.0" },
            { "pg_search_version": $p, "pgrx_version": $pgrx }
          ] | unique_by(.pg_search_version)')
          echo "prior_matrix=$MATRIX" >> $GITHUB_OUTPUT

  test-pg_search-upgrade:
    name: Test upgrading pg_search via ALTER EXTENSION
    needs: discover-upgrade-starting-points
    runs-on:
      # Compute-optimized c-family — Rust + Postgres tests are CPU-bound.
      # See https://runs-on.com/configuration/job-labels/ — runs in us-east-1.
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c7g+c8g
      - cpu=8
      - ram=16
      - image=ubuntu26-full-arm64
      - volume=80gb # default runner ships with 30GB — see https://runs-on.com/runners/linux/
      - extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        pg_version: [18]
        prior: ${{ fromJSON(needs.discover-upgrade-starting-points.outputs.prior_matrix) }}

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # With extras=s3-cache, configure RunsOn before cache or artifact operations.
      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Fetch Release Tags
        run: git fetch --depth=1 --no-tags origin "+refs/tags/v*:refs/tags/v*"

      # Do NOT add hashFiles('**/Cargo.lock') or arch to shared-key.
      # See test-pg_search.yml for rationale.
      - name: Set Up pg_search Toolchain
        uses: ./.github/actions/setup-pg-search-toolchain
        with:
          pg_version: ${{ matrix.pg_version }}
          # The upgrade action intentionally installs the prior and current
          # cargo-pgrx versions itself as it switches source revisions.
          install_cargo_pgrx: "false"

      - name: Install required system tools
        uses: paradedb/actions/apt-install@v14
        with:
          packages: lsof libopenblas-dev lld gdb

      - name: Enable Crash Dumps
        run: ./.github/scripts/setup_crashdumps.sh

      - name: Install & Configure Supported PostgreSQL Version
        uses: ./.github/actions/setup-postgres
        with:
          pg_version: ${{ matrix.pg_version }}
          initialize_pgrx: "false"

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Test Upgrade from ${{ matrix.prior.pg_search_version }}
        uses: ./.github/actions/test-pg_search-upgrade
        with:
          prior_pg_search_version: ${{ matrix.prior.pg_search_version }}
          prior_pgrx_version: ${{ matrix.prior.pgrx_version }}
          pg_version: ${{ matrix.pg_version }}
