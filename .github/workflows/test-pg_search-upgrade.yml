name: Verify range tokenizer upgrade regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-and-fix:
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c7g+c8g
      - cpu=8
      - ram=16
      - image=ubuntu26-full-arm64
      - volume=80gb
      - extras=s3-cache
    env:
      PGHOST: /tmp/range-upgrade-socket
      PGPORT: 55487
      PGDATABASE: postgres
      PGDATA: /tmp/range-upgrade-data
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: runs-on/action@v2
      - uses: ./.github/actions/setup-pg-search-toolchain
        with:
          pg_version: 18
      - uses: paradedb/actions/apt-install@v14
        with:
          packages: libopenblas-dev lld
      - uses: ./.github/actions/setup-postgres
        with:
          pg_version: 18

      - name: Download the released 0.25.11 and 0.26.2 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/range-upgrade-evidence /tmp/range-upgrade-packages "$PGHOST"
          for version in 0.25.11 0.26.2; do
            gh release download "v$version" --repo paradedb/paradedb \
              --pattern "postgresql-18-pg-search_${version}-1PARADEDB-resolute_arm64.deb" \
              --dir /tmp/range-upgrade-packages
          done
          git diff v0.26.2 -- pg_search/src/index/search.rs | tee /tmp/range-upgrade-evidence/fix.patch
          test "$(git diff --name-only v0.26.2 -- '*.rs')" = pg_search/src/index/search.rs

      - name: Create and query the range index on released 0.25.11
        run: |
          set -euo pipefail
          sudo dpkg -i /tmp/range-upgrade-packages/postgresql-18-pg-search_0.25.11-1PARADEDB-resolute_arm64.deb
          initdb -D "$PGDATA" -A trust --no-locale
          cat >> "$PGDATA/postgresql.conf" <<'CONF'
          shared_preload_libraries = 'pg_search'
          port = 55487
          unix_socket_directories = '/tmp/range-upgrade-socket'
          listen_addresses = ''
          CONF
          pg_ctl -D "$PGDATA" -l /tmp/range-upgrade-evidence/postgres.log -w start
          psql -X -v ON_ERROR_STOP=1 <<'SQL' | tee /tmp/range-upgrade-evidence/old-version.log
          CREATE EXTENSION pg_search CASCADE;
          SELECT version();
          SELECT extversion FROM pg_extension WHERE extname = 'pg_search';
          CREATE TABLE range_tokenizers (id INTEGER PRIMARY KEY, amount_range INT8RANGE, date_range DATERANGE);
          INSERT INTO range_tokenizers VALUES (1, '[100,200)', '[2026-01-01,2026-02-01)');
          CREATE INDEX range_tokenizers_idx ON range_tokenizers USING paradedb (id, amount_range, date_range)
              WITH (key_field = 'id', layer_sizes = '0', background_layer_sizes = '0');
          CREATE TABLE original_index AS
              SELECT 'range_tokenizers_idx'::regclass::oid AS index_oid,
                  pg_relation_filenode('range_tokenizers_idx') AS filenode;
          CREATE TABLE original_schema AS SELECT name, tokenizer FROM paradedb.schema('range_tokenizers_idx');
          TABLE original_schema;
          SELECT * FROM range_tokenizers WHERE id @@@ paradedb.all() ORDER BY id;
          DO $$ BEGIN
              ASSERT (SELECT extversion FROM pg_extension WHERE extname = 'pg_search') = '0.25.11';
              ASSERT (SELECT tokenizer FROM original_schema WHERE name = 'amount_range') = 'unicode_words_removeemojis:false';
          END $$;
          SQL
          pg_ctl -D "$PGDATA" -m fast -w stop

      - name: Upgrade to released 0.26.2 and verify the mutable segment error
        run: |
          set -euo pipefail
          sudo dpkg -i /tmp/range-upgrade-packages/postgresql-18-pg-search_0.26.2-1PARADEDB-resolute_arm64.deb
          pg_ctl -D "$PGDATA" -l /tmp/range-upgrade-evidence/postgres.log -w start
          psql -X -v ON_ERROR_STOP=1 <<'SQL' | tee /tmp/range-upgrade-evidence/unpatched-upgrade.log
          ALTER EXTENSION pg_search UPDATE TO '0.26.2';
          SELECT extversion FROM pg_extension WHERE extname = 'pg_search';
          SET paradedb.global_mutable_segment_rows = 1000;
          INSERT INTO range_tokenizers VALUES (2, '[200,300)', '[2026-02-01,2026-03-01)');
          SELECT mutable, num_docs FROM paradedb.index_info('range_tokenizers_idx');
          DO $$ BEGIN
              ASSERT (SELECT extversion FROM pg_extension WHERE extname = 'pg_search') = '0.26.2';
              ASSERT EXISTS (SELECT 1 FROM paradedb.index_info('range_tokenizers_idx') WHERE mutable);
          END $$;
          SQL
          if psql -X -v ON_ERROR_STOP=1 -c 'SELECT * FROM range_tokenizers WHERE id @@@ paradedb.all() ORDER BY id' \
              > /tmp/range-upgrade-evidence/expected-error.log 2>&1; then
            cat /tmp/range-upgrade-evidence/expected-error.log
            echo 'Unpatched 0.26.2 unexpectedly succeeded'
            exit 1
          fi
          cat /tmp/range-upgrade-evidence/expected-error.log
          grep -F 'Failed to index mutable segment.' /tmp/range-upgrade-evidence/expected-error.log
          grep -F 'Error getting tokenizer for field: amount_range' /tmp/range-upgrade-evidence/expected-error.log
          pg_ctl -D "$PGDATA" -m fast -w stop

      - name: Build and install 0.26.2 with only the tokenizer fix
        working-directory: pg_search
        run: cargo pgrx install --sudo --pg-config=/usr/lib/postgresql/18/bin/pg_config

      - name: Verify the same database succeeds with the patch and without REINDEX
        run: |
          set -euo pipefail
          pg_ctl -D "$PGDATA" -l /tmp/range-upgrade-evidence/postgres.log -w start
          psql -X -v ON_ERROR_STOP=1 <<'SQL' | tee /tmp/range-upgrade-evidence/patched-success.log
          SET plpgsql.check_asserts = on;
          SELECT extversion FROM pg_extension WHERE extname = 'pg_search';
          SELECT * FROM range_tokenizers WHERE id @@@ paradedb.all() ORDER BY id;
          DO $$ BEGIN
              ASSERT (SELECT extversion FROM pg_extension WHERE extname = 'pg_search') = '0.26.2';
              ASSERT (SELECT array_agg(id ORDER BY id) FROM range_tokenizers WHERE id @@@ paradedb.all()) = ARRAY[1, 2];
              ASSERT (SELECT array_agg(id ORDER BY id) FROM range_tokenizers
                  WHERE amount_range @@@ pdb.range_term('[250,260)'::int8range, 'Intersects')) = ARRAY[2];
              ASSERT (SELECT array_agg(id ORDER BY id) FROM range_tokenizers
                  WHERE date_range @@@ pdb.range_term('[2026-02-10,2026-02-11)'::daterange, 'Intersects')) = ARRAY[2];
              ASSERT (SELECT index_oid = 'range_tokenizers_idx'::regclass::oid
                  AND filenode = pg_relation_filenode('range_tokenizers_idx') FROM original_index);
              ASSERT NOT EXISTS (SELECT 1 FROM paradedb.schema('range_tokenizers_idx') current
                  FULL JOIN original_schema old USING (name)
                  WHERE current.tokenizer IS DISTINCT FROM old.tokenizer);
          END $$;
          SET paradedb.global_mutable_segment_rows = 0;
          INSERT INTO range_tokenizers VALUES (3, '[300,400)', '[2026-03-01,2026-04-01)');
          SELECT * FROM range_tokenizers WHERE id @@@ paradedb.all() ORDER BY id;
          DO $$ BEGIN
              ASSERT (SELECT array_agg(id ORDER BY id) FROM range_tokenizers WHERE id @@@ paradedb.all()) = ARRAY[1, 2, 3];
          END $$;
          SQL
      - name: Stop the test database
        if: always()
        run: pg_ctl -D "$PGDATA" -m fast -w stop || true
      - name: Save reproduction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: range-upgrade-before-after
          path: /tmp/range-upgrade-evidence
