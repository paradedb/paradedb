name: Verify worker-shortage regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c7g+c8g
      - cpu=8
      - ram=16
      - image=ubuntu26-full-arm64
      - volume=80gb
      - extras=s3-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: runs-on/action@v2
      - uses: ./.github/actions/setup-pg-search-toolchain
        with:
          pg_version: 18
      - uses: ./.github/actions/setup-postgres
        with:
          pg_version: 18
      - uses: paradedb/actions/apt-install@v14
        with:
          packages: --no-install-recommends clang lld libcurl4-openssl-dev libopenblas-dev gdb
      - name: Enable crash dumps
        run: ./.github/scripts/setup_crashdumps.sh
      - name: Allow extension installation
        run: |
          sudo chown -R "$(whoami)" /usr/share/postgresql/18/ /usr/lib/postgresql/18/ /var/run/postgresql/
      - name: Test unpatched main with the new regression
        id: main
        env:
          MAIN_SOURCE: d3d439e68a2d8c6bfcb2358491d1b6842a5798de
          PGRX_PG_CONFIG_PATH: /usr/lib/postgresql/18/bin/pg_config
        run: |
          mkdir diagnostics
          git restore --source="$MAIN_SOURCE" -- pg_search/src/parallel_worker/builder.rs
          git diff --exit-code "$MAIN_SOURCE" -- pg_search/src Cargo.toml Cargo.lock
          git rev-parse HEAD > diagnostics/test-revision.txt
          echo "$MAIN_SOURCE" > diagnostics/main-source.txt
          sha256sum pg_search/tests/pg_regress/sql/aggregate_worker_shortage.sql > diagnostics/test-sha256.txt
          set +e
          cargo pgrx regress -p pg_search pg18 aggregate_worker_shortage --resetdb --postgresql-conf shared_preload_libraries=pg_search > diagnostics/main-run.log 2>&1
          result=$?
          set -e
          echo "$result" > diagnostics/main-exit.txt
          echo "exit=$result" >> "$GITHUB_OUTPUT"
          cp "$HOME/.pgrx/18.log" diagnostics/main-postgres.log
          cp pg_search/tests/pg_regress/results/aggregate_worker_shortage.out diagnostics/main-result.out
          cargo pgrx stop pg18
      - name: Test fixed code three times
        env:
          PGRX_PG_CONFIG_PATH: /usr/lib/postgresql/18/bin/pg_config
        run: |
          git restore --source=HEAD -- pg_search/src/parallel_worker/builder.rs
          cargo pgrx regress -p pg_search pg18 aggregate_worker_shortage --resetdb --repeat 3 --postgresql-conf shared_preload_libraries=pg_search > diagnostics/fixed-run.log 2>&1
          cp "$HOME/.pgrx/18.log" diagnostics/fixed-postgres.log
          cp pg_search/tests/pg_regress/results/aggregate_worker_shortage.out diagnostics/fixed-result.out
          cargo pgrx stop pg18
      - name: Confirm main failed with the expected backend crash
        env:
          MAIN_EXIT: ${{ steps.main.outputs.exit }}
        run: |
          test "$MAIN_EXIT" -ne 0
          grep -E 'signal 11|Segmentation fault' diagnostics/main-postgres.log
          grep -E 'server closed the connection|connection to server was lost' diagnostics/main-result.out
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-shortage-regression-proof
          path: |
            diagnostics/
            pg_search/tests/pg_regress/regression*.diffs
          retention-days: 14
