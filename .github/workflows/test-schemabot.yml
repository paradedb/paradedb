# workflows/test-schemabot.yml
#
# Test SchemaBot
# Build and test the SchemaBot crate without a PostgreSQL server.

name: Test SchemaBot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".github/workflows/test-schemabot.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "schemabot/**"
  workflow_dispatch:

concurrency:
  group: test-schemabot-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-schemabot:
    name: Build & Test SchemaBot
    runs-on:
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=c7g+c8g
      - cpu=4
      - ram=8
      - image=ubuntu26-full-arm64
      - extras=s3-cache

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # With extras=s3-cache, configure RunsOn before cache or artifact operations.
      - name: Configure RunsOn Caching
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
          rustflags: "" # Respect .cargo/config.toml.

      - name: Install Build Dependencies
        uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          packages: --no-install-recommends clang libclang-dev lld

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: schemabot-ubuntu26

      - name: Build SchemaBot
        run: cargo build -p schemabot --locked

      - name: Test SchemaBot
        run: cargo test -p schemabot --locked
