# workflows/test-stressgres-docker.yml
#
# Test Stressgres (Docker)
# Test building and running the Stressgres Docker Image.

name: Test Stressgres (Docker)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - ".github/workflows/test-stressgres-docker.yml"
      - "docker/Dockerfile.stressgres"
      - "stressgres/**"
  workflow_dispatch:

concurrency:
  group: test-stressgres-docker-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-stressgres-docker:
    name: Test Stressgres Docker Image
    runs-on:
      # General-purpose m-family — Docker buildx is RAM-heavy.
      # See https://runs-on.com/configuration/job-labels/ — runs in us-east-1.
      - runs-on=${{ github.run_id }}
      - retry=when-interrupted
      - family=m7g+m8g # M instances provide 4 GiB RAM per vCPU for these workloads.
      - cpu=8
      - ram=32
      - image=ubuntu26-full-arm64
      - extras=s3-cache

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      # With extras=s3-cache, configure RunsOn before cache or artifact operations.
      - name: Configure RunsOn Caching
        uses: runs-on/action@v2

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build Stressgres Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.stressgres \
            -t paradedb/stressgres:${{ github.sha }} \
            .

      - name: Run the Stressgres Docker Image
        run: docker run -d --name stressgres paradedb/stressgres:${{ github.sha }}

      - name: Check Runtime Dependencies and Commands
        env:
          IMAGE: paradedb/stressgres:${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" bash -euo pipefail -c '
            /symbols/stressgres --help
            /symbols/stressgres headless --help
            /symbols/stressgres csv --help
            psql --version
            flock --version
            if /symbols/stressgres graph --help; then
              echo "Graph generation should be disabled in the runtime image" >&2
              exit 1
            fi
            for binary in /symbols/stressgres /usr/local/bin/psql; do
              libraries=$(ldd "$binary")
              printf "%s\n" "$libraries"
              if grep -q "not found" <<< "$libraries"; then
                exit 1
              fi
            done
            for package in libfontconfig1 libexpat1; do
              if dpkg-query -W -f="\${Status}" "$package" 2>/dev/null | grep -q "install ok installed"; then
                echo "Unexpected graphics dependency: $package" >&2
                exit 1
              fi
            done
          '

      - name: Check that the Stressgres Docker Image Runs Properly
        run: |
          CONTAINER_ID=$(docker ps -aq --filter "name=stressgres")
          CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' $CONTAINER_ID)
          echo "Stressgres container ID: $CONTAINER_ID"
          echo "Container status: $CONTAINER_STATUS"

          echo ""
          echo "Printing logs for the Stressgres Docker container..."
          docker logs $CONTAINER_ID

          # Fail the run if the container failed to start
          if [ "$CONTAINER_STATUS" = "exited" ]; then
            echo "Error: Container failed to start properly"
            exit 1
          fi
