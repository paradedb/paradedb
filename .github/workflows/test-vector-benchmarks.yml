name: Test Vector Benchmark Helpers

on:
  pull_request:
    paths:
      - "benchmarks/cohere/**"
      - "benchmarks/hn/**"
      - "benchmarks/msmarco/**"
      - ".github/workflows/test-vector-benchmarks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s benchmarks/cohere -p 'test_*.py'
          node --test benchmarks/cohere/k6/*.test.cjs
