name: Test Vector Benchmark Helpers

on:
  pull_request:
    paths:
      - "benchmarks/cohere/**"
      - "benchmarks/msmarco/**"
      - ".github/workflows/benchmark-pg_search-benchmarker-msmarco.yml"
      - ".github/workflows/test-vector-benchmarks.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/cohere/**"
      - "benchmarks/msmarco/**"
      - ".github/workflows/test-vector-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test vector benchmark helpers
        run: python3 -m unittest discover -s benchmarks/cohere -p 'test_*.py'
