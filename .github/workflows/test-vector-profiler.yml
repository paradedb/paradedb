name: Test Vector Profiler

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/profile-postgres.sh"
      - ".github/scripts/test_profile_postgres.py"
      - ".github/actions/benchmark-vector-k6/action.yml"
      - ".github/workflows/test-vector-profiler.yml"
  workflow_dispatch:

concurrency:
  group: vector-profiler-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64:
    name: Verify ARM CPU-clock Sampling
    timeout-minutes: 10
    runs-on:
      - runs-on=${{ github.run_id }}
      - spot=false
      - family=c8gd.metal-24xl
      - image=ubuntu26-full-arm64
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install host perf
        uses: paradedb/actions/apt-install@8f17ece584400f0113ff8ddb1b14f28b6fd10050 # v14
        with:
          packages: linux-perf

      - name: Verify CPU-clock and branch-miss sampling
        run: bash .github/scripts/profile-postgres.sh --check benchmark-profiles/preflight

      - name: Upload Sampling Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vector-profiler-preflight
          path: benchmark-profiles/
          retention-days: 7
          if-no-files-found: error
