default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "dev"]
      - id: mixed-line-ending
      - id: end-of-file-fixer
        exclude: '(\.sql|\.out|\.rs)$'
      - id: trailing-whitespace
        exclude: '(\.sql|\.out|\.rs)$'
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-symlinks
      # The Kubernetes manifests under docker/ are multi-document.
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-xml
      - id: check-ast
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: '\.rs$'
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: requirements-txt-fixer

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "-P", "scripts"]
        files: \.sh$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Shell snippets are covered by the dedicated ShellCheck workflow and hook.
        args: ["-shellcheck="]

  - repo: https://github.com/kaechele/pre-commit-mirror-prettier
    rev: v3.8.1
    hooks:
      - id: prettier

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo fmt
        args: ["--all"]
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        entry: cargo clippy
        args:
          ["--workspace", "--all-targets", "--", "-D", "warnings", "--no-deps"]
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check
        args: ["--workspace"]
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-doc
        name: cargo doc
        entry: cargo doc
        args: ["--workspace", "--no-deps", "--document-private-items"]
        language: system
        types: [rust]
        pass_filenames: false
        env:
          RUSTDOCFLAGS: "-D warnings"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.7
    hooks:
      - id: pylint
        args:
          - "--disable=R0911" # disables the "too many returns" lint

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        files: \.toml$
