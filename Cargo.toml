[workspace]
resolver = "2"
members = [
  "benchmarks",
  "dst",
  "macros",
  "pg_search",
  "stressgres",
  "tests",
  "tokenizers",
]

[workspace.package]
version = "0.25.0"
edition = "2021"
license = "AGPL-3.0"

[profile.dev]
panic = "unwind"

[profile.release]
# Note: We switched from `fat` to `thin` LTO to reduce compile time memory usage, which had been
# sufficient to cause swapping on local machines, and to kill CI builds on smaller instances.
# Benchmarks were unaffected.
lto = "thin"
panic = "unwind"
opt-level = 3
codegen-units = 1

# Optimized + debug symbols, for profiling; debug-assertions off keeps dst asserts compiled out.
[profile.release-with-debug]
inherits = "release"
debug = true
debug-assertions = false

# DST build profile — `dev`-like (debug assertions on) but isolated so it can be tuned
# without affecting `dev`.
[profile.dst]
inherits = "dev"

[workspace.dependencies]
tantivy = { git = "https://github.com/paradedb/tantivy.git", package = "tantivy", rev = "3212ceeca1709bf9f1da9446a06a803e6691f7ef", features = [
  "columnar-zstd-compression",
  "lz4-compression",
  "paradedb",
  "quickwit",                  # for sstable support
  "stemmer",
  "stopwords",
], default-features = false }
pgrx = "=0.19.0"
pgrx-tests = "=0.19.0"
tantivy-jieba = "0.20.0"

[patch.crates-io]
tantivy-tokenizer-api = { git = "https://github.com/paradedb/tantivy.git", package = "tantivy-tokenizer-api", rev = "3212ceeca1709bf9f1da9446a06a803e6691f7ef" }

[workspace.lints.clippy]
large_futures = "warn"
