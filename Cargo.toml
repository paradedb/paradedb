[workspace]
resolver = "2"
members = [
  "basescan",
  "benchmarks",
  "common",
  "dst",
  "index_read",
  "index_write",
  "joinscan",
  "macros",
  "pg_search",
  "planner",
  "scan",
  "schemabot",
  "storage",
  "stressgres",
  "tests",
  "tokenizers",
]
# A bare `cargo build`/`check`/`clippy`/`test` at the root covers only the
# extension stack. Other members pull in dependencies the extension does not
# need (`benchmarks`, for example, builds the bundled DuckDB from C++ source).
# Build them with `-p <crate>` or `--workspace`.
default-members = [
  "basescan",
  "common",
  "index_read",
  "index_write",
  "joinscan",
  "pg_search",
  "planner",
  "scan",
  "storage",
  "tokenizers",
]

[workspace.package]
version = "0.26.0"
edition = "2024"
license = "AGPL-3.0"

[profile.dev]
panic = "unwind"

# Backtraces through dependencies keep file:line, but the full DWARF (variable
# and type info) is dropped; it is most of a debug target dir and is only
# needed when stepping through a dependency in a debugger. Workspace crates
# keep full debuginfo. Override locally with a `[profile]` section in
# `~/.cargo/config.toml` if you need to debug into a dependency.
[profile.dev.package."*"]
debug = "line-tables-only"

# `cc` passes `-g` to the bundled DuckDB C++ build based on this. DuckDB is a
# benchmark comparison engine, not something we debug, and its objects with
# `-g` cost gigabytes per target dir.
[profile.dev.package.libduckdb-sys]
debug = false

[profile.release]
# Thin LTO avoids the high memory usage of fat LTO without affecting benchmarks.
lto = "thin"
panic = "unwind"
opt-level = 3
codegen-units = 1

# Optimized build with debug symbols for profiling. Disabling debug assertions
# keeps DST assertions out of the build.
[profile.release-with-debug]
inherits = "release"
debug = true
debug-assertions = false

# The DST profile uses moderate optimization so unoptimized ParadeDB execution
# does not dominate query-generation time. It retains DWARF, debug assertions,
# and overflow checks for debugging and invariant validation. LTO is disabled
# because it obscures stack frames and exhausts rustc memory with SanitizerCoverage.
[profile.dst]
inherits = "release"
opt-level = 2
lto = "off"
debug = true
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
pgrx = "=0.20.0-beta.1"
pgrx-tests = "=0.20.0-beta.1"

# Keep the Git revisions for `tantivy`, `tantivy-common`, and the crates.io
# patches in sync.
tantivy = { git = "https://github.com/paradedb/tantivy.git", package = "tantivy", rev = "4b1b227f57a43ed74744f16aa8b0559d29c549e1", features = [
  "columnar-zstd-compression",
  "lz4-compression",
  "paradedb",
  # Enables the SSTable backend.
  "quickwit",
  "stemmer",
  "stopwords",
], default-features = false }
tantivy-common = { git = "https://github.com/paradedb/tantivy.git", package = "tantivy-common", rev = "4b1b227f57a43ed74744f16aa8b0559d29c549e1" }
tantivy-jieba = "0.21.0"

async-trait = "0.1.92"
stable_deref_trait = "1.2.1"
anyhow = { version = "1.0.102", features = ["backtrace"] }
# Keep direct Arrow dependencies on DataFusion's major version.
arrow-array = "59.1.0"
arrow-buffer = "59.1.0"
arrow-schema = "59.1.0"
arrow-select = "59.1.0"
base64 = "0.23.1"
bitpacking = "0.9.3"
chrono = "0.4.45"
time = "0.3.47"
env_logger = "0.11.10"
log = "0.4.34"
once_cell = "1.21.4"
parking_lot = "0.13.0"
rustix = { version = "1.1.5", features = ["fs"] }
rustc-hash = "2.1.2"
serde = "1.0.228"
serde_json = { version = "1.0.149", features = [
  "preserve_order",
  "float_roundtrip",
] }
serde_cbor = "0.11.2"
thiserror = "2.0.21"
ordered-float = "5.5.0"
uuid = "1.27.0"
strum = { version = "0.28.0" }
serde_path_to_error = "0.1.20"
# Do not "upgrade" this: bincode is unmaintained and 3.0.0 is a tombstone whose
# lib.rs is a single compile_error!. `legacy()` also encodes to disk, so any
# replacement must be byte-compatible.
bincode = { version = "2.0.1", features = [
  "serde",
  "std",
], default-features = false }
rand = "0.10.3"
proptest = "1.11.0"
postcard = { version = "1.1.3", features = [
  "use-std",
], default-features = false }
# same version as tantivy uses
regex = { version = "1.12.3", default-features = false, features = [
  "std",
  "perf",
  "unicode",
] }
tantivy-fst = { git = "https://github.com/paradedb/fst.git", rev = "1d2e473c6de63d17749030eb8538ba4d647f3430" }
lazy_static = "1.5.1"
half = "2.7.1"
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
decimal-bytes = "0.6.0"
bigdecimal = "0.4.11"
paste = "1.0.15"
typetag = "0.2"
tokio = { version = "1.53.2", features = [
  "rt",
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "macros",
] }
tokio-stream = "0.1.17"
tonic = "0.14.2"
tower = "0.5.2"
hyper-util = { version = "0.1.16", features = ["tokio"] }
url = "2.5.4"
libc = "0.2"
bytes = { version = "1", features = ["serde"] }
# Here and the equivalent in our datafusion-distributed fork will need to be updated in sync so that
# both point to the same datafusion ref.
datafusion = { git = "https://github.com/paradedb/datafusion.git", branch = "paradedb.branch-55", default-features = false }
datafusion-proto = { git = "https://github.com/paradedb/datafusion.git", branch = "paradedb.branch-55", default-features = false }
datafusion-distributed = { git = "https://github.com/paradedb/datafusion-distributed.git", tag = "snapshot-main-2026-11-06-220218", default-features = false, features = [
  "grpc",
] }
futures = "0.3.34"
async-stream = "0.3.6"
prost = "0.14.3"
rstest = "0.28.0"
postgres = "0.19.14"

[patch.crates-io]
tantivy-common = { git = "https://github.com/paradedb/tantivy.git", package = "tantivy-common", rev = "4b1b227f57a43ed74744f16aa8b0559d29c549e1" }
tantivy-tokenizer-api = { git = "https://github.com/paradedb/tantivy.git", package = "tantivy-tokenizer-api", rev = "4b1b227f57a43ed74744f16aa8b0559d29c549e1" }

[workspace.lints.rust]
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
large_futures = "warn"
