        // Calculate earliest start time per chart group
        const chartStartTimes = {};
        Object.keys(runsByChart).forEach((chartGroup) => {
          chartStartTimes[chartGroup] = Infinity;
          runsByChart[chartGroup].forEach((name) => {
            const run = runs[name];
            if (run.startTime && run.startTime < chartStartTimes[chartGroup]) {
              chartStartTimes[chartGroup] = run.startTime;
            }
          });
        });

        // Update legend for each chart group (in emission order by start time)
        const sortedChartGroups = Object.keys(runsByChart).sort((a, b) => {
          const aTime = chartStartTimes[a] || Infinity;
          const bTime = chartStartTimes[b] || Infinity;
          if (aTime === bTime) return a.localeCompare(b);
          return aTime - bTime;
        });
        sortedChartGroups.forEach((chartGroup) => {
          const safeChartId = (chartGroup || "default").replace(
            /[^a-zA-Z0-9]/g,
            "_",
          );
          const legend = document.getElementById(`legend-${safeChartId}`);
          if (!legend) return;

          const runNames = runsByChart[chartGroup].slice().sort();

          // Build a key to detect if legend structure changed
          const queryList = [];
          runNames.forEach((name) => {
            const queries = runs[name].queries || {};
            Object.keys(queries)
              .sort()
              .forEach((qName) => queryList.push(qName));
          });
          const legendKey =
            queryList.join(",") +
            "|" +
            Array.from(selectedQueries).sort().join(",");

          // Only rebuild if structure changed
          if (legendKey === chartLegendKeys[chartGroup]) return;
          chartLegendKeys[chartGroup] = legendKey;

          const items = [];
          runNames.forEach((name) => {
            const run = runs[name];
            const baseColor = getRunColor(name, run);
            const queries = run.queries || {};
            const queryNames = Object.keys(queries).sort();

            queryNames.forEach((qName, idx) => {
              const color =
                idx === 0 ? baseColor : shadeColor(baseColor, idx * 15);
              const isEnabled = selectedQueries.has(qName);
              const disabledClass = isEnabled ? "" : " disabled";
              items.push(
                `<div class="legend-item${disabledClass}" data-query="${escapeHtml(qName)}" title="Click to toggle, Shift+click to isolate"><div class="legend-color" style="background: ${color}"></div> ${escapeHtml(qName)}</div>`,
              );
            });
          });
          legend.innerHTML = items.join("");
          legend.querySelectorAll(".legend-item").forEach((item) => {
            item.addEventListener("click", (event) => {
              toggleQueryFilter(item.dataset.query, event);
            });
          });
        });
      }

      function updateQueryFilters(runs) {
        // Collect all query names across all runs
        const queryNames = new Set();
        Object.values(runs).forEach((run) => {
          Object.keys(run.queries || {}).forEach((qName) => {
            queryNames.add(qName);
          });
        });

        // Initialize selectedQueries with all queries when first discovered
        queryNames.forEach((qn) => {
          if (!allQueryTypes.has(qn)) {
            selectedQueries.add(qn);
          }
        });
        allQueryTypes = queryNames;
      }

      function formatQueryText(queryText) {
        const trimmed = queryText.trim();
        // Try JSON first
        if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
          try {
            const parsed = JSON.parse(trimmed);
            return JSON.stringify(parsed, null, 2);
          } catch (e) {
            // Not valid JSON, continue
          }
        }
        // Try SQL formatting
        try {
          return sqlFormatter.format(trimmed, {
            language: "postgresql",
            tabWidth: 2,
            keywordCase: "upper",
          });
        } catch (e) {
          // Fallback to original
          return queryText;
        }
      }

      function showQueryModal(queryKey, qName) {
        const queryText = queryTexts[queryKey];
        if (!queryText) return;

        const formatted = formatQueryText(queryText);
        document.getElementById("config-modal-title").textContent = qName;
        document.getElementById("config-modal-content").innerHTML = `
          <pre style="white-space: pre-wrap; word-break: break-word; font-size: 11px; margin: 0; background: var(--bg); padding: 12px; border-radius: 4px;">${escapeHtml(formatted)}</pre>
        `;
        document.getElementById("modal-backdrop").classList.add("visible");
        document.getElementById("config-modal").classList.add("visible");
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function showConfigModal(runName) {
        const snapshot = runConfigs[runName] || {};
        const config = snapshot.config || {};
        const containerInfo = snapshot.container_info || null;
        const hasGlobalCapture =
          (lastData && (lastData.dataset_yaml || lastData.script)) || false;
        if (
          Object.keys(config).length === 0 &&
          !containerInfo &&
          !hasGlobalCapture
        ) {
          return;
        }

        document.getElementById("config-modal-title").textContent = runName;

        const preScript = config.pre_script;
        const postScript = config.post_script;

        let tabsHtml = '<div class="config-tabs">';
        tabsHtml +=
          '<button class="config-tab active" onclick="switchConfigTab(\'config\')">Config</button>';
        if (preScript) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'pre\')">Pre</button>';
        }
        if (postScript) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'post\')">Post</button>';
        }
        if (containerInfo) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'container\')">Container</button>';
        }
        const datasetYaml = (lastData && lastData.dataset_yaml) || "";
        const scriptSource = (lastData && lastData.script) || "";
        if (datasetYaml) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'dataset\')">Dataset</button>';
        }
        if (scriptSource) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'script\')">Script</button>';
        }
        tabsHtml += "</div>";

        function formatConfigValue(val) {
          if (val === null || val === undefined) return "-";
          if (typeof val === "object") return JSON.stringify(val);
          return String(val);
        }

        // Config tab — DB GUCs etc.
        let configHtml =
          '<div id="tab-config" class="config-tab-content active">';
        // Core postgres info first (settings section, then version), then
        // extension sections (paradedb etc.) alphabetically.
        const sectionRank = (name) =>
          name === "postgresql" ? 0 : name === "version" ? 1 : 2;
        const configEntries = Object.entries(config).sort(
          (a, b) =>
            sectionRank(a[0]) - sectionRank(b[0]) || a[0].localeCompare(b[0]),
        );
        for (const [section, value] of configEntries) {
          if (["pre_script", "post_script"].includes(section)) continue;

          if (
            typeof value === "object" &&
            value !== null &&
            !Array.isArray(value)
          ) {
            configHtml += `<div class="config-section">
            <div class="config-section-title">${escapeHtml(section)}</div>`;
            for (const [key, val] of Object.entries(value)) {
              configHtml += `<div class="config-item">
              <span class="config-key">${escapeHtml(key)}</span>
              <span class="config-value">${escapeHtml(formatConfigValue(val))}</span>
            </div>`;
            }
            configHtml += "</div>";
          } else if (!Array.isArray(value)) {
            configHtml += `<div class="config-item">
            <span class="config-key">${escapeHtml(section)}</span>
            <span class="config-value">${escapeHtml(formatConfigValue(value))}</span>
          </div>`;
          }
        }
        configHtml += "</div>";

        // Pre / Post tabs.
        const codeBlock = (text) =>
          `<pre style="white-space: pre-wrap; word-break: break-word; font-size: 10px; margin: 0; background: var(--bg); padding: 12px; border-radius: 4px;">${escapeHtml(text)}</pre>`;
        let preHtml = '<div id="tab-pre" class="config-tab-content">';
        if (preScript) preHtml += codeBlock(preScript);
        preHtml += "</div>";

        let postHtml = '<div id="tab-post" class="config-tab-content">';
        if (postScript) postHtml += codeBlock(postScript);
        postHtml += "</div>";

        // Container tab — docker inspect subset.
        let containerHtml =
          '<div id="tab-container" class="config-tab-content">';
        if (containerInfo) {
          containerHtml += renderContainerInfo(containerInfo);
        }
        containerHtml += "</div>";

        // Dataset / Script tabs — global to the run, hidden when absent.
        const sourceBlock = (text) =>
          `<pre style="white-space: pre-wrap; word-break: break-word; font-size: 10px; margin: 0; background: var(--bg); padding: 12px; border-radius: 4px;">${escapeHtml(text)}</pre>`;
        let datasetHtml = '<div id="tab-dataset" class="config-tab-content">';
        if (datasetYaml) datasetHtml += sourceBlock(datasetYaml);
        datasetHtml += "</div>";
        let scriptHtml = '<div id="tab-script" class="config-tab-content">';
        if (scriptSource) scriptHtml += sourceBlock(scriptSource);
        scriptHtml += "</div>";

        document.getElementById("config-modal-content").innerHTML =
          tabsHtml +
          configHtml +
          preHtml +
          postHtml +
          containerHtml +
          datasetHtml +
          scriptHtml;
        document.getElementById("modal-backdrop").classList.add("visible");
        document.getElementById("config-modal").classList.add("visible");
      }

      // renderContainerInfo turns the docker-inspect subset into the same
      // sections/items layout used by the Config tab.
      function renderContainerInfo(info) {
        const items = (kvs) =>
          kvs
            .map(
              ([k, v]) =>
                `<div class="config-item">
                  <span class="config-key">${escapeHtml(k)}</span>
                  <span class="config-value">${escapeHtml(v)}</span>
                </div>`,
            )
            .join("");
        const section = (title, body) =>
          `<div class="config-section">
            <div class="config-section-title">${escapeHtml(title)}</div>
            ${body}
          </div>`;

        let html = "";

        const idRows = [];
        if (info.image) idRows.push(["image", info.image]);
        if (info.image_id) idRows.push(["image_id", info.image_id]);
        if (info.cpu_limit) idRows.push(["cpu_limit", info.cpu_limit]);
        if (info.memory_limit) idRows.push(["memory_limit", info.memory_limit]);
        if (Array.isArray(info.cap_add) && info.cap_add.length)
          idRows.push(["cap_add", info.cap_add.join(", ")]);
        if (Array.isArray(info.security_opt) && info.security_opt.length)
          idRows.push(["security_opt", info.security_opt.join(", ")]);
        if (idRows.length) html += section("identity", items(idRows));

        if (Array.isArray(info.cmd) && info.cmd.length) {
          html += section(
            "cmd",
            `<pre style="white-space: pre-wrap; word-break: break-word; font-size: 10px; margin: 0;">${escapeHtml(info.cmd.join(" "))}</pre>`,
          );
        }

        if (Array.isArray(info.env) && info.env.length) {
          html += section(
            "env",
            items(
              info.env.map((e) => {
                const idx = e.indexOf("=");
                return idx >= 0 ? [e.slice(0, idx), e.slice(idx + 1)] : [e, ""];
              }),
            ),
          );
        }

        return html;
      }

      function switchConfigTab(tabName) {
        // Update tab buttons
        document.querySelectorAll(".config-tab").forEach((btn) => {
          btn.classList.toggle(
            "active",
            btn.textContent.toLowerCase() === tabName,
          );
        });
        // Update tab content
        document.querySelectorAll(".config-tab-content").forEach((content) => {
          content.classList.toggle("active", content.id === "tab-" + tabName);
        });
      }

      function hideConfigModal() {
        document.getElementById("modal-backdrop").classList.remove("visible");
        document.getElementById("config-modal").classList.remove("visible");
      }

      function toggleQueryFilter(queryName, event) {
        if (event && event.shiftKey) {
          // Shift+click: isolate this query (show only this one)
          if (selectedQueries.size === 1 && selectedQueries.has(queryName)) {
            // Already isolated - restore all
            allQueryTypes.forEach((q) => selectedQueries.add(q));
          } else {
            // Isolate this query
            selectedQueries.clear();
            selectedQueries.add(queryName);
          }
        } else {
          // Regular click: toggle visibility
          if (selectedQueries.has(queryName)) {
            selectedQueries.delete(queryName);
          } else {
            selectedQueries.add(queryName);
          }
        }
        // Re-render chart with updated filters
        if (lastData) {
          update(lastData);
        }
        // Recalculate Y axis if zoomed
        if (isZoomed) {
          setTimeout(() => {
            getAllCharts().forEach((chart) => {
              const xMin = chart.options.scales.x.min;
              const xMax = chart.options.scales.x.max;
              const yRange = getVisibleYRange(chart, xMin, xMax);
              if (yRange) {
                chart.options.scales.y.min = yRange.min;
                chart.options.scales.y.max = yRange.max;
              }
              chart.update("none");
            });
          }, 0);
        }
      }

      function updateUpdateStats(runs) {
        const container = document.getElementById("update-container");
        const entries = Object.entries(runs)
          .filter(([, run]) => (run.updates?.attempts || 0) > 0)
          .sort(([a], [b]) => a.localeCompare(b));
        if (entries.length === 0) {
          container.style.display = "none";
          container.innerHTML = "";
          return;
        }

        container.style.display = "flex";
        container.innerHTML = entries
          .map(([name, run]) => {
            const updates = run.updates;
            const color = getRunColor(name, run);
            return `<div class="stat-group" style="border-left-color: ${color}">
              <div class="stat-group-header"><div class="stat-group-label" style="color: ${color}">${escapeHtml(getBaseName(name))} updates</div></div>
              <div class="stats" style="grid-template-columns: repeat(5, 1fr)">
                <div class="stat"><div class="stat-value">${formatNumber(updates.attempts || 0)}</div><div class="stat-label">Attempts</div></div>
                <div class="stat"><div class="stat-value">${formatNumber(updates.documents || 0)}</div><div class="stat-label">Documents</div></div>
                <div class="stat"><div class="stat-value">${formatNumber(updates.errors || 0)}</div><div class="stat-label">Errors</div></div>
                <div class="stat"><div class="stat-value">${formatLatency(updates.mean)}</div><div class="stat-label">Mean</div></div>
                <div class="stat"><div class="stat-value">${formatLatency(updates.p95)}</div><div class="stat-label">P95</div></div>
              </div>
            </div>`;
          })
          .join("");
      }

      function stableHash(value) {
        let hash = 2166136261;
        for (let i = 0; i < value.length; i++) {
          hash ^= value.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36);
      }

      function telemetryColor(key) {
        const hue = parseInt(stableHash(key), 36) % 360;
        return `hsl(${hue} 70% 50%)`;
      }

      function formatBytes(value) {
        const units = ["B", "KiB", "MiB", "GiB", "TiB"];
        let amount = Number(value) || 0;
        let index = 0;
        while (Math.abs(amount) >= 1024 && index < units.length - 1) {
          amount /= 1024;
          index++;
        }
        return `${amount.toFixed(index === 0 ? 0 : 1)}${units[index]}`;
      }

      function formatTelemetryValue(value, unit) {
        if (unit === "bytes") return formatBytes(value);
        if (unit === "ms") return formatLatency(value);
        const formatted = formatNumber(value);
        if (!unit || unit === "count") return formatted;
        return `${formatted} ${unit}`;
      }

      function telemetrySeriesKey(point) {
        const labels = Object.entries(point.labels || {}).sort(([a], [b]) =>
          a.localeCompare(b),
        );
        return `${point.name}|${labels.map(([key, value]) => `${key}=${value}`).join(",")}`;
      }

      function telemetrySeriesLabel(point) {
        const base = String(point.name || "value")
          .split(".")
          .pop();
        const labels = Object.entries(point.labels || {})
          .filter(([, value]) => value !== "")
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([key, value]) => `${key}=${value}`);
        return labels.length > 0 ? `${base} (${labels.join(", ")})` : base;
      }

      function telemetryGroup(point) {
        const parts = String(point.name || "telemetry").split(".");
        const name = parts.length > 1 ? parts.slice(0, -1).join(".") : parts[0];
        return { name, unit: point.unit || "" };
      }

      function updateTelemetry(telemetry) {
        const container = document.getElementById("telemetry-container");
        const windowsContainer = document.getElementById("telemetry-windows");
        const seenCharts = new Set();
        const seenWindows = new Set();
        let hasWindows = false;

        Object.entries(telemetry || {})
          .sort(([a], [b]) => a.localeCompare(b))
          .forEach(([backend, windows]) => {
            (windows || []).forEach((window, windowIndex) => {
              hasWindows = true;
              const windowKey = `${backend}:${window.startTime || 0}:${windowIndex}`;
              const windowId = `telemetry-window-${stableHash(windowKey)}`;
              seenWindows.add(windowId);

              let windowEl = document.getElementById(windowId);
              if (!windowEl) {
                windowEl = document.createElement("section");
                windowEl.id = windowId;
                windowEl.className = "telemetry-window";
                windowEl.innerHTML = `<div class="telemetry-window-header"><div class="telemetry-window-title"></div><div class="telemetry-window-time"></div></div><div class="telemetry-errors"></div><div class="telemetry-grid"></div>`;
              }
              windowsContainer.appendChild(windowEl);
              windowEl.querySelector(".telemetry-window-title").textContent =
                `${backend} database telemetry`;
              const duration =
                window.endTime && window.startTime
                  ? Math.max(0, (window.endTime - window.startTime) / 1000)
                  : null;
              windowEl.querySelector(".telemetry-window-time").textContent =
                duration == null
                  ? "collecting"
                  : `${duration.toFixed(1)}s window`;
              const errors = window.errors || [];
              const errorsEl = windowEl.querySelector(".telemetry-errors");
              errorsEl.textContent = errors.join(" · ");
              errorsEl.style.display = errors.length > 0 ? "block" : "none";

              const groups = new Map();
              (window.samples || []).forEach((sample) => {
                (sample.values || []).forEach((point) => {
                  if (!Number.isFinite(point.value)) return;
                  const group = telemetryGroup(point);
                  const groupKey = `${group.name}|${group.unit}`;
                  if (!groups.has(groupKey)) {
                    groups.set(groupKey, { ...group, series: new Map() });
                  }
                  const seriesKey = telemetrySeriesKey(point);
                  const series = groups.get(groupKey).series;
                  if (!series.has(seriesKey)) {
                    series.set(seriesKey, {
                      label: telemetrySeriesLabel(point),
                      kind: point.kind,
                      data: [],
                    });
                  }
                  series.get(seriesKey).data.push({
                    x: (sample.time - window.startTime) / 1000,
                    y: point.value,
                  });
                });
              });

              const grid = windowEl.querySelector(".telemetry-grid");
              Array.from(groups.entries())
                .sort(([a], [b]) => a.localeCompare(b))
                .forEach(([groupKey, group]) => {
                  const chartKey = `${windowKey}:${groupKey}`;
                  const chartId = `telemetry-chart-${stableHash(chartKey)}`;
                  const cardId = `telemetry-card-${stableHash(chartKey)}`;
                  seenCharts.add(chartKey);

                  let card = document.getElementById(cardId);
                  if (!card) {
                    card = document.createElement("div");
                    card.id = cardId;
                    card.className = "chart-container";
                    card.innerHTML = `<div class="chart-header"><h2></h2><button class="reset-zoom" onclick="resetZoom()">Reset Zoom</button></div><div class="chart-wrapper"><canvas id="${chartId}"></canvas></div>`;
                  }
                  grid.appendChild(card);
                  card.querySelector("h2").textContent = group.unit
                    ? `${group.name} (${group.unit})`
                    : group.name;

                  let chart = telemetryCharts[chartKey];
                  if (!chart) {
                    const options = createChartOptions("", chartKey);
                    options.plugins.legend = {
                      display: true,
                      labels: {
                        color: getTickColor(),
                        boxWidth: 12,
                        font: { family: "JetBrains Mono", size: 9 },
                      },
                    };
                    options.plugins.tooltip.callbacks.label = (ctx) =>
                      `${ctx.dataset.label}: ${formatTelemetryValue(ctx.parsed.y, group.unit)}`;
                    options.scales.y.ticks.callback = (value) =>
                      formatTelemetryValue(value, group.unit);
                    const canvas = document.getElementById(chartId);
                    chart = new Chart(canvas, {
                      type: "line",
                      data: { datasets: [] },
                      options,
                    });
                    canvas.addEventListener("dblclick", resetZoom);
                    telemetryCharts[chartKey] = chart;
                  }

                  const datasets = Array.from(group.series.entries())
                    .sort(([, a], [, b]) => a.label.localeCompare(b.label))
                    .map(([seriesKey, series]) => {
                      const color = telemetryColor(`${chartKey}:${seriesKey}`);
                      return {
                        datasetKey: seriesKey,
                        label:
                          series.kind === "gauge"
                            ? `${series.label} [gauge]`
                            : series.label,
                        borderColor: color,
                        backgroundColor: color,
                        data: series.data,
                        pointRadius: (ctx) =>
                          ctx.dataset.data.length === 1 ? 2 : 0,
                      };
                    });
                  updateChartDatasets(chart, datasets, true);
                  updateChartYAxis(chart);
                  chart.update("none");
                });
            });
          });

        Object.keys(telemetryCharts).forEach((key) => {
          if (seenCharts.has(key)) return;
          const chart = telemetryCharts[key];
          chart.canvas.closest(".chart-container")?.remove();
          chart.destroy();
          delete telemetryCharts[key];
        });
        windowsContainer
          .querySelectorAll(".telemetry-window")
          .forEach((windowEl) => {
            if (!seenWindows.has(windowEl.id)) windowEl.remove();
          });
        container.style.display = hasWindows ? "block" : "none";
      }

      function update(data) {
        // Store for filter updates
        lastData = data;

        // Detect restart: elapsed time went backwards
        if (data.elapsed < lastElapsed - 1) {
          resetState();
        }
        lastElapsed = data.elapsed;

        // Update chart duration from server
        if (data.chartDuration && data.chartDuration > chartDuration) {
          chartDuration = data.chartDuration;
          // Only auto-scroll when not zoomed
          if (!isZoomed) {
            getAllCharts().forEach((chart) => {
              chart.options.scales.x.min = 0;
              chart.options.scales.x.max = chartDuration;
            });
          }
        }

        document.getElementById("elapsed").textContent = formatElapsed(
          data.elapsed,
        );

        // Display timeline settings if present
        const settingsEl = document.getElementById("timeline-settings");
        if (data.broadcastInterval != null || data.timelineWindow != null) {
          const parts = [];
          if (data.broadcastInterval != null)
            parts.push("updating every " + data.broadcastInterval + "ms");
          if (data.timelineWindow != null)
            parts.push(
              data.timelineWindow === 0
                ? "no smoothing"
                : "smoothed over " + data.timelineWindow + "ms",
            );
          settingsEl.textContent = parts.join(", ");
        }

        // Display notes if present
        const notesContainer = document.getElementById("notes-container");
        if (data.notes) {
          notesContainer.textContent = data.notes;
          notesContainer.style.display = "block";
        }

        const runs = data.runs || {};
        // Only show runs with query timeline data
        const runNames = Object.keys(runs)
          .filter((name) => hasQueryTimelines(runs[name]))
          .sort();

        updateQueryFilters(runs); // Initialize selected queries first
        updateStats(runs, data.backends);
        updateLegend(runs);
        updateUpdateStats(runs);
        updateTelemetry(data.telemetry || {});

        // Group runs by chart and track earliest start time per chart
        const runsByChart = {};
        const chartStartTimes = {};
        runNames.forEach((name) => {
          const run = runs[name];
          const chartGroup = run.chart || "default";
          if (!runsByChart[chartGroup]) {
            runsByChart[chartGroup] = [];
            chartStartTimes[chartGroup] = Infinity;
          }
          runsByChart[chartGroup].push(name);
          // Track earliest start time for this chart group
          if (run.startTime && run.startTime < chartStartTimes[chartGroup]) {
            chartStartTimes[chartGroup] = run.startTime;
          }
        });

        // Update latency/hits chart for each dashboard group
        const metricChanged = selectedMetric !== lastMetric;
        const chartTypeChanged = chartType !== lastChartType;
        lastMetric = selectedMetric;
        lastChartType = chartType;

        // Sort chart groups by earliest start time (emission order)
        const chartGroupsSorted = Object.keys(runsByChart).sort((a, b) => {
          const aTime = chartStartTimes[a] || Infinity;
          const bTime = chartStartTimes[b] || Infinity;
          if (aTime === bTime) return a.localeCompare(b);
          return aTime - bTime;
        });
        // Throughput conversion: count of samples in window → qps.
        // Sliding window uses timelineWindow; non-overlapping mode uses broadcastInterval.
        const throughputWindowMs =
          data.timelineWindow && data.timelineWindow > 0
            ? data.timelineWindow
            : data.broadcastInterval || 1000;
        const throughputDivisor = throughputWindowMs / 1000;

        chartGroupsSorted.forEach((chartGroup) => {
          const chart = getOrCreateChartGroup(
            chartGroup === "default" ? "" : chartGroup,
          );
          const groupRunNames = runsByChart[chartGroup];

          const datasets = [];
          groupRunNames.forEach((name) => {
            const run = runs[name];
            const baseColor = getRunColor(name, run);
            const queries = run.queries || {};
            const queryNames = Object.keys(queries).filter((qn) =>
              selectedQueries.has(qn),
            );

            // Use each run's own start time so scenarios starting later still begin at x=0
            const startTime = run.startTime || 0;

            if (queryNames.length === 0 && Object.keys(queries).length === 0) {
              // No query breakdown available, skip this run
            } else {
              // Show each selected query as separate line
              queryNames.forEach((qName, idx) => {
                const q = queries[qName];
                // Slightly vary color for multiple queries in same run
                const color =
                  idx === 0 ? baseColor : shadeColor(baseColor, idx * 15);
                const timelineData = (q.timeline || [])
                  .map((p) => {
                    const elapsedMs = p.time - startTime;
                    if (
                      chartType === "throughput" &&
                      data.timelineWindow > 0 &&
                      elapsedMs < data.timelineWindow
                    ) {
                      return null;
                    }

                    let y;
                    if (chartType === "hits") {
                      y = p.hits || 0;
                    } else if (chartType === "throughput") {
                      y = (p.count || 0) / throughputDivisor;
                    } else {
                      y = p[selectedMetric];
                    }
                    return { x: elapsedMs / 1000, y };
                  })
                  .filter((p) => p !== null);
                datasets.push({
                  datasetKey: `${name}::${qName}`,
                  label: qName,
                  borderColor: color,
                  backgroundColor: color,
                  data: timelineData,
                  // Use scriptable option - checks data length on each render
                  pointRadius: (ctx) => (ctx.dataset.data.length === 1 ? 2 : 0),
                });
              });
            }
          });

          updateChartDatasets(
            chart,
            datasets,
            metricChanged || chartTypeChanged,
          );
          updateChartYAxis(chart);

          // Update y-axis unit based on chart type
          if (chartType === "hits") {
            chart.options.scales.y.ticks.callback = (v) =>
              formatNumber(Math.round(v));
            chart.options.plugins.tooltip.callbacks.label = (ctx) =>
              `${ctx.dataset.label}: ${formatNumber(ctx.parsed.y)}`;
          } else if (chartType === "throughput") {
            chart.options.scales.y.ticks.callback = (v) =>
              formatNumber(Math.round(v)) + " qps";
            chart.options.plugins.tooltip.callbacks.label = (ctx) =>
              `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} qps`;
          } else {
            chart.options.scales.y.ticks.callback = (v) => Math.round(v) + "ms";
            chart.options.plugins.tooltip.callbacks.label = (ctx) =>
              `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}ms`;
          }

          chart.update("none");
        });

        // Update CPU/Memory charts from containers data (independent of runs)
        const containers = data.containers || {};

        // Find the run associated with each container
        const getContainerRun = (containerName, container) => {
          const allRuns = Object.values(runs);

          // Prefer exact container-name matches.
          const byContainer = allRuns.filter(
            (run) => run.container === containerName,
          );
          if (byContainer.length === 1) {
            return byContainer[0];
          }
          if (byContainer.length > 1) {
            return byContainer.sort(
              (a, b) => (a.startTime || 0) - (b.startTime || 0),
            )[0];
          }

          // Fallback to backend only when unambiguous.
          const byBackend = allRuns.filter(
            (run) => run.backend === container.backend,
          );
          if (byBackend.length === 1) {
            return byBackend[0];
          }
          return null;
        };

        // Only show containers whose associated run has started (has a startTime)
        const activeContainerNames = Object.keys(containers)
          .filter((name) => {
            const container = containers[name];
            const matchingRun = getContainerRun(name, container);
            return matchingRun?.startTime > 0;
          })
          .sort();

        const hasMetricsData = activeContainerNames.some((name) => {
          const c = containers[name];
          return (
            (c.cpu && c.cpu.length > 0) || (c.memory && c.memory.length > 0)
          );
        });

        if (activeContainerNames.length > 0 && hasMetricsData) {
          document.getElementById("metrics-container").style.display = "grid";

          // Find start time for each container based on its associated run
          const getContainerBaseline = (container) => {
            const matchingRun = getContainerRun(container.name, container);
            return matchingRun?.startTime || data.startTime || Date.now();
          };

          const cpuDatasets = activeContainerNames.map((name) => {
            const container = containers[name];
            const color = getContainerColor(name, container);
            const baseline = getContainerBaseline(container);
            const displayName = container.alias || name;
            return {
              datasetKey: `cpu:${name}`,
              label: displayName,
              borderColor: color,
              data: (container.cpu || []).map((p) => ({
                x: (p.time - baseline) / 1000,
                y: p.value,
              })),
            };
          });
          updateChartDatasets(cpuChart, cpuDatasets);
          updateChartYAxis(cpuChart);
          cpuChart.update("none");

          const memoryDatasets = activeContainerNames.map((name) => {
            const container = containers[name];
            const color = getContainerColor(name, container);
            const baseline = getContainerBaseline(container);
            const displayName = container.alias || name;
            return {
              datasetKey: `memory:${name}`,
              label: displayName,
              borderColor: color,
              data: (container.memory || []).map((p) => ({
                x: (p.time - baseline) / 1000,
                y: p.value,
              })),
            };
          });
          updateChartDatasets(memoryChart, memoryDatasets);
          updateChartYAxis(memoryChart);
          memoryChart.update("none");
        }

        // Update ingest chart (only if any run has ingest data)
        // Check all runs, not just those with query timelines
        const runsWithIngest = Object.keys(runs).filter(
          (name) => runs[name].totalIngested > 0,
        );
        if (runsWithIngest.length > 0) {
          document.getElementById("ingest-container").style.display = "grid";
          document.getElementById("ingest-legend").innerHTML = runsWithIngest
            .map((name) => {
              const color = getRunColor(name, runs[name]);
              const cfg = (lastData?.backends?.[runs[name].backend] || {})
                .config;
              const ver = backendVersion(cfg);
              const label = ver ? `${name} ${ver}` : name;
              return `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div> ${escapeHtml(label)}</div>`;
            })
            .join("");

          // Update ingest stats
          const ingestStatsContainer = document.getElementById(
            "ingest-stats-container",
          );
          runsWithIngest.forEach((name) => {
            const run = runs[name];
            const color = getRunColor(name, run);
            const ingestId = safeId(name);
            let el = document.getElementById(`ingest-stat-${ingestId}`);
            if (!el) {
              el = document.createElement("div");
              el.id = `ingest-stat-${ingestId}`;
              el.className = "stat-group";
              el.style.borderLeftColor = color;
              el.innerHTML = `
              <div class="stat-group-header">
                <div class="stat-group-label" style="color: ${color}">${escapeHtml(getBaseName(name))}</div>
              </div>
              <div class="stats" style="grid-template-columns: 1fr 1fr;">
                <div class="stat"><div class="stat-value" id="ingest-${ingestId}-total">0</div><div class="stat-label">Total</div></div>
                <div class="stat"><div class="stat-value" id="ingest-${ingestId}-rate">0</div><div class="stat-label">Rate/s</div></div>
              </div>
            `;
              ingestStatsContainer.appendChild(el);
            }
            document.getElementById(`ingest-${ingestId}-total`).textContent =
              formatNumber(run.totalIngested);
            document.getElementById(`ingest-${ingestId}-rate`).textContent =
              formatNumber(Math.floor(run.avgIngestRate || 0));
          });

          const ingestDatasets = runsWithIngest.map((name) => {
            const run = runs[name];
            const color = getRunColor(name, run);
            // Use each run's own start time so ingest offset is relative to when
            // the run began (same as query charts). This keeps second/third phases
            // visible within the chart's x-axis range.
            const startTime = run.startTime || data.startTime || 0;
            return {
              datasetKey: `ingest:${name}`,
              label: name,
              borderColor: color,
              data: (run.ingestRate || []).map((p) => ({
                x: (p.time - startTime) / 1000,
                y: p.value,
              })),
            };
          });
          updateChartDatasets(ingestChart, ingestDatasets);
          updateChartYAxis(ingestChart);
          ingestChart.update("none");
        }
      }

      if (window.__DASHBOARD_EMBEDDED_DATA) {
        update(window.__DASHBOARD_EMBEDDED_DATA);
      } else {
        const events = new EventSource("/events");
        events.onmessage = (e) => {
          try {
            update(JSON.parse(e.data));
          } catch (err) {
            console.error(err);
          }
        };
      }

      // Force charts to resize when window resizes
      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          getAllCharts().forEach((chart) => {
            chart.resize();
          });
        }, 100);
      });

      // Close modal on escape key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          hideConfigModal();
        }
      });
    </script>
  </body>
</html>
