<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParadeDB Benchmarker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.4.2/dist/sql-formatter.min.js"></script>
    <style>
      :root {
        --c1: #7c3aed;
        --c2: #f97316;
        --c3: #10b981;
        --c4: #ec4899;
        --c5: #3b82f6;
        --bg: #0f0f0f;
        --panel: #1a1a1a;
        --border: #2a2a2a;
        --text: #e5e5e5;
        --text-dim: #737373;
        --grid: #252525;
      }
      html.light {
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e5e5e5;
        --text: #171717;
        --text-dim: #737373;
        --grid: #f0f0f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "JetBrains Mono", monospace;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .header h1 {
        font-size: 20px;
        font-weight: 600;
      }
      .elapsed {
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .theme-toggle {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--c1);
      }
      .stats-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .stat-group {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        border-left: 3px solid var(--c1);
      }
      .stat-group-header {
        margin-bottom: 8px;
      }
      .stat-group-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .stat {
        text-align: left;
      }
      .stat-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 9px;
        color: var(--text-dim);
        text-transform: uppercase;
      }
      .stat-group-header {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-group-header:hover {
        opacity: 0.8;
      }
      .expand-icon {
        font-size: 10px;
        transition: transform 0.2s;
      }
      .stat-group.expanded .expand-icon {
        transform: rotate(90deg);
      }
      .query-details {
        display: none;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .stat-group.expanded .query-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .warmup-status {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .warmup-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: var(--text-dim);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .warmup-track {
        height: 6px;
        overflow: hidden;
        background: var(--border);
        border-radius: 3px;
      }
      .warmup-fill {
        height: 100%;
        width: 0;
        background: var(--c1);
        border-radius: inherit;
        transition: width 0.2s ease;
      }
      .query-item {
        background: var(--bg);
        border-radius: 4px;
        padding: 8px;
        cursor: pointer;
        position: relative;
      }
      .query-item:hover {
        background: var(--border);
      }
      .query-tooltip {
        display: none;
        position: fixed;
        right: 300px;
        top: 100px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        max-width: 500px;
        max-height: 400px;
        overflow: auto;
        z-index: 1000;
        font-size: 11px;
        white-space: pre-wrap;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .query-tooltip.visible {
        display: block;
      }
      .config-modal {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        min-width: 400px;
        max-width: 600px;
        max-height: 80vh;
        overflow: auto;
        z-index: 1001;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .config-modal.visible {
        display: block;
      }
      .config-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .config-modal-title {
        font-weight: 600;
        font-size: 13px;
      }
      .config-modal-close {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 18px;
        cursor: pointer;
        padding: 0 4px;
      }
      .config-modal-close:hover {
        color: var(--text);
      }
      .config-item {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .config-item:last-child {
        border-bottom: none;
      }
      .config-key {
        color: var(--text-dim);
      }
      .config-value {
        font-weight: 600;
        text-align: right;
        max-width: 60%;
        word-break: break-all;
      }
      .config-section {
        margin-top: 12px;
      }
      .config-section-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--c1);
      }
      .config-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }
      .config-tab {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 12px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
      }
      .config-tab:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .config-tab.active {
        background: var(--c1);
        border-color: var(--c1);
        color: white;
      }
      .config-tab-content {
        display: none;
      }
      .config-tab-content.active {
        display: block;
      }
      .schema-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      .schema-table th,
      .schema-table td {
        padding: 4px 8px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .schema-table th {
        color: var(--text-dim);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 9px;
      }
      .index-def {
        background: var(--bg);
        padding: 8px;
        border-radius: 4px;
        margin-top: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 10px;
      }
      .index-name {
        font-weight: 600;
        color: var(--c1);
        margin-bottom: 4px;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }
      .modal-backdrop.visible {
        display: block;
      }
      .query-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .query-name {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .query-info {
        font-size: 9px;
        font-weight: 400;
        color: var(--text-dim);
        margin-left: 12px;
        text-transform: none;
        letter-spacing: normal;
      }
      .query-stats {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .query-stat-value {
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .query-stat-label {
        font-size: 8px;
        color: var(--text-dim);
        text-transform: uppercase;
      }
      .chart-container {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
        min-width: 0;
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .chart-header h2 {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .chart-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .reset-zoom {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 8px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 9px;
        cursor: pointer;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .reset-zoom.visible {
        opacity: 1;
      }
      .reset-zoom:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .chart-header select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        text-transform: uppercase;
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
      }
      .legend-item:hover {
        opacity: 0.8;
      }
      .legend-item.disabled {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .legend-item.disabled .legend-color {
        opacity: 0.3;
      }
      .legend-color {
        width: 16px;
        height: 3px;
        border-radius: 1px;
      }
      .chart-wrapper {
        position: relative;
        height: clamp(140px, 30vh, 300px);
      }
      .chart-wrapper.small {
        height: clamp(80px, 14vh, 140px);
      }
      .main-row {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 16px;
        margin-bottom: 16px;
      }
      .stats-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stats-column .stat-group {
        min-width: unset;
        flex: unset;
      }
      .two-charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .telemetry-window {
        margin-bottom: 16px;
      }
      .telemetry-window-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 0 0 8px 2px;
      }
      .telemetry-window-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .telemetry-window-time,
      .telemetry-errors {
        color: var(--text-dim);
        font-size: 10px;
      }
      .telemetry-errors {
        margin: 0 0 8px 2px;
        color: #ef4444;
      }
      .telemetry-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 16px;
      }
      .telemetry-grid .chart-container {
        margin-bottom: 0;
      }
      .telemetry-grid .chart-wrapper {
        height: clamp(150px, 22vh, 220px);
      }

      @media (max-width: 1200px) {
        .main-row {
          grid-template-columns: 1fr 300px;
        }
        .query-stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 1000px) {
        .main-row {
          grid-template-columns: 1fr 260px;
          gap: 12px;
        }
        body {
          padding: 16px;
        }
        .chart-container {
          padding: 14px;
        }
        .query-stat-value {
          font-size: 10px;
        }
        .query-stat-label {
          font-size: 7px;
        }
      }
      @media (max-width: 850px) {
        .main-row {
          grid-template-columns: 1fr;
        }
        .stats-column {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .stats-column .stat-group {
          flex: 1;
          min-width: 280px;
        }
        .query-stats {
          grid-template-columns: repeat(6, 1fr);
        }
      }
      @media (max-width: 700px) {
        .two-charts {
          grid-template-columns: 1fr;
        }
        .stats-row {
          flex-direction: column;
        }
        body {
          padding: 12px;
        }
        .main-row {
          gap: 12px;
        }
        .chart-container {
          padding: 12px;
        }
        .stats-column .stat-group {
          min-width: 100%;
        }
        .query-stats {
          grid-template-columns: repeat(3, 1fr);
        }
        .telemetry-grid {
          grid-template-columns: 1fr;
        }
      }
      #runs-container {
        display: contents;
      }
    </style>

 || 10);\nconst workload = __ENV.WORKLOAD || \"topk\";\n\nif (![\"topk\", \"count\"].includes(workload)) {\n  throw new Error(\"WORKLOAD must be topk or count\");\n}\n\nif (![vus, durationSeconds, topK].every(Number.isSafeInteger)) {\n  throw new Error(\"VUS, DURATION_SECONDS, and TOP_K must be integers\");\n}\nif (vus \u003c 1 || durationSeconds \u003c 1 || topK \u003c 1) {\n  throw new Error(\"VUS, DURATION_SECONDS, and TOP_K must be positive\");\n}\nif (!Number.isSafeInteger(warmupSeconds) || warmupSeconds \u003c 0) {\n  throw new Error(\"WARMUP_SECONDS must be a non-negative integer\");\n}\n\nconst queries = loadQueries(\n  JSON.parse(open(__ENV.QUERIES || \"./queries.json\")),\n  __ENV.QUERY_STYLE || \"disjunction\",\n);\nconst paradedbRequests = queries.map((query) =\u003e\n  paradedbRequest(query, topK, workload),\n);\n\nconst backends = db.backends({\n  datasetPath: \"..\",\n  backends: [\n    {\n      type: \"paradedb\",\n      connection: __ENV.PARADEDB_URL,\n      container: __ENV.PARADEDB_CONTAINER || \"\",\n    },\n  ],\n});\n\nconst updateBackends =\n  updatesPerSecond \u003e 0\n    ? db.backends({\n        datasetPath: \"..\",\n        backends: [\n          {\n            type: \"paradedb\",\n            alias: \"updates\",\n            connection: __ENV.PARADEDB_URL,\n            container: \"\",\n          },\n        ],\n      })\n    : null;\nconst completed = new Counter(\"benchmark_writer_completed\");\nconst updated = new Counter(\"benchmark_updated_rows\");\nconst skipped = new Counter(\"benchmark_skipped_update_slots\");\n\nconst timer = db.timer({\n  duration: `${warmupSeconds + durationSeconds}s`,\n  gap: \"0s\",\n});\nconst stages = [\n  ...(warmupSeconds \u003e 0\n    ? [{ duration: `${warmupSeconds}s`, target: vus }]\n    : []),\n  { duration: `${durationSeconds}s`, target: vus },\n];\nconst scenario = (backend, startTime) =\u003e ({\n  executor: \"ramping-vus\",\n  startVUs: vus,\n  stages,\n  startTime,\n  gracefulRampDown: \"0s\",\n  exec: `${backend}Search`,\n  tags: {\n    backend,\n    chart: `${workload}_${__ENV.QUERY_STYLE || \"disjunction\"}`,\n    ...(warmupSeconds \u003e 0 ? { warmup: \"true\" } : {}),\n  },\n});\n\nconst scenarios = {\n  paradedb: scenario(\"paradedb\", timer.get()),\n};\nif (updatesPerSecond \u003e 0) {\n  scenarios.updates = {\n    executor: \"per-vu-iterations\",\n    vus: 1,\n    iterations: 1,\n    startTime: `${warmupSeconds}s`,\n    maxDuration: `${durationSeconds + GRACE_SECONDS}s`,\n    gracefulStop: \"0s\",\n    exec: \"update\",\n    tags: { backend: \"updates\", chart: \"random_updates\" },\n  };\n}\n\nconst queryErrors = new Counter(\"benchmark_query_errors\");\nexport const collectMetrics = backends.addMetricsCollector(scenarios, timer);\nexport const options = {\n  scenarios,\n  thresholds: {\n    benchmark_query_errors: [\"count==0\"],\n    ...(updatesPerSecond \u003e 0\n      ? {\n          benchmark_writer_completed: [\"count==1\"],\n          benchmark_updated_rows: [\"count\u003e0\"],\n        }\n      : {}),\n  },\n};\n\nexport function paradedbSearch() {\n  const index = Number(exec.scenario.iterationInTest) % queries.length;\n  exec.vu.metrics.tags.query_id = queries[index].id;\n  const result = backends.get(\"paradedb\").query(...paradedbRequests[index]);\n  queryErrors.add(result?.error \u0026\u0026 !result?.deadlineReached ? 1 : 0, {\n    backend: \"paradedb\",\n  });\n}\n\n// The scalar bounds preserve a TID range scan instead of scanning the heap.\nconst updateSQL = `\nWITH bounds AS MATERIALIZED (\n  SELECT floor(random() * GREATEST(\n    pg_relation_size('documents') / current_setting('block_size')::bigint, 1\n  ))::bigint AS block\n), candidate AS MATERIALIZED (\n  SELECT ctid FROM documents\n  WHERE ctid \u003e= (SELECT format('(%s,0)', block)::tid FROM bounds)\n    AND ctid \u003c (SELECT format('(%s,0)', block + 1)::tid FROM bounds)\n  LIMIT 1\n)\nUPDATE documents SET body = body || ' '\nWHERE ctid = (SELECT ctid FROM candidate)\nRETURNING id`;\n\nexport function update() {\n  completed.add(0);\n  updated.add(0);\n  const start = exec.scenario.startTime;\n  const deadline = start + durationSeconds * MILLISECONDS_PER_SECOND;\n  const interval = MILLISECONDS_PER_SECOND / updatesPerSecond;\n  let next = start;\n  while (next \u003c deadline) {\n    const delay = next - Date.now();\n    if (delay \u003e 0) sleep(delay / MILLISECONDS_PER_SECOND);\n    if (Date.now() \u003e= deadline) break;\n    const result = updateBackends.get(\"updates\").query(updateSQL);\n    if (result.error) exec.test.abort(`Update failed: ${result.error}`);\n    updated.add(result.hits);\n    next += interval;\n    const now = Date.now();\n    if (next \u003c now) {\n      const missed = Math.ceil((now - next) / interval);\n      skipped.add(missed);\n      next += missed * interval;\n    }\n  }\n  completed.add(1);\n}\n","script_path":"/home/runner/work/paradedb/paradedb/benchmarker/datasets/_ci_config/k6/search.js","startTime":1795559921558,"telemetry":{"paradedb":[{"backend":"paradedb","startTime":1795559926625,"endTime":1795559951625,"samples":[{"time":1795559927135,"values":[{"name":"postgres.wal.records","kind":"counter","unit":"count","value":0},{"name":"postgres.wal.full_pages","kind":"counter","unit":"count","value":0},{"name":"postgres.wal.bytes","kind":"counter","unit":"bytes","value":0},{"name":"postgres.wal.buffers_full","kind":"counter","unit":"count","value":0},{"name":"postgres.database.blocks_read","kind":"counter","unit":"blocks","value":0},{"name":"postgres.database.blocks_hit","kind":"counter","unit":"blocks","value":0},{"name":"postgres.database.block_read_time","kind":"counter","unit":"ms","value":0},{"name":"postgres.database.block_write_time","kind":"counter","unit":"ms","value":0},{"name":"postgres.database.temp_files","kind":"counter","unit":"count","value":0},{"name":"postgres.database.temp_bytes","kind":"counter","unit":"bytes","value":0},{"name":"postgres.database.deadlocks","kind":"counter","unit"
