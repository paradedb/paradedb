<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParadeDB Benchmarker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.4.2/dist/sql-formatter.min.js"></script>
    <style>
      :root {
        --c1: #7c3aed;
        --c2: #f97316;
        --c3: #10b981;
        --c4: #ec4899;
        --c5: #3b82f6;
        --bg: #0f0f0f;
        --panel: #1a1a1a;
        --border: #2a2a2a;
        --text: #e5e5e5;
        --text-dim: #737373;
        --grid: #252525;
      }
      html.light {
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e5e5e5;
        --text: #171717;
        --text-dim: #737373;
        --grid: #f0f0f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "JetBrains Mono", monospace;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .header h1 {
        font-size: 20px;
        font-weight: 600;
      }
      .elapsed {
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .theme-toggle {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--c1);
      }
      .stats-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .stat-group {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        border-left: 3px solid var(--c1);
      }
      .stat-group-header {
        margin-bottom: 8px;
      }
      .stat-group-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .stat {
        text-align: left;
      }
      .stat-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 9px;
        color: var(--text-dim);
        text-transform: uppercase;
      }
      .stat-group-header {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-group-header:hover {
        opacity: 0.8;
      }
      .expand-icon {
        font-size: 10px;
        transition: transform 0.2s;
      }
      .stat-group.expanded .expand-icon {
        transform: rotate(90deg);
      }
      .query-details {
        display: none;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .stat-group.expanded .query-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .warmup-status {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .warmup-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: var(--text-dim);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .warmup-track {
        height: 6px;
        overflow: hidden;
        background: var(--border);
        border-radius: 3px;
      }
      .warmup-fill {
        height: 100%;
        width: 0;
        background: var(--c1);
        border-radius: inherit;
        transition: width 0.2s ease;
      }
      .query-item {
        background: var(--bg);
        border-radius: 4px;
        padding: 8px;
        cursor: pointer;
        position: relative;
      }
      .query-item:hover {
        background: var(--border);
      }
      .query-tooltip {
        display: none;
        position: fixed;
        right: 300px;
        top: 100px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        max-width: 500px;
        max-height: 400px;
        overflow: auto;
        z-index: 1000;
        font-size: 11px;
        white-space: pre-wrap;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .query-tooltip.visible {
        display: block;
      }
      .config-modal {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        min-width: 400px;
        max-width: 600px;
        max-height: 80vh;
        overflow: auto;
        z-index: 1001;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .config-modal.visible {
        display: block;
      }
      .config-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .config-modal-title {
        font-weight: 600;
        font-size: 13px;
      }
      .config-modal-close {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 18px;
        cursor: pointer;
        padding: 0 4px;
      }
      .config-modal-close:hover {
        color: var(--text);
      }
      .config-item {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .config-item:last-child {
        border-bottom: none;
      }
      .config-key {
        color: var(--text-dim);
      }
      .config-value {
        font-weight: 600;
        text-align: right;
        max-width: 60%;
        word-break: break-all;
      }
      .config-section {
        margin-top: 12px;
      }
      .config-section-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--c1);
      }
      .config-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }
      .config-tab {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 12px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
      }
      .config-tab:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .config-tab.active {
        background: var(--c1);
        border-color: var(--c1);
        color: white;
      }
      .config-tab-content {
        display: none;
      }
      .config-tab-content.active {
        display: block;
      }
      .schema-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      .schema-table th,
      .schema-table td {
        padding: 4px 8px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .schema-table th {
        color: var(--text-dim);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 9px;
      }
      .index-def {
        background: var(--bg);
        padding: 8px;
        border-radius: 4px;
        margin-top: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 10px;
      }
      .index-name {
        font-weight: 600;
        color: var(--c1);
        margin-bottom: 4px;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }
      .modal-backdrop.visible {
        display: block;
      }
      .query-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .query-name {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .query-info {
        font-size: 9px;
        font-weight: 400;
        color: var(--text-dim);
        margin-left: 12px;
        text-transform: none;
        letter-spacing: normal;
      }
      .query-stats {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .query-stat-value {
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .query-stat-label {
        font-size: 8px;
        color: var(--text-dim);
        text-transform: uppercase;
      }
      .chart-container {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
        min-width: 0;
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .chart-header h2 {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .chart-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .reset-zoom {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 8px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 9px;
        cursor: pointer;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .reset-zoom.visible {
        opacity: 1;
      }
      .reset-zoom:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .chart-header select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        text-transform: uppercase;
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
      }
      .legend-item:hover {
        opacity: 0.8;
      }
      .legend-item.disabled {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .legend-item.disabled .legend-color {
        opacity: 0.3;
      }
      .legend-color {
        width: 16px;
        height: 3px;
        border-radius: 1px;
      }
      .chart-wrapper {
        position: relative;
        height: clamp(140px, 30vh, 300px);
      }
      .chart-wrapper.small {
        height: clamp(80px, 14vh, 140px);
      }
      .main-row {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 16px;
        margin-bottom: 16px;
      }
      .stats-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stats-column .stat-group {
        min-width: unset;
        flex: unset;
      }
      .two-charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .telemetry-window {
        margin-bottom: 16px;
      }
      .telemetry-window-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 0 0 8px 2px;
      }
      .telemetry-window-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .telemetry-window-time,
      .telemetry-errors {
        color: var(--text-dim);
        font-size: 10px;
      }
      .telemetry-errors {
        margin: 0 0 8px 2px;
        color: #ef4444;
      }
      .telemetry-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 16px;
      }
      .telemetry-grid .chart-container {
        margin-bottom: 0;
      }
      .telemetry-grid .chart-wrapper {
        height: clamp(150px, 22vh, 220px);
      }

      @media (max-width: 1200px) {
        .main-row {
          grid-template-columns: 1fr 300px;
        }
        .query-stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 1000px) {
        .main-row {
          grid-template-columns: 1fr 260px;
          gap: 12px;
        }
        body {
          padding: 16px;
        }
        .chart-container {
          padding: 14px;
        }
        .query-stat-value {
          font-size: 10px;
        }
        .query-stat-label {
          font-size: 7px;
        }
      }
      @media (max-width: 850px) {
        .main-row {
          grid-template-columns: 1fr;
        }
        .stats-column {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .stats-column .stat-group {
          flex: 1;
          min-width: 280px;
        }
        .query-stats {
          grid-template-columns: repeat(6, 1fr);
        }
      }
      @media (max-width: 700px) {
        .two-charts {
          grid-template-columns: 1fr;
        }
        .stats-row {
          flex-direction: column;
        }
        body {
          padding: 12px;
        }
        .main-row {
          gap: 12px;
        }
        .chart-container {
          padding: 12px;
        }
        .stats-column .stat-group {
          min-width: 100%;
        }
        .query-stats {
          grid-template-columns: repeat(3, 1fr);
        }
        .telemetry-grid {
          grid-template-columns: 1fr;
        }
      }
      #runs-container {
        display: contents;
      }
    </style>

  <body>
    <div class="header">
      <h1>
        <a
          href="https://github.com/paradedb/benchmarker"
          style="color: inherit; text-decoration: none"
          >ParadeDB Benchmarker</a
        >
      </h1>
      <div style="display: flex; align-items: center; gap: 16px">
        <div
          id="timeline-settings"
          style="font-size: 11px; color: var(--text-dim)"
        ></div>
        <div class="elapsed" id="elapsed">00:00</div>
        <button class="theme-toggle" onclick="toggleTheme()">◐ Theme</button>
      </div>
    </div>

    <div
      id="notes-container"
      style="
        display: none;
        padding: 12px 16px;
        margin-bottom: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-dim);
        font-size: 13px;
      "
    ></div>

    <div id="chart-groups-container"></div>

    <div class="main-row" id="ingest-container" style="display: none">
      <div class="chart-container">
        <div class="chart-header">
          <h2>Ingest (docs/s)</h2>
          <div class="chart-controls">
            <button class="reset-zoom" id="reset-ingest" onclick="resetZoom()">
              Reset Zoom
            </button>
            <div class="legend" id="ingest-legend"></div>
          </div>
        </div>
        <div class="chart-wrapper small">
          <canvas id="ingestChart"></canvas>
        </div>
      </div>
      <div class="stats-column" id="ingest-stats-container"></div>
    </div>

    <div class="two-charts" id="metrics-container" style="display: none">
      <div class="chart-container">
        <div class="chart-header">
          <h2>CPU %</h2>
          <button class="reset-zoom" id="reset-cpu" onclick="resetZoom()">
            Reset Zoom
          </button>
        </div>
        <div class="chart-wrapper small">
          <canvas id="cpuChart"></canvas>
        </div>
      </div>
      <div class="chart-container">
        <div class="chart-header">
          <h2>Memory</h2>
          <button class="reset-zoom" id="reset-memory" onclick="resetZoom()">
            Reset Zoom
          </button>
        </div>
        <div class="chart-wrapper small">
          <canvas id="memoryChart"></canvas>
        </div>
      </div>
    </div>

    <div class="stats-row" id="update-container" style="display: none"></div>

    <div id="telemetry-container" style="display: none">
      <div id="telemetry-windows"></div>
    </div>

    <div id="query-tooltip" class="query-tooltip"></div>
    <div
      id="modal-backdrop"
      class="modal-backdrop"
      onclick="hideConfigModal()"
    ></div>
    <div id="config-modal" class="config-modal">
      <div class="config-modal-header">
        <span class="config-modal-title" id="config-modal-title"
          >Configuration</span
        >
        <button class="config-modal-close" onclick="hideConfigModal()">
          &times;
        </button>
      </div>
      <div id="config-modal-content"></div>
    </div>

    <script>
      const COLORS = [
        "#7C3AED",
        "#F97316",
        "#10B981",
        "#EC4899",
        "#3B82F6",
        "#EAB308",
        "#06B6D4",
      ];
      // Hardcoded brand colors per backend type
      const BACKEND_COLORS = {
        paradedb: "#7C3AED", // Purple (ParadeDB brand)
        postgres: "#3B82F6", // Blue
        elasticsearch: "#10B981", // Green (Elastic brand)
        opensearch: "#EF4444", // Red (OpenSearch brand)
        clickhouse: "#FACC15", // Yellow (ClickHouse brand)
        mongodb: "#00ED64", // MongoDB Green (their actual brand green)
      };
      let isDark = false;
      let runColors = {};
      let selectedMetric = "p95";
      let lastMetric = "p95";
      let chartType = "latency"; // 'latency' | 'hits' | 'throughput'
      let lastChartType = "latency";
      let colorIndex = 0;
      let lastElapsed = 0;
      let chartDuration = 30; // Will be updated from server
      let selectedQueries = new Set(); // Empty = show all (aggregated)
      let allQueryTypes = new Set();
      let lastData = null; // Store last data for filter updates
      let queryTexts = {}; // Store query text per query name
      let runConfigs = {}; // Store config per run name
      let chartInstances = {}; // Chart instances per dashboard group
      let telemetryCharts = {}; // Generic backend telemetry charts
      let chartLegendKeys = {}; // Legend keys per dashboard group
      let chartGroupOrder = []; // Track order of chart groups by first emission

      function resetState() {
        runColors = {};
        colorIndex = 0;
        lastElapsed = 0;
        chartDuration = 30;
        selectedQueries = new Set();
        allQueryTypes = new Set();
        lastData = null;
        queryTexts = {};
        runConfigs = {};
        isZoomed = false;
        chartType = "latency";
        lastChartType = "latency";
        document
          .querySelectorAll(".reset-zoom")
          .forEach((btn) => btn.classList.remove("visible"));
        document.getElementById("chart-groups-container").innerHTML = "";
        document.getElementById("ingest-legend").innerHTML = "";
        chartLegendKeys = {};
        document.getElementById("ingest-stats-container").innerHTML = "";
        document.getElementById("ingest-container").style.display = "none";
        document.getElementById("update-container").innerHTML = "";
        document.getElementById("update-container").style.display = "none";
        document.getElementById("telemetry-windows").innerHTML = "";
        document.getElementById("telemetry-container").style.display = "none";
        // Destroy existing dashboard charts
        Object.values(chartInstances).forEach((chart) => chart.destroy());
        Object.values(telemetryCharts).forEach((chart) => chart.destroy());
        chartInstances = {};
        telemetryCharts = {};
        chartGroupOrder = [];
        [cpuChart, memoryChart, ingestChart].forEach((chart) => {
          chart.data.datasets = [];
          chart.options.scales.x.min = 0;
          chart.options.scales.x.max = chartDuration;
          delete chart.options.scales.y.max;
          chart.update("none");
        });
      }

      // Get base name without chart suffix (e.g., "paradedb-prod (chart)" -> "paradedb-prod")
      function getBaseName(run) {
        const match = run.match(/^(.+?) \(.+\)$/);
        return match ? match[1] : run;
      }

      // Short version string for a backend label, from the captured config.
      // ParadeDB reports the pg_search version (composite record text like
      // "(0.25.6,rev,...)"); postgres-family the "PostgreSQL x.y" banner;
      // ES/OpenSearch/Mongo/ClickHouse a bare version string.
      function backendVersion(cfg) {
        if (!cfg) return "";
        const pdb = cfg["paradedb.version"];
        if (typeof pdb === "string") {
          const m = pdb.match(/\(?"?v?([0-9][^,")]*)/);
          if (m) return m[1];
        }
        const v = cfg.version;
        if (typeof v !== "string" || v === "") return "";
        const pg = v.match(/^PostgreSQL (\S+)/);
        if (pg) return pg[1];
        return v.split(" ")[0];
      }

      function sanitizeColor(value) {
        const color = String(value || "").trim();
        if (/^#[0-9a-fA-F]{3,8}$/.test(color)) {
          return color;
        }
        if (/^(rgb|rgba|hsl|hsla)\([0-9.,%\s]+\)$/.test(color)) {
          return color;
        }
        // Allow named CSS colors (e.g. "red", "blue", "darkgreen")
        if (/^[a-zA-Z]{3,20}$/.test(color)) {
          return color;
        }
        return "";
      }

      function getRunColor(name, runData) {
        // Use base name for color so same backend has same color across charts
        const baseName = getBaseName(name);
        if (!runColors[baseName]) {
          // Check for custom color from backend options first
          if (runData?.color) {
            const customColor = sanitizeColor(runData.color);
            if (customColor) {
              runColors[baseName] = customColor;
            }
          }
          // Then check for backend-specific color
          if (
            !runColors[baseName] &&
            runData?.backend &&
            BACKEND_COLORS[runData.backend]
          ) {
            runColors[baseName] = BACKEND_COLORS[runData.backend];
          }
          // Fall back to cycling colors
          if (!runColors[baseName]) {
            runColors[baseName] = COLORS[colorIndex % COLORS.length];
            colorIndex++;
          }
        }
        return runColors[baseName];
      }

      // Cache for container colors
      const containerColors = {};
      let containerColorIndex = 0;

      function getContainerColor(name, container) {
        // Check for custom color first
        if (container?.color) {
          const customColor = sanitizeColor(container.color);
          if (customColor) {
            containerColors[name] = customColor;
            return customColor;
          }
        }
        // Try to match with a run's color for consistency across panels
        if (lastData?.runs) {
          for (const [runName, runData] of Object.entries(lastData.runs)) {
            if (
              runData.backend === container?.backend ||
              runData.container === name
            ) {
              return getRunColor(runName, runData);
            }
          }
        }
        // Check for backend-specific color
        if (container?.backend && BACKEND_COLORS[container.backend]) {
          containerColors[name] = BACKEND_COLORS[container.backend];
          return BACKEND_COLORS[container.backend];
        }
        // Fall back to cycling colors (only cache if no backend info yet)
        if (!containerColors[name]) {
          containerColors[name] = COLORS[containerColorIndex % COLORS.length];
          containerColorIndex++;
        }
        return containerColors[name];
      }

      function shadeColor(color, percent) {
        // Lighten or darken a hex color
        const num = parseInt(color.replace("#", ""), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.min(255, Math.max(0, (num >> 16) + amt));
        const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00ff) + amt));
        const B = Math.min(255, Math.max(0, (num & 0x0000ff) + amt));
        return (
          "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1)
        );
      }

      function toggleTheme() {
        isDark = !isDark;
        document.documentElement.classList.toggle("light", !isDark);
        updateChartColors();
      }

      function getGridColor() {
        return isDark ? "#252525" : "#f0f0f0";
      }
      function getTickColor() {
        return "#737373";
      }

      function updateChartColors() {
        [
          ...Object.values(chartInstances),
          ...Object.values(telemetryCharts),
          cpuChart,
          memoryChart,
          ingestChart,
        ].forEach((chart) => {
          chart.options.scales.x.grid.color = getGridColor();
          chart.options.scales.y.grid.color = getGridColor();
          if (chart.options.plugins.legend?.labels) {
            chart.options.plugins.legend.labels.color = getTickColor();
          }
          chart.update("none");
        });
      }

      function createChartOptions(yUnit = "", chartId = "") {
        return {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "nearest", axis: "x", intersect: true },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) =>
                  `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}${yUnit}`,
                title: (items) =>
                  items.length ? `${items[0].parsed.x.toFixed(0)}s` : "",
              },
            },
            zoom: {
              zoom: {
                wheel: {
                  enabled: true,
                  modifierKey: "ctrl",
                },
                drag: {
                  enabled: true,
                  backgroundColor: "rgba(124, 58, 237, 0.1)",
                  borderColor: "rgba(124, 58, 237, 0.5)",
                  borderWidth: 1,
                },
                mode: "x",
                onZoomComplete: ({ chart }) => syncZoom(chart),
              },
              pan: {
                enabled: true,
                mode: "x",
                onPanComplete: ({ chart }) => syncZoom(chart),
              },
              limits: {
                x: { min: 0, minRange: 1 },
              },
            },
          },
          elements: {
            point: { radius: 0, hitRadius: 5, hoverRadius: 3 },
            line: { borderWidth: 2, tension: 0.3 },
          },
          scales: {
            x: {
              type: "linear",
              min: 0,
              max: chartDuration,
              grid: { color: getGridColor() },
              ticks: {
                color: getTickColor(),
                font: { family: "JetBrains Mono", size: 10 },
                maxTicksLimit: 8,
                callback: (v) => Math.round(v) + "s",
              },
            },
            y: {
              min: 0,
              suggestedMax: 10,
              grid: { color: getGridColor() },
              ticks: {
                color: getTickColor(),
                font: { family: "JetBrains Mono", size: 10 },
                maxTicksLimit: 6,
                callback: (v) => Math.round(v) + yUnit,
              },
            },
          },
        };
      }

      let isZoomed = false;

      // Calculate Y min/max for visible data points within X range
      function getVisibleYRange(chart, xMin, xMax) {
        let yMin = Infinity;
        let yMax = -Infinity;

        chart.data.datasets.forEach((dataset) => {
          if (dataset.hidden) return;
          dataset.data.forEach((point) => {
            if (point.x >= xMin && point.x <= xMax) {
              if (point.y < yMin) yMin = point.y;
              if (point.y > yMax) yMax = point.y;
            }
          });
        });

        if (yMin === Infinity) return null;

        // Add 10% padding
        const padding = (yMax - yMin) * 0.1 || 1;
        return { min: Math.max(0, yMin - padding), max: yMax + padding };
      }

      function getAllCharts() {
        return [
          ...Object.values(chartInstances),
          ...Object.values(telemetryCharts),
          cpuChart,
          memoryChart,
          ingestChart,
        ];
      }

      function syncZoom(sourceChart) {
        const xMin = sourceChart.scales.x.min;
        const xMax = sourceChart.scales.x.max;

        // Only consider zoomed if not showing full extent
        const atFullExtent = xMin <= 0.1 && xMax >= chartDuration - 0.1;
        if (atFullExtent) {
          isZoomed = false;
          document
            .querySelectorAll(".reset-zoom")
            .forEach((btn) => btn.classList.remove("visible"));
          return;
        }

        isZoomed = true;
        document
          .querySelectorAll(".reset-zoom")
          .forEach((btn) => btn.classList.add("visible"));

        // Sync X axis to all charts first
        getAllCharts().forEach((chart) => {
          if (chart !== sourceChart) {
            chart.options.scales.x.min = xMin;
            chart.options.scales.x.max = xMax;
          }
        });

        // Defer Y axis recalculation to ensure zoom plugin has finished
        setTimeout(() => {
          getAllCharts().forEach((chart) => {
            const yRange = getVisibleYRange(chart, xMin, xMax);
            if (yRange) {
              chart.options.scales.y.min = yRange.min;
              chart.options.scales.y.max = yRange.max;
            }
            chart.update("none");
          });
        }, 0);
      }

      function resetZoom() {
        isZoomed = false;
        getAllCharts().forEach((chart) => {
          // Don't use chart.resetZoom() as it can be unreliable
          // Instead, explicitly reset all scale options
          chart.options.scales.x.min = 0;
          chart.options.scales.x.max = chartDuration;
          // Reset Y axis to auto-scale based on full dataset
          chart.options.scales.y.min = 0;
          chart.options.scales.y.max = getYMax(chart.data.datasets);
          // Force scales to update by triggering a full update
          chart.update("resize");
        });
        document
          .querySelectorAll(".reset-zoom")
          .forEach((btn) => btn.classList.remove("visible"));
      }

      // Create or get dashboard group section
      function getOrCreateChartGroup(chartName) {
        const groupId = chartName || "default";
        const safeGroupId = groupId.replace(/[^a-zA-Z0-9]/g, "_");

        if (chartInstances[groupId]) {
          return chartInstances[groupId];
        }

        // Track order of chart groups by first emission
        if (!chartGroupOrder.includes(groupId)) {
          chartGroupOrder.push(groupId);
        }

        const container = document.getElementById("chart-groups-container");
        const section = document.createElement("div");
        section.id = `chart-group-${safeGroupId}`;
        section.className = "main-row";
        const chartTitle = chartName
          ? `<span style="color: var(--text); margin-right: 8px;">${escapeHtml(chartName)}</span>`
          : "";
        section.innerHTML = `
        <div class="chart-container">
          <div class="chart-header">
            <h2>${chartTitle}<select class="chart-type-select" data-chart="${safeGroupId}">
              <option value="latency" selected>Latency</option>
              <option value="hits">Hits</option>
              <option value="throughput">Throughput</option>
            </select> <span class="metric-wrapper"><select class="metric-select" data-chart="${safeGroupId}">
              <option value="p50">P50</option>
              <option value="mean">Mean</option>
              <option value="p90">P90</option>
              <option value="p95" selected>P95</option>
              <option value="p99">P99</option>
            </select> (ms)</span><span class="hits-unit" style="display:none;">(avg)</span><span class="throughput-unit" style="display:none;">(qps)</span></h2>
            <div class="chart-controls">
              <button class="reset-zoom" onclick="resetZoom()" title="Double-click chart to reset">Reset Zoom</button>
              <div class="legend" id="legend-${safeGroupId}"></div>
            </div>
          </div>
          <div class="chart-wrapper">
            <canvas id="chart-${safeGroupId}"></canvas>
          </div>
        </div>
        <div class="stats-column" id="stats-${safeGroupId}"></div>
      `;
        container.appendChild(section);

        // Sync select elements with current state
        const metricSelect = section.querySelector(
          `.metric-select[data-chart="${safeGroupId}"]`,
        );
        if (metricSelect) metricSelect.value = selectedMetric;
        const chartTypeSelect = section.querySelector(
          `.chart-type-select[data-chart="${safeGroupId}"]`,
        );
        if (chartTypeSelect) chartTypeSelect.value = chartType;
        if (metricSelect) {
          metricSelect.addEventListener("change", (event) =>
            updateMetricSelectionForGroup(groupId, event.target.value),
          );
        }
        if (chartTypeSelect) {
          chartTypeSelect.addEventListener("change", (event) =>
            updateChartTypeForGroup(groupId, event.target.value),
          );
        }
        // Sync metric wrapper visibility based on chart type
        const metricWrapper = section.querySelector(".metric-wrapper");
        const hitsUnit = section.querySelector(".hits-unit");
        const throughputUnit = section.querySelector(".throughput-unit");
        if (metricWrapper)
          metricWrapper.style.display =
            chartType === "latency" ? "inline" : "none";
        if (hitsUnit)
          hitsUnit.style.display = chartType === "hits" ? "inline" : "none";
        if (throughputUnit)
          throughputUnit.style.display =
            chartType === "throughput" ? "inline" : "none";

        // Create chart instance
        const canvas = document.getElementById(`chart-${safeGroupId}`);
        const chart = new Chart(canvas, {
          type: "line",
          data: { datasets: [] },
          options: createChartOptions("ms", groupId),
        });

        // Add double-click to reset zoom
        canvas.addEventListener("dblclick", resetZoom);

        chartInstances[groupId] = chart;
        chartLegendKeys[groupId] = "";

        return chart;
      }

      function updateMetricSelectionForGroup(groupId, value) {
        if (!value) return;
        selectedMetric = value;
        // Sync all metric selects to the same value
        document.querySelectorAll(".metric-select").forEach((s) => {
          s.value = selectedMetric;
        });
        if (lastData) update(lastData);
      }

      function updateChartTypeForGroup(groupId, value) {
        if (!value) return;
        chartType = value;
        // Sync all chart type selects and visibility
        document.querySelectorAll(".chart-type-select").forEach((s) => {
          s.value = chartType;
        });
        // Update metric wrapper visibility for all charts
        document.querySelectorAll(".metric-wrapper").forEach((mw) => {
          mw.style.display = chartType === "latency" ? "inline" : "none";
        });
        document.querySelectorAll(".hits-unit").forEach((hu) => {
          hu.style.display = chartType === "hits" ? "inline" : "none";
        });
        document.querySelectorAll(".throughput-unit").forEach((tu) => {
          tu.style.display = chartType === "throughput" ? "inline" : "none";
        });
        if (lastData) update(lastData);
      }

      const cpuChart = new Chart(document.getElementById("cpuChart"), {
        type: "line",
        data: { datasets: [] },
        options: createChartOptions("%", "cpu"),
      });

      const memoryChart = new Chart(document.getElementById("memoryChart"), {
        type: "line",
        data: { datasets: [] },
        options: {
          ...createChartOptions("GB", "memory"),
          plugins: {
            ...createChartOptions("GB", "memory").plugins,
            tooltip: {
              callbacks: {
                label: (ctx) =>
                  `${ctx.dataset.label}: ${(ctx.parsed.y / 1e9).toFixed(2)}GB`,
                title: (items) =>
                  items.length ? `${items[0].parsed.x.toFixed(0)}s` : "",
              },
            },
          },
          scales: {
            ...createChartOptions().scales,
            y: {
              min: 0,
              suggestedMax: 1e9,
              grid: { color: getGridColor() },
              ticks: {
                color: getTickColor(),
                font: { family: "JetBrains Mono", size: 10 },
                maxTicksLimit: 6,
                callback: (v) => Math.round((v / 1e9) * 10) / 10 + "GB",
              },
            },
          },
        },
      });

      const ingestChart = new Chart(document.getElementById("ingestChart"), {
        type: "line",
        data: { datasets: [] },
        options: {
          ...createChartOptions("/s", "ingest"),
          plugins: {
            ...createChartOptions("/s", "ingest").plugins,
            tooltip: {
              callbacks: {
                label: (ctx) =>
                  `${ctx.dataset.label}: ${formatNumber(ctx.parsed.y)}/s`,
                title: (items) =>
                  items.length ? `${items[0].parsed.x.toFixed(0)}s` : "",
              },
            },
          },
          scales: {
            ...createChartOptions().scales,
            y: {
              min: 0,
              grid: { color: getGridColor() },
              ticks: {
                color: getTickColor(),
                font: { family: "JetBrains Mono", size: 10 },
                maxTicksLimit: 6,
                callback: (v) => formatNumber(Math.round(v)) + "/s",
              },
            },
          },
        },
      });

      // Add double-click to reset zoom on all charts
      ["cpuChart", "memoryChart", "ingestChart"].forEach((id) => {
        document.getElementById(id).addEventListener("dblclick", resetZoom);
      });

      function getYMax(datasets) {
        let max = 0;
        datasets.forEach((ds) =>
          ds.data.forEach((p) => {
            if (p.y > max) max = p.y;
          }),
        );
        return max > 0 ? max * 1.2 : 10;
      }

      // Update Y axis based on zoom state
      function updateChartYAxis(chart) {
        if (isZoomed) {
          // When zoomed, recalculate Y range for visible data
          const xMin = chart.options.scales.x.min;
          const xMax = chart.options.scales.x.max;
          const yRange = getVisibleYRange(chart, xMin, xMax);
          if (yRange) {
            chart.options.scales.y.min = yRange.min;
            chart.options.scales.y.max = yRange.max;
          }
        } else {
          // When not zoomed, auto-scale to full dataset
          chart.options.scales.y.min = 0;
          chart.options.scales.y.max = getYMax(chart.data.datasets);
        }
      }

      // Update chart datasets in place to preserve hover state
      function updateChartDatasets(chart, newDatasets, forceReplace = false) {
        const getDatasetKey = (ds) => ds.datasetKey || ds.label;
        const existingLabels = new Set(
          chart.data.datasets.map((ds) => getDatasetKey(ds)),
        );
        const newLabels = new Set(newDatasets.map((ds) => getDatasetKey(ds)));

        // Update existing datasets
        chart.data.datasets.forEach((ds) => {
          const datasetKey = getDatasetKey(ds);
          const newDs = newDatasets.find(
            (n) => getDatasetKey(n) === datasetKey,
          );
          if (newDs) {
            if (forceReplace) {
              // Full replace when metric changes
              ds.data.length = 0;
              newDs.data.forEach((pt) => ds.data.push(pt));
            } else {
              // Only push new points to preserve hover state
              const lastTime =
                ds.data.length > 0 ? ds.data[ds.data.length - 1].x : 0;
              newDs.data.forEach((pt) => {
                if (pt.x > lastTime) {
                  ds.data.push(pt);
                }
              });
            }
            ds.borderColor = newDs.borderColor;
            ds.backgroundColor = newDs.backgroundColor;
            // Copy scriptable pointRadius function
            if (newDs.pointRadius) {
              ds.pointRadius = newDs.pointRadius;
            }
            ds.label = newDs.label;
            ds.datasetKey = newDs.datasetKey;
          }
        });

        // Add new datasets
        newDatasets.forEach((ds) => {
          if (!existingLabels.has(getDatasetKey(ds))) {
            chart.data.datasets.push(ds);
          }
        });

        // Remove datasets that no longer exist (in place)
        for (let i = chart.data.datasets.length - 1; i >= 0; i--) {
          if (!newLabels.has(getDatasetKey(chart.data.datasets[i]))) {
            chart.data.datasets.splice(i, 1);
          }
        }
      }

      function formatElapsed(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }

      function formatNumber(n) {
        if (!n && n !== 0) return "-";
        if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
        if (n >= 1000) return (n / 1000).toFixed(1) + "K";
        return Math.floor(n).toString();
      }

      function safeId(value) {
        return String(value).replace(/[^a-zA-Z0-9_-]/g, "_");
      }

      function formatLatency(ms) {
        if (!ms) return "-";
        if (ms >= 10000) return (ms / 1000).toFixed(1) + "s";
        if (ms >= 1000) return (ms / 1000).toFixed(2) + "s";
        if (ms >= 100) return Math.round(ms) + "ms";
        if (ms >= 10) return ms.toFixed(0) + "ms";
        return ms.toFixed(1) + "ms";
      }

      function hasQueries(run) {
        // A warmup creates the backend card before measured samples arrive.
        return run.warmingUp || Object.keys(run.queries || {}).length > 0;
      }

      function hasQueryTimelines(run) {
        return Object.values(run.queries || {}).some(
          (q) => q.timeline?.length > 0,
        );
      }

      function updateStats(runs, backendsBlock) {
        backendsBlock = backendsBlock || {};
        // Group runs by chart (show runs with queries even before timeline data)
        const runsByChart = {};
        Object.keys(runs)
          .filter((name) => hasQueries(runs[name]))
          .sort()
          .forEach((name) => {
            const run = runs[name];
            const chartGroup = run.chart || "default";
            if (!runsByChart[chartGroup]) {
              runsByChart[chartGroup] = [];
            }
            runsByChart[chartGroup].push(name);
          });

        // Calculate earliest start time per chart group
        const chartStartTimes = {};
        Object.keys(runsByChart).forEach((chartGroup) => {
          chartStartTimes[chartGroup] = Infinity;
          runsByChart[chartGroup].forEach((name) => {
            const run = runs[name];
            if (run.startTime && run.startTime < chartStartTimes[chartGroup]) {
              chartStartTimes[chartGroup] = run.startTime;
            }
          });
        });

        // Update stats for each chart group (in emission order by start time)
        const sortedChartGroups = Object.keys(runsByChart).sort((a, b) => {
          const aTime = chartStartTimes[a] || Infinity;
          const bTime = chartStartTimes[b] || Infinity;
          if (aTime === bTime) return a.localeCompare(b);
          return aTime - bTime;
        });
        sortedChartGroups.forEach((chartGroup) => {
          const safeChartId = (chartGroup || "default").replace(
            /[^a-zA-Z0-9]/g,
            "_",
          );
          // Ensure chart group exists
          getOrCreateChartGroup(chartGroup === "default" ? "" : chartGroup);
          const container = document.getElementById(`stats-${safeChartId}`);
          if (!container) return;

          // Sort backends by selected metric (fastest first)
          const sortedBackends = runsByChart[chartGroup]
            .slice()
            .sort((a, b) => {
              const runA = runs[a];
              const runB = runs[b];
              // Get average metric across all queries for each backend
              const getAvgMetric = (run) => {
                const queries = run.queries || {};
                const values = Object.values(queries)
                  .map((q) => q[selectedMetric])
                  .filter((v) => v != null && v > 0);
                return values.length > 0
                  ? values.reduce((s, v) => s + v, 0) / values.length
                  : Infinity;
              };
              return getAvgMetric(runA) - getAvgMetric(runB);
            });

          sortedBackends.forEach((name, idx) => {
            const run = runs[name];
            const color = getRunColor(name, run);
            const safeNameId = safeId(name);
            const statId = `stat-${safeNameId}`;
            const queryContainerId = `${safeNameId}-queries`;

            // Look up the deduplicated backend snapshot for this run.
            const backendSnapshot = backendsBlock[run.backend] || {};
            const backendConfig = backendSnapshot.config || {};
            const containerInfo = backendSnapshot.container_info || null;
            runConfigs[name] = backendSnapshot;

            const labelId = `label-${safeNameId}`;
            let el = document.getElementById(statId);

            if (!el) {
              el = document.createElement("div");
              el.id = statId;
              el.className = "stat-group expanded";
              el.style.borderLeftColor = color;

              // Build limits string from container_info on the backend snapshot.
              let limitsStr = "";
              if (containerInfo) {
                const parts = [];
                if (containerInfo.cpu_limit)
                  parts.push(escapeHtml(containerInfo.cpu_limit));
                if (containerInfo.memory_limit)
                  parts.push(escapeHtml(containerInfo.memory_limit));
                if (parts.length > 0)
                  limitsStr = `<span style="color: var(--text-dim); font-size: 9px; margin-left: 8px;">${parts.join(" / ")}</span>`;
              }

              el.innerHTML = `
              <div class="stat-group-header">
                <div id="${labelId}" class="stat-group-label" style="color: ${color};">${escapeHtml(getBaseName(name))}</div>${limitsStr}
              </div>
              <div class="warmup-status" id="${safeNameId}-warmup">
                <div class="warmup-label">
                  <span>Warmup</span>
                  <span id="${safeNameId}-warmup-percent">0%</span>
                </div>
                <div class="warmup-track">
                  <div class="warmup-fill" id="${safeNameId}-warmup-fill" style="background: ${color};"></div>
                </div>
              </div>
              <div class="query-details" id="${queryContainerId}"></div>
            `;
              container.appendChild(el);
            }

            const warmupEl = document.getElementById(`${safeNameId}-warmup`);
            const progress = Math.max(
              0,
              Math.min(100, Number(run.warmupProgress) || 0),
            );
            warmupEl.style.display = run.warmingUp ? "block" : "none";
            document.getElementById(
              `${safeNameId}-warmup-percent`,
            ).textContent = `${Math.floor(progress)}%`;
            document.getElementById(`${safeNameId}-warmup-fill`).style.width =
              `${progress}%`;

            // Set up config click handler after element is in the DOM.
            // Runs on every update so it works even if config arrives later.
            const hasGlobalCapture =
              (lastData && (lastData.dataset_yaml || lastData.script)) || false;
            const hasConfig =
              Object.keys(backendConfig).length > 0 ||
              containerInfo ||
              hasGlobalCapture;
            if (hasConfig) {
              const labelEl = document.getElementById(labelId);
              if (labelEl && !labelEl.dataset.configHandler) {
                labelEl.style.cursor = "pointer";
                labelEl.style.textDecoration = "underline";
                labelEl.style.textDecorationStyle = "dotted";
                labelEl.addEventListener("click", () => showConfigModal(name));
                labelEl.dataset.configHandler = "1";
              }
            }

            // Append the backend version to the label (config may arrive
            // after the label is first rendered, so re-check every update).
            {
              const labelEl = document.getElementById(labelId);
              if (labelEl) {
                const ver = backendVersion(backendConfig);
                const text = ver
                  ? `${getBaseName(name)} ${ver}`
                  : getBaseName(name);
                if (labelEl.textContent !== text) labelEl.textContent = text;
              }
            }

            // Update query details - only create if not exists, then just update values
            const queriesEl = document.getElementById(queryContainerId);
            const queries = run.queries || {};
            const queryNames = Object.keys(queries).sort();

            queryNames.forEach((qName) => {
              const q = queries[qName];
              const queryKey = `${name}::${qName}`;
              const queryId = `${safeNameId}-${safeId(qName)}`;
              let queryEl = document.getElementById(queryId);

              // Store query text if available
              if (q.query) {
                queryTexts[queryKey] = q.query;
              }

              if (!queryEl) {
                // Create new query item
                queryEl = document.createElement("div");
                queryEl.id = queryId;
                queryEl.className = "query-item";
                queryEl.dataset.query = qName;

                // Build info string with VUs and executor if available
                const infoParts = [];
                if (q.vus) infoParts.push(`${q.vus} VUs`);
                if (q.executor) infoParts.push(q.executor);
                const infoStr =
                  infoParts.length > 0
                    ? `<span class="query-info">${infoParts.map(escapeHtml).join(" · ")}</span>`
                    : "";

                queryEl.innerHTML = `
                <div class="query-header">
                  <div class="query-name">${escapeHtml(qName)}${infoStr}</div>
                </div>
                <div class="query-stats">
                  <div><div class="query-stat-value" id="${queryId}-qps">0</div><div class="query-stat-label">QPS</div></div>
                  <div><div class="query-stat-value" id="${queryId}-min">0</div><div class="query-stat-label">Min</div></div>
                  <div><div class="query-stat-value" id="${queryId}-mean">0</div><div class="query-stat-label">Mean</div></div>
                  <div><div class="query-stat-value" id="${queryId}-p50">0</div><div class="query-stat-label">P50</div></div>
                  <div><div class="query-stat-value" id="${queryId}-p95">0</div><div class="query-stat-label">P95</div></div>
                  <div><div class="query-stat-value" id="${queryId}-p99">0</div><div class="query-stat-label">P99</div></div>
                  <div><div class="query-stat-value" id="${queryId}-max">0</div><div class="query-stat-label">Max</div></div>
                </div>
              `;
                queryEl.addEventListener("click", () =>
                  showQueryModal(queryKey, qName),
                );
                queriesEl.appendChild(queryEl);
              }

              // Update values only
              document.getElementById(`${queryId}-qps`).textContent =
                formatNumber(q.qps || 0);
              document.getElementById(`${queryId}-min`).textContent =
                formatLatency(q.min);
              document.getElementById(`${queryId}-mean`).textContent =
                formatLatency(q.mean);
              document.getElementById(`${queryId}-p50`).textContent =
                formatLatency(q.p50);
              document.getElementById(`${queryId}-p95`).textContent =
                formatLatency(q.p95);
              document.getElementById(`${queryId}-p99`).textContent =
                formatLatency(q.p99);
              document.getElementById(`${queryId}-max`).textContent =
                formatLatency(q.max);
            });
          });
        });
      }

      function updateLegend(runs) {
        // Group runs by chart (show runs with queries even before timeline data)
        const runsByChart = {};
        Object.keys(runs)
          .filter((name) => hasQueries(runs[name]))
          .sort()
          .forEach((name) => {
            const run = runs[name];
            const chartGroup = run.chart || "default";
            if (!runsByChart[chartGroup]) {
              runsByChart[chartGroup] = [];
            }
            runsByChart[chartGroup].push(name);
          });

        // Calculate earliest start time per chart group
        const chartStartTimes = {};
        Object.keys(runsByChart).forEach((chartGroup) => {
          chartStartTimes[chartGroup] = Infinity;
          runsByChart[chartGroup].forEach((name) => {
            const run = runs[name];
            if (run.startTime && run.startTime < chartStartTimes[chartGroup]) {
              chartStartTimes[chartGroup] = run.startTime;
            }
          });
        });

        // Update legend for each chart group (in emission order by start time)
        const sortedChartGroups = Object.keys(runsByChart).sort((a, b) => {
          const aTime = chartStartTimes[a] || Infinity;
          const bTime = chartStartTimes[b] || Infinity;
          if (aTime === bTime) return a.localeCompare(b);
          return aTime - bTime;
        });
        sortedChartGroups.forEach((chartGroup) => {
          const safeChartId = (chartGroup || "default").replace(
            /[^a-zA-Z0-9]/g,
            "_",
          );
          const legend = document.getElementById(`legend-${safeChartId}`);
          if (!legend) return;

          const runNames = runsByChart[chartGroup].slice().sort();

          // Build a key to detect if legend structure changed
          const queryList = [];
          runNames.forEach((name) => {
            const queries = runs[name].queries || {};
            Object.keys(queries)
              .sort()
              .forEach((qName) => queryList.push(qName));
          });
          const legendKey =
            queryList.join(",") +
            "|" +
            Array.from(selectedQueries).sort().join(",");

          // Only rebuild if structure changed
          if (legendKey === chartLegendKeys[chartGroup]) return;
          chartLegendKeys[chartGroup] = legendKey;

          const items = [];
          runNames.forEach((name) => {
            const run = runs[name];
            const baseColor = getRunColor(name, run);
            const queries = run.queries || {};
            const queryNames = Object.keys(queries).sort();

            queryNames.forEach((qName, idx) => {
              const color =
                idx === 0 ? baseColor : shadeColor(baseColor, idx * 15);
              const isEnabled = selectedQueries.has(qName);
              const disabledClass = isEnabled ? "" : " disabled";
              items.push(
                `<div class="legend-item${disabledClass}" data-query="${escapeHtml(qName)}" title="Click to toggle, Shift+click to isolate"><div class="legend-color" style="background: ${color}"></div> ${escapeHtml(qName)}</div>`,
              );
            });
          });
          legend.innerHTML = items.join("");
          legend.querySelectorAll(".legend-item").forEach((item) => {
            item.addEventListener("click", (event) => {
              toggleQueryFilter(item.dataset.query, event);
            });
          });
        });
      }

      function updateQueryFilters(runs) {
        // Collect all query names across all runs
        const queryNames = new Set();
        Object.values(runs).forEach((run) => {
          Object.keys(run.queries || {}).forEach((qName) => {
            queryNames.add(qName);
          });
        });

        // Initialize selectedQueries with all queries when first discovered
        queryNames.forEach((qn) => {
          if (!allQueryTypes.has(qn)) {
            selectedQueries.add(qn);
          }
        });
        allQueryTypes = queryNames;
      }

      function formatQueryText(queryText) {
        const trimmed = queryText.trim();
        // Try JSON first
        if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
          try {
            const parsed = JSON.parse(trimmed);
            return JSON.stringify(parsed, null, 2);
          } catch (e) {
            // Not valid JSON, continue
          }
        }
        // Try SQL formatting
        try {
          return sqlFormatter.format(trimmed, {
            language: "postgresql",
            tabWidth: 2,
            keywordCase: "upper",
          });
        } catch (e) {
          // Fallback to original
          return queryText;
        }
      }

      function showQueryModal(queryKey, qName) {
        const queryText = queryTexts[queryKey];
        if (!queryText) return;

        const formatted = formatQueryText(queryText);
        document.getElementById("config-modal-title").textContent = qName;
        document.getElementById("config-modal-content").innerHTML = `
          <pre style="white-space: pre-wrap; word-break: break-word; font-size: 11px; margin: 0; background: var(--bg); padding: 12px; border-radius: 4px;">${escapeHtml(formatted)}</pre>
        `;
        document.getElementById("modal-backdrop").classList.add("visible");
        document.getElementById("config-modal").classList.add("visible");
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function showConfigModal(runName) {
        const snapshot = runConfigs[runName] || {};
        const config = snapshot.config || {};
        const containerInfo = snapshot.container_info || null;
        const hasGlobalCapture =
          (lastData && (lastData.dataset_yaml || lastData.script)) || false;
        if (
          Object.keys(config).length === 0 &&
          !containerInfo &&
          !hasGlobalCapture
        ) {
          return;
        }

        document.getElementById("config-modal-title").textContent = runName;

        const preScript = config.pre_script;
        const postScript = config.post_script;

        let tabsHtml = '<div class="config-tabs">';
        tabsHtml +=
          '<button class="config-tab active" onclick="switchConfigTab(\'config\')">Config</button>';
        if (preScript) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'pre\')">Pre</button>';
        }
        if (postScript) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'post\')">Post</button>';
        }
        if (containerInfo) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'container\')">Container</button>';
        }
        const datasetYaml = (lastData && lastData.dataset_yaml) || "";
        const scriptSource = (lastData && lastData.script) || "";
        if (datasetYaml) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'dataset\')">Dataset</button>';
        }
        if (scriptSource) {
          tabsHtml +=
            '<button class="config-tab" onclick="switchConfigTab(\'script\')">Script</button>';
        }
        tabsHtml += "</div>";

        function formatConfigValue(val) {
          if (val === null || val === undefined) return "-";
          if (typeof val === "object") return JSON.stringify(val);
          return String(val);
        }

        // Config tab — DB GUCs etc.
        let configHtml =
          '<div id="tab-config" class="config-tab-content active">';
        // Core postgres info first (settings section, then version), then
        // extension sections (paradedb etc.) alphabetically.
        const sectionRank = (name) =>
          name === "postgresql" ? 0 : name === "version" ? 1 : 2;
        const configEntries = Object.entries(config).sort(
          (a, b) =>
            sectionRank(a[0]) - sectionRank(b[0]) || a[0].localeCompare(b[0]),
        );
        for (const [section, value] of configEntries) {
          if (["pre_script", "post_script"].includes(section)) continue;

          if (
            typeof value === "object" &&
            value !== null &&
            !Array.isArray(value)
          ) {
            configHtml += `<div class="config-section">
            <div class="config-section-title">${escapeHtml(section)}</div>`;
            for (const [key, val] of Object.entries(value)) {
              configHtml += `<div class="config-item">
              <span class="config-key">${escapeHtml(key)}</span>
              <span class="config-value">${escapeHtml(formatConfigValue(val))}</span>
            </div>`;
            }
            configHtml += "</div>";
          } else if (!Array.isArray(value)) {
            configHtml += `<div class="config-item">
            <span class="config-key">${escapeHtml(section)}</span>
            <span class="config-value">${escapeHtml(formatConfigValue(value))}</span>
          </div>`;
          }
        }
        configHtml += "</div>";

        // Pre / Post tabs.
        const codeBlock = (text) =>
          `<pre style="white-space: pre-wrap; word-break: break-word; font-size: 10px; margin: 0; background: var(--bg); padding: 12px; border-radius: 4px;">${escapeHtml(text)}</pre>`;
        let preHtml = '<div id="tab-pre" class="config-tab-content">';
        if (preScript) preHtml += codeBlock(preScript);
        preHtml += "</div>";

        let postHtml = '<div id="tab-post" class="config-tab-content">';
        if (postScript) postHtml += codeBlock(postScript);
        postHtml += "</div>";

        // Container tab — docker inspect subset.
        let containerHtml =
          '<div id="tab-container" class="config-tab-content">';
        if (containerInfo) {
          containerHtml += renderContainerInfo(containerInfo);
        }
        containerHtml += "</div>";

        // Dataset / Script tabs — global to the run, hidden when absent.
        const sourceBlock = (text) =>
          `<pre style="white-space: pre-wrap; word-break: break-word; font-size: 10px; margin: 0; background: var(--bg); padding: 12px; border-radius: 4px;">${escapeHtml(text)}</pre>`;
        let datasetHtml = '<div id="tab-dataset" class="config-tab-content">';
        if (datasetYaml) datasetHtml += sourceBlock(datasetYaml);
        datasetHtml += "</div>";
        let scriptHtml = '<div id="tab-script" class="config-tab-content">';
        if (scriptSource) scriptHtml += sourceBlock(scriptSource);
        scriptHtml += "</div>";

        document.getElementById("config-modal-content").innerHTML =
          tabsHtml +
          configHtml +
          preHtml +
          postHtml +
          containerHtml +
          datasetHtml +
          scriptHtml;
        document.getElementById("modal-backdrop").classList.add("visible");
        document.getElementById("config-modal").classList.add("visible");
      }

      // renderContainerInfo turns the docker-inspect subset into the same
      // sections/items layout used by the Config tab.
      function renderContainerInfo(info) {
        const items = (kvs) =>
          kvs
            .map(
              ([k, v]) =>
                `<div class="config-item">
                  <span class="config-key">${escapeHtml(k)}</span>
                  <span class="config-value">${escapeHtml(v)}</span>
                </div>`,
            )
            .join("");
        const section = (title, body) =>
          `<div class="config-section">
            <div class="config-section-title">${escapeHtml(title)}</div>
            ${body}
          </div>`;

        let html = "";

        const idRows = [];
        if (info.image) idRows.push(["image", info.image]);
        if (info.image_id) idRows.push(["image_id", info.image_id]);
        if (info.cpu_limit) idRows.push(["cpu_limit", info.cpu_limit]);
        if (info.memory_limit) idRows.push(["memory_limit", info.memory_limit]);
        if (Array.isArray(info.cap_add) && info.cap_add.length)
          idRows.push(["cap_add", info.cap_add.join(", ")]);
        if (Array.isArray(info.security_opt) && info.security_opt.length)
          idRows.push(["security_opt", info.security_opt.join(", ")]);
        if (idRows.length) html += section("identity", items(idRows));

        if (Array.isArray(info.cmd) && info.cmd.length) {
          html += section(
            "cmd",
            `<pre style="white-space: pre-wrap; word-break: break-word; font-size: 10px; margin: 0;">${escapeHtml(info.cmd.join(" "))}</pre>`,
          );
        }

        if (Array.isArray(info.env) && info.env.length) {
          html += section(
            "env",
            items(
              info.env.map((e) => {
                const idx = e.indexOf("=");
                return idx >= 0 ? [e.slice(0, idx), e.slice(idx + 1)] : [e, ""];
              }),
            ),
          );
        }

        return html;
      }

      function switchConfigTab(tabName) {
        // Update tab buttons
        document.querySelectorAll(".config-tab").forEach((btn) => {
          btn.classList.toggle(
            "active",
            btn.textContent.toLowerCase() === tabName,
          );
        });
        // Update tab content
        document.querySelectorAll(".config-tab-content").forEach((content) => {
          content.classList.toggle("active", content.id === "tab-" + tabName);
        });
      }

      function hideConfigModal() {
        document.getElementById("modal-backdrop").classList.remove("visible");
        document.getElementById("config-modal").classList.remove("visible");
      }

      function toggleQueryFilter(queryName, event) {
        if (event && event.shiftKey) {
          // Shift+click: isolate this query (show only this one)
          if (selectedQueries.size === 1 && selectedQueries.has(queryName)) {
            // Already isolated - restore all
            allQueryTypes.forEach((q) => selectedQueries.add(q));
          } else {
            // Isolate this query
            selectedQueries.clear();
            selectedQueries.add(queryName);
          }
        } else {
          // Regular click: toggle visibility
          if (selectedQueries.has(queryName)) {
            selectedQueries.delete(queryName);
          } else {
            selectedQueries.add(queryName);
          }
        }
        // Re-render chart with updated filters
        if (lastData) {
          update(lastData);
        }
        // Recalculate Y axis if zoomed
        if (isZoomed) {
          setTimeout(() => {
            getAllCharts().forEach((chart) => {
              const xMin = chart.options.scales.x.min;
              const xMax = chart.options.scales.x.max;
              const yRange = getVisibleYRange(chart, xMin, xMax);
              if (yRange) {
                chart.options.scales.y.min = yRange.min;
                chart.options.scales.y.max = yRange.max;
              }
              chart.update("none");
            });
          }, 0);
        }
      }

      function updateUpdateStats(runs) {
        const container = document.getElementById("update-container");
        const entries = Object.entries(runs)
          .filter(([, run]) => (run.updates?.attempts || 0) > 0)
          .sort(([a], [b]) => a.localeCompare(b));
        if (entries.length === 0) {
          container.style.display = "none";
          container.innerHTML = "";
          return;
        }

        container.style.display = "flex";
        container.innerHTML = entries
          .map(([name, run]) => {
            const updates = run.updates;
            const color = getRunColor(name, run);
            return `<div class="stat-group" style="border-left-color: ${color}">
              <div class="stat-group-header"><div class="stat-group-label" style="color: ${color}">${escapeHtml(getBaseName(name))} updates</div></div>
              <div class="stats" style="grid-template-columns: repeat(5, 1fr)">
                <div class="stat"><div class="stat-value">${formatNumber(updates.attempts || 0)}</div><div class="stat-label">Attempts</div></div>
                <div class="stat"><div class="stat-value">${formatNumber(updates.documents || 0)}</div><div class="stat-label">Documents</div></div>
                <div class="stat"><div class="stat-value">${formatNumber(updates.errors || 0)}</div><div class="stat-label">Errors</div></div>
                <div class="stat"><div class="stat-value">${formatLatency(updates.mean)}</div><div class="stat-label">Mean</div></div>
                <div class="stat"><div class="stat-value">${formatLatency(updates.p95)}</div><div class="stat-label">P95</div></div>
              </div>
            </div>`;
          })
          .join("");
      }

      function stableHash(value) {
        let hash = 2166136261;
        for (let i = 0; i < value.length; i++) {
          hash ^= value.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36);
      }

      function telemetryColor(key) {
        const hue = parseInt(stableHash(key), 36) % 360;
        return `hsl(${hue} 70% 50%)`;
      }

      function formatBytes(value) {
        const units = ["B", "KiB", "MiB", "GiB", "TiB"];
        let amount = Number(value) || 0;
        let index = 0;
        while (Math.abs(amount) >= 1024 && index < units.length - 1) {
          amount /= 1024;
          index++;
        }
        return `${amount.toFixed(index === 0 ? 0 : 1)}${units[index]}`;
      }

      function formatTelemetryValue(value, unit) {
        if (unit === "bytes") return formatBytes(value);
        if (unit === "ms") return formatLatency(value);
        const formatted = formatNumber(value);
        if (!unit || unit === "count") return formatted;
        return `${formatted} ${unit}`;
      }

      function telemetrySeriesKey(point) {
        const labels = Object.entries(point.labels || {}).sort(([a], [b]) =>
          a.localeCompare(b),
        );
        return `${point.name}|${labels.map(([key, value]) => `${key}=${value}`).join(",")}`;
      }

      function telemetrySeriesLabel(point) {
        const base = String(point.name || "value")
          .split(".")
          .pop();
        const labels = Object.entries(point.labels || {})
          .filter(([, value]) => value !== "")
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([key, value]) => `${key}=${value}`);
        return labels.length > 0 ? `${base} (${labels.join(", ")})` : base;
      }

      function telemetryGroup(point) {
        const parts = String(point.name || "telemetry").split(".");
        const name = parts.length > 1 ? parts.slice(0, -1).join(".") : parts[0];
        return { name, unit: point.unit || "" };
      }

      function updateTelemetry(telemetry) {
        const container = document.getElementById("telemetry-container");
        const windowsContainer = document.getElementById("telemetry-windows");
        const seenCharts = new Set();
        const seenWindows = new Set();
        let hasWindows = false;

        Object.entries(telemetry || {})
          .sort(([a], [b]) => a.localeCompare(b))
          .forEach(([backend, windows]) => {
            (windows || []).forEach((window, windowIndex) => {
              hasWindows = true;
              const windowKey = `${backend}:${window.startTime || 0}:${windowIndex}`;
              const windowId = `telemetry-window-${stableHash(windowKey)}`;
              seenWindows.add(windowId);

              let windowEl = document.getElementById(windowId);
              if (!windowEl) {
                windowEl = document.createElement("section");
                windowEl.id = windowId;
                windowEl.className = "telemetry-window";
                windowEl.innerHTML = `<div class="telemetry-window-header"><div class="telemetry-window-title"></div><div class="telemetry-window-time"></div></div><div class="telemetry-errors"></div><div class="telemetry-grid"></div>`;
              }
              windowsContainer.appendChild(windowEl);
              windowEl.querySelector(".telemetry-window-title").textContent =
                `${backend} database telemetry`;
              const duration =
                window.endTime && window.startTime
                  ? Math.max(0, (window.endTime - window.startTime) / 1000)
                  : null;
              windowEl.querySelector(".telemetry-window-time").textContent =
                duration == null
                  ? "collecting"
                  : `${duration.toFixed(1)}s window`;
              const errors = window.errors || [];
              const errorsEl = windowEl.querySelector(".telemetry-errors");
              errorsEl.textContent = errors.join(" · ");
              errorsEl.style.display = errors.length > 0 ? "block" : "none";

              const groups = new Map();
              (window.samples || []).forEach((sample) => {
                (sample.values || []).forEach((point) => {
                  if (!Number.isFinite(point.value)) return;
                  const group = telemetryGroup(point);
                  const groupKey = `${group.name}|${group.unit}`;
                  if (!groups.has(groupKey)) {
                    groups.set(groupKey, { ...group, series: new Map() });
                  }
                  const seriesKey = telemetrySeriesKey(point);
                  const series = groups.get(groupKey).series;
                  if (!series.has(seriesKey)) {
                    series.set(seriesKey, {
                      label: telemetrySeriesLabel(point),
                      kind: point.kind,
                      data: [],
                    });
                  }
                  series.get(seriesKey).data.push({
                    x: (sample.time - window.startTime) / 1000,
                    y: point.value,
                  });
                });
              });

              const grid = windowEl.querySelector(".telemetry-grid");
              Array.from(groups.entries())
                .sort(([a], [b]) => a.localeCompare(b))
                .forEach(([groupKey, group]) => {
                  const chartKey = `${windowKey}:${groupKey}`;
                  const chartId = `telemetry-chart-${stableHash(chartKey)}`;
                  const cardId = `telemetry-card-${stableHash(chartKey)}`;
                  seenCharts.add(chartKey);

                  let card = document.getElementById(cardId);
                  if (!card) {
                    card = document.createElement("div");
                    card.id = cardId;
                    card.className = "chart-container";
                    card.innerHTML = `<div class="chart-header"><h2></h2><button class="reset-zoom" onclick="resetZoom()">Reset Zoom</button></div><div class="chart-wrapper"><canvas id="${chartId}"></canvas></div>`;
                  }
                  grid.appendChild(card);
                  card.querySelector("h2").textContent = group.unit
                    ? `${group.name} (${group.unit})`
                    : group.name;

                  let chart = telemetryCharts[chartKey];
                  if (!chart) {
                    const options = createChartOptions("", chartKey);
                    options.plugins.legend = {
                      display: true,
                      labels: {
                        color: getTickColor(),
                        boxWidth: 12,
                        font: { family: "JetBrains Mono", size: 9 },
                      },
                    };
                    options.plugins.tooltip.callbacks.label = (ctx) =>
                      `${ctx.dataset.label}: ${formatTelemetryValue(ctx.parsed.y, group.unit)}`;
                    options.scales.y.ticks.callback = (value) =>
                      formatTelemetryValue(value, group.unit);
                    const canvas = document.getElementById(chartId);
                    chart = new Chart(canvas, {
                      type: "line",
                      data: { datasets: [] },
                      options,
                    });
                    canvas.addEventListener("dblclick", resetZoom);
                    telemetryCharts[chartKey] = chart;
                  }

                  const datasets = Array.from(group.series.entries())
                    .sort(([, a], [, b]) => a.label.localeCompare(b.label))
                    .map(([seriesKey, series]) => {
                      const color = telemetryColor(`${chartKey}:${seriesKey}`);
                      return {
                        datasetKey: seriesKey,
                        label:
                          series.kind === "gauge"
                            ? `${series.label} [gauge]`
                            : series.label,
                        borderColor: color,
                        backgroundColor: color,
                        data: series.data,
                        pointRadius: (ctx) =>
                          ctx.dataset.data.length === 1 ? 2 : 0,
                      };
                    });
                  updateChartDatasets(chart, datasets, true);
                  updateChartYAxis(chart);
                  chart.update("none");
                });
            });
          });

        Object.keys(telemetryCharts).forEach((key) => {
          if (seenCharts.has(key)) return;
          const chart = telemetryCharts[key];
          chart.canvas.closest(".chart-container")?.remove();
          chart.destroy();
          delete telemetryCharts[key];
        });
