<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParadeDB Benchmarker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.4.2/dist/sql-formatter.min.js"></script>
    <style>
      :root {
        --c1: #7c3aed;
        --c2: #f97316;
        --c3: #10b981;
        --c4: #ec4899;
        --c5: #3b82f6;
        --bg: #0f0f0f;
        --panel: #1a1a1a;
        --border: #2a2a2a;
        --text: #e5e5e5;
        --text-dim: #737373;
        --grid: #252525;
      }
      html.light {
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e5e5e5;
        --text: #171717;
        --text-dim: #737373;
        --grid: #f0f0f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "JetBrains Mono", monospace;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .header h1 {
        font-size: 20px;
        font-weight: 600;
      }
      .elapsed {
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .theme-toggle {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--c1);
      }
      .stats-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .stat-group {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        border-left: 3px solid var(--c1);
      }
      .stat-group-header {
        margin-bottom: 8px;
      }
      .stat-group-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .stat {
        text-align: left;
      }
      .stat-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 9px;
        color: var(--text-dim);
        text-transform: uppercase;
      }
      .stat-group-header {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-group-header:hover {
        opacity: 0.8;
      }
      .expand-icon {
        font-size: 10px;
        transition: transform 0.2s;
      }
      .stat-group.expanded .expand-icon {
        transform: rotate(90deg);
      }
      .query-details {
        display: none;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .stat-group.expanded .query-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .prewarm-status {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .prewarm-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: var(--text-dim);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .prewarm-track {
        height: 6px;
        overflow: hidden;
        background: var(--border);
        border-radius: 3px;
      }
      .prewarm-fill {
        height: 100%;
        width: 0;
        background: var(--c1);
        border-radius: inherit;
        transition: width 0.2s ease;
      }
      .query-item {
        background: var(--bg);
        border-radius: 4px;
        padding: 8px;
        cursor: pointer;
        position: relative;
      }
      .query-item:hover {
        background: var(--border);
      }
      .query-tooltip {
        display: none;
        position: fixed;
        right: 300px;
        top: 100px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        max-width: 500px;
        max-height: 400px;
        overflow: auto;
        z-index: 1000;
        font-size: 11px;
        white-space: pre-wrap;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .query-tooltip.visible {
        display: block;
      }
      .config-modal {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        min-width: 400px;
        max-width: 600px;
        max-height: 80vh;
        overflow: auto;
        z-index: 1001;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .config-modal.visible {
        display: block;
      }
      .config-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .config-modal-title {
        font-weight: 600;
        font-size: 13px;
      }
      .config-modal-close {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 18px;
        cursor: pointer;
        padding: 0 4px;
      }
      .config-modal-close:hover {
        color: var(--text);
      }
      .config-item {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .config-item:last-child {
        border-bottom: none;
      }
      .config-key {
        color: var(--text-dim);
      }
      .config-value {
        font-weight: 600;
        text-align: right;
        max-width: 60%;
        word-break: break-all;
      }
      .config-section {
        margin-top: 12px;
      }
      .config-section-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--c1);
      }
      .config-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }
      .config-tab {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 12px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
      }
      .config-tab:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .config-tab.active {
        background: var(--c1);
        border-color: var(--c1);
        color: white;
      }
      .config-tab-content {
        display: none;
      }
      .config-tab-content.active {
        display: block;
      }
      .schema-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      .schema-table th,
      .schema-table td {
        padding: 4px 8px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .schema-table th {
        color: var(--text-dim);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 9px;
      }
      .index-def {
        background: var(--bg);
        padding: 8px;
        border-radius: 4px;
        margin-top: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 10px;
      }
      .index-name {
        font-weight: 600;
        color: var(--c1);
        margin-bottom: 4px;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }
      .modal-backdrop.visible {
        display: block;
      }
      .query-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .query-name {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .query-info {
        font-size: 9px;
        font-weight: 400;
        color: var(--text-dim);
        margin-left: 12px;
        text-transform: none;
        letter-spacing: normal;
      }
      .query-stats {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(max-content, 1fr);
        gap: 6px;
      }
      .query-stat-value {
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .query-stat-label {
        font-size: 8px;
        color: var(--text-dim);
        text-transform: uppercase;
        white-space: nowrap;
      }
      .query-stat-update-start {
        border-left: 1px solid var(--border);
        margin-left: 2px;
        padding-left: 8px;
      }
      .chart-container {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
        min-width: 0;
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .chart-header h2 {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .chart-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .reset-zoom {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 8px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 9px;
        cursor: pointer;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .reset-zoom.visible {
        opacity: 1;
      }
      .reset-zoom:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .chart-header select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        text-transform: uppercase;
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
      }
      .legend-item:hover {
        opacity: 0.8;
      }
      .legend-item.disabled {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .legend-item.disabled .legend-color {
        opacity: 0.3;
      }
      .legend-color {
        width: 16px;
        height: 3px;
        border-radius: 1px;
      }
      .chart-wrapper {
        position: relative;
        height: clamp(140px, 30vh, 300px);
      }
      .chart-wrapper.small {
        height: clamp(80px, 14vh, 140px);
      }
      .main-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(390px, max-content);
        gap: 16px;
        margin-bottom: 16px;
      }
      .stats-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stats-column .stat-group {
        min-width: unset;
        flex: unset;
      }
      .two-charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      @media (max-width: 1200px) {
        .main-row {
          grid-template-columns: 1fr 350px;
        }
        .query-stats {
          grid-auto-flow: row;
          grid-auto-columns: auto;
          grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
        }
      }
      @media (max-width: 1000px) {
        .main-row {
          grid-template-columns: 1fr 310px;
          gap: 12px;
        }
        body {
          padding: 16px;
        }
        .chart-container {
          padding: 14px;
        }
        .query-stat-value {
          font-size: 10px;
        }
        .query-stat-label {
          font-size: 7px;
        }
      }
      @media (max-width: 850px) {
        .main-row {
          grid-template-columns: 1fr;
        }
        .stats-column {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .stats-column .stat-group {
          flex: 1;
          min-width: 280px;
        }
      }
      @media (max-width: 700px) {
        .two-charts {
          grid-template-columns: 1fr;
        }
        .stats-row {
          flex-direction: column;
        }
        body {
          padding: 12px;
        }
        .main-row {
          gap: 12px;
        }
        .chart-container {
          padding: 12px;
        }
        .stats-column .stat-group {
          min-width: 100%;
        }
      }
      #runs-container {
        display: contents;
      }
    </style>

ES_PORT}/benchmark`,\n  elasticsearch: `http://127.0.0.1:${__ENV.ELASTICSEARCH_PORT}`,\n};\nconst backends = db.backends({\n  datasetPath: __ENV.CONFIG_DIR,\n  backends: names.map((type) =\u003e ({\n    type,\n    connection: connections[type],\n    container: `${__ENV.COMPOSE_PROJECT || __ENV.PROJECT}-${type}`,\n  })),\n});\nconst phases = db.phases({\n  backends: names,\n  vus,\n  duration: __ENV.DURATION || \"60s\",\n  prewarm: __ENV.PREWARM || \"10s\",\n  updates: updatesPerSecond \u003e 0,\n});\nconst updaters = updatesPerSecond \u003e 0\n  ? Object.fromEntries(names.map((name) =\u003e [name, {\n      prewarm: backends.randomDocumentPrewarmer(name, \"documents\"),\n      update: backends.randomDocumentUpdater(name, \"documents\"),\n    }]))\n  : {};\nconst scenario = (execName, workers) =\u003e ({\n  executor: \"per-vu-iterations\",\n  vus: workers,\n  iterations: 1,\n  maxDuration: \"168h\",\n  gracefulStop: \"0s\",\n  exec: execName,\n});\nconst scenarios = Object.fromEntries(\n  names.map((name) =\u003e [\n    name,\n    { ...scenario(\"queryPhase\", vus), env: { ACTIVE_BACKEND: name } },\n  ]),\n);\nif (updatesPerSecond \u003e 0) {\n  for (const name of names) {\n    scenarios[`${name}_updates`] = {\n      ...scenario(\"updatePhase\", 1),\n      env: { ACTIVE_BACKEND: name },\n    };\n  }\n}\nscenarios.metrics_collector = scenario(\"collectMetrics\", 1);\nconst queryErrors = new Counter(\"benchmark_query_errors\");\nconst updateErrors = updatesPerSecond \u003e 0\n  ? new Counter(\"benchmark_update_errors\")\n  : null;\nexport const options = {\n  scenarios,\n  thresholds: {\n    benchmark_query_errors: [\"count==0\"],\n    ...(updatesPerSecond \u003e 0 ? { benchmark_update_errors: [\"count==0\"] } : {}),\n  },\n};\nbackends.enableIndexIOStats();\n\nconst prewarmSQL = `WITH relation AS (\n  SELECT pg_relation_size($1::text::regclass, 'main') /\n         current_setting('block_size')::bigint AS blocks\n), chunk AS (\n  SELECT blocks * $2::text::bigint / $3::text::bigint AS first_block,\n         blocks * ($2::text::bigint + 1) / $3::text::bigint - 1 AS last_block\n  FROM relation\n)\nSELECT pg_prewarm($1::text::regclass, 'buffer', 'main', first_block, last_block)\nFROM chunk WHERE first_block \u003c= last_block`;\n\nexport function queryPhase() {\n  const name = __ENV.ACTIVE_BACKEND;\n  const client = backends.get(name);\n  const relation =\n    name === \"postgres\" ? \"documents_body_gin_idx\" : \"documents_body_bm25_idx\";\n  phases.run(\n    name,\n    name === \"elasticsearch\" ? 0 : vus,\n    (iteration) =\u003e {\n      const result = client.prewarm(\n        prewarmSQL,\n        relation,\n        String(iteration),\n        String(vus),\n      );\n      if (result?.error) throw new Error(result.error);\n    },\n    () =\u003e {\n      backends.resetIndexIOStats([name]);\n      if (updatesPerSecond \u003e 0) backends.resetWALStats([name]);\n      backends.resetPostgresDiagnostics([name]);\n    },\n    (iteration) =\u003e {\n      const index = Number(iteration) % entries.length;\n      exec.vu.metrics.tags.query_id = `${entries[index].record.source_id}:${entries[index].style}`;\n      const result = client.query(...requests[name][index]);\n      const failed =\n        result?.error \u0026\u0026\n        result.error !== \"benchmark measurement deadline reached\";\n      queryErrors.add(failed ? 1 : 0, { backend: name });\n    },\n  );\n}\n\nexport function updatePhase() {\n  const name = __ENV.ACTIVE_BACKEND;\n  phases.runUpdates(name, updatesPerSecond, updaters[name].prewarm, () =\u003e {\n    const result = updaters[name].update();\n    updateErrors.add(result?.error ? 1 : 0, { backend: name });\n  });\n}\n\nexport function collectMetrics() {\n  phases.runCollector(\n    (name, measuring) =\u003e {\n      if (measuring) {\n        if (updatesPerSecond \u003e 0) backends.collectWALStats(name);\n        backends.collectPostgresDiagnostics(name, false);\n        backends.collect();\n      }\n    },\n    (name, h   <body>
    <div class="header">

    <script>
      const COLORS = [
        "#7C3AED",
        "#F97316",
        "#10B981",
        "#EC4899",
        "#3B82F6",
        "#EAB308",
        "#06B6D4",
      ];
      // Hardcoded brand colors per backend type
      const BACKEND_COLORS = {
        paradedb: "#7C3AED", // Purple (ParadeDB brand)
        pg_textsearch: "#F97316", // Orange
        postgres: "#3B82F6", // Blue
        elasticsearch: "#10B981", // Green (Elastic brand)
        opensearch: "#EF4444", // Red (OpenSearch brand)
        clickhouse: "#FACC15", // Yellow (ClickHouse brand)
        mongodb: "#00ED64", // MongoDB Green (their actual brand green)
      };
      let isDark = false;
      let runColors = {};
      let selectedMetric = "p95";
      let lastMetric = "p95";
      let chartType = "latency"; // 'latency' | 'hits' | 'throughput'
      let lastChartType = "latency";
      let queryScaleType = "logarithmic";
      let colorIndex = 0;
      let lastElapsed = 0;
      let chartDuration = 30; // Will be updated from server
      let selectedQueries = new Set(); // Empty = show all (aggregated)
      let allQueryTypes = new Set();
      let lastData = null; // Store last data for filter updates
      let queryTexts = {}; // Store query text per query name
      let runConfigs = {}; // Store config per run name
      let chartInstances = {}; // Chart instances per dashboard group
      let chartLegendKeys = {}; // Legend keys per dashboard group
      let chartGroupOrder = []; // Track order of chart groups by first emission

      function resetState() {
        runColors = {};
        colorIndex = 0;
        lastElapsed = 0;
        chartDuration = 30;
        selectedQueries = new Set();
        allQueryTypes = new Set();
        lastData = null;
        queryTexts = {};
        runConfigs = {};
        isZoomed = false;
        chartType = "latency";
        lastChartType = "latency";
        queryScaleType = "logarithmic";
        document
          .querySelectorAll(".reset-zoom")
          .forEach((btn) => btn.classList.remove("visible"));
        document.getElementById("chart-groups-container").innerHTML = "";
        document.getElementById("ingest-legend").innerHTML = "";
        chartLegendKeys = {};
        document.getElementById("ingest-stats-container").innerHTML = "";
        document.getElementById("ingest-container").style.display = "none";
        // Destroy existing dashboard charts
        Object.values(chartInstances).forEach((chart) => chart.destroy());
        chartInstances = {};
        chartGroupOrder = [];
        [cpuChart, memoryChart, ingestChart].forEach((chart) => {
          chart.data.datasets = [];
          chart.options.scales.x.min = 0;
          chart.options.scales.x.max = chartDuration;
          delete chart.options.scales.y.max;
          chart.update("none");
        });
      }

      // Get base name without chart suffix (e.g., "paradedb-prod (chart)" -> "paradedb-prod")
      function getBaseName(run) {
        const match = run.match(/^(.+?) \(.+\)$/);
        return match ? match[1] : run;
      }

      function sanitizeColor(value) {
        const color = String(value || "").trim();
        if (/^#[0-9a-fA-F]{3,8}$/.test(color)) {
          return color;
        }
        if (/^(rgb|rgba|hsl|hsla)\([0-9.,%\s]+\)$/.test(color)) {
          return color;
        }
        // Allow named CSS colors (e.g. "red", "blue", "darkgreen")
        if (/^[a-zA-Z]{3,20}$/.test(color)) {
          return color;
        }
        return "";
      }

      function getRunColor(name, runData) {
        // Use base name for color so same backend has same color across charts
        const baseName = getBaseName(name);
        if (!runColors[baseName]) {
          // Check for custom color from backend options first
          if (runData?.color) {
            const customColor = sanitizeColor(runData.color);
            if (customColor) {
              runColors[baseName] = customColor;
            }
          }
          // Then check for backend-specific color
          if (
            !runColors[baseName] &&
            runData?.backend &&
            BACKEND_COLORS[runData.backend]
          ) {
            runColors[baseName] = BACKEND_COLORS[runData.backend];
          }
          // Fall back to cycling colors
          if (!runColors[baseName]) {
            runColors[baseName] = COLORS[colorIndex % COLORS.length];
            colorIndex++;
          }
        }
        return runColors[baseName];
      }

      // Cache for container colors
      const containerColors = {};
      let containerColorIndex = 0;

      function getContainerColor(name, container) {
        // Check for custom color first
        if (container?.color) {
          const customColor = sanitizeColor(container.color);
          if (customColor) {
            containerColors[name] = customColor;
            return customColor;
          }
        }
        // Try to match with a run's color for consistency across panels
        if (lastData?.runs) {
          for (const [runName, runData] of Object.entries(lastData.runs)) {
            if (
              runData.backend === container?.backend ||
              runData.container === name
            ) {
              return getRunColor(runName, runData);
            }
          }
        }
        // Check for backend-specific color
        if (container?.backend && BACKEND_COLORS[container.backend]) {
          containerColors[name] = BACKEND_COLORS[container.backend];
          return BACKEND_COLORS[container.backend];
        }
        // Fall back to cycling colors (only cache if no backend info yet)
        if (!containerColors[name]) {
          containerColors[name] = COLORS[containerColorIndex % COLORS.length];
          containerColorIndex++;
        }
        return containerColors[name];
      }

      function shadeColor(color, percent) {
        // Lighten or darken a hex color
        const num = parseInt(color.replace("#", ""), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.min(255, Math.max(0, (num >> 16) + amt));
        const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00ff) + amt));
        const B = Math.min(255, Math.max(0, (num & 0x0000ff) + amt));
        return (
          "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1)
        );
      }

      function toggleTheme() {
        isDark = !isDark;
        document.documentElement.classList.toggle("light", !isDark);
        updateChartColors();
      }

      function getGridColor() {
        return isDark ? "#252525" : "#f0f0f0";
      }
      function getTickColor() {
        return "#737373";
      }

      function updateChartColors() {
        [
          ...Object.values(chartInstances),
          cpuChart,
          memoryChart,
          ingestChart,
        ].forEach((chart) => {
          chart.options.scales.x.grid.color = getGridColor();
          chart.options.scales.y.grid.color = getGridColor();
          chart.update("none");
        });
      }

      function createChartOptions(
        yUnit = "",
        chartId = "",
        yScaleType = "linear",
      ) {
        return {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "nearest", axis: "x", intersect: true },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) =>
                  `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}${yUnit}`,
                title: (items) =>
                  items.length ? `${items[0].parsed.x.toFixed(0)}s` : "",
              },
            },
            zoom: {
              zoom: {
                wheel: {
                  enabled: true,
                  modifierKey: "ctrl",
                },
                drag: {
                  enabled: true,
                  backgroundColor: "rgba(124, 58, 237, 0.1)",
                  borderColor: "rgba(124, 58, 237, 0.5)",
                  borderWidth: 1,
                },
                mode: "x",
                onZoomComplete: ({ chart }) => syncZoom(chart),
              },
              pan: {
                enabled: true,
                mode: "x",
                onPanComplete: ({ chart }) => syncZoom(chart),
              },
              limits: {
                x: { min: 0, minRange: 1 },
              },
            },
          },
          elements: {
            point: { radius: 0, hitRadius: 5, hoverRadius: 3 },
            line: { borderWidth: 2, tension: 0.3 },
          },
          scales: {
            x: {
              type: "linear",
              min: 0,
              max: chartDuration,
              grid: { color: getGridColor() },
              ticks: {
                color: getTickColor(),
                font: { family: "JetBrains Mono", size: 10 },
                maxTicksLimit: 8,
                callback: (v) => Math.round(v) + "s",
              },
            },
            y: {
              type: yScaleType,
              ...(yScaleType === "linear" ? { min: 0 } : {}),
              suggestedMax: 10,
              grid: { color: getGridColor() },
              ticks: {
                color: getTickColor(),
                font: { family: "JetBrains Mono", size: 10 },
                maxTicksLimit: 6,
                callback: (v) => Math.round(v) + yUnit,
              },
            },
          },
        };
      }

      let isZoomed = false;

      // Calculate Y min/max for visible data points within X range
      function getVisibleYRange(chart, xMin, xMax) {
        let yMin = Infinity;
        let yMax = -Infinity;
        const logarithmic =
          chart.options.scales.y.type === "logarithmic";

        chart.data.datasets.forEach((dataset) => {
          if (dataset.hidden) return;
          dataset.data.forEach((point) => {
            if (
              point.x >= xMin &&
              point.x <= xMax &&
              (!logarithmic || point.y > 0)
            ) {
              if (point.y < yMin) yMin = point.y;
              if (point.y > yMax) yMax = point.y;
            }
          });
        });

        if (yMin === Infinity) return null;

        if (logarithmic) {
          return { min: yMin / 1.2, max: yMax * 1.2 };
        }

        // Add 10% padding for a linear scale.
        const padding = (yMax - yMin) * 0.1 || 1;
        return { min: Math.max(0, yMin - padding), max: yMax + padding };
      }

      function getAllCharts() {
        return [
          ...Object.values(chartInstances),
          cpuChart,
          memoryChart,
          ingestChart,
        ];
      }

      function syncZoom(sourceChart) {
        const xMin = sourceChart.scales.x.min;
        const xMax = sourceChart.scales.x.max;

        // Only consider zoomed if not showing full extent
        const atFullExtent = xMin <= 0.1 && xMax >= chartDuration - 0.1;
        if (atFullExtent) {
          isZoomed = false;
          document
            .querySelectorAll(".reset-zoom")
            .forEach((btn) => btn.classList.remove("visible"));
          return;
        }

        isZoomed = true;
        document
          .querySelectorAll(".reset-zoom")
          .forEach((btn) => btn.classList.add("visible"));

        // Sync X axis to all charts first
        getAllCharts().forEach((chart) => {
          if (chart !== sourceChart) {
            chart.options.scales.x.min = xMin;
            chart.options.scales.x.max = xMax;
          }
        });

        // Defer Y axis recalculation to ensure zoom plugin has finished
        setTimeout(() => {
          getAllCharts().forEach((chart) => {
            updateChartYAxis(chart);
            chart.update("none");
          });
        }, 0);
      }

      function resetZoom() {
        isZoomed = false;
        getAllCharts().forEach((chart) => {
          // Don't use chart.resetZoom() as it can be unreliable
          // Instead, explicitly reset all scale options
          chart.options.scales.x.min = 0;
          chart.options.scales.x.max = chartDuration;
          updateChartYAxis(chart);
          // Force scales to update by triggering a full update
          chart.update("resize");
        });
        document
          .querySelectorAll(".reset-zoom")
          .forEach((btn) => btn.classList.remove("visible"));
      }

      // Create or get dashboard group section
      function getOrCreateChartGroup(chartName) {
        const groupId = chartName || "default";
        const safeGroupId = groupId.replace(/[^a-zA-Z0-9]/g, "_");

        if (chartInstances[groupId]) {
          return chartInstances[groupId];
        }

        // Track order of chart groups by first emission
        if (!chartGroupOrder.includes(groupId)) {
          chartGroupOrder.push(groupId);
        }

        const container = document.getElementById("chart-groups-container");
        const section = document.createElement("div");
        section.id = `chart-group-${safeGroupId}`;
        section.className = "main-row";
        const chartTitle = chartName
          ? `<span style="color: var(--text); margin-right: 8px;">${escapeHtml(chartName)}</span>`
          : "";
        section.innerHTML = `
        <div class="chart-container">
          <div class="chart-header">
            <h2>${chartTitle}<select class="chart-type-select" data-chart="${safeGroupId}">
              <option value="latency" selected>Latency</option>
              <option value="hits">Hits</option>
              <option value="throughput">Throughput</option>
            </select> <span class="metric-wrapper"><select class="metric-select" data-chart="${safeGroupId}">
              <option value="p50">P50</option>
              <option value="p90">P90</option>
              <option value="p95" selected>P95</option>
              <option value="p99">P99</option>
            </select> (ms)</span><span class="hits-unit" style="display:none;">(avg)</span><span class="throughput-unit" style="display:none;">(qps)</span> <select class="scale-type-select" data-chart="${safeGroupId}" title="Y-axis scale" aria-label="Y-axis scale">
              <option value="logarithmic" selected>Log Scale</option>
              <option value="linear">Linear Scale</option>
            </select></h2>
            <div class="chart-controls">
              <button class="reset-zoom" onclick="resetZoom()" title="Double-click chart to reset">Reset Zoom</button>
              <div class="legend" id="legend-${safeGroupId}"></div>
            </div>
          </div>
          <div class="chart-wrapper">
            <canvas id="chart-${safeGroupId}"></canvas>
          </div>
        </div>
        <div class="stats-column" id="stats-${safeGroupId}"></div>
      `;
        container.appendChild(section);

        // Sync select elements with current state
        const metricSelect = section.querySelector(
          `.metric-select[data-chart="${safeGroupId}"]`,
        );
        if (metricSelect) metricSelect.value = selectedMetric;
        const chartTypeSelect = section.querySelector(
          `.chart-type-select[data-chart="${safeGroupId}"]`,
        );
        if (chartTypeSelect) chartTypeSelect.value = chartType;
        const scaleTypeSelect = section.querySelector(
          `.scale-type-select[data-chart="${safeGroupId}"]`,
        );
        if (scaleTypeSelect) scaleTypeSelect.value = queryScaleType;
        if (metricSelect) {
          metricSelect.addEventListener("change", (event) =>
            updateMetricSelectionForGroup(groupId, event.target.value),
          );
        }
        if (chartTypeSelect) {
          chartTypeSelect.addEventListener("change", (event) =>
            updateChartTypeForGroup(groupId, event.target.value),
          );
        }
        if (scaleTypeSelect) {
          scaleTypeSelect.addEventListener("change", (event) =>
            updateQueryScaleTypeForGroup(groupId, event.target.value),
          );
        }
        // Sync metric wrapper visibility based on chart type
        const metricWrapper = section.querySelector(".metric-wrapper");
        const hitsUnit = section.querySelector(".hits-unit");
        const throughputUnit = section.querySelector(".throughput-unit");
        if (metricWrapper)
          metricWrapper.style.display =
            chartType === "latency" ? "inline" : "none";
        if (hitsUnit)
          hitsUnit.style.display = chartType === "hits" ? "inline" : "none";
        if (throughputUnit)
          throughputUnit.style.display =
            chartType === "throughput" ? "inline" : "none";

        // Create chart instance
        const canvas = document.getElementById(`chart-${safeGroupId}`);
        const chart = new Chart(canvas, {
          type: "line",
          data: { datasets: [] },
          options: createChartOptions("ms", groupId, queryScaleType),
        });

        // Add double-click to reset zoom
        canvas.addEventListener("dblclick", resetZoom);

        chartInstances[groupId] = chart;
        chartLegendKeys[groupId] = "";

        return chart;
      }

      function updateMetricSelectionForGroup(groupId, value) {
        if (!value) return;
        selectedMetric = value;
        // Sync all metric selects to the same value
        document.querySelectorAll(".metric-select").forEach((s) => {
          s.value = selectedMetric;
        });
        if (lastData) update(lastData);
      }

      function updateChartTypeForGroup(groupId, value) {
        if (!value) return;
        chartType = value;
        // Sync all chart type selects and visibility
        document.querySelectorAll(".chart-type-select").forEach((s) => {
          s.value = chartType;
        });
        // Update metric wrapper visibility for all charts
        document.querySelectorAll(".metric-wrapper").forEach((mw) => {
          mw.style.display = chartType === "latency" ? "inline" : "none";
        });
        document.querySelectorAll(".hits-unit").forEach((hu) => {
          hu.style.display = chartType === "hits" ? "inline" : "none";
        });
        document.querySelectorAll(".throughput-unit").forEach((tu) => {
          tu.style.display = chartType === "throughput" ? "inline" : "none";
        });
        if (lastData) update(lastData);
      }

      function updateQueryScaleTypeForGroup(groupId, value) {
        if (value !== "linear" && value !== "logarithmic") return;
        queryScaleType = value;
        document.querySelectorAll(".scale-type-select").forEach((select) => {
          select.value = queryScaleType;
        });
        Object.values(chartInstances).forEach((chart) => {
          chart.options.scales.y.type = queryScaleType;
          updateChartYAxis(chart);
          chart.update("none");
        });
      }

      const cpuChart = new Chart(document.getElementById("cpuChart"), {
        type: "line",
        data: { datasets: [] },
        options: createChartOptions("%", "cpu"),
      });

      const memoryChart = new Chart(document.getElementById("memoryChart"), {
        type: "line",
        data: { datasets: [] },
        options: {
          ...createChartOptions("GB", "memory"),
          plugins: {
            ...createChartOptions("GB", "memory").plugins,
            tooltip: {
              callbacks: {
                label: (ctx) =>
                  `${ctx.dataset.label}: ${(ctx.parsed.y / 1e9).toFixed(2)}GB`,
                title: (items) =>
                  items.length ? `${items[0].parsed.x.toFixed(0)}s` : "",
              },

          scales: {

                callback: (v) => Math.round((v / 1e9) * 10) / 10 + "GB",
              },

          },

      const ingestChart = new Chart(document.getElementById("ingestChart"), {
        type: "line",
        data: { datasets: [] },
        options: {
          ...createChartOptions("/s", "ingest"),
          plugins: {
            ...createChartOptions("/s", "ingest").plugins,
            tooltip: {
              callbacks: {
                label: (ctx) =>
                  `${ctx.dataset.label}: ${formatNumber(ctx.parsed.y)}/s`,
                title: (items) =>
                  items.length ? `${items[0].parsed.x.toFixed(0)}s` : "",
              },
            },
          },
          scales: {
            ...createChartOptions().scales,
            y: {
              min: 0,
              grid: { color: getGridColor() },
              ticks: {
                color: getTickColor(),
                font: { family: "JetBrains Mono", size: 10 },
                maxTicksLimit: 6,
                callback: (v) => formatNumber(Math.round(v)) + "/s",
              },
