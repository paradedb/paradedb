<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParadeDB Benchmarker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.4.2/dist/sql-formatter.min.js"></script>
    <style>
      :root {
        --c1: #7c3aed;
        --c2: #f97316;
        --c3: #10b981;
        --c4: #ec4899;
        --c5: #3b82f6;
        --bg: #0f0f0f;
        --panel: #1a1a1a;
        --border: #2a2a2a;
        --text: #e5e5e5;
        --text-dim: #737373;
        --grid: #252525;
      }
      html.light {
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e5e5e5;
        --text: #171717;
        --text-dim: #737373;
        --grid: #f0f0f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "JetBrains Mono", monospace;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .header h1 {
        font-size: 20px;
        font-weight: 600;
      }
      .elapsed {
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .theme-toggle {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--c1);
      }
      .stats-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .stat-group {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        border-left: 3px solid var(--c1);
      }
      .stat-group-header {
        margin-bottom: 8px;
      }
      .stat-group-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .stat {
        text-align: left;
      }
      .stat-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 9px;
        color: var(--text-dim);
        text-transform: uppercase;
      }
      .stat-group-header {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-group-header:hover {
        opacity: 0.8;
      }
      .expand-icon {
        font-size: 10px;
        transition: transform 0.2s;
      }
      .stat-group.expanded .expand-icon {
        transform: rotate(90deg);
      }
      .query-details {
        display: none;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .stat-group.expanded .query-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .prewarm-status {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .prewarm-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: var(--text-dim);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .prewarm-track {
        height: 6px;
        overflow: hidden;
        background: var(--border);
        border-radius: 3px;
      }
      .prewarm-fill {
        height: 100%;
        width: 0;
        background: var(--c1);
        border-radius: inherit;
        transition: width 0.2s ease;
      }
      .query-item {
        background: var(--bg);
        border-radius: 4px;
        padding: 8px;
        cursor: pointer;
        position: relative;
      }
      .query-item:hover {
        background: var(--border);
      }
      .query-tooltip {
        display: none;
        position: fixed;
        right: 300px;
        top: 100px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        max-width: 500px;
        max-height: 400px;
        overflow: auto;
        z-index: 1000;
        font-size: 11px;
        white-space: pre-wrap;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .query-tooltip.visible {
        display: block;
      }
      .config-modal {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        min-width: 400px;
        max-width: 600px;
        max-height: 80vh;
        overflow: auto;
        z-index: 1001;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .config-modal.visible {
        display: block;
      }
      .config-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .config-modal-title {
        font-weight: 600;
        font-size: 13px;
      }
      .config-modal-close {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 18px;
        cursor: pointer;
        padding: 0 4px;
      }
      .config-modal-close:hover {
        color: var(--text);
      }
      .config-item {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .config-item:last-child {
        border-bottom: none;
      }
      .config-key {
        color: var(--text-dim);
      }
      .config-value {
        font-weight: 600;
        text-align: right;
        max-width: 60%;
        word-break: break-all;
      }
      .config-section {
        margin-top: 12px;
      }
      .config-section-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--c1);
      }
      .config-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }
      .config-tab {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 12px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
      }
      .config-tab:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .config-tab.active {
        background: var(--c1);
        border-color: var(--c1);
        color: white;
      }
      .config-tab-content {
        display: none;
      }
      .config-tab-content.active {
        display: block;
      }
      .schema-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      .schema-table th,
      .schema-table td {
        padding: 4px 8px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .schema-table th {
        color: var(--text-dim);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 9px;
      }
      .index-def {
        background: var(--bg);
        padding: 8px;
        border-radius: 4px;
        margin-top: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 10px;
      }
      .index-name {
        font-weight: 600;
        color: var(--c1);
        margin-bottom: 4px;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }
      .modal-backdrop.visible {
        display: block;
      }
      .query-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .query-name {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .query-info {
        font-size: 9px;
        font-weight: 400;
        color: var(--text-dim);
        margin-left: 12px;
        text-transform: none;
        letter-spacing: normal;
      }
      .query-stats {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(max-content, 1fr);
        gap: 6px;
      }
      .query-stat-value {
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .query-stat-label {
        font-size: 8px;
        color: var(--text-dim);
        text-transform: uppercase;
        white-space: nowrap;
      }
      .query-stat-update-start {
        border-left: 1px solid var(--border);
        margin-left: 2px;
        padding-left: 8px;
      }
      .chart-container {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
        min-width: 0;
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .chart-header h2 {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .chart-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .reset-zoom {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 8px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 9px;
        cursor: pointer;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .reset-zoom.visible {
        opacity: 1;
      }
      .reset-zoom:hover {
        border-color: var(--c1);
        color: var(--text);
      }
      .chart-header select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        text-transform: uppercase;
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
      }
      .legend-item:hover {
        opacity: 0.8;
      }
      .legend-item.disabled {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .legend-item.disabled .legend-color {
        opacity: 0.3;
      }
      .legend-color {
        width: 16px;
        height: 3px;
        border-radius: 1px;
      }
      .chart-wrapper {
        position: relative;
        height: clamp(140px, 30vh, 300px);
      }
      .chart-wrapper.small {
        height: clamp(80px, 14vh, 140px);
      }
      .main-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(390px, max-content);
        gap: 16px;
        margin-bottom: 16px;
      }
      .stats-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stats-column .stat-group {
        min-width: unset;
        flex: unset;
      }
      .two-charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      @media (max-width: 1200px) {
        .main-row {
          grid-template-columns: 1fr 350px;
        }
        .query-stats {
          grid-auto-flow: row;
          grid-auto-columns: auto;
          grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
        }
      }
      @media (max-width: 1000px) {
        .main-row {
          grid-template-columns: 1fr 310px;
          gap: 12px;
        }
        body {
          padding: 16px;
        }
        .chart-container {
          padding: 14px;
        }
        .query-stat-value {
          font-size: 10px;
        }
        .query-stat-label {
          font-size: 7px;
        }
      }
      @media (max-width: 850px) {
        .main-row {
          grid-template-columns: 1fr;
        }
        .stats-column {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .stats-column .stat-group {
          flex: 1;
          min-width: 280px;
        }
      }
      @media (max-width: 700px) {
        .two-charts {
          grid-template-columns: 1fr;
        }
        .stats-row {
          flex-direction: column;
        }
        body {
          padding: 12px;
        }
        .main-row {
          gap: 12px;
        }
        .chart-container {
          padding: 12px;
        }
        .stats-column .stat-group {
          min-width: 100%;
        }
      }
      #runs-container {
        display: contents;
      }
    </style>

"import db from \"k6/x/database\";\nimport exec from \"k6/execution\";\nimport { Counter } from \"k6/metrics\";\nimport {\n  buildRequest,\n  parseUpdatesPerSecond,\n  selectBackends,\n  selectQueries,\n} from \"./queries.js\";\n\nconst workload = __ENV.WORKLOAD || \"topk\";\nconst style = __ENV.QUERY_STYLE || \"disjunction\";\nconst updatesPerSecond = parseUpdatesPerSecond(__ENV.UPDATES_PER_SECOND ?? \"0\");\nconst names = selectBackends(\n  __ENV.BACKENDS || \"paradedb,postgres,elasticsearch\",\n  workload,\n  style,\n  updatesPerSecond,\n);\nconst vus = Number(__ENV.VUS || \"8\");\nconst topK = Number(__ENV.TOP_K || \"10\");\nif (!Number.isSafeInteger(vus) || vus \u003c 1)\n  throw new Error(\"VUS must be a positive integer\");\nconst entries = selectQueries(\n  JSON.parse(open(__ENV.QUERIES)),\n  style,\n  Number(__ENV.SEED || \"1592614637\"),\n);\n// Encode once at initialization; database analyzers still parse the stored forms.\nconst requests = Object.fromEntries(\n  names.map((name) =\u003e [\n    name,\n    entries.map((entry) =\u003e buildRequest(name, workload, entry, topK)),\n  ]),\n);\nconst connections = {\n  paradedb: `postgres://postgres:postgres@127.0.0.1:${__ENV.PARADEDB_PORT}/benchmark`,\n  pg_textsearch: `postgres://postgres:postgres@127.0.0.1:${__ENV.PG_TEXTSEARCH_PORT}/benchmark`,\n  postgres: `postgres://postgres:postgres@127.0.0.1:${__ENV.POSTGRES_PORT}/benchmark`,\n  elasticsearch: `http://127.0.0.1:${__ENV.ELASTICSEARCH_PORT}`,\n};\nconst backends = db.backends({\n  datasetPath: __ENV.CONFIG_DIR,\n  backends: names.map((type) =\u003e ({\n    type,\n    connection: connections[type],\n    container: `${__ENV.COMPOSE_PROJECT || __ENV.PROJECT}-${type}`,\n  })),\n});\nconst phases = db.phases({\n  backends: names,\n  vus,\n  duration: __ENV.DURATION || \"60s\",\n  prewarm: __ENV.PREWARM || \"10s\",\n  updates: updatesPerSecond \u003e 0,\n});\nconst updaters = updatesPerSecond \u003e 0\n  ? Object.fromEntries(names.map((name) =\u003e [name, {\n      prewarm: backends.randomDocumentPrewarmer(name, \"documents\"),\n      update: backends.randomDocumentUpdater(name, \"documents\"),\n    }]))\n  : {};\nconst scenario = (execName, workers) =\u003e ({\n  executor: \"per-vu-iterations\",\n  vus: workers,\n  iterations: 1,\n  maxDuration: \"168h\",\n  gracefulStop: \"0s\",\n  exec: execName,\n});\nconst scenarios = Object.fromEntries(\n  names.map((name) =\u003e [\n    name,\n    { ...scenario(\"queryPhase\", vus), env: { ACTIVE_BACKEND: name } },\n  ]),\n);\nif (updatesPerSecond \u003e 0) {\n  for (const name of names) {\n    scenarios[`${name}_updates`] = {\n      ...scenario(\"updatePhase\", 1),\n      env: { ACTIVE_BACKEND: name },\n    };\n  }\n}\nscenarios.metrics_collector = scenario(\"collectMetrics\", 1);\nconst queryErrors = new Counter(\"benchmark_query_errors\");\nconst updateErrors = updatesPerSecond \u003e 0\n  ? new Counter(\"benchmark_update_errors\")\n  : null;\nexport const options = {\n  scenarios,\n  thresholds: {\n    benchmark_query_errors: [\"count==0\"],\n    ...(updatesPerSecond \u003e 0 ? { benchmark_update_errors: [\"count==0\"] } : {}),\n  },\n};\nbackends.enableIndexIOStats();\n\nconst prewarmSQL = `WITH relation AS (\n  SELECT pg_relation_size($1::text::regclass, 'main') /\n         current_setting('block_size')::bigint AS blocks\n), chunk AS (\n  SELECT blocks * $2::text::bigint / $3::text::bigint AS first_block,\n         blocks * ($2::text::bigint + 1) / $3::text::bigint - 1 AS last_block\n  FROM relation\n)\nSELECT pg_prewarm($1::text::regclass, 'buffer', 'main', first_block, last_block)\nFROM chunk WHERE first_block \u003c= last_block`;\n\nexport function queryPhase() {\n  const name = __ENV.ACTIVE_BACKEND;\n  const client = backends.get(name);\n  const relation =\n    name === \"postgres\" ? \"documents_body_gin_idx\" : \"documents_body_bm25_idx\";\n  phases.run(\n    name,\n    name === \"elasticsearch\" ? 0 : vus,\n    (iteration) =\u003e {\n      const result = client.prewarm
