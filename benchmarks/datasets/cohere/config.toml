sampling_seed = 0                                         # unused (no sampling), required by parser
load_format = "parquet"
s3_base_path = "s3://paradedb-benchmarks/datasets/cohere"
tables = []

[root_table]
name = "cohere_wiki"
primary_key = "_id"  # used only if sampled later

[params]
# Only knobs a sweep cannot supply live here. Everything a sweep varies is declared in [sweeps]
# alone; fixed non-recall settings are inlined as literals in the query SQL.
#   lists / vchord_lists  -- CREATE INDEX parameters. A sweep measures many operating points
#                            against one already-built index, so a build-time knob cannot be swept
#                            without rebuilding per value.
#   max_scan_tuples_1pct  -- bounds hnsw's filtered scan (not a recall knob) and scales with size.
lists = "sqrt({{ dataset_size }})::int"
vchord_lists = "CASE WHEN {{ dataset_size }} < 2000000 THEN 2000 WHEN {{ dataset_size }} < 100000000 THEN 10000 ELSE 80000 END"
max_scan_tuples_1pct = "CASE {{ dataset_size }} WHEN 1000000 THEN 500000 WHEN 10000000 THEN 5000000 ELSE 200000 END"

# Operating-point sweeps. Each arm's knob is measured across these values and the points that
# reach 90/95/99% recall are the ones benchmarked -- so no value here needs to be "the" tuned
# setting, and none needs a per-size CASE: the sweep picks a different point at 1m than at 10m.
# Ranges are chosen to bracket 90-99% recall at every benchmarked size.

# pgvector ivfflat: probes (cells scanned).
[sweeps.ivfflat.knn_top10_unfiltered]
param = "probes_unfiltered"
values = ["10", "20", "40", "80", "160", "320", "640"]

[sweeps.ivfflat.knn_top10_10pct]
param = "probes_10pct"
values = ["10", "20", "40", "80", "160", "320", "640"]

[sweeps.ivfflat.knn_top10_1pct]
param = "probes_1pct"
values = ["10", "20", "40", "80", "160", "320", "640"]

# pgvector hnsw: ef_search (candidate queue size).
[sweeps.hnsw.knn_top10_unfiltered]
param = "ef_search_unfiltered"
values = ["40", "80", "160", "320", "640", "1000", "1600", "2400"]

[sweeps.hnsw.knn_top10_10pct]
param = "ef_search_10pct"
values = ["40", "80", "160", "320", "640", "1000", "1600", "2400"]

[sweeps.hnsw.knn_top10_1pct]
param = "ef_search_1pct"
values = ["40", "80", "160", "320", "640", "1000", "1600", "2400"]

# VectorChord: probes (lists scanned). epsilon stays at the docs default.
[sweeps.vchord.knn_top10_unfiltered]
param = "vchord_probes_unfiltered"
values = ["20", "40", "80", "160", "320", "640", "1200", "2000"]

[sweeps.vchord.knn_top10_10pct_prefilter_off]
param = "vchord_probes_10pct_off"
values = ["20", "40", "80", "160", "320", "640", "1200", "2000"]

[sweeps.vchord.knn_top10_10pct_prefilter_on]
param = "vchord_probes_10pct_on"
values = ["20", "40", "80", "160", "320", "640", "1200", "2000"]

[sweeps.vchord.knn_top10_1pct_prefilter_off]
param = "vchord_probes_1pct_off"
values = ["20", "40", "80", "160", "320", "640", "1200", "2000"]

[sweeps.vchord.knn_top10_1pct_prefilter_on]
param = "vchord_probes_1pct_on"
values = ["20", "40", "80", "160", "320", "640", "1200", "2000"]

# pg_search: the distance-ratio gate. The probe ceiling is a fixed tail-latency guard, not a
# recall knob, so it is a literal in the query SQL.
[sweeps.pg_search.knn_top10_unfiltered]
param = "pg_search_probe_epsilon_unfiltered"
values = ["0.05", "0.1", "0.15", "0.2", "0.3", "0.45", "0.65", "0.9"]

[sweeps.pg_search.knn_top10_10pct]
param = "pg_search_probe_epsilon_10pct"
values = ["0.05", "0.1", "0.15", "0.2", "0.3", "0.45", "0.65", "0.9"]

[sweeps.pg_search.knn_top10_1pct]
param = "pg_search_probe_epsilon_1pct"
values = ["0.05", "0.1", "0.15", "0.2", "0.3", "0.45", "0.65", "0.9"]
