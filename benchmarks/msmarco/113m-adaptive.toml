[dataset]
name = "msmarco"
size = "113m"
table = "msmarco"
expected_rows = 113520750
dims = 1024
vector_field = "emb"
s3_base_path = "s3://paradedb-benchmark/datasets/msmarco/v1"

[postgres.build]
"paradedb.vector_centroid_quantization" = "on"
shared_buffers = "12GB"
maintenance_work_mem = "12GB"
max_parallel_maintenance_workers = 8

[postgres.search]
shared_buffers = "12GB"
max_parallel_workers = 8
max_worker_processes = 8

[index]
training_sample_ratio = 0.32
target_segment_count = 8

[search]
queries = 100
runs = 1
warmup_runs = 1
explain_sample = 100

[search.session]
"paradedb.vector_adaptive_probing" = "on"
"paradedb.vector_cluster_max_probe" = "0"
max_parallel_workers_per_gather = "8"
jit = "off"
plan_cache_mode = "force_custom_plan"

[search.sweep]
param = "paradedb.vector_search_effort"
min = 0.05
max = 10.0
start = 1.25
targets = [0.9, 0.95, 0.99]
tolerance = 0.000001
max_probes = 20
