engine = "pg_vectorsearch"

[dataset]
name = "msmarco"
size = "113m"
table = "msmarco"
expected_rows = 113520750
dims = 1024
vector_field = "emb"
s3_base_path = "s3://paradedb-benchmark/datasets/msmarco/v1"

# Both sections match the paradedb service in pdbench's datasets/msmarco/docker-compose.yml.
# `pdbench search` checks [postgres.search] before a sweep. CI builds the index with
# pdbench-load, so [postgres.build] is not checked; the profile format requires it.
[postgres.build]
shared_buffers = "32GB"
maintenance_work_mem = "52428MB"
max_parallel_maintenance_workers = 8

[postgres.search]
shared_buffers = "32GB"
max_parallel_workers = 16
max_worker_processes = 32

[index]
nlist = 0

[search]
queries = 100
runs = 1
warmup_runs = 1
explain_sample = 100

[search.session]
max_parallel_workers_per_gather = "8"
jit = "off"
plan_cache_mode = "force_custom_plan"
enable_seqscan = "off"
enable_bitmapscan = "off"
enable_sort = "off"

[search.sweep]
param = "prism.nprobe"
min = 1
max = 4096
start = 64
integer = true
targets = [0.9, 0.95, 0.99]
tolerance = 0.000001
max_probes = 20
