engine = "pg_vectorsearch"

[dataset]
name = "msmarco"
size = "113m"
table = "msmarco"
expected_rows = 113520750
dims = 1024
vector_field = "emb"
s3_base_path = "s3://paradedb-benchmark/datasets/msmarco/v1"

[postgres.build]
shared_buffers = "12GB"
maintenance_work_mem = "12GB"
max_parallel_maintenance_workers = 8

[postgres.search]
shared_buffers = "12GB"
max_parallel_workers = 8
max_worker_processes = 8

[index]
nlist = 0
boundary_epsilon = 0.0
soar_lambda = 0.0

[search]
queries = 100
runs = 1
warmup_runs = 1
explain_sample = 100

[search.session]
enable_seqscan = "off"
enable_bitmapscan = "off"
enable_sort = "off"
max_parallel_workers_per_gather = "8"
jit = "off"
plan_cache_mode = "force_custom_plan"

[search.sweep]
param = "prism.nprobe"
integer = true
min = 1
max = 4096
start = 64
targets = [0.9, 0.95, 0.99]
tolerance = 0.000001
max_probes = 20
