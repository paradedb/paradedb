[package]
name = "pg_search"
description = "One Postgres for your application data, full-text search, vector retrieval, and aggregations"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

# Opts into cargo-pgrx's SQL migration fragments, the same `<PR>.<slug>.sql`
# files and `-- depends-on:` syntax RELEASE.md describes. `cargo pgrx install`,
# `run`, `test` and `regress` assemble them into a temporary upgrade script so
# `ALTER EXTENSION pg_search UPDATE` works on a development database, and
# `cargo pgrx package` refuses to build while any are unassembled unless given
# `--assemble-unreleased` or `--no-assemble-unreleased`.
[package.metadata.pgrx]
unreleased-sql-dir = "sql/unreleased"

# `cargo pgrx package` builds an RPM and a DEB from these sections on Linux.
# Unset keys keep cargo-pgrx's PGDG defaults: package names
# `pg_search_<pg>` and `postgresql-<pg>-pg-search`, installed under
# `/usr/pgsql-<pg>/` and `/usr/{lib,share}/postgresql/<pg>/`. `files` replaces
# the default list, so it repeats the shared library before adding the license.
# The publish workflows and `make package` pass `--no-distrib-packages` and
# still build their own packages.
[package.metadata.rpm]
maintainer = "ParadeDB <support@paradedb.com>"
description = """Full-text search, vector retrieval, and aggregations for Postgres
pg_search upgrades Postgres with a custom index for fast full-text and
vector search, BM25 scoring, filtering, and aggregations. Your application
data and search engine live in one database, with no second system to
deploy and nothing to sync."""
depends = ["postgresql${PG_MAJOR_VERSION}-server", "openblas"]
files = [
  { source = "${BUILD_BASE_PATH}/${PG_PKGLIBDIR}/${LIB_FILE}", dest = "/usr/pgsql-${PG_MAJOR_VERSION}/lib/${LIB_FILE}", mode = "0755" },
  { source = "${WORKSPACE_ROOT}/LICENSE", dest = "/usr/share/licenses/${NAME}_${PG_MAJOR_VERSION}/LICENSE", mode = "0644" },
]

[package.metadata.deb]
maintainer = "ParadeDB <support@paradedb.com>"
description = """Full-text search, vector retrieval, and aggregations for Postgres
pg_search upgrades Postgres with a custom index for fast full-text and
vector search, BM25 scoring, filtering, and aggregations. Your application
data and search engine live in one database, with no second system to
deploy and nothing to sync."""
section = "database"
depends = ["postgresql-${PG_MAJOR_VERSION}", "libopenblas0"]
files = [
  { source = "${BUILD_BASE_PATH}/${PG_PKGLIBDIR}/${LIB_FILE}", dest = "/usr/lib/postgresql/${PG_MAJOR_VERSION}/lib/${LIB_FILE}", mode = "0644" },
  { source = "${WORKSPACE_ROOT}/LICENSE", dest = "/usr/share/doc/postgresql-${PG_MAJOR_VERSION}-${DEB_NAME}/LICENSE", mode = "0644" },
]

[features]
default = ["pg18"]
pg15 = [
  "pgrx/pg15",
  "pgrx-tests/pg15",
  "common/pg15",
  "index_read/pg15",
  "index_write/pg15",
  "planner/pg15",
  "basescan/pg15",
  "joinscan/pg15",
]
pg16 = [
  "pgrx/pg16",
  "pgrx-tests/pg16",
  "common/pg16",
  "index_read/pg16",
  "index_write/pg16",
  "planner/pg16",
  "basescan/pg16",
  "joinscan/pg16",
]
pg17 = [
  "pgrx/pg17",
  "pgrx-tests/pg17",
  "common/pg17",
  "index_read/pg17",
  "index_write/pg17",
  "planner/pg17",
  "basescan/pg17",
  "joinscan/pg17",
]
pg18 = [
  "pgrx/pg18",
  "pgrx-tests/pg18",
  "common/pg18",
  "index_read/pg18",
  "index_write/pg18",
  "planner/pg18",
  "basescan/pg18",
  "joinscan/pg18",
]
pg_test = [
  "common/pg_test",
  "index_read/pg_test",
  "index_write/pg_test",
  "planner/pg_test",
  "basescan/pg_test",
  "joinscan/pg_test",
]
# direct dep so the coverage shim survives into the cdylib (see lib.rs)
dst = ["dst/enabled", "dep:antithesis-instrumentation"]
unsafe-postgres = ["pgrx/unsafe-postgres"]
block_tracker = [
  "index_read/block_tracker",
] # for debugging when blocks are acquired and released
debug-logging = [
  "dep:env_logger",
] # enables env_logger for dependency debug output

# Thin `cdylib` root crate for SQL entity registration and `_PG_init`. Keep implementation code
# and heavy dependencies (`datafusion`, `tonic`, `arrow-*`, etc.) in the appropriate sub-crates.
[dependencies]
common = { path = "../common", default-features = false }
index_read = { path = "../index_read", default-features = false }
index_write = { path = "../index_write", default-features = false }
planner = { path = "../planner", default-features = false }
basescan = { path = "../basescan", default-features = false }
joinscan = { path = "../joinscan", default-features = false }
antithesis-instrumentation = { version = "0.1", optional = true }   # coverage shim; see lib.rs
anyhow.workspace = true
dst = { path = "../dst" }
env_logger = { workspace = true, optional = true }
half.workspace = true
macros = { path = "../macros" }
once_cell.workspace = true
paste.workspace = true
pgrx.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
strum.workspace = true
tantivy.workspace = true
tantivy-common.workspace = true
tokenizers = { path = "../tokenizers" }

[dev-dependencies]
common = { path = "../common", default-features = false, features = [
  "pg_test",
] }
index_read = { path = "../index_read", default-features = false, features = [
  "pg_test",
] }
index_write = { path = "../index_write", default-features = false, features = [
  "pg_test",
] }
planner = { path = "../planner", default-features = false, features = [
  "pg_test",
] }
basescan = { path = "../basescan", default-features = false, features = [
  "pg_test",
] }
joinscan = { path = "../joinscan", default-features = false, features = [
  "pg_test",
] }
pgrx-tests.workspace = true
postgres.workspace = true
proptest.workspace = true
