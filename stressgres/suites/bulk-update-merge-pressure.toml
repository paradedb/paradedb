SELECT g, md5(g::text) || ' ' || md5(random()::text), md5(random()::text)
FROM (SELECT 1 + (random() * 12400)::int8 AS b) s, generate_series(s.b, s.b + 99) AS g
ON CONFLICT (id) DO UPDATE SET body = EXCLUDED.body, title = EXCLUDED.title;
"""

