workload = "workloads/planner-mixed.toml"

[routes.read]
destinations = ["SubscriberA", "SubscriberB"]
# Preserve roughly the same aggregate read rate while fanning every read out twice.
refresh_scale = 2.0

[routes.write]
destinations = ["Publisher"]
refresh_scale = 1.0

[[server]]
name = "Publisher"
setup_template = "writer"
[server.style.Automatic]
postgresql_conf = "Publisher"

[server.setup]
sql = """
DROP PUBLICATION IF EXISTS stressgres_pub;
CREATE PUBLICATION stressgres_pub FOR ALL TABLES;
"""
[server.teardown]
sql = ""

[server.monitor]
refresh_ms = 10
log_columns = ["replication_lag:MB"]
sql = """
SELECT
  pid,
  pg_wal_lsn_diff(sent_lsn, replay_lsn) AS replication_lag,
  application_name::text,
  state::text
FROM pg_stat_replication;
"""

[[server]]
name = "SubscriberA"
setup_template = "reader"
[server.style.Automatic]
postgresql_conf = "Subscriber"

[server.setup]
sql = """
DROP SUBSCRIPTION IF EXISTS stressgres_sub_a;
CREATE SUBSCRIPTION stressgres_sub_a CONNECTION '@Publisher_CONNSTR@' PUBLICATION stressgres_pub;
SELECT pg_sleep(5);
"""
[server.teardown]
sql = ""

[server.monitor]
refresh_ms = 10
title = "Subscriber A Index Info"
sql = """
SELECT segno, visible, recyclable, xmax, num_docs, num_deleted, byte_size
FROM paradedb.index_info('idxtest', true)
ORDER BY byte_size DESC;
"""

[[server]]
name = "SubscriberB"
setup_template = "reader"
[server.style.Automatic]
postgresql_conf = "Subscriber"

[server.setup]
sql = """
DROP SUBSCRIPTION IF EXISTS stressgres_sub_b;
CREATE SUBSCRIPTION stressgres_sub_b CONNECTION '@Publisher_CONNSTR@' PUBLICATION stressgres_pub;
SELECT pg_sleep(5);
"""
[server.teardown]
sql = ""

[server.monitor]
refresh_ms = 10
title = "Subscriber B Index Info"
sql = """
SELECT segno, visible, recyclable, xmax, num_docs, num_deleted, byte_size
FROM paradedb.index_info('idxtest', true)
ORDER BY byte_size DESC;
"""
