[[server]]
name = "Publisher"
[server.style.Automatic]
postgresql_conf = "Publisher"

[server.setup]
sql = """
DROP TABLE IF EXISTS test CASCADE;
CREATE TABLE test (
    id SERIAL8 NOT NULL PRIMARY KEY,
    message TEXT,
    old_message TEXT,
    unique_id BIGINT UNIQUE
) WITH (autovacuum_enabled = false);

DROP SEQUENCE IF EXISTS test_unique_id_seq;
CREATE SEQUENCE test_unique_id_seq START 1;

DROP PUBLICATION IF EXISTS stressgres_pub;
CREATE PUBLICATION stressgres_pub FOR ALL TABLES;

INSERT INTO test (message, unique_id) VALUES ('beer wine cheese a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('beer wine a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('beer cheese a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('beer a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('wine cheese a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('wine a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('cheese a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('beer wine cheese a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('beer wine a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('beer cheese a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('beer a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('wine cheese a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('wine a', nextval('test_unique_id_seq'));
INSERT INTO test (message, unique_id) VALUES ('cheese a', nextval('test_unique_id_seq'));
"""
[server.teardown]
sql = ""

[server.monitor]
refresh_ms = 10
log_columns = ["replication_lag:MB"]
sql = """
SELECT
  pid,
  pg_wal_lsn_diff(sent_lsn, replay_lsn) AS replication_lag,
  application_name::text,
  state::text
FROM pg_stat_replication;
"""

[[server]]
name = "Subscriber"
[server.style.Automatic]
postgresql_conf = "Subscriber"

[server.setup]
sql = """
DROP TABLE IF EXISTS test CASCADE;
CREATE EXTENSION IF NOT EXISTS pg_search CASCADE;
CREATE TABLE test (
    id SERIAL8 NOT NULL PRIMARY KEY,
    message TEXT,
    old_message TEXT,
    unique_id BIGINT UNIQUE
) WITH (
    autovacuum_enabled = true,
    autovacuum_vacuum_scale_factor = 0,
    autovacuum_vacuum_threshold = 50,
    autovacuum_vacuum_insert_threshold = 50
);

DROP SUBSCRIPTION IF EXISTS stressgres_sub;
CREATE SUBSCRIPTION stressgres_sub CONNECTION '@Publisher_CONNSTR@' PUBLICATION stressgres_pub;
SELECT pg_sleep(5);

CREATE INDEX idxtest ON test USING paradedb (id, message) WITH (key_field = 'id', layer_sizes = '10kb, 100kb, 1mb, 100mb');
CREATE OR REPLACE FUNCTION assert(a bigint, b bigint) RETURNS bool LANGUAGE plpgsql AS $$
DECLARE
    current_txid bigint;
BEGIN
    -- Check if the values are not equal
    IF a <> b THEN
        RAISE EXCEPTION 'Assertion failed: % <> %', a, b;
    END IF;

    RETURN true;
END;
$$;

CREATE OR REPLACE FUNCTION assert_plan_contains(
    p_query text,
    p_expected_text text
) RETURNS boolean AS $$
DECLARE
    plan_line text;
    full_plan text := '';
BEGIN
    -- Accumulate the EXPLAIN output as we go so we can show the plan we actually
    -- got if the assertion fails (invaluable when a fault-injection run flips the plan).
    FOR plan_line IN EXECUTE 'EXPLAIN (VERBOSE) ' || p_query LOOP
        full_plan := full_plan || plan_line || chr(10);
        -- Check if the current line contains the expected text
        IF plan_line ILIKE '%' || p_expected_text || '%' THEN
            RETURN true;
        END IF;
    END LOOP;

    RAISE EXCEPTION 'Plan assertion failed: expected "%" not found in plan for query: %. Actual plan:%',
        p_expected_text, p_query, chr(10) || full_plan;
END;
$$ LANGUAGE plpgsql;

ALTER SYSTEM SET autovacuum_naptime TO '1s';
SELECT pg_reload_conf();
"""

[server.teardown]
sql = ""

[server.monitor]
refresh_ms = 10
title = "Index Info Monitor"
destination = "Subscriber"
sql = """
SELECT segno, visible, recyclable, xmax, num_docs, num_deleted, byte_size
FROM paradedb.index_info('idxtest', true)
ORDER BY byte_size DESC;
"""

[[jobs]]
refresh_ms = 5
title = "Index Size Info"
destination = "Subscriber"
log_columns = ["pages", "relation_size:MB", "segment_count"]
log_tps = false
sql = """
SELECT count(*) FILTER (WHERE visible)         AS visible,
       count(*) FILTER (WHERE recyclable)      AS recyclable,
       count(*)                                AS segment_count,
       pg_relation_size('idxtest') / 8192      AS pages,
       pg_relation_size('idxtest')             AS relation_size,
       pg_size_pretty(pg_relation_size('idxtest'))
FROM paradedb.index_info('idxtest', true);
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Top K"
on_connect = """
SET enable_indexonlyscan to OFF;
SET enable_indexscan to OFF;
SET max_parallel_workers = 32;
SELECT assert_plan_contains(
    $q$ SELECT * FROM test WHERE id @@@ 'message:beer' ORDER BY id DESC LIMIT 25 $q$,
    'TopKScanExecState'
);
"""
sql = "SELECT * FROM test WHERE id @@@ 'message:beer' ORDER BY id DESC LIMIT 25"
assert = "11"
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Custom Scan"
# `paradedb.enable_aggregate_custom_scan` defaults to on and absorbs `count(*)`, which would
# plan this job as a ParadeDB Aggregate Scan instead of the base custom scan it is named for.
# Pinning `max_parallel_workers_per_gather = 0` keeps the serial shape out of the cost model's
# hands, so this job stays distinct from "Parallel Custom Scan" below.
on_connect = """
SET enable_indexonlyscan to OFF;
SET enable_indexscan to OFF;
SET paradedb.enable_aggregate_custom_scan = off;
SET max_parallel_workers_per_gather = 0;
SELECT assert_plan_contains(
    $q$ SELECT count(*) FROM test where id @@@ 'message:beer' $q$,
    'NormalScanExecState'
);
"""
sql = """
SELECT assert(count(*), 8), count(*) FROM test where id @@@ 'message:beer';
"""
destinations = ["Subscriber"]


[[jobs]]
refresh_ms = 5
title = "Parallel Custom Scan"
# `debug_parallel_query` only forces a parallel plan when the planner is allowed workers, so pin
# `max_parallel_workers_per_gather` rather than inheriting the cluster default. Both are plan-time
# GUCs, so the plan shape does not depend on how many workers are actually free at execution time
# -- a container kill/restart cannot flip it.
on_connect = """
SET enable_indexonlyscan to OFF;
SET enable_indexscan to OFF;
SET paradedb.enable_aggregate_custom_scan = off;
SET debug_parallel_query TO ON;
SET max_parallel_workers_per_gather = 2;
SELECT assert_plan_contains(
    $q$ SELECT count(*) FROM test WHERE id @@@ 'message:beer' $q$,
    'Parallel Custom Scan'
);
"""
sql = """
SELECT count(*) FROM test WHERE id @@@ 'message:beer';
"""
assert = "8"
destinations = ["Subscriber"]


[[jobs]]
refresh_ms = 5
title = "Index Only Scan"
# `paradedb.enable_custom_scan = off` does not disable the *aggregate* custom scan, so without
# turning that off too this job never reached an Index Only Scan. `enable_seqscan = off` pins the
# choice: `@@@` does have a (heavily penalised) seq scan fallback, and on a table this small the
# margin between the two is not worth racing.
on_connect = """
set max_parallel_workers = 0;
set paradedb.enable_custom_scan to off;
SET paradedb.enable_aggregate_custom_scan = off;
SET enable_seqscan = off;
SELECT assert_plan_contains(
    $q$ SELECT count(*) FROM test where id @@@ 'message:wine' $q$,
    'Index Only Scan'
);
"""
sql = """
SELECT assert(count(*), 8), count(*) FROM test where id @@@ 'message:wine';
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
# Was titled "Top K", but `old_message` is not in the bm25 index so the ORDER BY can never be
# pushed down -- pg_search itself warns about this and falls back to a Sort over a normal scan.
# Renamed to match what it actually covers, and asserted so the fallback path stays covered.
title = "Sort over Normal Scan"
on_connect = """
SELECT assert_plan_contains(
    $q$ SELECT * FROM test WHERE message @@@ 'wine' OR message @@@ 'beer' ORDER BY old_message LIMIT 5 $q$,
    'NormalScanExecState'
);
"""
sql = """
SELECT * FROM test WHERE message @@@ 'wine' OR message @@@ 'beer' ORDER BY old_message LIMIT 5;
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
window_height = 10
log_tps = false
title = "Find by ctid"
sql = """
select ctid::text, id, message, old_message, paradedb.find_ctid('idxtest', ctid) as segment_ids, now()::text, txid_current()::numeric from test where message ilike '%beer%' order by id;
"""
destinations = ["Subscriber"]

##
## These UPDATE/INSERT/DELETE jobs run on the primary, which has no pg_search index, so there's no need for us to
## log their tps -- nothing we can do about that
##

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Update 1..9"
cancel_keycode = 'U'
sql = """
UPDATE test SET message = array_to_string((string_to_array(message, ' '))[1:array_length(string_to_array(message, ' '), 1) - 1], ' ') || ' ' || lpad((txid_current() % 10000)::text, 5, '0'), old_message = message WHERE id < 10;
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Update 10,11"
cancel_keycode = 'U'
sql = """
BEGIN;
UPDATE test SET message = array_to_string((string_to_array(message, ' '))[1:array_length(string_to_array(message, ' '), 1) - 1], ' ') || ' ' || lpad((txid_current() % 10000)::text, 5, '0'), old_message = message WHERE id IN (10, 11);
ABORT;
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Insert value A"
sql = """
INSERT INTO test (message, unique_id) VALUES ('A', nextval('test_unique_id_seq'));
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Insert value B"
sql = """
INSERT INTO test (message, unique_id) VALUES ('B', nextval('test_unique_id_seq'));
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
pause_keycode = 'd'
cancel_keycode = 'D'
title = "Delete values"
sql = """
DELETE FROM test WHERE id > 14;
"""
destinations = ["Publisher"]
