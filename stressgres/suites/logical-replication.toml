[[server]]
name = "Publisher"
[server.style.Automatic]
postgresql_conf = "Publisher"

[server.setup]
sql = """
DROP TABLE IF EXISTS test CASCADE;
DROP TABLE IF EXISTS categories CASCADE;

CREATE TABLE categories (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL
) WITH (autovacuum_enabled = false);

CREATE TABLE test (
    id SERIAL8 NOT NULL PRIMARY KEY,
    message TEXT,
    old_message TEXT,
    category_id INTEGER NOT NULL,
    unique_id BIGINT UNIQUE
) WITH (autovacuum_enabled = false);

DROP SEQUENCE IF EXISTS test_unique_id_seq;
CREATE SEQUENCE test_unique_id_seq START 1;

DROP PUBLICATION IF EXISTS stressgres_pub;
CREATE PUBLICATION stressgres_pub FOR ALL TABLES;

INSERT INTO categories (id, name)
SELECT i, 'category ' || i::text
FROM generate_series(1, 100) AS s(i);

-- Keep the distribution deterministic so result-count assertions stay stable while still giving
-- the planner enough rows to make realistic choices. The write jobs below mutate a small hot set
-- and append rows that do not contain the search terms, so these baseline counts remain stable.
INSERT INTO test (message, category_id, unique_id)
SELECT
    (ARRAY['beer wine cheese', 'beer wine', 'beer cheese', 'beer',
           'wine cheese', 'wine', 'cheese', 'bread butter'])[1 + (i % 8)]
    || ' ' || i::text,
    1 + (i % 100),
    nextval('test_unique_id_seq')
FROM generate_series(1, 10000) AS s(i);
"""
[server.teardown]
sql = ""

[server.monitor]
refresh_ms = 10
log_columns = ["replication_lag:MB"]
sql = """
SELECT
  pid,
  pg_wal_lsn_diff(sent_lsn, replay_lsn) AS replication_lag,
  application_name::text,
  state::text
FROM pg_stat_replication;
"""

[[server]]
name = "Subscriber"
[server.style.Automatic]
postgresql_conf = "Subscriber"

[server.setup]
sql = """
DROP TABLE IF EXISTS test CASCADE;
DROP TABLE IF EXISTS categories CASCADE;
CREATE EXTENSION IF NOT EXISTS pg_search CASCADE;

CREATE TABLE categories (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL
) WITH (autovacuum_enabled = true);

CREATE TABLE test (
    id SERIAL8 NOT NULL PRIMARY KEY,
    message TEXT,
    old_message TEXT,
    category_id INTEGER NOT NULL,
    unique_id BIGINT UNIQUE
) WITH (
    autovacuum_enabled = true,
    autovacuum_vacuum_scale_factor = 0,
    autovacuum_vacuum_threshold = 50,
    autovacuum_vacuum_insert_threshold = 50
);

DROP SUBSCRIPTION IF EXISTS stressgres_sub;
CREATE SUBSCRIPTION stressgres_sub CONNECTION '@Publisher_CONNSTR@' PUBLICATION stressgres_pub;
SELECT pg_sleep(5);

CREATE INDEX idxtest ON test USING paradedb(id, message, category_id) WITH (
    key_field = 'id',
    layer_sizes = '10kb, 100kb, 1mb, 100mb',
    numeric_fields = '{"category_id": {"fast": true}}'
);
CREATE INDEX idxcategories ON categories USING paradedb(id, name) WITH (
    key_field = 'id',
    text_fields = '{"name": {"fast": true, "tokenizer": {"type": "raw"}}}'
);

ANALYZE test;
ANALYZE categories;

CREATE OR REPLACE FUNCTION assert(a bigint, b bigint) RETURNS bool LANGUAGE plpgsql AS $$
DECLARE
    current_txid bigint;
BEGIN
    -- Check if the values are not equal
    IF a <> b THEN
        RAISE EXCEPTION 'Assertion failed: % <> %', a, b;
    END IF;

    RETURN true;
END;
$$;

CREATE OR REPLACE FUNCTION assert_plan_contains(
    p_query text,
    p_expected_text text
) RETURNS boolean AS $$
DECLARE
    plan_line text;
    full_plan text := '';
BEGIN
    FOR plan_line IN EXECUTE 'EXPLAIN (VERBOSE) ' || p_query LOOP
        full_plan := full_plan || plan_line || chr(10);
        IF plan_line ILIKE '%' || p_expected_text || '%' THEN
            RETURN true;
        END IF;
    END LOOP;

    RAISE EXCEPTION 'Plan assertion failed: expected "%" not found in plan for query: %. Actual plan:%',
        p_expected_text, p_query, chr(10) || full_plan;
END;
$$ LANGUAGE plpgsql;

ALTER SYSTEM SET autovacuum_naptime TO '1s';
SELECT pg_reload_conf();
"""

[server.teardown]
sql = ""

[server.monitor]
refresh_ms = 10
title = "Index Info Monitor"
destination = "Subscriber"
sql = """
SELECT segno, visible, recyclable, xmax, num_docs, num_deleted, byte_size
FROM paradedb.index_info('idxtest', true)
ORDER BY byte_size DESC;
"""

[[jobs]]
refresh_ms = 5
title = "Index Size Info"
destination = "Subscriber"
log_columns = ["pages", "relation_size:MB", "segment_count"]
log_tps = false
sql = """
SELECT count(*) FILTER (WHERE visible)         AS visible,
       count(*) FILTER (WHERE recyclable)      AS recyclable,
       count(*)                                AS segment_count,
       pg_relation_size('idxtest') / 8192      AS pages,
       pg_relation_size('idxtest')             AS relation_size,
       pg_size_pretty(pg_relation_size('idxtest'))
FROM paradedb.index_info('idxtest', true);
"""
destinations = ["Subscriber"]

# Query semantics choose the path first; the plan assertion is only a coverage guard. In
# particular, retrieval jobs retrieve rows, while count(*) is reserved for Aggregate Scan.
[[jobs]]
refresh_ms = 5
title = "Top K Search"
on_connect = """
SELECT assert_plan_contains(
    $q$ SELECT id, message FROM test WHERE id @@@ 'message:beer' ORDER BY id DESC LIMIT 25 $q$,
    'TopKScanExecState'
);
"""
sql = "SELECT id, message FROM test WHERE id @@@ 'message:beer' ORDER BY id DESC LIMIT 25"
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Custom Search"
# old_message is deliberately not in the ParadeDB index. Projecting it makes this a real
# heap-backed retrieval workload rather than disguising an aggregate or index-only workload.
on_connect = """
SET max_parallel_workers_per_gather = 0;
SELECT assert_plan_contains(
    $q$ SELECT id, message, old_message FROM test WHERE id @@@ 'message:beer' LIMIT 100 $q$,
    'NormalScanExecState'
);
"""
sql = """
SELECT id, message, old_message FROM test WHERE id @@@ 'message:beer' LIMIT 100;
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Parallel Custom Search"
# debug_parallel_query is retained because this job exists specifically to keep the parallel
# executor under fault. The query itself is a retrieval workload and cannot be absorbed by
# Aggregate Scan or Index Only Scan.
on_connect = """
SET debug_parallel_query TO ON;
SET max_parallel_workers_per_gather = 2;
SELECT assert_plan_contains(
    $q$ SELECT id, message, old_message FROM test WHERE id @@@ 'message:cheese' $q$,
    'Parallel Custom Scan'
);
"""
sql = """
SELECT id, message, old_message FROM test WHERE id @@@ 'message:cheese';
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Aggregate Search"
# count(*) is exactly the workload Aggregate Scan is intended to consume; keep it as its own
# first-class workload instead of disabling Aggregate Scan to reach another executor.
on_connect = """
SELECT assert_plan_contains(
    $q$ SELECT count(*) FROM test WHERE id @@@ 'message:beer' $q$,
    'ParadeDB Aggregate Scan'
);
"""
sql = """
SELECT assert(count(*), 5000), count(*) FROM test WHERE id @@@ 'message:beer';
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Index Only Search"
# This is intentionally fallback-path coverage: turn off ParadeDB's custom scan, then ask only
# for the indexed key. Unlike the old count(*) query, the query shape itself is index-only.
on_connect = """
SET max_parallel_workers = 0;
SET paradedb.enable_custom_scan = off;
SELECT assert_plan_contains(
    $q$ SELECT id FROM test WHERE id @@@ 'message:wine' LIMIT 100 $q$,
    'Index Only Scan'
);
"""
sql = """
SELECT id FROM test WHERE id @@@ 'message:wine' LIMIT 100;
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Sort over Normal Scan"
# old_message is not indexed, so this intentionally covers a non-pushdown ORDER BY fallback.
on_connect = """
SELECT assert_plan_contains(
    $q$ SELECT id, message, old_message FROM test WHERE message @@@ 'wine' OR message @@@ 'beer' ORDER BY old_message LIMIT 20 $q$,
    'NormalScanExecState'
);
"""
sql = """
SELECT id, message, old_message
FROM test
WHERE message @@@ 'wine' OR message @@@ 'beer'
ORDER BY old_message
LIMIT 20;
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
title = "Join Search"
# Both sides are replicated and indexed. The write jobs below mutate both the join key and the
# joined row so JoinScan sees MVCC/replication churn rather than a static lookup table.
on_connect = """
SET paradedb.enable_join_custom_scan = on;
SELECT assert_plan_contains(
    $q$
    SELECT t.id, t.message, c.name
    FROM test t
    JOIN categories c ON t.category_id = c.id
    WHERE t.message @@@ 'beer'
    ORDER BY t.id
    LIMIT 25
    $q$,
    'ParadeDB Join Scan'
);
"""
sql = """
SELECT t.id, t.message, c.name
FROM test t
JOIN categories c ON t.category_id = c.id
WHERE t.message @@@ 'beer'
ORDER BY t.id
LIMIT 25;
"""
destinations = ["Subscriber"]

[[jobs]]
refresh_ms = 5
window_height = 10
log_tps = false
title = "Find by ctid"
sql = """
select ctid::text, id, message, old_message, paradedb.find_ctid('idxtest', ctid) as segment_ids, now()::text, txid_current()::numeric from test where message ilike '%beer%' order by id limit 100;
"""
destinations = ["Subscriber"]

##
## These UPDATE/INSERT/DELETE jobs run on the primary, which has no pg_search index, so there's no need for us to
## log their tps -- nothing we can do about that
##

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Update 1..9"
cancel_keycode = 'U'
sql = """
UPDATE test SET message = array_to_string((string_to_array(message, ' '))[1:array_length(string_to_array(message, ' '), 1) - 1], ' ') || ' ' || lpad((txid_current() % 10000)::text, 5, '0'), old_message = message WHERE id < 10;
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Update 10,11"
cancel_keycode = 'U'
sql = """
BEGIN;
UPDATE test SET message = array_to_string((string_to_array(message, ' '))[1:array_length(string_to_array(message, ' '), 1) - 1], ' ') || ' ' || lpad((txid_current() % 10000)::text, 5, '0'), old_message = message WHERE id IN (10, 11);
ABORT;
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Rotate join keys"
sql = """
UPDATE test SET category_id = (category_id % 100) + 1 WHERE id BETWEEN 1 AND 100;
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 150
log_tps = false
title = "Update joined rows"
sql = """
UPDATE categories SET name = 'category ' || id::text || ' ' || txid_current()::text WHERE id <= 10;
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Insert value A"
sql = """
INSERT INTO test (message, category_id, unique_id)
VALUES ('A', 1 + (txid_current() % 100)::int, nextval('test_unique_id_seq'));
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
title = "Insert value B"
sql = """
INSERT INTO test (message, category_id, unique_id)
VALUES ('B', 1 + (txid_current() % 100)::int, nextval('test_unique_id_seq'));
"""
destinations = ["Publisher"]

[[jobs]]
refresh_ms = 100
log_tps = false
pause_keycode = 'd'
cancel_keycode = 'D'
title = "Delete values"
sql = """
DELETE FROM test WHERE id > 10000;
"""
destinations = ["Publisher"]
